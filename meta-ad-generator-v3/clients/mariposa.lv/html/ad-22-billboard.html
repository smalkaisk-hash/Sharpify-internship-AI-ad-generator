<!DOCTYPE html>
<html lang="lv">
<head>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Raleway:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
*{hyphens:none;-webkit-hyphens:none}
html,body{width:1080px;height:1080px;overflow:hidden}
.ad{width:1080px;height:1080px;position:relative;overflow:hidden;background:#3E4C54}

/* photo fills top 65% */
.photo-zone{
  position:absolute;top:0;left:0;right:0;height:680px;
  overflow:hidden;
  z-index:0;
}
.photo-zone img{width:100%;height:100%;object-fit:cover;object-position:50% 14%}

/* SHARP horizontal cut — no gradient, no diagonal */
/* coral accent line at the seam */
.seam-line{
  position:absolute;top:678px;left:0;right:0;height:3px;
  background:#BC6C54;z-index:5;
}

/* solid dark panel — bottom 35% */
.dark-panel{
  position:absolute;bottom:0;left:0;right:0;height:402px;
  background:#3E4C54;
  z-index:1;
}

/* logo sits on photo — top-left corner with soft scrim */
.photo-scrim{
  position:absolute;top:0;left:0;right:0;height:220px;
  background:linear-gradient(180deg,rgba(28,36,40,0.65) 0%,transparent 100%);
  z-index:2;
}
.logo-zone{position:absolute;top:52px;left:72px;z-index:10}
.logo-zone img{height:116px;max-width:360px;width:auto;display:block;object-fit:contain;filter:drop-shadow(0 2px 12px rgba(0,0,0,0.50))}

/* text content in dark panel */
.panel-content{
  position:absolute;bottom:0;left:0;right:0;height:402px;
  display:flex;flex-direction:column;
  padding:32px 72px 60px;
  z-index:10;
}
.eyebrow{
  font-family:'Raleway',sans-serif;
  font-size:20px;font-weight:400;letter-spacing:0.22em;text-transform:uppercase;
  color:#E4A489;margin-bottom:12px;flex-shrink:0;
}
.hd-wrap{flex-shrink:0;padding-bottom:14px}
.hd{
  font-family:'Cormorant Garamond',serif;
  font-size:80px;line-height:0.88;font-weight:600;font-style:italic;
  color:#E9D9C8;
}
.rule{height:1px;background:linear-gradient(90deg,rgba(228,164,137,0.45),transparent);flex-shrink:0;margin-bottom:14px}
.info-row{display:flex;gap:40px;flex-shrink:0;margin-bottom:0}
.info-item{
  font-family:'Raleway',sans-serif;
  font-size:22px;font-weight:400;
  color:rgba(233,217,200,0.65);
}
.info-item strong{color:#E4A489;font-weight:600}
.spacer{flex:1;min-height:0}
.cta{
  display:block;background:#BC6C54;color:#E9D9C8;
  font-family:'Raleway',sans-serif;font-size:21px;font-weight:600;
  padding:22px 36px;border-radius:4px;
  text-align:center;letter-spacing:0.08em;text-transform:uppercase;flex-shrink:0;
}
/* bullet-style-start */
.benefit,.brow{background:linear-gradient(105deg,#9B9F91,#A6844E);border-radius:28px;padding:11px 20px;box-shadow:0 4px 18px rgba(155,159,145,0.55);gap:12px;}
.btext{color:#fff;font-weight:600;}
.bicon,.bicon svg{color:#fff;fill:#fff;}
.bdot{background:rgba(255,255,255,0.65);}
/* bullet-style-end */
</style>
</head>
<body>
<div class="ad">
  <div class="photo-zone">
    <img src="file:///C:/Users/User/Meta-ad-generator-v2/meta-ad-generator-v3/clients/mariposa.lv/image/generated-5.jpg" alt="">
  </div>
  <div class="photo-scrim"></div>
  <div class="seam-line"></div>

  <div class="logo-zone">
    <img src="file:///C:/Users/User/Meta-ad-generator-v2/meta-ad-generator-v3/clients/mariposa.lv/scrape/logo/001-mariposa-skaistumkop-anas-salons-genskaln.png" alt="Mariposa">

    <div class="eyebrow">Optimas · Rīga</div>
    <div class="hd-wrap">

    <div class="info-row">
      <span class="info-item"><strong>95%</strong> atgriežas</span>
      <span class="info-item"><strong>2500+</strong> klientu</span>
