<!DOCTYPE html>
<html lang="lv">
<head>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Raleway:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
*{hyphens:none;-webkit-hyphens:none}
html,body{width:1080px;height:1080px;overflow:hidden}
.ad{width:1080px;height:1080px;position:relative;overflow:hidden;background:#E9D9C8}

/* wide parallelogram photo panel — full height */
.slant-frame{
  position:absolute;
  right:0;top:0;
  width:720px;height:1080px;
  clip-path:polygon(17% 0%, 100% 0%, 83% 100%, 0% 100%);
  overflow:hidden;
  z-index:1;
}
.slant-frame img{
  width:100%;height:100%;object-fit:cover;object-position:50% 14%;
}

/* accent line tracing the left slant edge */
.accent-svg{
  position:absolute;inset:0;
  width:1080px;height:1080px;
  z-index:2;pointer-events:none;
}

/* text column — left */
.text-col{
  position:absolute;left:0;top:0;bottom:0;
  width:385px;
  display:flex;flex-direction:column;
  padding:64px 28px 80px 68px;
  z-index:10;
}
.logo-zone{align-self:flex-start;flex-shrink:0}
.logo-zone img{
  height:116px;max-width:340px;width:auto;display:block;object-fit:contain;
  filter:brightness(0);opacity:0.70;
}
.spacer{flex:1;min-height:0}
.eyebrow{
  font-family:'Raleway',sans-serif;
  font-size:20px;font-weight:400;letter-spacing:0.22em;text-transform:uppercase;
  color:#A6844E;margin-bottom:14px;flex-shrink:0;
}
.hd-wrap{flex-shrink:0;padding-bottom:18px}
.hd{
  font-family:'Cormorant Garamond',serif;
  font-size:68px;line-height:0.92;font-weight:600;font-style:italic;
  color:#3E4C54;hyphens:none;-webkit-hyphens:none;
}
.rule{
  height:1px;background:linear-gradient(90deg,rgba(166,132,78,0.48),transparent);
  flex-shrink:0;margin-bottom:18px;
}
.benefits{
  display:flex;flex-direction:column;gap:12px;
  flex-shrink:0;
}
.brow{display:flex;align-items:center;gap:12px}
.bicon{width:24px;height:24px;flex-shrink:0}
.btext{font-family:'Raleway',sans-serif;font-size:22px;font-weight:500;line-height:1.30;color:rgba(62,76,84,0.85)}
.spacer2{flex:1;min-height:0}
.cta{
  display:block;background:#BC6C54;color:#E9D9C8;
  font-family:'Raleway',sans-serif;font-size:21px;font-weight:600;
  padding:22px 8px;border-radius:4px;
  text-align:center;letter-spacing:0.08em;text-transform:uppercase;
  flex-shrink:0;
}
/* bullet-style-start */
.benefit,.brow{gap:14px;padding:8px 0;border-bottom:1px solid rgba(155,159,145,0.2);}
.benefit:last-child,.brow:last-child{border-bottom:none;}
.benefit::before,.brow::before{content:'';width:10px;height:10px;border-radius:50%;background:#9B9F91;flex-shrink:0;margin-top:7px;box-shadow:0 0 8px rgba(155,159,145,0.55);}
.bicon,.bdot{display:none;}
.btext{color:#ffffff;}
/* bullet-style-end */
</style>
</head>
<body>

</div>
