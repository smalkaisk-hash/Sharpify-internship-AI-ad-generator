<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Raleway:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
*{hyphens:none;-webkit-hyphens:none}
html,body{width:1080px;height:1080px;overflow:hidden}
.ad{width:1080px;height:1080px;position:relative;overflow:hidden;background:#3E4C54}

/* photo clipped with concave left edge */
.photo-zone{
  position:absolute;
  right:0;top:0;bottom:0;
  width:650px;
  clip-path:path('M 210,0 C 80,270 80,810 210,1080 L 650,1080 L 650,0 Z');
  overflow:hidden;
  z-index:1;
}
.photo-zone img{
  width:100%;height:100%;object-fit:cover;object-position:50% 12%;
}

/* subtle peach accent arc tracing the sweep edge */
.sweep-arc{
  position:absolute;
  left:466px;top:0;bottom:0;
  width:200px;
  z-index:2;
  overflow:visible;
}

/* text column — left, dark bg shows through */
.text-col{
  position:absolute;left:0;top:0;bottom:0;
  width:480px;
  display:flex;flex-direction:column;
  padding:64px 24px 150px 68px;
  z-index:10;
}
.logo-zone{align-self:flex-start;flex-shrink:0}
.logo-zone img{
  height:116px;max-width:340px;width:auto;display:block;object-fit:contain;
  filter:drop-shadow(0 2px 10px rgba(0,0,0,0.40));
}
.spacer{flex:1;min-height:0}

.eyebrow{
  font-family:'Raleway',sans-serif;
  font-size:20px;font-weight:400;letter-spacing:0.22em;text-transform:uppercase;
  color:#E4A489;margin-bottom:14px;flex-shrink:0;
}
.hd-wrap{flex-shrink:0;padding-bottom:12px}
.hd{
  font-family:'Cormorant Garamond',serif;
  font-size:74px;line-height:0.92;font-weight:600;font-style:italic;
  color:#E9D9C8;hyphens:none;-webkit-hyphens:none;
}
.sub{
  font-family:'Cormorant Garamond',serif;
  font-size:30px;font-weight:500;font-style:italic;
  color:rgba(233,217,200,0.62);margin-bottom:22px;flex-shrink:0;
}
.rule{
  height:1px;background:linear-gradient(90deg,rgba(228,164,137,0.45),transparent);
  flex-shrink:0;margin-bottom:20px;
}
.benefits{
  display:grid;grid-template-columns:1fr 1fr;gap:8px 20px;
  flex-shrink:0;margin-bottom:0;
}
.brow{display:flex;align-items:flex-start;gap:10px}
.bdot{width:6px;height:6px;border-radius:50%;background:#E4A489;flex-shrink:0;margin-top:9px}
.btext{font-family:'Raleway',sans-serif;font-size:22px;font-weight:400;line-height:1.32;color:#E9D9C8bb}
.spacer2{flex:1;min-height:0}
.cta{
  display:block;background:#BC6C54;color:#E9D9C8;
  font-family:'Raleway',sans-serif;font-size:21px;font-weight:600;
  padding:22px 28px;border-radius:4px;
  text-align:center;letter-spacing:0.08em;text-transform:uppercase;
  flex-shrink:0;
}
/* bullet-style-start */
.benefit,.brow{background:rgba(155,159,145,0.14);border-left:5px solid #9B9F91;border-radius:0 10px 10px 0;padding:11px 18px;gap:12px;}
.btext{color:#ffffff;font-weight:500;}
.bicon,.bicon svg{color:#9B9F91;fill:#9B9F91;}
.bdot{display:none;}
/* bullet-style-end */
</style>
</head>
<body>
<div class="ad">
  <div class="photo-zone">
    <img src="file:///C:/Users/User/Meta-ad-generator-v2/meta-ad-generator-v3/clients/mariposa.lv/image/generated-3.jpg" alt="">
  </div>
  <!-- decorative arc SVG following the sweep curve -->
  <svg viewBox="0 0 220 1080" preserveAspectRatio="none" style="position:absolute;left:416px;top:0;width:220px;height:1080px;z-index:2;overflow:visible">
    <path d="M 210,0 C 80,270 80,810 210,1080" fill="none" stroke="rgba(228,164,137,0.38)" stroke-width="1.5"/>
    <path d="M 192,0 C 66,270 66,810 192,1080" fill="none" stroke="rgba(228,164,137,0.18)" stroke-width="1"/>
  </svg>
  <div class="text-col">
    <div class="logo-zone">
      <img src="file:///C:/Users/User/Meta-ad-generator-v2/meta-ad-generator-v3/clients/mariposa.lv/scrape/logo/001-mariposa-skaistumkop-anas-salons-genskaln.png" alt="Mariposa">
    </div>
    <div class="spacer"></div>
    <div class="eyebrow">Optimas · Rīga</div>
    <div class="hd-wrap">
      <div class="hd">Pigmentācija<br>pazūd.</div>
    </div>
    <div class="sub">Āda atjaunojas.</div>
    <div class="rule"></div>
    <div class="benefits">
      <div class="brow"><span class="bdot"></span><span class="btext">IPL, RF un lāzerepilācija vienā platformā</span></div>
      <div class="brow"><span class="bdot"></span><span class="btext">Redzami rezultāti jau pēc 2 sesijām</span></div>
      <div class="brow"><span class="bdot"></span><span class="btext">Bez sāpēm, atpakaļ uz darbu tajā pašā dienā</span></div>
      <div class="brow"><span class="bdot"></span><span class="btext">Katrs protokols kalibrēts Tavam ādas tipam</span></div>
    </div>
    <div class="spacer2"></div>
    <div class="cta">Piesakies bezmaksas konsultācijai</div>
  </div>
</div>
<script>
document.fonts.ready.then(()=>{
  return Promise.all([
    document.fonts.load('400 22px Raleway','āēīūģķļņšžĀĒĪŪĢĶĻŅŠŽ'),
    document.fonts.load('600 74px "Cormorant Garamond"','āēīūģķļņšžĀĒĪŪĢĶĻŅŠŽ'),
  ]);
}).then(()=>{ document.title="fonts-ready"; });
</script>
</body>
</html>
