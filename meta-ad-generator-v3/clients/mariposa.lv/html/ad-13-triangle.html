html,body{width:1080px;height:1080px;overflow:hidden}

/* photo in full-height right-pointing triangle */
.triangle-frame{
  position:absolute;

  width:540px;height:1080px;

  overflow:hidden;

}
.triangle-frame img{
  width:100%;height:100%;object-fit:cover;object-position:55% 15%;
}

.accent-svg{

.spacer{flex:1;min-height:0}
.eyebrow{

.spacer2{flex:1;min-height:0}
.cta{

/* bullet-style-start */

.btext{color:#ffffff;}
.bicon,.bicon svg{color:#9B9F91;fill:#9B9F91;}
.bdot{background:rgba(255,255,255,0.6);}
