<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Raleway:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
*{hyphens:none;-webkit-hyphens:none}
html,body{width:1080px;height:1080px;overflow:hidden}
.ad{width:1080px;height:1080px;position:relative;overflow:hidden;background:#1C2428}

.bg-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 20%;z-index:0}

/* subtle edge darkening to frame the photo */
.edge-grad{
  position:absolute;inset:0;z-index:1;
  background:
    linear-gradient(180deg, rgba(28,36,40,0.50) 0%, transparent 16%, transparent 62%, rgba(28,36,40,0.88) 82%, rgba(28,36,40,0.97) 100%),
    linear-gradient(90deg, rgba(28,36,40,0.30) 0%, transparent 12%, transparent 88%, rgba(28,36,40,0.30) 100%);
}

/* BOLD horizontal band across center — the hero element */
.band{
  position:absolute;
  left:0;right:0;top:326px;height:300px;
  background:rgba(62,76,84,0.96);
  z-index:5;
}
/* coral accent top border on band */
.band-border-top{
  position:absolute;left:0;right:0;top:324px;height:2px;
  background:#BC6C54;z-index:6;
}
.band-border-bot{
  position:absolute;left:0;right:0;top:626px;height:2px;
  background:#BC6C54;z-index:6;
}

/* headline in the band */
.band-content{
  position:absolute;top:326px;left:0;right:0;height:300px;
  display:flex;flex-direction:column;
  align-items:flex-start;justify-content:center;
  padding:0 80px;
  z-index:10;
}
.band-eyebrow{
  font-family:'Raleway',sans-serif;
  font-size:20px;font-weight:400;letter-spacing:0.22em;text-transform:uppercase;
  color:#E4A489;margin-bottom:12px;
}
.band-hd{
  font-family:'Cormorant Garamond',serif;
  font-size:88px;line-height:0.90;font-weight:600;font-style:italic;
  color:#E9D9C8;
}

/* logo top-left */
.logo-zone{position:absolute;top:52px;left:72px;z-index:10}
.logo-zone img{height:116px;max-width:360px;width:auto;display:block;object-fit:contain;filter:drop-shadow(0 2px 16px rgba(0,0,0,0.60));opacity:0.88}

/* bottom content zone — below band */
.bottom-zone{
  position:absolute;bottom:0;left:0;right:0;height:300px;
  display:flex;flex-direction:column;
  padding:32px 80px 60px;
  z-index:10;
}
.benefits{display:grid;grid-template-columns:1fr 1fr;gap:8px 40px;flex-shrink:0}
.brow{display:flex;align-items:flex-start;gap:10px}
.bdot{width:6px;height:6px;border-radius:50%;background:#E4A489;flex-shrink:0;margin-top:9px}
.btext{font-family:'Raleway',sans-serif;font-size:22px;font-weight:400;line-height:1.32;color:rgba(233,217,200,0.75)}
.b-spacer{flex:1;min-height:0}
.cta{
  display:block;background:#BC6C54;color:#E9D9C8;
  font-family:'Raleway',sans-serif;font-size:21px;font-weight:600;
  padding:22px 36px;border-radius:4px;
  text-align:center;letter-spacing:0.08em;text-transform:uppercase;flex-shrink:0;
}
/* bullet-style-start */
.benefit,.brow{gap:14px;padding:8px 0;border-bottom:1px solid rgba(155,159,145,0.2);}
.benefit:last-child,.brow:last-child{border-bottom:none;}
.benefit::before,.brow::before{content:'';width:10px;height:10px;border-radius:50%;background:#9B9F91;flex-shrink:0;margin-top:7px;box-shadow:0 0 8px rgba(155,159,145,0.55);}
.bicon,.bdot{display:none;}
.btext{color:#ffffff;}
/* bullet-style-end */
</style>
</head>
<body>
<div class="ad">
  <img class="bg-photo" src="file:///C:/Users/User/Meta-ad-generator-v2/meta-ad-generator-v3/clients/mariposa.lv/image/generated-4.jpg" alt="">
  <div class="edge-grad"></div>
  <div class="band"></div>
  <div class="band-border-top"></div>
  <div class="band-border-bot"></div>
  <div class="band-content">
    <div class="band-eyebrow">Optimas · Rīga</div>
    <div class="band-hd">Pigmentācija<br>pazūd. Āda atjaunojas.</div>
  </div>
  <div class="logo-zone">
    <img src="file:///C:/Users/User/Meta-ad-generator-v2/meta-ad-generator-v3/clients/mariposa.lv/scrape/logo/001-mariposa-skaistumkop-anas-salons-genskaln.png" alt="Mariposa">
  </div>
  <div class="bottom-zone">
    <div class="benefits">
      <div class="brow"><span class="bdot"></span><span class="btext">IPL, RF un lāzerepilācija vienā platformā</span></div>
      <div class="brow"><span class="bdot"></span><span class="btext">95% klientu atgriežas pēc pirmās procedūras</span></div>
      <div class="brow"><span class="bdot"></span><span class="btext">Bez sāpēm, atpakaļ uz darbu tajā pašā dienā</span></div>
      <div class="brow"><span class="bdot"></span><span class="btext">Bezmaksas konsultācija, vērtība 40€</span></div>
    </div>
    <div class="b-spacer"></div>
    <div class="cta">Piesakies bezmaksas konsultācijai</div>
  </div>
</div>
<script>

</script>
</body>
</html>
