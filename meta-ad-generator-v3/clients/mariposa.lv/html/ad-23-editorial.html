<!DOCTYPE html>
<html lang="lv">
<head>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Raleway:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
*{hyphens:none;-webkit-hyphens:none}
html,body{width:1080px;height:1080px;overflow:hidden}
.ad{width:1080px;height:1080px;position:relative;overflow:hidden}

/* full-bleed photo */
.bg-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 18%;z-index:0}

/* TOP content bar — solid cream, like a torn paper strip */
.top-bar{
  position:absolute;top:0;left:0;right:0;height:220px;
  background:#E9D9C8;
  z-index:5;
}
/* coral accent bottom edge on top bar */
.top-bar-edge{
  position:absolute;top:218px;left:0;right:0;height:3px;
  background:#BC6C54;z-index:6;
}

/* top bar content: logo left, eyebrow + headline right-ish */
.top-bar-inner{
  position:absolute;top:0;left:0;right:0;height:220px;
  display:flex;align-items:center;
  padding:0 72px;
  gap:40px;
  z-index:10;
}
.logo-zone{flex-shrink:0}
.logo-zone img{height:116px;max-width:280px;width:auto;display:block;object-fit:contain;filter:brightness(0);opacity:0.70}
.top-divider{width:1px;height:80px;background:rgba(62,76,84,0.22);flex-shrink:0}
.top-text{flex:1}
.top-eyebrow{
  font-family:'Raleway',sans-serif;
  font-size:20px;font-weight:400;letter-spacing:0.22em;text-transform:uppercase;
  color:#A6844E;margin-bottom:8px;
}
.top-tagline{
  font-family:'Cormorant Garamond',serif;
  font-size:36px;line-height:1.05;font-weight:600;font-style:italic;
  color:#3E4C54;
}

/* BOTTOM content bar — solid cream, editorial */
.bottom-bar{
  position:absolute;bottom:0;left:0;right:0;height:430px;
  background:#E9D9C8;
  z-index:5;
}
.bottom-bar-edge{
  position:absolute;top:0;left:0;right:0;height:3px;background:#BC6C54;z-index:1;
  /* relative to bottom bar */
}
.bottom-bar-top-line{
  position:absolute;bottom:430px;left:0;right:0;height:3px;background:#BC6C54;z-index:6;
}

/* bottom bar content */
.bottom-bar-inner{
  position:absolute;bottom:0;left:0;right:0;height:430px;
  display:flex;flex-direction:column;
  padding:28px 72px 60px;
  z-index:10;
}
.hd-wrap{flex-shrink:0;padding-bottom:14px}
.hd{
  font-family:'Cormorant Garamond',serif;
  font-size:76px;line-height:0.88;font-weight:600;font-style:italic;
  color:#3E4C54;
}
.rule{height:1px;background:linear-gradient(90deg,rgba(166,132,78,0.48),transparent);flex-shrink:0;margin-bottom:14px}
.benefits{display:grid;grid-template-columns:1fr 1fr;gap:8px 32px;flex-shrink:0}
.brow{display:flex;align-items:flex-start;gap:10px}
.bdot{width:6px;height:6px;border-radius:50%;background:#BC6C54;flex-shrink:0;margin-top:9px}
.btext{font-family:'Raleway',sans-serif;font-size:22px;font-weight:400;line-height:1.32;color:rgba(62,76,84,0.80)}
.spacer{flex:1;min-height:0}
.cta{
  display:block;background:#BC6C54;color:#E9D9C8;
  font-family:'Raleway',sans-serif;font-size:21px;font-weight:600;
  padding:22px 36px;border-radius:4px;
  text-align:center;letter-spacing:0.08em;text-transform:uppercase;flex-shrink:0;
}
/* bullet-style-start */
.benefit,.brow{border:2px solid #9B9F91;border-radius:28px;padding:10px 18px;gap:12px;box-shadow:0 0 18px rgba(155,159,145,0.55),inset 0 0 8px rgba(155,159,145,0.08);background:rgba(255,255,255,0.05);}
.btext{color:#ffffff;}
.bicon,.bicon svg{color:#9B9F91;fill:#9B9F91;}
.bdot{background:#9B9F91;box-shadow:0 0 8px rgba(155,159,145,0.55);}
/* bullet-style-end */
</style>
</head>
<body>

</div>

</body>
</html>
