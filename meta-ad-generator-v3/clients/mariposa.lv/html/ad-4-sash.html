<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Raleway:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
*{hyphens:none;-webkit-hyphens:none}
html,body{width:1080px;height:1080px;overflow:hidden}
.ad{width:1080px;height:1080px;position:relative;overflow:hidden}

.bg-photo{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;object-position:50% 30%;z-index:0;
}
/* dual gradient — top-left scrim for logo + bottom fade for CTA zone */
.bg-grad{
  position:absolute;inset:0;z-index:1;
  background:
    linear-gradient(135deg, rgba(62,76,84,0.72) 0%, rgba(62,76,84,0.28) 18%, transparent 36%),
    linear-gradient(180deg,
      rgba(62,76,84,0.00) 0%,
      rgba(62,76,84,0.00) 60%,
      rgba(62,76,84,0.55) 78%,
      rgba(62,76,84,0.88) 92%,
      rgba(62,76,84,1.00) 100%
    );
}

/* logo — top-left */
.logo-zone{
  position:absolute;top:52px;left:60px;z-index:10;
}
.logo-zone img{
  height:116px;max-width:360px;width:auto;display:block;object-fit:contain;
  filter:drop-shadow(0 2px 12px rgba(0,0,0,0.60));
}

/* diagonal coral sash — spans full width at an angle */
.sash{
  position:absolute;
  left:-120px;right:-120px;
  top:390px;height:192px;
  background:#BC6C54;
  transform:rotate(-5deg);
  transform-origin:center center;
  z-index:5;
  display:flex;align-items:center;justify-content:center;
}
.sash-text{
  transform:rotate(5deg);
  font-family:'Cormorant Garamond',serif;
  font-size:76px;font-weight:600;font-style:italic;
  color:#E9D9C8;letter-spacing:-0.01em;
  white-space:nowrap;
}

/* eyebrow above sash */
.eyebrow-above{
  position:absolute;top:308px;left:0;right:0;text-align:center;
  z-index:10;
  font-family:'Raleway',sans-serif;
  font-size:20px;font-weight:400;letter-spacing:0.22em;text-transform:uppercase;
  color:#E4A489;
}

/* stat chips — just below the sash */
.chips{
  position:absolute;
  top:604px;left:0;right:0;
  display:flex;gap:16px;justify-content:center;
  z-index:10;
}
.chip{
  border:1px solid rgba(228,164,137,0.55);
  color:#E4A489;
  font-family:'Raleway',sans-serif;
  font-size:20px;font-weight:400;
  letter-spacing:0.12em;text-transform:uppercase;
  padding:10px 20px;border-radius:100px;
}

/* benefit row below chips */
.sub-benefits{
  position:absolute;top:672px;left:60px;right:60px;
  display:grid;grid-template-columns:1fr 1fr;gap:10px 32px;
  z-index:10;
}
.brow{display:flex;align-items:flex-start;gap:10px}
.bdot{width:6px;height:6px;border-radius:50%;background:#E4A489;flex-shrink:0;margin-top:9px}
.btext{font-family:'Raleway',sans-serif;font-size:22px;font-weight:400;line-height:1.35;color:#E9D9C8bb}

/* CTA — pinned to bottom */
.cta{
  position:absolute;bottom:150px;left:60px;right:60px;
  display:block;background:#BC6C54;color:#E9D9C8;
  font-family:'Raleway',sans-serif;font-size:21px;font-weight:600;
  padding:22px 36px;border-radius:4px;
  text-align:center;letter-spacing:0.08em;text-transform:uppercase;
  z-index:10;
}
/* bullet-style-start */
.benefits{counter-reset:benefit-num;}
.benefit,.brow{counter-increment:benefit-num;gap:14px;}
.benefit::before,.brow::before{content:counter(benefit-num);min-width:34px;height:34px;background:#9B9F91;border-radius:50%;font-size:15px;font-weight:700;color:#fff;text-align:center;line-height:34px;flex-shrink:0;}
.bicon,.bdot{display:none;}
.btext{color:#ffffff;font-weight:500;}
/* bullet-style-end */
</style>
</head>
<body>
<div class="ad">
  <img class="bg-photo" src="file:///C:/Users/User/Meta-ad-generator-v2/meta-ad-generator-v3/clients/mariposa.lv/image/generated-4.jpg" alt="">
  <div class="bg-grad"></div>
  <div class="logo-zone">
    <img src="file:///C:/Users/User/Meta-ad-generator-v2/meta-ad-generator-v3/clients/mariposa.lv/scrape/logo/001-mariposa-skaistumkop-anas-salons-genskaln.png" alt="Mariposa">
  </div>
  <div class="sash">
    <span class="sash-text">Āda mainās no iekšpuses.</span>
  </div>
  <div class="eyebrow-above">Optimas · Rīga</div>
  <div class="chips">
    <span class="chip">2500+ klientu</span>
    <span class="chip">95% atgriežas</span>
    <span class="chip">Bez sāpēm</span>
  </div>
  <div class="sub-benefits">
    <div class="brow"><span class="bdot"></span><span class="btext">IPL, RF un lāzerepilācija vienā</span></div>
    <div class="brow"><span class="bdot"></span><span class="btext">Redzami rezultāti pēc 2 sesijām</span></div>
    <div class="brow"><span class="bdot"></span><span class="btext">Bezmaksas konsultācija 40€</span></div>
    <div class="brow"><span class="bdot"></span><span class="btext">Katrs protokols kalibrēts Tavam ādas tipam</span></div>
  </div>
  <div class="cta">Piesakies bezmaksas konsultācijai</div>
</div>

</script>
</body>
</html>
