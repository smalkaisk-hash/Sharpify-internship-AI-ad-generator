<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Raleway:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
*{hyphens:none;-webkit-hyphens:none}
html,body{width:1080px;height:1080px;overflow:hidden}
.ad{width:1080px;height:1080px;position:relative;overflow:hidden}

.bg-photo{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;object-position:40% 15%;z-index:0;
}
/* top-left scrim for logo legibility */
.bg-scrim{
  position:absolute;inset:0;z-index:1;
  background:linear-gradient(135deg, rgba(62,76,84,0.65) 0%, rgba(62,76,84,0.22) 16%, transparent 32%);
}

/* logo — top-left, above scrim */
.logo-zone{
  position:absolute;top:52px;left:60px;z-index:10;
}
.logo-zone img{
  height:116px;max-width:360px;width:auto;display:block;object-fit:contain;
  filter:drop-shadow(0 2px 10px rgba(0,0,0,0.55));
}

/* floating card — bottom of canvas */
.card{
  position:absolute;
  bottom:150px;left:52px;right:52px;
  background:rgba(62,76,84,0.95);
  border-radius:20px;
  padding:40px 52px 44px;
  z-index:5;
  display:flex;flex-direction:column;
}
.card-eyebrow{
  font-family:'Raleway',sans-serif;
  font-size:20px;font-weight:400;letter-spacing:0.22em;text-transform:uppercase;
  color:#E4A489;margin-bottom:12px;flex-shrink:0;
}
.card-hd{
  font-family:'Cormorant Garamond',serif;
  font-size:76px;line-height:0.94;font-weight:600;font-style:italic;
  color:#E9D9C8;hyphens:none;-webkit-hyphens:none;padding-bottom:22px;flex-shrink:0;
}
.card-rule{
  height:1px;background:linear-gradient(90deg,#E4A48966,transparent);
  flex-shrink:0;margin-bottom:20px;
}
.card-benefits{
  display:grid;grid-template-columns:1fr 1fr;gap:10px 28px;
  flex-shrink:0;margin-bottom:26px;
}
.brow{display:flex;align-items:flex-start;gap:10px}
.bdot{width:6px;height:6px;border-radius:50%;background:#E4A489;flex-shrink:0;margin-top:8px}
.btext{font-family:'Raleway',sans-serif;font-size:22px;font-weight:400;line-height:1.35;color:#E9D9C8bb}
.card-cta{
  display:block;background:#BC6C54;color:#E9D9C8;
  font-family:'Raleway',sans-serif;font-size:21px;font-weight:600;
  padding:20px 36px;border-radius:4px;
  text-align:center;letter-spacing:0.08em;text-transform:uppercase;
  flex-shrink:0;
}
/* bullet-style-start */
.benefit,.brow{gap:14px;padding:8px 0;border-bottom:1px solid rgba(155,159,145,0.2);}
.benefit:last-child,.brow:last-child{border-bottom:none;}
.benefit::before,.brow::before{content:'';width:10px;height:10px;border-radius:50%;background:#9B9F91;flex-shrink:0;margin-top:7px;box-shadow:0 0 8px rgba(155,159,145,0.55);}
.bicon,.bdot{display:none;}
.btext{color:#ffffff;}
/* bullet-style-end */
</style>
</head>
<body>
<div class="ad">
  <img class="bg-photo" src="file:///C:/Users/User/Meta-ad-generator-v2/meta-ad-generator-v3/clients/mariposa.lv/image/generated-1.jpg" alt="">
  <div class="bg-scrim"></div>
  <div class="logo-zone">
    <img src="file:///C:/Users/User/Meta-ad-generator-v2/meta-ad-generator-v3/clients/mariposa.lv/scrape/logo/001-mariposa-skaistumkop-anas-salons-genskaln.png" alt="Mariposa">
  </div>
  <div class="card">
    <div class="card-eyebrow">Optimas · Rīga</div>
    <div class="card-hd">Trīs tehnoloģijas.<br>Vienā platformā.</div>
    <div class="card-rule"></div>
    <div class="card-benefits">
      <div class="brow"><span class="bdot"></span><span class="btext">IPL, RF un lāzerepilācija vienā platformā</span></div>
      <div class="brow"><span class="bdot"></span><span class="btext">Bez sāpēm, atpakaļ tajā pašā dienā</span></div>
      <div class="brow"><span class="bdot"></span><span class="btext">Redzami rezultāti jau pēc 2 sesijām</span></div>
      <div class="brow"><span class="bdot"></span><span class="btext">Bezmaksas konsultācija, vērtība 40€</span></div>
    </div>
    <div class="card-cta">Piesakies bezmaksas konsultācijai</div>
  </div>
</div>
<script>
document.fonts.ready.then(()=>{
  return Promise.all([
    document.fonts.load('400 22px Raleway','āēīūģķļņšžĀĒĪŪĢĶĻŅŠŽ'),
    document.fonts.load('600 76px "Cormorant Garamond"','āēīūģķļņšžĀĒĪŪĢĶĻŅŠŽ'),
  ]);

</script>
</body>
</html>
