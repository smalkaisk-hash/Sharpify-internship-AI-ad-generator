<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Raleway:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
*{hyphens:none;-webkit-hyphens:none}
html,body{width:1080px;height:1080px;overflow:hidden}
.ad{width:1080px;height:1080px;position:relative;overflow:hidden}

.bg-photo{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;object-position:55% 5%;z-index:0;
}
.bg-scrim{
  position:absolute;inset:0;z-index:1;
  background:linear-gradient(135deg, rgba(62,76,84,0.62) 0%, rgba(62,76,84,0.20) 16%, transparent 32%);
}

.logo-zone{
  position:absolute;top:52px;left:60px;z-index:10;
}
.logo-zone img{
  height:116px;max-width:360px;width:auto;display:block;object-fit:contain;
  filter:drop-shadow(0 2px 12px rgba(0,0,0,0.55));
}

/* wave panel — grows from bottom */
.wave-panel{
  position:absolute;
  bottom:0;left:0;right:0;
  height:600px;
  z-index:5;
  display:flex;flex-direction:column;
}
.wave-svg{
  width:100%;height:90px;
  display:block;flex-shrink:0;
}
.wave-content{
  flex:1;
  background:#E9D9C8;
  padding:14px 68px 150px;
  display:flex;flex-direction:column;
}

.eyebrow{
  font-family:'Raleway',sans-serif;
  font-size:20px;font-weight:400;letter-spacing:0.22em;text-transform:uppercase;
  color:#A6844E;margin-bottom:12px;flex-shrink:0;
}
.hd{
  font-family:'Cormorant Garamond',serif;
  font-size:68px;line-height:0.92;font-weight:600;font-style:italic;
  color:#3E4C54;hyphens:none;-webkit-hyphens:none;padding-bottom:13px;flex-shrink:0;
}
.rule{
  height:1px;background:linear-gradient(90deg,rgba(166,132,78,0.45),transparent);
  flex-shrink:0;margin-bottom:14px;
}
.benefits{
  display:grid;grid-template-columns:1fr 1fr;gap:8px 24px;
  flex-shrink:0;margin-bottom:18px;
}
.brow{display:flex;align-items:flex-start;gap:10px}
.bdot{width:6px;height:6px;border-radius:50%;background:#BC6C54;flex-shrink:0;margin-top:8px}
.btext{font-family:'Raleway',sans-serif;font-size:22px;font-weight:400;line-height:1.30;color:rgba(62,76,84,0.78)}
.cta{
  display:block;background:#BC6C54;color:#E9D9C8;
  font-family:'Raleway',sans-serif;font-size:21px;font-weight:600;
  padding:20px 36px;border-radius:4px;
  text-align:center;letter-spacing:0.08em;text-transform:uppercase;
  flex-shrink:0;
}
/* bullet-style-start */
.benefit,.brow{background:linear-gradient(105deg,#9B9F91,#A6844E);border-radius:28px;padding:11px 20px;box-shadow:0 4px 18px rgba(155,159,145,0.55);gap:12px;}
.btext{color:#fff;font-weight:600;}
.bicon,.bicon svg{color:#fff;fill:#fff;}
.bdot{background:rgba(255,255,255,0.65);}
/* bullet-style-end */
</style>
</head>
<body>
<div class="ad">
  <img class="bg-photo" src="file:///C:/Users/User/Meta-ad-generator-v2/meta-ad-generator-v3/clients/mariposa.lv/image/generated-5.jpg" alt="">
  <div class="bg-scrim"></div>
  <div class="logo-zone">
    <img src="file:///C:/Users/User/Meta-ad-generator-v2/meta-ad-generator-v3/clients/mariposa.lv/scrape/logo/001-mariposa-skaistumkop-anas-salons-genskaln.png" alt="Mariposa">
  </div>
  <div class="wave-panel">
    <svg class="wave-svg" viewBox="0 0 1080 90" preserveAspectRatio="none">
      <!-- floating decorative wave line above fill -->
      <path d="M 0,46 C 130,7 262,65 405,31 C 548,0 672,53 810,25 C 948,-2 1010,38 1080,16"
        fill="none" stroke="rgba(228,164,137,0.42)" stroke-width="1.5"/>
      <!-- main cream wave fill -->
      <path d="M 0,69 C 130,25 262,88 405,51 C 548,15 672,75 810,43 C 948,11 1010,59 1080,36 L 1080,90 L 0,90 Z"
        fill="#E9D9C8"/>
    </svg>
    <div class="wave-content">
      <div class="eyebrow">Optimas · Rīga</div>
      <div class="hd">Sāc redzēt<br>atšķirību.</div>
      <div class="rule"></div>
      <div class="benefits">
        <div class="brow"><span class="bdot"></span><span class="btext">IPL, RF un lāzerepilācija vienā platformā</span></div>
        <div class="brow"><span class="bdot"></span><span class="btext">95% klientu atgriežas pēc pirmās procedūras</span></div>
        <div class="brow"><span class="bdot"></span><span class="btext">Redzami rezultāti jau pēc 2 sesijām</span></div>
        <div class="brow"><span class="bdot"></span><span class="btext">Bezmaksas konsultācija, vērtība 40€</span></div>
      </div>
      <div class="cta">Piesakies bezmaksas konsultācijai</div>
    </div>
  </div>
</div>
<script>
document.fonts.ready.then(()=>{
  return Promise.all([
    document.fonts.load('400 22px Raleway','āēīūģķļņšžĀĒĪŪĢĶĻŅŠŽ'),
    document.fonts.load('600 72px "Cormorant Garamond"','āēīūģķļņšžĀĒĪŪĢĶĻŅŠŽ'),
  ]);
}).then(()=>{ document.title="fonts-ready"; });
</script>
</body>
</html>
