<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Raleway:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
*{hyphens:none;-webkit-hyphens:none}
html,body{width:1080px;height:1080px;overflow:hidden}
.ad{
  width:1080px;height:1080px;position:relative;overflow:hidden;
  background:#BC6C54;
  display:flex;flex-direction:column;
  padding:64px 76px 80px;
}

/* tall arch photo frame — right side */
.photo-frame{
  position:absolute;right:64px;top:88px;bottom:88px;width:390px;
  border-radius:195px 195px 195px 195px;
  overflow:hidden;
  border:8px solid rgba(233,217,200,0.30);
  filter:drop-shadow(0 24px 60px rgba(40,16,8,0.45));
  z-index:1;
}
.photo-frame img{width:100%;height:100%;object-fit:cover;object-position:50% 18%}

/* subtle ring echo */
.ring{
  position:absolute;right:48px;top:72px;bottom:72px;width:422px;
  border-radius:211px;
  border:1px solid rgba(233,217,200,0.16);
  z-index:0;
}

/* left text col — sits on coral BG */
.logo-zone{align-self:flex-start;flex-shrink:0;position:relative;z-index:2}
.logo-zone img{height:116px;max-width:340px;width:auto;display:block;object-fit:contain;opacity:0.92}
.spacer{flex:1;min-height:0}

.eyebrow{
  font-family:'Raleway',sans-serif;
  font-size:20px;font-weight:400;letter-spacing:0.22em;text-transform:uppercase;
  color:rgba(233,217,200,0.68);margin-bottom:14px;
  flex-shrink:0;position:relative;z-index:2;
}
.hd-wrap{flex-shrink:0;padding-bottom:20px;position:relative;z-index:2}
.hd{
  font-family:'Cormorant Garamond',serif;
  font-size:84px;line-height:0.88;font-weight:600;font-style:italic;
  color:#E9D9C8;
}
.rule{
  height:1px;background:linear-gradient(90deg,rgba(233,217,200,0.50),transparent);
  flex-shrink:0;margin-bottom:18px;position:relative;z-index:2;
}
/* 3 stat chips stacked vertically */
.stat-col{display:flex;flex-direction:column;gap:16px;flex-shrink:0;position:relative;z-index:2;margin-bottom:0}
.stat-item{display:flex;align-items:baseline;gap:10px}
.stat-num{
  font-family:'Cormorant Garamond',serif;
  font-size:56px;font-weight:600;font-style:italic;line-height:1.0;
  color:#E9D9C8;
}
.stat-lbl{
  font-family:'Raleway',sans-serif;
  font-size:20px;font-weight:400;letter-spacing:0.14em;text-transform:uppercase;
  color:rgba(233,217,200,0.68);
}
.spacer2{flex:1;min-height:0}
.cta{
  display:block;border:2px solid rgba(233,217,200,0.80);color:#E9D9C8;
  font-family:'Raleway',sans-serif;font-size:21px;font-weight:600;
  padding:22px 8px;border-radius:4px;
  text-align:center;letter-spacing:0.08em;text-transform:uppercase;
  flex-shrink:0;position:relative;z-index:2;
  /* constrain to left column so it doesn't overlap the photo frame */
  margin-right:440px;
}
/* bullet-style-start */
.benefit,.brow{border-left:5px solid #9B9F91;border-radius:0;padding:9px 16px;gap:12px;background:transparent;}
.btext{color:#ffffff;}
.bicon,.bicon svg{color:#9B9F91;fill:#9B9F91;}
.bdot{display:none;}
/* bullet-style-end */
</style>
</head>
<body>
<div class="ad">
  <div class="ring"></div>
  <div class="photo-frame">
    <img src="file:///C:/Users/User/Meta-ad-generator-v2/meta-ad-generator-v3/clients/mariposa.lv/image/generated-10.jpg" alt="">
  </div>
  <div class="logo-zone">
    <img src="file:///C:/Users/User/Meta-ad-generator-v2/meta-ad-generator-v3/clients/mariposa.lv/scrape/logo/001-mariposa-skaistumkop-anas-salons-genskaln.png" alt="Mariposa">
  </div>
  <div class="spacer"></div>
  <div class="eyebrow">Optimas · Rīga</div>
  <div class="hd-wrap">
    <div class="hd">Pigmentācija<br>pazūd. Āda<br>atjaunojas.</div>
  </div>
  <div class="rule"></div>
  <div class="stat-col">
    <div class="stat-item"><span class="stat-num">2500+</span><span class="stat-lbl">klientu</span></div>
    <div class="stat-item"><span class="stat-num">95%</span><span class="stat-lbl">atgriežas</span></div>
    <div class="stat-item"><span class="stat-num">40€</span><span class="stat-lbl">bez maksas</span></div>
  </div>
  <div class="spacer2"></div>
  <div class="cta">Piesakies bezmaksas konsultācijai</div>
</div>
<script>
document.fonts.ready.then(()=>{
  return Promise.all([
    document.fonts.load('400 22px Raleway','āēīūģķļņšžĀĒĪŪĢĶĻŅŠŽ'),
    document.fonts.load('600 84px "Cormorant Garamond"','āēīūģķļņšžĀĒĪŪĢĶĻŅŠŽ'),
  ]);
}).then(()=>{ document.title="fonts-ready"; });
</script>
</body>
</html>
