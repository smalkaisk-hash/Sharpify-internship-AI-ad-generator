html,body{width:1080px;height:1080px;overflow:hidden}

/* full-height photo right side */
.photo-zone{
  position:absolute;right:0;top:0;bottom:0;width:560px;
  overflow:hidden;z-index:0;
}
.photo-zone img{width:100%;height:100%;object-fit:cover;object-position:30% 50%}

/* gradient blend: teal panel fades into photo */
.photo-blend{
  position:absolute;right:0;top:0;bottom:0;width:680px;

}

/* left text column */
.text-col{
  position:absolute;left:0;top:0;bottom:0;width:540px;
  display:flex;flex-direction:column;
  padding:64px 36px 80px 72px;
  z-index:10;
}

.spacer{flex:1;min-height:0}

.bicon{width:24px;height:24px;flex-shrink:0;margin-top:2px}

.cta{

  padding:22px 8px;border-radius:4px;
  text-align:center;letter-spacing:0.08em;text-transform:uppercase;flex-shrink:0;
}
/* bullet-style-start */
.benefits{counter-reset:benefit-num;}
.benefit,.brow{counter-increment:benefit-num;gap:14px;}
.benefit::before,.brow::before{content:counter(benefit-num);min-width:34px;height:34px;background:#9B9F91;border-radius:50%;font-size:15px;font-weight:700;color:#fff;text-align:center;line-height:34px;flex-shrink:0;}
.bicon,.bdot{display:none;}
