<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Raleway:wght@400;500;600&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; hyphens:none; -webkit-hyphens:none; }
html, body { width:1080px; height:1080px; overflow:hidden; }
.ad { width:1080px; height:1080px; display:flex; position:relative; overflow:hidden; }

/* Left dark panel with editorial big number */
.left {
  width:570px; flex-shrink:0; height:1080px;
  background:#0D1320;
  display:flex; flex-direction:column;
  padding:52px 48px 0 60px;
  position:relative; z-index:10; overflow:hidden;
}
/* Amber separator right edge */
.left::after {
  content:''; position:absolute; top:80px; bottom:80px; right:0; width:1px;
  background:linear-gradient(180deg,
    transparent 0%, rgba(200,169,110,0.45) 22%,
    rgba(200,169,110,0.45) 78%, transparent 100%);
}

/* Giant decorative background number — barely visible, adds editorial depth */
.deco-num {
  position:absolute; left:-22px; bottom:-55px; z-index:1;
  font-family:'Barlow Condensed', sans-serif; font-size:530px; font-weight:700;
  color:rgba(200,169,110,0.09); line-height:1; letter-spacing:-0.04em;
  user-select:none; pointer-events:none;
}

.logo-name {
  font-family:'Barlow Condensed', sans-serif; font-size:30px; font-weight:700;
  color:#F2F0EC; letter-spacing:0.14em; text-transform:uppercase; line-height:1;
  position:relative; z-index:5;
}
.logo-sub {
  font-family:'Raleway', sans-serif; font-size:12px; font-weight:400;
  color:rgba(242,240,236,0.42); letter-spacing:0.26em; text-transform:uppercase; margin-top:5px;
  position:relative; z-index:5;
}

.spacer { flex:1; }

.eyebrow {
  font-family:'Raleway', sans-serif; font-size:20px; font-weight:500;
  color:#C8A96E; letter-spacing:0.20em; text-transform:uppercase; margin-bottom:14px;
  position:relative; z-index:5;
}
.headline {
  font-family:'Barlow Condensed', sans-serif; font-size:88px; font-weight:700;
  line-height:0.88; color:#F2F0EC; letter-spacing:-0.01em; margin-bottom:24px;
  position:relative; z-index:5;
}
.rule {
  height:1px;
  background:linear-gradient(90deg, rgba(200,169,110,0.50) 0%, transparent 75%);
  margin-bottom:24px; position:relative; z-index:5;
}

.stats { display:flex; margin-bottom:32px; position:relative; z-index:5; }
.stat { padding:0 22px; border-right:1px solid rgba(200,169,110,0.22); }
.stat:first-child { padding-left:0; }
.stat:last-child { border-right:none; }
.stat-num {
  font-family:'Barlow Condensed', sans-serif; font-size:24px; font-weight:700;
  color:#C8A96E; line-height:1; margin-bottom:4px;
}
.stat-lbl {
  font-family:'Raleway', sans-serif; font-size:11px; font-weight:400;
  color:rgba(242,240,236,0.44); letter-spacing:0.14em; text-transform:uppercase;
}

.spacer2 { height:28px; flex-shrink:0; }
.cta {
  display:block; background:#C8A96E; color:#1C2128;
  font-family:'Raleway', sans-serif; font-size:22px; font-weight:600;
  padding:26px 32px; text-align:center; letter-spacing:0.06em;
  margin-bottom:52px; position:relative; z-index:5;
}

/* Right photo */
.right { flex:1; position:relative; overflow:hidden; }
.right img { width:100%; height:100%; object-fit:cover; object-position:50% 42%; }
.vignette-l {
  position:absolute; inset:0;
  background:linear-gradient(90deg,
    #0D1320 0%, rgba(13,19,32,0.68) 9%,
    rgba(13,19,32,0.22) 24%, transparent 42%);
}
/* bullet-style-start */
.benefit,.brow{background:linear-gradient(105deg,#C8A96E,#E8E0D0);border-radius:28px;padding:11px 20px;box-shadow:0 4px 18px rgba(200,169,110,0.55);gap:12px;}
.btext{color:#fff;font-weight:600;}
.bicon,.bicon svg{color:#fff;fill:#fff;}
.bdot{background:rgba(255,255,255,0.65);}
/* bullet-style-end */
</style>
</head>
<body>
<div class="ad">
  <div class="left">
    <div class="deco-num">32</div>
    <div class="logo-name">Miera 1</div>
    <div class="logo-sub">Biroju centrs</div>
    <div class="spacer"></div>
    <div class="eyebrow">Fakti · Bez kompromisiem</div>
    <div class="headline">Darba vide,<br>kur fakti runā<br>paši par sevi.</div>
    <div class="rule"></div>
    <div class="stats">
      <div class="stat">
        <div class="stat-num">32 gadi</div>
        <div class="stat-lbl">Pieredze</div>
      </div>
      <div class="stat">
        <div class="stat-num">140–1000 m²</div>
        <div class="stat-lbl">Platības</div>
      </div>
      <div class="stat">
        <div class="stat-num">16–18 €/m²</div>
        <div class="stat-lbl">Noma</div>
      </div>
    </div>
    <div class="spacer2"></div>
    <div class="cta">Rezervēt telpas</div>
  </div>
  <div class="right">
    <img src="file:///C:/Users/User/Meta-ad-generator-v2/meta-ad-generator-v3/clients/berzins%20investment/assets/imgi_5_IMG_2189_koki.jpg" alt="">
    <div class="vignette-l"></div>
  </div>
</div>
<script>document.fonts.ready.then(()=>{ document.title="fonts-ready"; });</script>
</body>
</html>
