<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Raleway:wght@400;500;600&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; hyphens:none; -webkit-hyphens:none; }
html, body { width:1080px; height:1080px; overflow:hidden; }
.ad { width:1080px; height:1080px; position:relative; overflow:hidden; background:#0A0E14; }

.photo { position:absolute; inset:0; }
.photo img {
  width:100%; height:100%;
  object-fit:cover; object-position:72% 30%;
  filter:brightness(0.88) contrast(1.04);
}

/* Frosted diagonal panel — left side */
.panel {
  position:absolute; top:0; left:0; bottom:0; width:680px; z-index:5;
  background:rgba(13,19,32,0.82);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  clip-path:polygon(0 0, 100% 0, 80% 100%, 0 100%);
}

/* Amber diagonal edge stripe (4px wide, follows panel right edge) */
.panel-edge {
  position:absolute; inset:0; z-index:6; pointer-events:none;
  background:rgba(200,169,110,0.42);
  clip-path:polygon(62.6% 0, 63.3% 0, 50.0% 100%, 49.3% 100%);
}

/* Content column — fits within panel at all heights */
.content {
  position:absolute; top:0; left:0; bottom:0; width:520px; z-index:10;
  display:flex; flex-direction:column;
  padding:52px 60px 52px 60px;
}

.logo-name {
  font-family:'Barlow Condensed', sans-serif; font-size:30px; font-weight:700;
  color:#F2F0EC; letter-spacing:0.14em; text-transform:uppercase; line-height:1;
}
.logo-sub {
  font-family:'Raleway', sans-serif; font-size:12px; font-weight:400;
  color:rgba(242,240,236,0.42); letter-spacing:0.26em; text-transform:uppercase; margin-top:5px;
}

.spacer { flex:1; }

.eyebrow {
  font-family:'Raleway', sans-serif; font-size:20px; font-weight:500;
  color:#C8A96E; letter-spacing:0.20em; text-transform:uppercase; margin-bottom:12px;
}
.headline {
  font-family:'Barlow Condensed', sans-serif; font-size:72px; font-weight:700;
  line-height:0.88; color:#F2F0EC; letter-spacing:-0.01em; margin-bottom:18px;
}
.rule {
  height:1px;
  background:linear-gradient(90deg, rgba(200,169,110,0.50) 0%, transparent 80%);
  margin-bottom:20px;
}

/* Numbered credentials list */
.bullets { margin-bottom:28px; }
.bullet {
  display:flex; align-items:flex-start; gap:14px;
  padding:10px 0;
  border-bottom:1px solid rgba(200,169,110,0.14);
}
.bullet:last-child { border-bottom:none; }
.bnum {
  min-width:34px; height:34px;
  background:#C8A96E; border-radius:50%;
  font-family:'Barlow Condensed', sans-serif; font-size:18px; font-weight:700;
  color:#1C2128; text-align:center; line-height:34px;
  flex-shrink:0; display:inline-flex; align-items:center; justify-content:center;
}
.btext {
  font-family:'Raleway', sans-serif; font-size:22px; font-weight:400;
  color:rgba(242,240,236,0.85); line-height:1.30;
}

.spacer2 { height:28px; flex-shrink:0; }
.cta {
  display:block; background:#C8A96E; color:#1C2128;
  font-family:'Raleway', sans-serif; font-size:22px; font-weight:600;
  padding:26px 32px; text-align:center; letter-spacing:0.06em;
}
/* bullet-style-start */
.benefit,.brow{background:rgba(255,255,255,0.13);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.22);border-radius:14px;padding:11px 18px;gap:12px;}
.btext{color:#ffffff;}
.bicon,.bicon svg{color:#C8A96E;fill:#C8A96E;}
.bdot{background:rgba(255,255,255,0.6);}
/* bullet-style-end */
</style>
</head>
<body>
<div class="ad">
  <div class="photo">
    <img src="file:///C:/Users/User/Meta-ad-generator-v2/meta-ad-generator-v3/clients/berzins%20investment/scrape/other_images/web_kapnu_telpa_1.jpg" alt="">

  <div class="panel"></div>

  <div class="content">
