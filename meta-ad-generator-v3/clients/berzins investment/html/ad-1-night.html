<style>

.overlay-l {

.logo-zone { position:absolute; top:52px; left:60px; z-index:10; }

.tag-dot { width:5px; height:5px; background:#C8A96E; border-radius:50%; }

.bottom { position:absolute; bottom:52px; left:60px; right:60px; z-index:10; }

.eyebrow {

.rule {
  height:1px;

.stats { display:flex; margin-bottom:30px; }
.stat { padding:0 28px; border-right:1px solid rgba(200,169,110,0.20); }

.cta {
