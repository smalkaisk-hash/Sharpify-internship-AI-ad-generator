<!DOCTYPE html>
<!-- Template: t54 — arch photo frame, dark elegant, mixed font headline -->
<html lang="en">
<head><meta charset="UTF-8"><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=Inter:ital,wght@0,300;0,400;1,400;1,600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1080px;overflow:hidden}
.ad{width:1080px;height:1080px;position:relative;overflow:hidden;background:#000000;display:flex;flex-direction:column;align-items:center;padding:52px 72px 52px}

/* Arch photo frame */
.arch-wrap{
  width:560px;height:460px;flex-shrink:0;
  border-radius:280px 280px 0 0;
  overflow:hidden;position:relative;margin-bottom:32px;
}
.arch-img{width:100%;height:100%;object-fit:cover;object-position:50% 20%}
/* Inner glow border */
.arch-border{
  position:absolute;inset:0;
  border-radius:280px 280px 0 0;
  border:2px solid #6C47FF44;
  pointer-events:none;
}

/* Headline — mixed serif italic + bold sans */
.hd-wrap{text-align:center;margin-bottom:24px;flex-shrink:0}
.hd-regular{font-family:'Inter',sans-serif;font-size:68px;font-weight:400;color:#FFFFFF;line-height:1.05}
.hd-italic{font-family:'Inter',sans-serif;font-style:italic;font-size:68px;font-weight:600;color:#9B7AFF;line-height:1.05}

/* Sub */
.sub{font-family:'Inter',sans-serif;font-size:20px;font-weight:300;color:#A8A8B8;text-align:center;margin-bottom:24px;flex-shrink:0;max-width:720px}

/* Middle spacer — vertically centers content between arch and CTA */
.middle{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%}

/* Chips row */
.chips{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;flex-shrink:0}
.chip{background:#111122;border:1px solid #1E1E35;border-radius:50px;padding:10px 22px;font-family:'Inter',sans-serif;font-size:17px;font-weight:500;color:#A8A8B8;white-space:nowrap}
.chip-cta{background:#6C47FF22;border:1px solid #6C47FF;color:#9B7AFF}

/* CTA + proof */
.cta-row{display:flex;align-items:center;gap:24px;flex-shrink:0}
.cta{background:#6C47FF;color:#FFFFFF;font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700;padding:18px 48px;border-radius:50px;letter-spacing:0.03em;white-space:nowrap}
.proof{font-family:'Inter',sans-serif;font-size:16px;color:#555566;white-space:nowrap}
.proof b{color:#A8A8B8;font-weight:500}
.logo-img{height:70px;max-width:220px;object-fit:contain;opacity:0.90;flex-shrink:0;align-self:flex-start;margin-bottom:12px}
</style></head>
<body>
<div class="ad">
  <img class="logo-img" src="../scrape/logo/002-builder.io-logo-white.svg" alt="Builder.io">
  <div class="arch-wrap">
    <img class="arch-img" src="file:///C:/Users/User/Meta-ad-generator-v2/meta-ad-generator-v3/clients/builder.io/scrape/other_images/080-og-image.png" alt="">
    <div class="arch-border"></div>
  </div>

  <div class="middle">
    <div class="hd-wrap">
      <div class="hd-regular">Your whole team ships</div>
      <div class="hd-italic">production-ready code.</div>
    </div>
    <div class="sub">AI builds on your real codebase. Designers, PMs, and engineers collaborate in one workspace. No handoffs, no bottlenecks.</div>
    <div class="chips">
      <div class="chip">AI Code Gen</div>
      <div class="chip">Visual Editor</div>
      <div class="chip">No Handoffs</div>
      <div class="chip chip-cta">🎁 Free Trial →</div>
    </div>
  </div>

  <div class="cta-row">
    <div class="cta">Start for Free →</div>
    <div class="proof"><b>10,000+ teams</b> already use Builder.io</div>
  </div>
</div>
<script>document.fonts.ready.then(()=>{ document.title="fonts-ready"; });</script>
</body></html>
