.circle-frame{position:absolute;right:28px;top:50%;transform:translateY(-50%);

.circle-frame img{width:100%;height:100%;object-fit:cover;object-position:50% 22%}

.rule{height:1px;background:linear-gradient(90deg,rgba(229,0,126,0.45),transparent);

.bullets{display:flex;flex-direction:column;gap:11px;flex-shrink:0}

.btext{font-family:'Raleway',sans-serif;font-size:22px;font-weight:400;

  font-family:'Raleway',sans-serif;font-size:22px;font-weight:700;

/* bullet-style-start */

.bicon,.bicon svg{color:#E5007E;fill:#E5007E;}
.bdot{background:#E5007E;box-shadow:0 0 8px rgba(229,0,126,0.55);}
