<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@800&family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;hyphens:none;-webkit-hyphens:none}
html,body{width:1080px;height:1080px;overflow:hidden}
.ad{width:1080px;height:1080px;position:relative;overflow:hidden;background:#1E1E1E}

/* full-bleed travel photo */
.photo{position:absolute;inset:0;z-index:0}
.photo img{width:100%;height:100%;object-fit:cover;object-position:50% 25%}

/* top-left scrim for logo readability */
.scrim{position:absolute;top:0;left:0;width:360px;height:300px;z-index:1;
  background:radial-gradient(ellipse at top left,rgba(18,18,18,0.82) 0%,transparent 72%)}

/* scalloped navy panel — 9 concave arcs, height 560px from bottom */
.panel{position:absolute;bottom:0;left:0;right:0;height:560px;
  clip-path:path('M 0,50 Q 60,0 120,50 Q 180,0 240,50 Q 300,0 360,50 Q 420,0 480,50 Q 540,0 600,50 Q 660,0 720,50 Q 780,0 840,50 Q 900,0 960,50 Q 1020,0 1080,50 L 1080,560 L 0,560 Z');
  background:linear-gradient(180deg,#1E1E1E 0%,#111111 100%);z-index:2}

/* yellow accent line tracing scallop peaks */
.scallop-line{position:absolute;bottom:510px;left:0;right:0;height:56px;
  clip-path:path('M 0,50 Q 60,0 120,50 Q 180,0 240,50 Q 300,0 360,50 Q 420,0 480,50 Q 540,0 600,50 Q 660,0 720,50 Q 780,0 840,50 Q 900,0 960,50 Q 1020,0 1080,50 L 1080,56 L 0,56 Z');
  background:transparent;
  outline:none;
  border-top:2px solid rgba(229,0,126,0.45);
  z-index:3;pointer-events:none}

/* logo — top-left over photo area */
.logo-zone{position:absolute;top:48px;left:64px;z-index:20}
.logo-zone img{height:116px;max-width:340px;width:auto;object-fit:contain;filter:none}

/* panel content — two-spacer flex in the bottom panel */
.panel-col{position:absolute;bottom:0;left:0;right:0;height:510px;
  display:flex;flex-direction:column;
  padding:28px 80px 160px 72px;z-index:10}
.eyebrow{font-family:'Raleway',sans-serif;font-size:20px;font-weight:600;
  letter-spacing:0.18em;text-transform:uppercase;color:rgba(229,0,126,0.75);
  margin-bottom:12px;flex-shrink:0}
.hd{font-family:'Barlow Condensed',sans-serif;font-size:80px;font-weight:800;
  color:#FFFFFF;line-height:0.90;text-transform:uppercase;letter-spacing:-0.01em;
  margin-bottom:18px;flex-shrink:0}
.hd em{color:#E5007E;font-style:normal}
.rule{height:1px;background:linear-gradient(90deg,rgba(229,0,126,0.50),transparent);
  margin-bottom:16px;flex-shrink:0}
.bullets-grid{display:flex;flex-wrap:wrap;gap:10px;flex-shrink:0}
.bullet{width:calc(50% - 5px);display:flex;align-items:flex-start;gap:9px}
.btext{font-family:'Raleway',sans-serif;font-size:22px;font-weight:400;
  line-height:1.26;color:rgba(255,255,255,0.84)}
.spacer{flex:1;min-height:0}
.cta{align-self:flex-start;flex-shrink:0;display:block;
  background:#E5007E;color:#FFFFFF;
  font-family:'Raleway',sans-serif;font-size:22px;font-weight:700;
  padding:22px 44px;border-radius:8px;letter-spacing:0.03em}

/* bullet-style-start */
.benefit,.brow{gap:14px;padding:8px 0;border-bottom:1px solid rgba(229,0,126,0.2);}
.benefit:last-child,.brow:last-child{border-bottom:none;}
.benefit::before,.brow::before{content:'';width:10px;height:10px;border-radius:50%;background:#E5007E;flex-shrink:0;margin-top:7px;box-shadow:0 0 8px rgba(229,0,126,0.55);}
.bicon,.bdot{display:none;}
.btext{color:#ffffff;}
/* bullet-style-end */
</style>
<script>document.fonts.ready.then(()=>{ document.title="fonts-ready"; });</script>
</head>
<body>
<div class="ad">
  <div class="photo"><img src="file:///C:/Users/User/Meta-ad-generator-v2/meta-ad-generator-v3/clients/celojumubode.lv/image/generated-6.jpg" alt=""></div>
  <div class="scrim"></div>
  <div class="panel"></div>
  <div class="logo-zone">
    <img src="file:///C:/Users/User/Meta-ad-generator-v2/meta-ad-generator-v3/clients/celojumubode.lv/scrape/logo/001-ce-ojumu-bode.png" alt="Ceļojumu Bode">
  </div>
  <div class="panel-col">
    <div class="eyebrow">Viss iekļauts</div>
    <div class="hd">Turcijā vasarā.<br><em>Bez</em> iekrājumiem.</div>
    <div class="rule"></div>
    <div class="bullets-grid">
      <div class="bullet"><span class="btext">Bezprocentu nomaksa.</span></div>
      <div class="bullet"><span class="btext">Lidojums + viesnīca + transfērs.</span></div>

    </div>
    <div class="spacer"></div>
    <a class="cta">Rezervēt ceļojumu</a>
  </div>
</div>
</body>
</html>
