<style>
*{margin:0;padding:0;box-sizing:border-box;hyphens:none;-webkit-hyphens:none}
html,body{width:1080px;height:1080px;overflow:hidden}

/* Full-bleed photo */
.bg{position:absolute;inset:0;z-index:0}
.bg img{width:100%;height:100%;object-fit:cover;object-position:50% 22%}

/* Top scrim — logo readability */
.scrim{position:absolute;top:0;left:0;right:0;height:220px;z-index:1;

.logo{position:absolute;top:48px;left:52px;z-index:10; height:76px; max-width:360px; object-fit:contain;}
.logo img{height:116px;max-width:360px;width:auto;object-fit:contain;
  filter:drop-shadow(0 0 14px rgba(229,0,126,0.65)) drop-shadow(0 2px 6px rgba(0,0,0,0.90))}

/* Watermark stat — decorative, upper-right */
.wm{position:absolute;top:42px;right:48px;z-index:2;text-align:right;
  font-family:'Barlow Condensed',sans-serif;font-weight:800;line-height:0.9;
  color:rgba(255,255,255,0.08);pointer-events:none}
.wm-num{font-size:130px;letter-spacing:-0.03em}
.wm-sub{font-size:24px;font-weight:600;letter-spacing:0.08em;display:block;margin-top:4px;
  color:rgba(255,255,255,0.10)}

/* Arch card — bottom 600px */
.card{
  position:absolute;bottom:0;left:0;right:0;height:600px;z-index:3;
  clip-path:path('M 0,70 Q 540,0 1080,70 L 1080,600 L 0,600 Z');
  background:#180A10;
  display:flex;flex-direction:column;
  padding:80px 52px 100px
}
.spacer{flex:1}

/* Subtle hairline at arch waist */
.arch-line{position:absolute;top:548px;left:0;right:0;height:1px;z-index:4;
  background:linear-gradient(to right,transparent 0%,rgba(255,255,255,0.18) 20%,rgba(255,255,255,0.18) 80%,transparent 100%)}

.eyebrow{font-family:'Raleway',sans-serif;font-size:20px;font-weight:700;
  color:#E5007E;text-transform:uppercase;letter-spacing:0.14em;margin-bottom:6px}
.hd{font-family:'Barlow Condensed',sans-serif;font-size:86px;font-weight:800;
  color:#FFFFFF;line-height:0.88;letter-spacing:-0.02em;margin-bottom:8px;
  hyphens:none;-webkit-hyphens:none}
.hd em{color:#E5007E;font-style:normal}
.sub{font-family:'Raleway',sans-serif;font-size:22px;font-weight:400;
  color:rgba(255,255,255,0.50);margin-bottom:16px}

/* 2×2 bullets */
.bullets{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:28px}
.benefit{display:flex;align-items:flex-start}
.btext{font-family:'Raleway',sans-serif;font-size:22px;font-weight:500;
  color:#fff;line-height:1.22}

/* CTA */
.cta{display:block;background:#E5007E;color:#FFFFFF;
  font-family:'Raleway',sans-serif;font-size:22px;font-weight:700;
  padding:22px 14px;border-radius:8px;text-align:center;
  letter-spacing:0.02em;margin-top:auto}

/* bullet-style-start */
.benefit,.brow{border:2px solid #E5007E;border-radius:28px;padding:10px 18px;gap:12px;box-shadow:0 0 18px rgba(229,0,126,0.55),inset 0 0 8px rgba(229,0,126,0.08);background:rgba(255,255,255,0.05);}
.btext{color:#ffffff;}
.bicon,.bicon svg{color:#E5007E;fill:#E5007E;}
.bdot{background:#E5007E;box-shadow:0 0 8px rgba(229,0,126,0.55);}
/* bullet-style-end */
</style>
</head>
