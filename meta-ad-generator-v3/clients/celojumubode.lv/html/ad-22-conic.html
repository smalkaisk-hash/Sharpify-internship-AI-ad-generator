<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@800&family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;hyphens:none;-webkit-hyphens:none}
html,body{width:1080px;height:1080px;overflow:hidden}

/* conic gradient burst — blue/navy radiating from top-right corner */
.ad{width:1080px;height:1080px;position:relative;overflow:hidden;
  background:conic-gradient(
    from 220deg at 84% 16%,
    #E5007E 0deg,
    #1E1E1E 50deg,
    #111111 180deg,
    #111111 290deg,
    #1E1E1E 340deg,
    #E5007E 360deg
  )}

/* radial vignette softener */
.vignette{position:absolute;inset:0;z-index:1;
  background:radial-gradient(ellipse 88% 88% at 50% 50%,transparent 38%,rgba(18,18,18,0.75) 100%)}

/* photo inset circle — top-right, shows travel scene */
.photo-inset{position:absolute;top:60px;right:60px;
  width:240px;height:240px;border-radius:50%;overflow:hidden;z-index:3;
  border:3px solid rgba(229,0,126,0.70);
  filter:drop-shadow(0 12px 36px rgba(0,0,0,0.35))}
.photo-inset img{width:100%;height:100%;object-fit:cover;object-position:50% 20%}

/* decorative ring around photo inset */
.inset-ring{position:absolute;top:42px;right:42px;
  width:276px;height:276px;border-radius:50%;
  border:1.5px solid rgba(229,0,126,0.28);z-index:2}

/* main text column — left, full height */
.col{position:absolute;left:0;top:0;bottom:0;width:740px;
  display:flex;flex-direction:column;padding:56px 52px 160px 72px;z-index:10}
.logo-zone{align-self:flex-start;flex-shrink:0}
.logo-zone img{height:116px;max-width:360px;width:auto;object-fit:contain;filter:none}
.spacer{flex:1;min-height:0}
.eyebrow{font-family:'Raleway',sans-serif;font-size:20px;font-weight:600;
  letter-spacing:0.18em;text-transform:uppercase;color:rgba(229,0,126,0.75);
  margin-bottom:14px;flex-shrink:0}
.hd{font-family:'Barlow Condensed',sans-serif;font-size:84px;font-weight:800;
  color:#FFFFFF;line-height:0.90;text-transform:uppercase;letter-spacing:-0.01em;
  margin-bottom:22px;flex-shrink:0}
.hd em{color:#E5007E;font-style:normal}
.rule{height:1px;background:linear-gradient(90deg,rgba(229,0,126,0.50),transparent);
  margin-bottom:18px;flex-shrink:0}
.bullets-grid{display:flex;flex-wrap:wrap;gap:10px;flex-shrink:0}
.bullet{width:calc(50% - 5px);display:flex;align-items:flex-start;gap:10px}
.btext{font-family:'Raleway',sans-serif;font-size:22px;font-weight:400;
  line-height:1.26;color:rgba(255,255,255,0.84)}
.spacer2{height:28px;flex-shrink:0}
.cta{align-self:flex-start;flex-shrink:0;display:block;
  background:#E5007E;color:#FFFFFF;
  font-family:'Raleway',sans-serif;font-size:22px;font-weight:700;
  padding:22px 52px;border-radius:8px;letter-spacing:0.03em}

/* bullet-style-start */
.benefit,.brow{background:linear-gradient(105deg,#E5007E,#2A2A2A);border-radius:28px;padding:11px 20px;box-shadow:0 4px 18px rgba(229,0,126,0.55);gap:12px;}
.btext{color:#fff;font-weight:600;}
.bicon,.bicon svg{color:#fff;fill:#fff;}
.bdot{background:rgba(255,255,255,0.65);}
/* bullet-style-end */
</style>
<script>document.fonts.ready.then(()=>{ document.title="fonts-ready"; });</script>
</head>
<body>
<div class="ad">
  <div class="vignette"></div>
  <div class="inset-ring"></div>
  <div class="photo-inset">
    <img src="file:///C:/Users/User/Meta-ad-generator-v2/meta-ad-generator-v3/clients/celojumubode.lv/image/generated-7.jpg" alt="">
  </div>
  <div class="col">
    <div class="logo-zone"><img src="file:///C:/Users/User/Meta-ad-generator-v2/meta-ad-generator-v3/clients/celojumubode.lv/scrape/logo/001-ce-ojumu-bode.png" alt="Ceļojumu Bode"></div>
    <div class="spacer"></div>
    <div class="eyebrow">351 atsauksme</div>
    <div class="hd">Vērtējums<br><em>4.9/5.</em><br>Ceļotāji iesaka.</div>
    <div class="rule"></div>
    <div class="bullets-grid">
      <div class="bullet"><span class="btext">1000+ ceļojumi no Rīgas.</span></div>
      <div class="bullet"><span class="btext">Turcija, Ēģipte, Grieķija un 50+ valstis.</span></div>
      <div class="bullet"><span class="btext">Bezprocentu nomaksa.</span></div>
      <div class="bullet"><span class="btext">Atmaksa atcelšanas gadījumā.</span></div>
    </div>
    <div class="spacer2"></div>
    <a class="cta">Rezervēt ceļojumu</a>
  </div>
</div>
</body>
</html>
