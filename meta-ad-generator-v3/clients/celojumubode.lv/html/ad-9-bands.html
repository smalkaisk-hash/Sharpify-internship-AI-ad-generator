<!DOCTYPE html>
<html lang="lv">
<head>

<style>
*{margin:0;padding:0;box-sizing:border-box;hyphens:none;-webkit-hyphens:none}
html,body{width:1080px;height:1080px;overflow:hidden}
.ad{width:1080px;height:1080px;display:flex;flex-direction:column;overflow:hidden}
/* Warm dark top zone */
.top{height:420px;flex-shrink:0;background:#1E1E1E;padding:44px 52px 36px;display:flex;flex-direction:column;justify-content:space-between}
.logo img{height:116px;max-width:320px;width:auto;object-fit:contain;filter:drop-shadow(0 0 4px rgba(255,255,255,0.20))}
.eyebrow{font-family:'Raleway',sans-serif;font-size:20px;font-weight:700;color:rgba(255,255,255,0.42);text-transform:uppercase;letter-spacing:0.16em;margin-bottom:10px}
.hd{font-family:'Barlow Condensed',sans-serif;font-size:88px;font-weight:800;color:#FFFFFF;line-height:0.88;letter-spacing:-0.02em;hyphens:none;-webkit-hyphens:none}
.hd em{color:#E5007E;font-style:normal}
.stats{display:flex;gap:16px}
.stat-chip{background:rgba(229,0,126,0.12);border:1px solid rgba(229,0,126,0.35);border-radius:50px;padding:10px 20px;display:flex;align-items:center;gap:8px}
.snum{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:800;color:#E5007E;line-height:1}
.slabel{font-family:'Raleway',sans-serif;font-size:20px;font-weight:600;color:rgba(255,255,255,0.60)}
/* Pink rule */
.rule{height:4px;background:#E5007E;flex-shrink:0;opacity:0.75}
/* Photo fills the rest */
.photo{flex:1;position:relative;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover;object-position:50% 35%}
.cta-wrap{position:absolute;bottom:44px;left:52px;right:52px;z-index:5}
.cta{display:block;background:#E5007E;color:#FFFFFF;font-family:'Raleway',sans-serif;font-size:24px;font-weight:700;padding:22px 36px;border-radius:8px;text-align:center;letter-spacing:0.02em;box-shadow:0 4px 24px rgba(0,0,0,0.35)}
/* bullet-style-start */
.benefit,.brow{background:rgba(229,0,126,0.14);border-left:5px solid #E5007E;border-radius:0 10px 10px 0;padding:11px 18px;gap:12px;}
.btext{color:#ffffff;font-weight:500;}
.bicon,.bicon svg{color:#E5007E;fill:#E5007E;}
.bdot{display:none;}
/* bullet-style-end */
</style>
</head>
<body>
<div class="ad">
  <div class="top">
    <div class="logo"><img src="file:///C:/Users/User/Meta-ad-generator-v2/meta-ad-generator-v3/clients/celojumubode.lv/scrape/logo/001-ce-ojumu-bode.png" alt="Ceļojumu Bode"></div>

    </div>
    <div class="stats">

      <div class="stat-chip"><span class="snum">0%</span><span class="slabel">procenti</span></div>
