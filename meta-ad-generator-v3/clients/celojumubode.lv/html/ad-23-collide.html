<!DOCTYPE html>

<style>
*{margin:0;padding:0;box-sizing:border-box;hyphens:none;-webkit-hyphens:none}
html,body{width:1080px;height:1080px;overflow:hidden}
.ad{width:1080px;height:1080px;position:relative;overflow:hidden;background:#111111}

/* full-bleed photo layer */
.photo{position:absolute;inset:0;z-index:0}
.photo img{width:100%;height:100%;object-fit:cover;object-position:50% 30%}

/* dark vignette bottom */
.vignette{position:absolute;inset:0;z-index:1;
  background:linear-gradient(to top,rgba(17,17,17,0.94) 0%,rgba(17,17,17,0.65) 38%,transparent 62%)}

/* dark polygon zone — collides from top-left over photo */
.poly{position:absolute;top:0;left:0;width:100%;height:500px;z-index:2;
  background:linear-gradient(135deg,#1E1E1E 0%,#111111 60%,rgba(17,17,17,0.72) 100%);
  clip-path:polygon(0 0,100% 0,100% 28%,58% 46%,0 46%)}

/* pink collision stripe — crosses polygon boundary diagonally */
.stripe{position:absolute;top:258px;left:0;right:0;height:6px;z-index:5;
  background:linear-gradient(90deg,#E5007E 0%,#E5007E 62%,transparent 100%);
  transform:rotate(-1.5deg);transform-origin:left center}

/* accent dot at stripe-poly junction */
.junction-dot{position:absolute;top:248px;left:57%;
  width:20px;height:20px;border-radius:50%;background:#E5007E;z-index:6;
  transform:translate(-50%,-50%)}

/* logo in dark poly zone */
.logo-zone{position:absolute;top:44px;left:64px;z-index:20;align-self:flex-start}
.logo-zone img{height:116px;max-width:300px;width:auto;object-fit:contain}

/* eyebrow in dark zone */
.eyebrow-abs{position:absolute;top:174px;left:72px;z-index:20;
  font-family:'Raleway',sans-serif;font-size:20px;font-weight:600;
  letter-spacing:0.18em;text-transform:uppercase;color:rgba(229,0,126,0.80)}

/* content zone — lower two thirds, inside vignette */
.content{position:absolute;bottom:0;left:0;right:0;
  display:flex;flex-direction:column;
  padding:0 72px 168px 72px;z-index:10}
.hd{font-family:'Barlow Condensed',sans-serif;font-size:82px;font-weight:800;
  color:#FFFFFF;line-height:0.90;text-transform:uppercase;letter-spacing:-0.01em;
  margin-bottom:20px;flex-shrink:0}
.hd em{color:#E5007E;font-style:normal}
.rule{height:1px;background:linear-gradient(90deg,#E5007E 0%,rgba(229,0,126,0.15) 100%);
  margin-bottom:16px;flex-shrink:0}
.bullets-grid{display:flex;flex-wrap:wrap;gap:10px;flex-shrink:0;margin-bottom:28px}
.bullet{width:calc(50% - 5px);display:flex;align-items:flex-start;gap:10px}
.btext{font-family:'Raleway',sans-serif;font-size:22px;font-weight:400;
  line-height:1.26;color:rgba(255,255,255,0.88)}
.cta{align-self:flex-start;flex-shrink:0;display:block;
  background:#E5007E;color:#FFFFFF;
  font-family:'Raleway',sans-serif;font-size:22px;font-weight:700;
  padding:22px 52px;border-radius:8px;letter-spacing:0.03em}

/* bullet-style-start */
.benefit,.brow{border:2px solid #E5007E;border-radius:28px;padding:10px 18px;gap:12px;box-shadow:0 0 18px rgba(229,0,126,0.55),inset 0 0 8px rgba(229,0,126,0.08);background:rgba(255,255,255,0.05);}
.btext{color:#ffffff;}
.bicon,.bicon svg{color:#E5007E;fill:#E5007E;}
.bdot{background:#E5007E;box-shadow:0 0 8px rgba(229,0,126,0.55);}
/* bullet-style-end */
</style>
<script>document.fonts.ready.then(()=>{ document.title="fonts-ready"; });</script>
</head>
