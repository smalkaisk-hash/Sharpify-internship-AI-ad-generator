<!DOCTYPE html>
<html lang="lv">
<head>

<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@800&family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;hyphens:none;-webkit-hyphens:none}
html,body{width:1080px;height:1080px;overflow:hidden}
.ad{width:1080px;height:1080px;position:relative;overflow:hidden;background:#111111}

/* full-bleed darkened photo */
.photo{position:absolute;inset:0;z-index:0}
.photo img{width:100%;height:100%;object-fit:cover;object-position:50% 30%;
  filter:brightness(0.38) saturate(0.45)}

/* stat bar */
.stat-bar{display:flex;gap:12px;flex-shrink:0;margin-bottom:28px}
.stat{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:5px;padding:16px 8px;background:rgba(255,255,255,0.08);
  border:1px solid rgba(229,0,126,0.35);border-radius:12px}
.stat-icon{font-size:26px;line-height:1;color:#E5007E}
.stat-val{font-family:'Raleway',sans-serif;font-size:20px;font-weight:600;
  color:#FFFFFF;text-align:center;line-height:1.2}

/* dark vignette bottom */
.vignette{position:absolute;inset:0;z-index:2;
  background:linear-gradient(to top,
    rgba(17,17,17,0.96) 0%,
    rgba(17,17,17,0.78) 36%,
    rgba(17,17,17,0.30) 58%,
    transparent 74%)}


/* logo top-left */
.logo-zone{position:absolute;top:48px;left:64px;z-index:20;align-self:flex-start}
.logo-zone img{height:116px;max-width:300px;width:auto;object-fit:contain;
  filter:drop-shadow(0 2px 12px rgba(0,0,0,0.60))}

/* rating badge — top right */
.badge{position:absolute;top:52px;right:64px;z-index:20;
  display:flex;flex-direction:column;align-items:center;
  background:rgba(30,30,30,0.85);border:1.5px solid rgba(229,0,126,0.45);
  border-radius:12px;padding:16px 24px}
.badge-score{font-family:'Barlow Condensed',sans-serif;font-size:44px;font-weight:800;
  color:#E5007E;line-height:1;letter-spacing:-0.01em}
.badge-label{font-family:'Raleway',sans-serif;font-size:20px;font-weight:600;
  color:rgba(255,255,255,0.70);letter-spacing:0.10em;text-transform:uppercase;
  margin-top:4px}

/* content zone — bottom, anchored to bottom */
.content{position:absolute;bottom:0;left:0;right:0;
  display:flex;flex-direction:column;
  padding:0 72px 168px 72px;z-index:10}
.eyebrow{font-family:'Raleway',sans-serif;font-size:20px;font-weight:600;
  letter-spacing:0.18em;text-transform:uppercase;color:rgba(229,0,126,0.80);
  margin-bottom:14px;flex-shrink:0}
.hd{font-family:'Barlow Condensed',sans-serif;font-size:88px;font-weight:800;
  color:#FFFFFF;line-height:0.90;text-transform:uppercase;letter-spacing:-0.01em;
  margin-bottom:22px;flex-shrink:0}
.hd em{color:#E5007E;font-style:normal}
.rule{height:1px;background:linear-gradient(90deg,rgba(229,0,126,0.50),transparent);
  margin-bottom:18px;flex-shrink:0}
.bullets-grid{display:flex;flex-wrap:wrap;gap:10px;flex-shrink:0;margin-bottom:28px}
.bullet{width:calc(50% - 5px);display:flex;align-items:flex-start;gap:10px}
.btext{font-family:'Raleway',sans-serif;font-size:22px;font-weight:400;
  line-height:1.26;color:rgba(255,255,255,0.86)}
.cta{align-self:flex-start;flex-shrink:0;display:block;
  background:#E5007E;color:#FFFFFF;
  font-family:'Raleway',sans-serif;font-size:22px;font-weight:700;
  padding:22px 56px;border-radius:8px;letter-spacing:0.03em}

/* bullet-style-start */
.benefit,.brow{border-left:5px solid #E5007E;border-radius:0;padding:9px 16px;gap:12px;background:transparent;}
.btext{color:#ffffff;}
.bicon,.bicon svg{color:#E5007E;fill:#E5007E;}
.bdot{display:none;}
/* bullet-style-end */
</style>
<script>document.fonts.ready.then(()=>{ document.title="fonts-ready"; });</script>
</head>

  <div class="vignette"></div>
