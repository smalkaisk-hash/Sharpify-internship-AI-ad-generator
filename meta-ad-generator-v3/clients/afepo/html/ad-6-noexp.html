<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1080px;overflow:hidden}
.ad{width:1080px;height:1080px;position:relative;overflow:hidden;background:#060C18}

.photo{position:absolute;inset:0}
.photo img{width:100%;height:100%;object-fit:cover;object-position:50% 18%;filter:contrast(1.20) brightness(0.48) saturate(0.52)}
.fade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,12,24,0.05) 0%,rgba(6,12,24,0.40) 38%,rgba(6,12,24,0.88) 62%,rgba(6,12,24,0.98) 80%,rgba(6,12,24,1) 100%)}

/* === DIAGONAL SLASH — construction hazard stripe === */
/* Main slash — ~72px wide vertical, ~8° angle */
.slash{
  position:absolute;top:0;left:0;width:100%;height:1080px;
  background:#F5C200;
  clip-path:polygon(0 355px, 1080px 195px, 1080px 267px, 0 427px);
  z-index:10;pointer-events:none;
}
/* Shadow edge behind slash for depth */
.slash-shadow{
  position:absolute;top:0;left:0;width:100%;height:1080px;
  background:rgba(0,0,0,0.35);
  clip-path:polygon(0 355px, 1080px 195px, 1080px 278px, 0 438px);
  z-index:9;pointer-events:none;
}
/* Thin echo stripe — second hazard line */
.slash2{
  position:absolute;top:0;left:0;width:100%;height:1080px;
  background:#F5C200;
  clip-path:polygon(0 448px, 1080px 288px, 1080px 304px, 0 464px);

.ui{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;padding:46px 58px 54px}

.top-row{display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.logo{height:96px;max-width:260px;width:auto;display:block;object-fit:contain}
.badge{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(245,194,0,0.52);background:rgba(245,194,0,0.10);padding:9px 16px;border-radius:4px;flex-shrink:0}
.badge-text{font-family:'Inter',sans-serif;font-size:20px;font-weight:800;color:#F5C200;letter-spacing:0.10em;text-transform:uppercase}

.spacer{flex:1}

/* Q&A headline — question faint, answer huge */
.q{font-family:'Barlow Condensed',sans-serif;font-size:72px;font-weight:900;line-height:1;letter-spacing:0.01em;text-transform:uppercase;color:rgba(255,255,255,0.36);flex-shrink:0}
.a{font-family:'Barlow Condensed',sans-serif;font-size:150px;font-weight:900;line-height:0.83;letter-spacing:0.01em;text-transform:uppercase;color:#FFFFFF;margin-top:6px;margin-bottom:18px;flex-shrink:0}
.a em{color:#F5C200;font-style:normal}
.sub{font-family:'Inter',sans-serif;font-size:22px;font-weight:700;color:rgba(255,255,255,0.55);margin-bottom:24px;line-height:1.4;flex-shrink:0}

/* Requirement chips */
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px;flex-shrink:0}
.chip{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.15);padding:9px 14px;border-radius:4px}
.chip-icon{color:#F5C200;flex-shrink:0;display:flex;align-items:center}
.chip-text{font-family:'Inter',sans-serif;font-size:20px;font-weight:700;color:rgba(255,255,255,0.88)}

.cta{display:block;background:#F5C200;color:#060C18;font-family:'Inter',sans-serif;font-size:22px;font-weight:800;padding:22px;border-radius:6px;text-align:center;letter-spacing:0.06em;text-transform:uppercase;flex-shrink:0}
</style>
</head>
