<!DOCTYPE html>
<!-- Photo top zone with chevron V-cut, yellow accent bar, navy text zone below -->
<html lang="lv">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@800;900&family=Inter:wght@700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1080px;overflow:hidden}
.ad{width:1080px;height:1080px;display:flex;flex-direction:column;overflow:hidden;background:#1C2D4A}

.top-bar{height:7px;flex-shrink:0;background:#F5C200}

/* Photo zone: chevron V-cut clips the bottom edge inward */
.photo-zone{
  height:448px;flex-shrink:0;position:relative;overflow:hidden;
  clip-path:polygon(0 0,100% 0,100% 348px,50% 448px,0 348px)
}
.photo-zone img{
  width:100%;height:100%;object-fit:cover;object-position:50% 22%;
  filter:contrast(1.18) brightness(0.72) saturate(0.65)
}
.photo-zone::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(28,45,74,0.06) 0%,rgba(28,45,74,0.38) 62%,rgba(28,45,74,0.92) 100%)
}

/* Text zone */
.text-zone{
  flex:1;display:flex;flex-direction:column;
  padding:18px 58px 48px
}
.logo-row{
  display:flex;align-items:center;justify-content:space-between;
  flex-shrink:0
}
.logo-zone{background:#fff;padding:6px 14px;border-radius:5px;display:inline-block;align-self:flex-start}
.logo{height:68px;max-width:185px;width:auto;display:block;object-fit:contain}
.badge{
  font-family:'Inter',sans-serif;font-size:20px;font-weight:800;
  color:#F5C200;letter-spacing:0.10em;text-transform:uppercase;
  border:1.5px solid rgba(245,194,0,0.42);padding:8px 14px;border-radius:4px
}

.middle{flex:1;display:flex;flex-direction:column;justify-content:center;width:100%}
.hd{
  font-family:'Barlow Condensed',sans-serif;font-size:108px;font-weight:900;
  line-height:0.84;letter-spacing:0.01em;text-transform:uppercase;
  color:#FFFFFF;margin-bottom:22px
}
.hd em{color:#F5C200;font-style:normal}

.benefits{display:grid;grid-template-columns:1fr 1fr;gap:13px 40px;flex-shrink:0;margin-bottom:0}
.benefit{display:flex;align-items:center;gap:12px}
.icon{flex-shrink:0;color:#F5C200}
.btext{font-family:'Inter',sans-serif;font-size:22px;font-weight:700;color:rgba(210,225,245,0.92)}

.cta{
  display:block;background:#F5C200;color:#1C2D4A;
  font-family:'Inter',sans-serif;font-size:22px;font-weight:800;
  padding:22px;border-radius:6px;text-align:center;
  letter-spacing:0.06em;text-transform:uppercase;
  flex-shrink:0;margin-top:24px
}
</style>
</head>

  <div class="text-zone">

      <div class="logo-zone"><img class="logo" src="file:///C:/Users/User/Meta-ad-generator-v2/meta-ad-generator-v3/clients/afepo/Screenshot_2021-09-13_at_22_16_10.png" alt="Afepo"></div>
