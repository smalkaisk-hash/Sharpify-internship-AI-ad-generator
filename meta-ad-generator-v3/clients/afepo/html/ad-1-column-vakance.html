<!DOCTYPE html>

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1080px;overflow:hidden}
.ad{width:1080px;height:1080px;position:relative;overflow:hidden}

.photo{position:absolute;inset:0}
.photo img{width:100%;height:100%;object-fit:cover;object-position:52% 24%;filter:contrast(1.20) brightness(0.78) saturate(0.70)}
.overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,16,34,0.08) 0%,rgba(8,16,34,0.52) 38%,rgba(8,16,34,0.93) 60%,rgba(8,16,34,0.98) 100%)}

/* Yellow left accent bar — construction industry signature */
.bar{position:absolute;top:0;left:0;bottom:0;width:9px;background:#F5C200;z-index:20}

.ui{position:absolute;inset:0;display:flex;flex-direction:column;padding:44px 52px 48px 64px;z-index:10}

.logo{height:96px;max-width:260px;width:auto;display:block;object-fit:contain;flex-shrink:0}
.middle{flex:1;display:flex;flex-direction:column;justify-content:center;width:100%}

.eyebrow{font-family:'Inter',sans-serif;font-size:20px;font-weight:800;color:#F5C200;letter-spacing:0.10em;text-transform:uppercase;margin-bottom:16px}
.hd{font-family:'Barlow Condensed',sans-serif;font-size:130px;font-weight:900;line-height:0.83;letter-spacing:0.01em;text-transform:uppercase;color:#FFFFFF}
.hd em{color:#F5C200;font-style:normal}

.bullets{display:grid;grid-template-columns:1fr 1fr;gap:14px 20px;flex-shrink:0;margin-bottom:28px}
.bullet{font-family:'Inter',sans-serif;font-size:22px;font-weight:700;color:rgba(255,255,255,0.90);display:flex;align-items:center;gap:12px;line-height:1.2}
.bicon{flex-shrink:0;width:26px;height:26px;color:#F5C200}

.cta{display:block;background:#3558AA;color:#FFFFFF;font-family:'Inter',sans-serif;font-size:21px;font-weight:800;padding:22px;border-radius:7px;text-align:center;letter-spacing:0.06em;text-transform:uppercase;flex-shrink:0}
