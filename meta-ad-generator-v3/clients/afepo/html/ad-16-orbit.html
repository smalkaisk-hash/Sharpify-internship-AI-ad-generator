<!DOCTYPE html>
<!-- Navy bg + photo vignette + two decorative rings (top-right), bold centered layout -->
<html lang="lv">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@800;900&family=Inter:wght@700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1080px;overflow:hidden}
.ad{width:1080px;height:1080px;position:relative;overflow:hidden;background:#0C1624}

.photo{position:absolute;inset:0}
.photo img{
  width:100%;height:100%;object-fit:cover;object-position:50% 20%;
  filter:contrast(1.15) brightness(0.32) saturate(0.40)
}
.fade{
  position:absolute;inset:0;
  background:radial-gradient(ellipse at 30% 40%,rgba(53,88,170,0.22) 0%,transparent 65%),
             linear-gradient(180deg,rgba(12,22,36,0.30) 0%,rgba(12,22,36,0.75) 55%,rgba(12,22,36,0.98) 80%)
}

/* Decorative rings — partially off-canvas top-right */
.ring1{
  position:absolute;top:-110px;right:-110px;
  width:560px;height:560px;border-radius:50%;
  border:14px solid rgba(245,194,0,0.30);
  z-index:4;pointer-events:none
}
.ring2{
  position:absolute;top:-40px;right:-40px;
  width:380px;height:380px;border-radius:50%;
  border:6px solid rgba(245,194,0,0.18);
  z-index:4;pointer-events:none
}
.ring3{
  position:absolute;top:60px;right:60px;
  width:160px;height:160px;border-radius:50%;
  border:3px solid rgba(245,194,0,0.12);
  z-index:4;pointer-events:none
}

/* Yellow top accent */
.top-bar{position:absolute;top:0;left:0;right:0;height:7px;background:#F5C200;z-index:20}

/* Main UI */
.ui{
  position:absolute;inset:0;z-index:10;
  display:flex;flex-direction:column;
  padding:46px 58px 48px
}
.logo-zone{background:#fff;padding:6px 12px;border-radius:5px;display:inline-block;flex-shrink:0;align-self:flex-start}
.logo{height:64px;max-width:165px;width:auto;display:block;object-fit:contain}

.middle{flex:1;display:flex;flex-direction:column;justify-content:center;width:100%}

.tag{
  display:inline-flex;align-items:center;gap:10px;
  margin-bottom:22px;align-self:flex-start
}
.tag-dot{width:8px;height:8px;border-radius:50%;background:#F5C200;flex-shrink:0}
.tag-text{
  font-family:'Inter',sans-serif;font-size:20px;font-weight:800;
  color:#F5C200;letter-spacing:0.10em;text-transform:uppercase
}

.hd{
  font-family:'Barlow Condensed',sans-serif;font-size:136px;font-weight:900;
  line-height:0.83;letter-spacing:0.01em;text-transform:uppercase;
  color:#FFFFFF;margin-bottom:20px
}
.hd em{color:#F5C200;font-style:normal}

.sub{
  font-family:'Inter',sans-serif;font-size:26px;font-weight:700;
  color:rgba(255,255,255,0.55);margin-bottom:32px;line-height:1.4
}

.benefits{display:grid;grid-template-columns:1fr 1fr;gap:18px 40px;flex-shrink:0;margin-bottom:0}
.benefit{display:flex;align-items:center;gap:12px}
.dash{flex-shrink:0;color:#F5C200}
.btext{
  font-family:'Inter',sans-serif;font-size:24px;font-weight:700;
  color:rgba(210,225,245,0.88)
}

.cta{
  display:block;background:#3558AA;color:#FFFFFF;
  font-family:'Inter',sans-serif;font-size:22px;font-weight:800;
  padding:22px;border-radius:6px;text-align:center;
  letter-spacing:0.06em;text-transform:uppercase;
  flex-shrink:0;margin-top:26px
}
</style>
</head>
