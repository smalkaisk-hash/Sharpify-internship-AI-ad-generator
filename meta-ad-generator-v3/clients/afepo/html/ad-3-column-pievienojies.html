html,body{width:1080px;height:1080px;overflow:hidden}
.ad{width:1080px;height:1080px;display:flex;flex-direction:column;overflow:hidden}

/* Top: bold blue band, headline + yellow tag */
.top{
  height:360px;flex-shrink:0;
  background:#3558AA;
  padding:36px 52px 40px;
  display:flex;flex-direction:column;justify-content:flex-end;
  position:relative

/* Yellow top accent bar */
.top::before{content:'';position:absolute;top:0;left:0;right:0;height:8px;background:#F5C200}

.tag-top{font-family:'Inter',sans-serif;font-size:20px;font-weight:800;color:rgba(255,255,255,0.60);letter-spacing:0.24em;text-transform:uppercase;margin-bottom:14px}
.hd{font-family:'Barlow Condensed',sans-serif;font-size:128px;font-weight:900;line-height:0.83;letter-spacing:0.02em;text-transform:uppercase;color:#FFFFFF}
.hd em{color:#F5C200;font-style:normal}

/* Middle photo */
.mid{height:298px;flex-shrink:0;position:relative;overflow:hidden}
.mid img{width:100%;height:100%;object-fit:cover;object-position:50% 30%;filter:contrast(1.18) brightness(0.82) saturate(0.85)}
.mid::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:48px;background:#FFFFFF;clip-path:polygon(0 48px,100% 0,100% 48px)}

/* Bottom white zone */
.btm{
  flex:1;
  background:#FFFFFF;
  padding:20px 52px 40px;
  display:flex;flex-direction:column

.logo{height:76px;max-width:175px;width:auto;display:block;object-fit:contain;margin-bottom:16px;flex-shrink:0}

.benefit{display:flex;align-items:center;gap:11px}
.icon{flex-shrink:0;color:#3558AA}
.btext{font-family:'Inter',sans-serif;font-size:22px;font-weight:700;color:#1A1A1A;line-height:1.25}
.cta{display:block;margin-top:16px;background:#1C2D4A;color:#FFFFFF;font-family:'Inter',sans-serif;font-size:21px;font-weight:800;padding:21px;border-radius:7px;text-align:center;letter-spacing:0.05em;text-transform:uppercase;flex-shrink:0}
</style>
