<!DOCTYPE html>
<!-- Two overlapping rotated cards over dark photo: navy headline card + yellow label card -->
<html lang="lv">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@800;900&family=Inter:wght@700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1080px;overflow:hidden}
.ad{width:1080px;height:1080px;position:relative;overflow:hidden;background:#050D18}

.photo{position:absolute;inset:0}
.photo img{width:100%;height:100%;object-fit:cover;object-position:50% 22%;filter:contrast(1.15) brightness(0.36) saturate(0.42)}
.fade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,13,24,0.55) 0%,rgba(5,13,24,0.90) 62%,rgba(5,13,24,1) 100%)}

/* Yellow top accent bar */
.bar{position:absolute;top:0;left:0;right:0;height:6px;background:#F5C200;z-index:30}

/* Main flex layout */
.ui{
  position:absolute;inset:0;z-index:10;
  display:flex;flex-direction:column;
  padding:44px 58px 52px
}

/* Logo — right-aligned */
.logo-row{display:flex;justify-content:flex-end;flex-shrink:0;margin-bottom:0}
.logo{height:68px;max-width:175px;width:auto;display:block;object-fit:contain}

/* Cards zone — flex:1 centers the cards vertically in the remaining space */
.cards-zone{
  flex:1;display:flex;flex-direction:column;justify-content:center;
  padding:12px 0
}

/* Card 1 — navy, rotated left, bleeds 14px left of UI padding to match original left:44px */
.card1{
  width:862px;
  margin-left:-14px;
  height:250px;
  background:#1C2D4A;
  border:1px solid rgba(53,88,170,0.55);
  border-radius:8px;
  padding:34px 44px;
  transform:rotate(-2.8deg);
  display:flex;flex-direction:column;justify-content:center;
  box-shadow:0 12px 48px rgba(0,0,0,0.65);
  position:relative;z-index:10
}
.hd{font-family:'Barlow Condensed',sans-serif;font-size:96px;font-weight:900;line-height:0.84;letter-spacing:0.01em;text-transform:uppercase;color:#FFFFFF}
.hd em{color:#F5C200;font-style:normal}

/* Card 2 — yellow, rotated right, overlaps card1 bottom by 12px */
.card2{
  width:620px;
  height:98px;
  margin-left:18px;
  margin-top:-12px;
  background:#F5C200;
  border-radius:6px;
  padding:0 32px;
  transform:rotate(2.2deg);
  display:flex;align-items:center;gap:14px;
  box-shadow:0 8px 32px rgba(0,0,0,0.55);
  position:relative;z-index:15
}
.card2-dot{width:11px;height:11px;border-radius:50%;background:#1C2D4A;flex-shrink:0}
.card2-text{font-family:'Inter',sans-serif;font-size:21px;font-weight:800;color:#1C2D4A;text-transform:uppercase;letter-spacing:0.04em;line-height:1.25}

/* Benefits + CTA — pinned below cards zone */
.benefits{display:grid;grid-template-columns:1fr 1fr;gap:13px 44px;margin-bottom:26px;flex-shrink:0}
.benefit{display:flex;align-items:center;gap:13px}
.icon{flex-shrink:0;color:#F5C200}
.btext{font-family:'Inter',sans-serif;font-size:22px;font-weight:700;color:rgba(210,225,245,0.90);line-height:1.25}
.cta{display:block;background:#F5C200;color:#050D18;font-family:'Inter',sans-serif;font-size:22px;font-weight:800;padding:22px;border-radius:6px;text-align:center;letter-spacing:0.06em;text-transform:uppercase;flex-shrink:0}
</style>
</head>
<body>
<div class="ad">

  <div class="ui">
    <div class="logo-row">
      <img class="logo" src="file:///C:/Users/User/Meta-ad-generator-v2/meta-ad-generator-v3/clients/afepo/Screenshot_2021-09-13_at_22_16_10.png" alt="Afepo">
    </div>
    <div class="cards-zone">
      <div class="card1">
        <div class="hd">Stabils darbs.<br><em>Laba alga.</em></div>

    </div>
    <div class="benefits">

      <div class="benefit"><div class="icon"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17H3a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11v12H5z"/><rect x="9" y="11" width="4" height="4" rx=".5"/><path d="M13 3l3 4h5v7h-2"/><circle cx="7.5" cy="17.5" r="1.5"/><circle cx="17.5" cy="17.5" r="1.5"/></svg></div><span class="btext">Transports uz objektiem</span></div>
      <div class="benefit"><div class="icon"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 18a1 1 0 0 0 1 1h18a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1H3a1 1 0 0 0-1 1v2z"/><path d="M10 10V5a2 2 0 1 1 4 0v5"/><path d="M4 15v-3a8 8 0 0 1 16 0v3"/></svg></div><span class="btext">Darba apģērbs un aprīkojums</span></div>
      <div class="benefit"><div class="icon"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg></div><span class="btext">Alga + bonusi par rezultātu</span></div>
