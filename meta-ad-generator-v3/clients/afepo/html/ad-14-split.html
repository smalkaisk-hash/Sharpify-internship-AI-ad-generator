<!DOCTYPE html>
<!-- Vertical split: photo left half fades into navy, navy right panel, yellow skewed divider stripe -->
<html lang="lv">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@800;900&family=Inter:wght@700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1080px;overflow:hidden}
.ad{width:1080px;height:1080px;position:relative;overflow:hidden;background:#1C2D4A}

/* Full-bleed photo — left half remains visible, right half fades to navy */
.photo{position:absolute;inset:0}
.photo img{
  width:100%;height:100%;object-fit:cover;object-position:30% 20%;
  filter:contrast(1.20) brightness(0.68) saturate(0.60)
}
.photo::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,rgba(28,45,74,0.10) 0%,rgba(28,45,74,0.45) 38%,rgba(28,45,74,0.97) 62%,rgba(28,45,74,1) 100%)
}

/* Yellow skewed divider — visual boundary between photo and text zones */
.divider{
  position:absolute;top:0;bottom:0;
  left:502px;width:10px;
  background:#F5C200;
  transform:skewX(-3deg);
  transform-origin:top center;
  z-index:15
}
.divider2{
  position:absolute;top:0;bottom:0;
  left:518px;width:3px;
  background:rgba(245,194,0,0.30);
  transform:skewX(-3deg);
  transform-origin:top center;
  z-index:15
}

/* Logo floating top-left on photo */
.logo-zone{
  position:absolute;top:46px;left:46px;
  background:#fff;padding:6px 12px;border-radius:5px;
  display:inline-block;z-index:20
}
.logo{height:64px;max-width:165px;width:auto;display:block;object-fit:contain}

/* Yellow top accent bar */
.top-bar{
  position:absolute;top:0;left:0;right:0;height:7px;
  background:#F5C200;z-index:30
}

/* Right text panel */
.panel{
  position:absolute;top:0;right:0;bottom:0;width:540px;
  display:flex;flex-direction:column;
  padding:52px 52px 48px 52px;
  z-index:10
}

.eyebrow{
  font-family:'Inter',sans-serif;font-size:20px;font-weight:800;
  color:#F5C200;letter-spacing:0.10em;text-transform:uppercase;
  flex-shrink:0
}

.middle{flex:1;display:flex;flex-direction:column;justify-content:center;width:100%}
.hd{
  font-family:'Barlow Condensed',sans-serif;font-size:96px;font-weight:900;
  line-height:0.84;letter-spacing:0.01em;text-transform:uppercase;
  color:#FFFFFF;margin-bottom:26px
}
.hd em{color:#F5C200;font-style:normal}

.list{display:flex;flex-direction:column;gap:14px;flex-shrink:0;margin-bottom:0}
.item{display:flex;align-items:flex-start;gap:14px}
.num{
  font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:900;
  color:#F5C200;line-height:1;flex-shrink:0;min-width:28px
}
.itext{
  font-family:'Inter',sans-serif;font-size:22px;font-weight:700;
  color:rgba(210,225,245,0.90);line-height:1.3
}

.cta{
  display:block;background:#3558AA;color:#FFFFFF;
  font-family:'Inter',sans-serif;font-size:22px;font-weight:800;
  padding:22px;border-radius:6px;text-align:center;
  letter-spacing:0.06em;text-transform:uppercase;
  flex-shrink:0;margin-top:28px
}
</style>
</head>
<body>
<div class="ad">
  <div class="photo">
    <img src="file:///C:/Users/User/Meta-ad-generator-v2/meta-ad-generator-v3/clients/afepo/image/generated.jpg" alt="">
  </div>
  <div class="divider"></div>
  <div class="divider2"></div>
  <div class="top-bar"></div>
  <div class="logo-zone"><img class="logo" src="file:///C:/Users/User/Meta-ad-generator-v2/meta-ad-generator-v3/clients/afepo/Screenshot_2021-09-13_at_22_16_10.png" alt="Afepo"></div>
  <div class="panel">
    <div class="middle">
      <div class="eyebrow">Vakance</div>
      <div class="hd">Apdares<br>darbu<br><em>strādnieks</em></div>
    </div>
    <div class="list">
      <div class="item"><span class="num">01</span><span class="itext">Pilnas slodzes darbs</span></div>
      <div class="item"><span class="num">02</span><span class="itext">Transports uz objektiem</span></div>
      <div class="item"><span class="num">03</span><span class="itext">Darba apģērbs un aprīkojums</span></div>
      <div class="item"><span class="num">04</span><span class="itext">Alga + bonusi par rezultātu</span></div>
    </div>
    <div class="cta">Piesakies darbam →</div>
  </div>
</div>
<script>document.fonts.ready.then(()=>{ document.title="fonts-ready"; });</script>
</body>
</html>
