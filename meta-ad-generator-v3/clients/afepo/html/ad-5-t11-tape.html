html,body{width:1080px;height:1080px;overflow:hidden}

/* Large circle photo — right side, significantly off canvas, vertically centred high */
.circle{

.top-bar{position:absolute;top:0;left:0;right:0;height:7px;background:#F5C200;z-index:20}

/* Left column — content, narrower to leave room for circle overlap on headline */
.left{

.badge-text{font-family:'Inter',sans-serif;font-size:20px;font-weight:800;color:#FFFFFF;letter-spacing:0.10em;text-transform:uppercase}

.hd{font-family:'Barlow Condensed',sans-serif;font-size:114px;font-weight:900;line-height:0.84;letter-spacing:0.01em;text-transform:uppercase;color:#FFFFFF;margin-bottom:28px;flex-shrink:0}

.rule{width:48px;height:4px;background:#3558AA;border-radius:2px;margin-bottom:20px;flex-shrink:0}

.benefits{display:flex;flex-direction:column;gap:0;flex:1}

.icon{flex-shrink:0;color:#F5C200}
.btext{font-family:'Inter',sans-serif;font-size:22px;font-weight:700;color:rgba(210,225,245,0.90);line-height:1.3}

.cta{display:block;margin-top:20px;flex-shrink:0;background:#F5C200;color:#1C2D4A;font-family:'Inter',sans-serif;font-size:20px;font-weight:800;padding:21px;border-radius:7px;text-align:center;letter-spacing:0.05em;text-transform:uppercase}
