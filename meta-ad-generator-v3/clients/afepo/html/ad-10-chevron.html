<!DOCTYPE html>
<!-- Photo top half clipped to a downward chevron/V; white editorial bottom; yellow chevron fill -->
<html lang="lv">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@800;900&family=Inter:wght@700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1080px;overflow:hidden}
.ad{width:1080px;height:1080px;position:relative;overflow:hidden;background:#FFFFFF}

/* Photo section — clipped to a downward-pointing chevron at the bottom */
.photo-wrap{
  position:absolute;top:0;left:0;right:0;height:540px;
  clip-path:polygon(0 0, 1080px 0, 1080px 470px, 540px 540px, 0 470px);
  overflow:hidden;
}
.photo-wrap img{width:1080px;height:540px;object-fit:cover;object-position:50% 28%;filter:contrast(1.12) brightness(0.82) saturate(0.88)}

/* Yellow chevron fill — same V shape, sits below photo to extend the V */
.chevron-fill{
  position:absolute;top:0;left:0;right:0;height:560px;
  clip-path:polygon(0 470px, 540px 540px, 1080px 470px, 1080px 560px, 540px 560px, 0 560px);
  background:#F5C200;
  z-index:5;
}

/* Photo overlay — darken edges for contrast */
.photo-overlay{
  position:absolute;top:0;left:0;right:0;height:540px;
  background:linear-gradient(180deg, rgba(0,0,0,0.28) 0%, rgba(0,0,0,0) 40%, rgba(0,0,0,0.42) 100%);
  clip-path:polygon(0 0, 1080px 0, 1080px 470px, 540px 540px, 0 470px);
  z-index:3;
}

/* Badge on photo — top-left */
.photo-badge{
  position:absolute;top:36px;left:52px;
  background:#1C2D4A;padding:10px 18px;border-radius:4px;
  display:inline-flex;align-items:center;gap:10px;
  z-index:10;
}
.photo-badge span{font-family:'Inter',sans-serif;font-size:20px;font-weight:800;color:#FFF;letter-spacing:0.08em;text-transform:uppercase}

/* Eyebrow on photo — bottom area */
.photo-eyebrow{
  position:absolute;top:380px;left:0;right:0;
  text-align:center;
  z-index:10;
}
.pe-text{font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:800;color:rgba(255,255,255,0.88);letter-spacing:0.16em;text-transform:uppercase}

/* White content area — below chevron */
.content{
  position:absolute;bottom:0;left:0;right:0;
  top:555px;
  padding:0 60px 52px;
  display:flex;flex-direction:column;
  z-index:10;
}

/* Logo on white — screenshot's white bg naturally invisible */
.logo{height:116px;max-width:340px;width:auto;display:block;object-fit:contain;margin-bottom:20px;flex-shrink:0}

.hd-row{display:flex;align-items:flex-end;gap:20px;margin-bottom:18px;flex-shrink:0}
.hd{font-family:'Barlow Condensed',sans-serif;font-size:78px;font-weight:900;line-height:0.87;letter-spacing:0.01em;text-transform:uppercase;color:#1C2D4A}
.hd em{color:#3558AA;font-style:normal}
.hd-rule{flex:1;height:4px;background:#F5C200;border-radius:2px;margin-bottom:10px}

/* 2×2 grid */
.benefits{display:grid;grid-template-columns:1fr 1fr;gap:10px 20px;margin-bottom:22px;flex-shrink:0}
.benefit{display:flex;align-items:center;gap:10px}
.dot{flex-shrink:0;color:#1C2D4A}
.btext{font-family:'Inter',sans-serif;font-size:22px;font-weight:700;color:#1C2D4A;line-height:1.3}

.cta{
  display:block;flex-shrink:0;
  background:#1C2D4A;color:#FFFFFF;
  font-family:'Inter',sans-serif;font-size:22px;font-weight:800;
  padding:21px;border-radius:6px;
  text-align:center;letter-spacing:0.05em;text-transform:uppercase;
  margin-top:auto;
}

/* Small yellow diamond accents — decorative corners on white section */
.diamond-l{
  position:absolute;left:52px;top:570px;
  width:14px;height:14px;background:#F5C200;
  transform:rotate(45deg);
  z-index:8;
}
.diamond-r{
  position:absolute;right:52px;top:570px;
  width:14px;height:14px;background:#1C2D4A;
  transform:rotate(45deg);
  z-index:8;
}
</style>
</head>
