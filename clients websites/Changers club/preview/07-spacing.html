<!doctype html>
<html><head><meta charset="utf-8"><title>Spacing</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;}body{background:#000;color:#F4EFE6;padding:18px;font-family:var(--cc-font-sans);}
.scale{display:flex;align-items:flex-end;gap:8px;height:120px;}
.tk{display:flex;flex-direction:column;align-items:center;gap:6px;}
.bar{width:38px;background:#C9A24A;border-radius:1px;}
.t{font-family:var(--cc-font-mono);font-size:10px;color:rgba(244,239,230,.6);}
.n{font-size:10px;letter-spacing:0.18em;text-transform:uppercase;color:rgba(244,239,230,.45);}
</style></head><body>
  <div class="scale">
    <div class="tk"><div class="bar" style="height:4px"></div><div class="t">4</div><div class="n">1</div></div>
    <div class="tk"><div class="bar" style="height:8px"></div><div class="t">8</div><div class="n">2</div></div>
    <div class="tk"><div class="bar" style="height:12px"></div><div class="t">12</div><div class="n">3</div></div>
    <div class="tk"><div class="bar" style="height:16px"></div><div class="t">16</div><div class="n">4</div></div>
    <div class="tk"><div class="bar" style="height:24px"></div><div class="t">24</div><div class="n">5</div></div>
    <div class="tk"><div class="bar" style="height:32px"></div><div class="t">32</div><div class="n">6</div></div>
    <div class="tk"><div class="bar" style="height:48px"></div><div class="t">48</div><div class="n">7</div></div>
    <div class="tk"><div class="bar" style="height:64px"></div><div class="t">64</div><div class="n">8</div></div>
    <div class="tk"><div class="bar" style="height:96px"></div><div class="t">96</div><div class="n">9</div></div>
    <div class="tk"><div class="bar" style="height:120px"></div><div class="t">128</div><div class="n">10</div></div>
  </div>
</body></html>
