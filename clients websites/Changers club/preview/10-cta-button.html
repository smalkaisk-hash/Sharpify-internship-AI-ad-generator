<!doctype html>
<html><head><meta charset="utf-8"><title>CTA Button</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;}body{background:#000;color:#F4EFE6;padding:24px;font-family:var(--cc-font-sans);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;min-height:120px;}
.row{display:flex;gap:14px;align-items:center;}
.btn{font-family:var(--cc-font-sans);font-weight:600;font-size:15px;letter-spacing:.02em;color:#1A1208;background:#C9A24A;border:0;padding:16px 32px;border-radius:999px;display:inline-flex;align-items:center;gap:12px;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.06),inset 0 -2px 0 #8E6F2C,0 8px 24px rgba(201,162,74,.18);transition:background .32s cubic-bezier(.22,.61,.36,1);}
.btn:hover{background:#D9B860;}
.btn.pressed{background:#8E6F2C;color:#0a0a0a;}
.btn.ghost{background:transparent;color:#F4EFE6;border:1px solid rgba(244,239,230,.45);box-shadow:none;}
.l{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:rgba(244,239,230,.5);}
</style></head><body>
  <div class="row">
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px;"><button class="btn">See if you qualify <span>→</span></button><div class="l">Default</div></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px;"><button class="btn" style="background:#D9B860;">See if you qualify <span>→</span></button><div class="l">Hover</div></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px;"><button class="btn pressed">See if you qualify <span>→</span></button><div class="l">Pressed</div></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px;"><button class="btn ghost">Read the brief <span>→</span></button><div class="l">Ghost</div></div>
  </div>
</body></html>
