<!doctype html>
<html><head><meta charset="utf-8"><title>Hero composition</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;}body{background:#000;color:#F4EFE6;font-family:var(--cc-font-sans);}
.wrap{display:grid;grid-template-columns:1.1fr 1fr;min-height:280px;}
.img{background:url('../assets/social-legacy.png') center/cover;}
.panel{padding:28px 28px;display:flex;flex-direction:column;justify-content:center;gap:12px;}
.eyebrow{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:#C9A24A;}
.h{font-family:var(--cc-font-display);font-style:italic;font-size:34px;line-height:1.05;color:#F4EFE6;margin:0;}
.gold{color:#C9A24A;}
.sub{font-family:var(--cc-font-serif);font-size:14px;color:rgba(244,239,230,.7);max-width:280px;}
.btn{align-self:flex-start;font-family:var(--cc-font-sans);font-weight:600;font-size:13px;letter-spacing:.02em;color:#1A1208;background:#C9A24A;border:0;padding:13px 22px;border-radius:999px;}
</style></head><body>
  <div class="wrap">
    <div class="img"></div>
    <div class="panel">
      <div class="eyebrow">Monaco · Dubai</div>
      <h1 class="h">We don't do networking,<br/>we do <span class="gold">Legacy</span></h1>
      <div class="sub">Your next 10 years are one conversation away.</div>
      <button class="btn">See if you qualify  →</button>
    </div>
  </div>
</body></html>
