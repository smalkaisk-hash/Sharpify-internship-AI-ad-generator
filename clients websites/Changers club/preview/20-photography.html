<!doctype html>
<html><head><meta charset="utf-8"><title>Brand photography</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;}body{background:#0a0a0a;padding:14px;font-family:var(--cc-font-sans);}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.tile{aspect-ratio:1/1;background-size:cover;background-position:center;border:1px solid rgba(244,239,230,.08);}
.cap{margin-top:10px;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:rgba(244,239,230,.5);text-align:center;}
</style></head><body>
  <div class="grid">
    <div class="tile" style="background-image:url('../assets/social-legacy.png')"></div>
    <div class="tile" style="background-image:url('../assets/social-longevity-meets-legacy.png')"></div>
    <div class="tile" style="background-image:url('../assets/social-power-families.png')"></div>
    <div class="tile" style="background-image:url('../assets/social-longevity-meets-legacy-alt.png')"></div>
  </div>
  <div class="cap">Warm, candid, ambient — invisible grade</div>
</body></html>
