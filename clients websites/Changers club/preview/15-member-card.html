<!doctype html>
<html><head><meta charset="utf-8"><title>Member card</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;}body{background:#0A0A0A;color:#F4EFE6;padding:24px;font-family:var(--cc-font-sans);display:flex;justify-content:center;align-items:center;}
.row{display:flex;gap:18px;}
.card{width:300px;border:1px solid rgba(244,239,230,.12);padding:18px;background:#000;}
.eyebrow{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:#C9A24A;margin-bottom:8px;}
.q{font-family:var(--cc-font-serif);font-size:16px;line-height:1.45;color:rgba(244,239,230,.85);margin:0 0 12px;font-style:italic;}
.who{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;color:rgba(244,239,230,.55);}
.name{color:#F4EFE6;font-family:var(--cc-font-display);font-style:italic;font-size:14px;}
.rule{height:1px;background:rgba(201,162,74,.55);margin:10px 0 12px;}
</style></head><body>
  <div class="row">
    <div class="card">
      <div class="eyebrow">Member · joined at 64</div>
      <div class="rule"></div>
      <p class="q">"Four years later, I had built an AI company and taken it public at a two-billion-dollar valuation. My son is now joining the ride."</p>
      <div class="who"><span class="name">Brooks Newmark</span><span>Rezolve · NASDAQ</span></div>
    </div>
  </div>
</body></html>
