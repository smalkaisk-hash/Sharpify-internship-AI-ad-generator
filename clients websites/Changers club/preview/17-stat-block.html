<!doctype html>
<html><head><meta charset="utf-8"><title>Stat block</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;}body{background:#000;color:#F4EFE6;padding:22px 28px;font-family:var(--cc-font-sans);display:flex;justify-content:center;align-items:center;}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:48px;width:100%;max-width:600px;}
.stat{display:flex;flex-direction:column;gap:6px;}
.n{font-family:var(--cc-font-display);font-style:italic;font-size:54px;color:#C9A24A;line-height:1;}
.l{font-family:var(--cc-font-sans);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:rgba(244,239,230,.6);}
</style></head><body>
  <div class="row">
    <div class="stat"><div class="n">270</div><div class="l">Power families</div></div>
    <div class="stat"><div class="n">€25b</div><div class="l">In joint capital</div></div>
    <div class="stat"><div class="n">50</div><div class="l">Admitted yearly</div></div>
  </div>
</body></html>
