<!doctype html>
<html><head><meta charset="utf-8"><title>Iconography</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;}body{background:#000;color:#F4EFE6;padding:22px;font-family:var(--cc-font-sans);}
.row{display:flex;gap:36px;align-items:center;flex-wrap:wrap;}
.cell{display:flex;flex-direction:column;align-items:center;gap:8px;}
.lbl{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:rgba(244,239,230,.5);}
.arrow{font-size:30px;color:#C9A24A;line-height:1;}
.lucide{width:24px;height:24px;color:#F4EFE6;}
.x{font-size:34px;color:rgba(244,239,230,.18);position:relative;}
.x::after{content:"";position:absolute;left:6%;right:6%;top:50%;height:2px;background:#9c5c5c;transform:rotate(-12deg);}
.note{font-family:var(--cc-font-mono);font-size:10px;color:rgba(244,239,230,.4);text-align:center;max-width:120px;}
</style></head><body>
  <div class="row">
    <div class="cell"><div class="arrow">→</div><div class="lbl">CTA arrow</div><div class="note">U+2192 · gold</div></div>
    <div class="cell">
      <svg class="lucide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      <div class="lbl">Lucide · 1.5px</div>
      <div class="note">functional UI only</div>
    </div>
    <div class="cell">
      <svg class="lucide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      <div class="lbl">Confirm</div>
      <div class="note">cream / gold</div>
    </div>
    <div class="cell"><div class="x">🎉</div><div class="lbl" style="color:#9c5c5c">Forbidden</div><div class="note">no emoji, ever</div></div>
  </div>
</body></html>
