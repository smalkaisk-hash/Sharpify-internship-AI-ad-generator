<!doctype html>
<html><head><meta charset="utf-8"><title>Type — Display</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;}body{background:#000;color:#F4EFE6;padding:22px 24px;font-family:var(--cc-font-sans);}
.row{display:flex;align-items:baseline;gap:14px;margin-bottom:8px;}
.lbl{font-family:var(--cc-font-sans);font-size:10px;letter-spacing:0.2em;text-transform:uppercase;color:rgba(244,239,230,.5);width:120px;flex-shrink:0;}
.spec{font-family:var(--cc-font-mono);font-size:10px;color:rgba(244,239,230,.4);}
.italic{font-family:var(--cc-font-display);font-style:italic;font-size:54px;line-height:1;letter-spacing:-.015em;color:#F4EFE6;}
.gold{color:#C9A24A;}
.caps{font-family:var(--cc-font-wordmark);font-size:42px;letter-spacing:0.04em;line-height:1;}
</style></head><body>
  <div class="row"><div class="lbl">Display Italic</div><div class="italic">Legacy <span class="gold">Power</span></div></div>
  <div class="spec" style="margin-left:134px;margin-bottom:18px;">Playfair Display · 500 italic · -1.5% tracking</div>
  <div class="row"><div class="lbl">Wordmark</div><div class="caps">CHANGER</div></div>
  <div class="spec" style="margin-left:134px;">Anton · 400 · +4% tracking · uppercase</div>
</body></html>
