<!doctype html>
<html><head><meta charset="utf-8"><title>Logo lockup</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;}
  body{background:#000;color:#F4EFE6;font-family:var(--cc-font-sans);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;}
  .stage{display:grid;grid-template-columns:1fr 1px 1fr;gap:32px;align-items:center;width:100%;max-width:660px;}
  .cell{display:flex;flex-direction:column;align-items:center;gap:10px;}
  .lockup{display:flex;flex-direction:column;align-items:center;gap:6px;}
  .wm{font-family:var(--cc-font-wordmark);font-size:46px;letter-spacing:0.04em;color:#F4EFE6;line-height:1;}
  .tag{font-family:var(--cc-font-sans);font-weight:500;font-size:9px;letter-spacing:0.22em;color:#F4EFE6;text-transform:uppercase;}
  .lbl{font-size:10px;letter-spacing:0.2em;color:rgba(244,239,230,.45);text-transform:uppercase;}
  .divider{background:rgba(244,239,230,.12);width:1px;height:80px;}
  .gold .wm,.gold .tag{color:#C9A24A;}
</style></head>
<body>
  <div class="stage">
    <div class="cell">
      <img src="../assets/logo-changer-white.webp" alt="Changer — Be wealthy, not just rich" style="max-width:260px;width:100%;height:auto;display:block;" />
      <div class="lbl">Primary · official lockup on ink</div>
    </div>
    <div class="divider"></div>
    <div class="cell">
      <div class="lockup"><div class="wm" style="color:#C9A24A;">CHANGER</div><div class="tag" style="color:#C9A24A;">BE WEALTHY, NOT JUST RICH</div></div>
      <div class="lbl">Editorial typeset · gold</div>
    </div>
  </div>
</body></html>
