<!doctype html>
<html><head><meta charset="utf-8"><title>Photo card pattern</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;}body{background:#1a1a1a;color:#F4EFE6;padding:0;font-family:var(--cc-font-sans);min-height:100vh;display:flex;align-items:center;justify-content:center;}
.card{width:340px;background:#000;border:1px solid #C9A24A;padding:10px;}
.img{aspect-ratio:16/10;background:url('../assets/social-power-families.png') center/cover #222;}
.panel{padding:18px 14px 14px;text-align:center;}
.eyebrow{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:#C9A24A;margin-bottom:8px;}
.h{font-family:var(--cc-font-display);font-style:italic;font-size:30px;line-height:1.05;color:#F4EFE6;margin:0 0 8px;}
.sub{font-family:var(--cc-font-sans);font-size:11px;color:rgba(244,239,230,.7);margin-bottom:12px;}
.btn{font-family:var(--cc-font-sans);font-weight:600;font-size:11px;letter-spacing:.02em;color:#1A1208;background:#C9A24A;border:0;padding:10px 18px;border-radius:999px;}
</style></head><body>
  <div class="card">
    <div class="img"></div>
    <div class="panel">
      <div class="eyebrow">For the next generation of</div>
      <div class="h">Power Families</div>
      <div class="sub">Build a legacy your children are proud to carry forward</div>
      <button class="btn">Apply to join Changer  →</button>
    </div>
  </div>
</body></html>
