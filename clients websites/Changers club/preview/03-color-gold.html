<!doctype html>
<html><head><meta charset="utf-8"><title>Color — Gold</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;}
  body{background:#000;color:#F4EFE6;font-family:var(--cc-font-sans);padding:18px;}
  .grid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:12px;}
  .sw{display:flex;flex-direction:column;gap:8px;}
  .chip{height:96px;border-radius:2px;}
  .name{font-size:12px;letter-spacing:0.04em;}
  .hex{font-family:var(--cc-font-mono);font-size:10px;color:rgba(244,239,230,.6);}
  .role{font-size:10px;color:rgba(244,239,230,.45);text-transform:uppercase;letter-spacing:.18em;}
  .burg{margin-top:14px;display:flex;align-items:center;gap:14px;}
  .burgChip{width:46px;height:46px;background:#4A1C24;border-radius:2px;}
</style></head>
<body>
  <div class="grid">
    <div class="sw"><div class="chip" style="background:#C9A24A"></div><div class="role">Primary accent</div><div class="name">Gold</div><div class="hex">#C9A24A</div></div>
    <div class="sw"><div class="chip" style="background:#D9B860"></div><div class="role">Hover</div><div class="name">Gold Bright</div><div class="hex">#D9B860</div></div>
    <div class="sw"><div class="chip" style="background:#8E6F2C"></div><div class="role">Pressed</div><div class="name">Gold Deep</div><div class="hex">#8E6F2C</div></div>
    <div class="sw"><div class="chip" style="background:rgba(201,162,74,0.16);border:1px solid rgba(201,162,74,.35);"></div><div class="role">Tint / hairline</div><div class="name">Gold Soft</div><div class="hex">rgba(201,162,74,.16)</div></div>
  </div>
  <div class="burg">
    <div class="burgChip"></div>
    <div>
      <div class="role">Editorial only · sparingly</div>
      <div class="name">Burgundy <span class="hex" style="margin-left:8px;">#4A1C24</span></div>
    </div>
  </div>
</body></html>
