<!doctype html>
<html><head><meta charset="utf-8"><title>Press wall</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;}body{background:#000;color:#F4EFE6;padding:24px;font-family:var(--cc-font-sans);}
.rule{height:1px;background:#C9A24A;opacity:.85;margin-bottom:18px;}
.row{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;align-items:center;justify-items:center;}
.logo{font-family:var(--cc-font-display);color:#F4EFE6;letter-spacing:.02em;}
.f{font-weight:900;font-size:24px;font-style:italic;}
.bi{font-family:var(--cc-font-wordmark);font-size:18px;letter-spacing:.04em;text-transform:uppercase;}
.nb{font-family:var(--cc-font-wordmark);font-size:18px;letter-spacing:.06em;text-transform:uppercase;}
.kt{font-family:var(--cc-font-display);font-style:italic;font-size:22px;}
</style></head><body>
  <div class="rule"></div>
  <div class="row">
    <div class="logo f">Fortune</div>
    <div class="logo bi">BUSINESS INSIDER</div>
    <div class="logo nb">NEBELSPALTER</div>
    <div class="logo kt">Khaleej Times</div>
  </div>
</body></html>
