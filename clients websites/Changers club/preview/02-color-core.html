<!doctype html>
<html><head><meta charset="utf-8"><title>Color — Core</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;}
  body{background:#0A0A0A;color:#F4EFE6;font-family:var(--cc-font-sans);padding:18px;}
  .row{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;}
  .sw{display:flex;flex-direction:column;gap:6px;}
  .chip{height:78px;border-radius:2px;border:1px solid rgba(244,239,230,.08);}
  .name{font-size:11px;letter-spacing:0.04em;color:#F4EFE6;}
  .hex{font-family:var(--cc-font-mono);font-size:10px;color:rgba(244,239,230,.55);}
</style></head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:#000"></div><div class="name">Black</div><div class="hex">#000000</div></div>
    <div class="sw"><div class="chip" style="background:#0A0A0A"></div><div class="name">Ink</div><div class="hex">#0A0A0A</div></div>
    <div class="sw"><div class="chip" style="background:#141414"></div><div class="name">Ink-2</div><div class="hex">#141414</div></div>
    <div class="sw"><div class="chip" style="background:#1E1E1E"></div><div class="name">Ink-3</div><div class="hex">#1E1E1E</div></div>
    <div class="sw"><div class="chip" style="background:#F4EFE6"></div><div class="name">Cream</div><div class="hex">#F4EFE6</div></div>
    <div class="sw"><div class="chip" style="background:#E8E1D2"></div><div class="name">Cream Soft</div><div class="hex">#E8E1D2</div></div>
    <div class="sw"><div class="chip" style="background:#FBF8F2"></div><div class="name">Paper</div><div class="hex">#FBF8F2</div></div>
  </div>
</body></html>
