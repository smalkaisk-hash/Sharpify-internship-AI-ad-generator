<!doctype html>
<html><head><meta charset="utf-8"><title>Voice in copy</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;}body{background:#000;color:#F4EFE6;padding:18px 22px;font-family:var(--cc-font-sans);}
.col{display:grid;grid-template-columns:1fr 1fr;gap:24px;}
.card{padding:14px;border:1px solid rgba(244,239,230,.1);}
.t{font-size:9px;letter-spacing:.22em;text-transform:uppercase;margin-bottom:8px;}
.do{color:#C9A24A;}.dont{color:#9c5c5c;}
.q{font-family:var(--cc-font-serif);font-size:15px;line-height:1.45;color:rgba(244,239,230,.85);}
.dont .q{color:rgba(244,239,230,.45);text-decoration:line-through;text-decoration-color:#9c5c5c;}
</style></head><body>
  <div class="col">
    <div class="card">
      <div class="t do">Voice — equal to equal</div>
      <div class="q">"We admit fifty families a year. We have said no to applicants with considerably more, when the fit was wrong."</div>
    </div>
    <div class="card dont">
      <div class="t dont">Never — sales register</div>
      <div class="q">"Unlock exclusive access to the world's most elite network and supercharge your legacy today!"</div>
    </div>
  </div>
</body></html>
