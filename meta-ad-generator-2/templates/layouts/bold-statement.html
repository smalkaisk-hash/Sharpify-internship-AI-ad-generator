<!DOCTYPE html>
<html lang="{{language}}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1080">
  <link rel="stylesheet" href="../base.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* === TEMPLATE: Bold Statement ===
       Large centered text hook with subtle background texture/image.
       Best for: cold audience awareness, scroll-stopping hooks, question ads.
    */
    :root {
      --color-primary: {{color_primary}};
      --color-secondary: {{color_secondary}};
      --color-accent: {{color_accent}};
      --color-bg: {{color_bg}};
      --color-text: {{color_text}};
      --color-cta-bg: {{color_cta_bg}};
      --color-cta-text: {{color_cta_text}};
      --font-heading: '{{font_heading}}', 'Montserrat', sans-serif;
      --font-body: '{{font_body}}', 'Inter', sans-serif;
    }

    .bold-container {
      width: 1080px;
      height: 1080px;
      background-color: var(--color-primary);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    /* Subtle background image — optional, low opacity */
    .bg-image {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      opacity: 0.12;
      filter: grayscale(60%);
    }

    /* Geometric decoration */
    .geo-circle {
      position: absolute;
      border-radius: 50%;
      border: 3px solid var(--color-accent);
      opacity: 0.15;
    }

    .geo-1 {
      width: 400px;
      height: 400px;
      top: -100px;
      right: -100px;
    }

    .geo-2 {
      width: 250px;
      height: 250px;
      bottom: 150px;
      left: -80px;
    }

    /* Content */
    .bold-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 80px var(--pad-outer);
      position: relative;
      z-index: 2;
    }

    .bold-content .headline {
      color: #FFFFFF;
      font-size: 120px;
      line-height: 1.05;
      max-width: 960px;
      margin-bottom: 36px;
    }

    .accent-line {
      width: 100px;
      height: 6px;
      background-color: var(--color-accent);
      border-radius: 3px;
      margin-bottom: 36px;
    }

    .bold-content .body-text {
      color: rgba(255, 255, 255, 0.8);
      font-size: 52px;
      line-height: 1.4;
      max-width: 880px;
      margin-bottom: 48px;
    }

    .bold-content .cta-button {
      min-width: 680px;
      height: 160px;
      font-size: 52px;
      padding: 0 60px;
      border-radius: 20px;
    }

    /* Footer bar */
    .bold-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 28px var(--pad-outer);
      background: rgba(0, 0, 0, 0.25);
      position: relative;
      z-index: 2;
    }

    .footer-text {
      font-family: var(--font-body);
      font-size: 20px;
      color: rgba(255, 255, 255, 0.6);
    }
  </style>
</head>
<body>
  <div class="bold-container">
    <!-- Optional subtle background image -->
    <img class="bg-image" src="{{hero_image}}" alt="">

    <!-- Geometric decorations -->
    <div class="geo-circle geo-1"></div>
    <div class="geo-circle geo-2"></div>

    <!-- Main content -->
    <div class="bold-content">
      <h1 class="headline">{{headline}}</h1>
      <div class="accent-line"></div>
      <p class="body-text">{{primary_text}}</p>
      <button class="cta-button">{{cta_text}}</button>
    </div>

    <!-- Footer -->
    <div class="bold-footer">
      <span class="footer-text">{{footer_tagline}}</span>
    </div>
  </div>
</body>
</html>
