<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1080px; overflow: hidden; }
body {
  width: 1080px; height: 1080px;
  position: relative;
  font-family: 'Inter', sans-serif; color: #fff;
  background: #0a0a0a;
}

.bg-image {
  position: absolute; inset: 0;
  background-image: url('../images/books-stack.png');
  background-size: cover;
  background-position: center;
  filter: brightness(0.75) contrast(1.05);
}

.overlay {
  position: absolute; inset: 0;
  background:
    linear-gradient(180deg,
      rgba(5,8,16,0.85) 0%,
      rgba(5,8,16,0.4) 30%,
      rgba(5,8,16,0.4) 60%,
      rgba(5,8,16,0.9) 100%);
}

.content {
  position: relative; z-index: 2;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  justify-content: space-between;
  padding: 56px;
}

.top {
  text-align: center;
}
.badge {
  display: inline-block;
  background: rgba(16,185,129,0.15);
  border: 1px solid rgba(16,185,129,0.4);
  color: #10b981;
  padding: 10px 24px; border-radius: 50px;
  font-size: 20px; font-weight: 800;
  backdrop-filter: blur(8px);
  margin-bottom: 18px;
}
.headline {
  font-family: 'Montserrat', sans-serif;
  font-size: 66px; font-weight: 900;
  line-height: 1.05;
  text-shadow: 0 4px 24px rgba(0,0,0,0.8);
}
.headline span { color: #10b981; }

/* Floating info boxes */
.info-boxes {
  display: flex; gap: 16px; justify-content: center;
  margin-top: 24px;
}
.info-box {
  background: rgba(10,15,25,0.75);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(16,185,129,0.25);
  border-radius: 14px;
  padding: 18px 22px;
  text-align: center;
  min-width: 160px;
}
.info-num {
  font-family: 'Montserrat', sans-serif;
  font-size: 36px; font-weight: 900; color: #10b981;
  line-height: 1;
}
.info-label {
  font-size: 14px; color: #94a3b8;
  margin-top: 6px;
  text-transform: uppercase; letter-spacing: 1px;
}

.bottom {
  display: flex; justify-content: space-between; align-items: center;
  background: rgba(10,15,25,0.85);
  backdrop-filter: blur(12px);
  border: 2px solid rgba(16,185,129,0.3);
  border-radius: 16px;
  padding: 24px 32px;
}
.bottom-info {}
.bottom-title {
  font-family: 'Montserrat', sans-serif;
  font-size: 28px; font-weight: 900;
  color: #fff;
}
.bottom-sub { font-size: 18px; color: #94a3b8; margin-top: 4px; }
.bottom-sub s { color: #ef4444; }
.bottom-sub .new { color: #10b981; font-weight: 700; }
.cta-btn {
  background: #10b981; color: #000;
  padding: 22px 48px; border-radius: 14px;
  font-weight: 800; font-size: 28px;
  box-shadow: 0 8px 32px rgba(16,185,129,0.4);
}
</style>
</head>
<body>
  <div class="bg-image"></div>
  <div class="overlay"></div>

  <div class="content">
    <div class="top">
      <div class="badge">📚 Viss vienā komplektā</div>
      <div class="headline">Pilna AI bibliotēka<br><span>vienā vietā</span></div>

      <div class="info-boxes">
        <div class="info-box">
          <div class="info-num">128</div>
          <div class="info-label">slaidi</div>
        </div>
        <div class="info-box">
          <div class="info-num">27</div>
          <div class="info-label">AI skills</div>
        </div>
        <div class="info-box">
          <div class="info-num">74 min</div>
          <div class="info-label">video</div>
        </div>
        <div class="info-box">
          <div class="info-num">10</div>
          <div class="info-label">workflows</div>
        </div>
      </div>
    </div>

    <div class="bottom">
      <div class="bottom-info">
        <div class="bottom-title">AI Rīku Komplekts</div>
        <div class="bottom-sub"><s>€99</s> · <span class="new">€19</span> · mūžīga piekļuve</div>
      </div>
      <div class="cta-btn">Iegūt →</div>
    </div>
  </div>
</body>
</html>
