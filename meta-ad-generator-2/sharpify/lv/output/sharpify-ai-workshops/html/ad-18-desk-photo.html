<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1080px; overflow: hidden; }
body {
  width: 1080px; height: 1080px;
  position: relative;
  font-family: 'Inter', sans-serif; color: #fff;
  background: #000;
}

.bg-image {
  position: absolute; inset: 0;
  background-image: url('../images/desk-setup.png');
  background-size: cover;
  background-position: center;
  filter: brightness(0.78);
}

.overlay {
  position: absolute; inset: 0;
  background:
    linear-gradient(180deg,
      rgba(5,8,16,0.3) 0%,
      rgba(5,8,16,0.2) 40%,
      rgba(5,8,16,0.95) 100%);
}

.content {
  position: relative; z-index: 2;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  justify-content: flex-end;
  padding: 56px;
}

/* Quote card */
.quote-card {
  background: rgba(10,15,25,0.82);
  backdrop-filter: blur(16px);
  border: 1px solid rgba(255,255,255,0.08);
  border-left: 4px solid #10b981;
  border-radius: 14px;
  padding: 26px 32px;
  margin-bottom: 28px;
  max-width: 720px;
}
.quote-text {
  font-size: 26px; color: #e2e8f0;
  line-height: 1.5; font-style: italic;
}
.quote-text strong { color: #10b981; font-style: normal; font-weight: 700; }

.headline-block {
  margin-bottom: 32px;
}
.badge {
  display: inline-block;
  background: rgba(16,185,129,0.15);
  border: 1px solid rgba(16,185,129,0.4);
  color: #10b981;
  padding: 8px 20px; border-radius: 50px;
  font-size: 18px; font-weight: 800;
  backdrop-filter: blur(8px);
  margin-bottom: 16px;
}
.headline {
  font-family: 'Montserrat', sans-serif;
  font-size: 68px; font-weight: 900;
  line-height: 1.05;
  text-shadow: 0 4px 28px rgba(0,0,0,0.7);
  max-width: 860px;
}
.headline span { color: #10b981; }

.cta-row {
  display: flex; align-items: center; gap: 24px;
}
.cta-btn {
  background: #10b981; color: #000;
  padding: 26px 56px; border-radius: 14px;
  font-weight: 800; font-size: 30px;
  box-shadow: 0 8px 32px rgba(16,185,129,0.4);
}
.price-info {
  color: #94a3b8; font-size: 20px;
}
.price-info .new { color: #10b981; font-weight: 800; font-size: 26px; }
.price-info s { color: #64748b; }
</style>
</head>
<body>
  <div class="bg-image"></div>
  <div class="overlay"></div>

  <div class="content">
    <div class="quote-card">
      <div class="quote-text">"Ieliku <strong>30 minūtes</strong> setup. Tagad taupu <strong>2+ stundas dienā</strong>. Nebūtu atgriezies atpakaļ."</div>
    </div>

    <div class="headline-block">
      <div class="badge">⚡ Instalē 30 min — taupi mūžīgi</div>
      <div class="headline">No pirmās dienas<br><span>AI strādā Tavā vietā</span></div>
    </div>

    <div class="cta-row">
      <div class="cta-btn">Iegūt par €19 →</div>
      <div class="price-info"><s>€99</s> · <span class="new">taupi 81%</span></div>
    </div>
  </div>
</body>
</html>
