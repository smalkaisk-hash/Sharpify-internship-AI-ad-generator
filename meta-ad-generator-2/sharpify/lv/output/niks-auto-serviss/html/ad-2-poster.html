<!DOCTYPE html>

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1080px;overflow:hidden}
.ad{width:1080px;height:1080px;position:relative;overflow:hidden;background:#0a0a0a}
.left{position:absolute;top:0;left:0;width:520px;height:100%;overflow:hidden;clip-path:polygon(0 0, 100% 0, 94% 50%, 100% 100%, 0 100%)}
.left img{width:100%;height:100%;object-fit:cover;filter:contrast(1.05) saturate(0.9)}
.left::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,0.15) 0%,rgba(0,0,0,0.6) 100%)}
.right{position:absolute;top:0;right:0;width:580px;height:100%;background:#DC2626;display:flex;flex-direction:column;justify-content:space-between;padding:60px 56px 60px 40px;clip-path:polygon(6% 0, 100% 0, 100% 100%, 0 100%, 6% 50%)}
.tag{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:13px;color:#fff;letter-spacing:0.2em;text-transform:uppercase;opacity:0.85;margin-bottom:22px}
.tag::before{content:"// "}
h1{font-family:'Bebas Neue',sans-serif;font-size:130px;line-height:0.9;color:#fff;letter-spacing:0.005em}
h1 .stroke{-webkit-text-stroke:3px #fff;color:transparent;display:inline-block}
.sub{font-family:'Inter',sans-serif;font-size:22px;font-weight:600;color:#fff;line-height:1.4;margin-top:20px;max-width:420px;opacity:0.95}
.stats{display:flex;gap:24px;margin-top:28px;padding-top:24px;border-top:2px solid rgba(255,255,255,0.3)}
.stat b{display:block;font-family:'Bebas Neue',sans-serif;font-size:44px;line-height:1;color:#fff}
.stat span{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;color:#fff;text-transform:uppercase;letter-spacing:0.15em;opacity:0.85}
.bot{background:#0a0a0a;border-radius:16px;padding:22px 26px;display:flex;justify-content:space-between;align-items:center;gap:16px;border:2px solid #DC2626}
.bot-left{font-family:'Inter',sans-serif;font-size:13px;font-weight:700;line-height:1.2;color:#fff;text-transform:uppercase;letter-spacing:0.08em}
.bot-left b{display:block;font-family:'Bebas Neue',sans-serif;font-size:38px;color:#DC2626;letter-spacing:0.02em;line-height:1}
.bot-cta{font-family:'Bebas Neue',sans-serif;font-size:32px;color:#0a0a0a;background:#DC2626;padding:14px 28px;border-radius:10px;letter-spacing:0.03em;white-space:nowrap;color:#fff}
.corner{position:absolute;top:50px;left:50px;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;color:#DC2626;letter-spacing:0.2em;z-index:5;writing-mode:vertical-rl;transform:rotate(180deg)}
</style>
</head>
