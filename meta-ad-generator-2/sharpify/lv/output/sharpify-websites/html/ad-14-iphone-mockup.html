<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1080px; overflow: hidden; }
body {
  width: 1080px; height: 1080px;
  background: linear-gradient(155deg, #0a1628 0%, #0f172a 100%);
  font-family: 'Inter', sans-serif; color: #fff;
  display: flex;
  position: relative;
}

/* Left side — text */
.text-side {
  flex: 1; display: flex; flex-direction: column;
  justify-content: center;
  padding: 64px 24px 64px 72px;
}

.badge {
  display: inline-block; align-self: flex-start;
  background: rgba(16,185,129,0.12); border: 1px solid rgba(16,185,129,0.3);
  color: #10b981; padding: 10px 22px; border-radius: 50px;
  font-size: 20px; font-weight: 700; margin-bottom: 28px;
}

.main-title {
  font-family: 'Montserrat', sans-serif;
  font-size: 56px; font-weight: 900; line-height: 1.15;
  margin-bottom: 24px;
}
.main-title span { color: #10b981; }

.features {
  display: flex; flex-direction: column; gap: 14px;
  margin-bottom: 36px;
}
.feature {
  display: flex; align-items: center; gap: 14px;
  font-size: 24px; color: #cbd5e1;
}
.feature .icon {
  width: 36px; height: 36px; border-radius: 8px;
  background: rgba(16,185,129,0.15);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; flex-shrink: 0;
}

.price-row {
  display: flex; align-items: baseline; gap: 16px;
  margin-bottom: 32px;
}
.price-old {
  font-size: 28px; color: #ef4444; text-decoration: line-through; opacity: 0.6;
}
.price-new {
  font-family: 'Montserrat', sans-serif;
  font-size: 64px; font-weight: 900; color: #10b981;
}

.cta-btn {
  background: #10b981; color: #000;
  padding: 26px 56px; border-radius: 16px;
  font-weight: 800; font-size: 32px;
  display: inline-block; align-self: flex-start;
  box-shadow: 0 8px 32px rgba(16,185,129,0.3);
}

/* Right side — phone */
.phone-side {
  width: 440px; display: flex; align-items: center; justify-content: center;
  position: relative; padding-right: 40px;
}

.iphone {
  width: 320px; height: 660px;
  background: #111;
  border-radius: 44px;
  border: 4px solid #2a2a2a;
  padding: 14px;
  position: relative;
  box-shadow: -20px 20px 60px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.05);
  transform: perspective(800px) rotateY(-8deg);
}
.iphone-screen {
  width: 100%; height: 100%;
  background: #fff;
  border-radius: 32px;
  overflow: hidden;
  position: relative;
}
.iphone-notch {
  width: 100px; height: 24px;
  background: #111; border-radius: 0 0 14px 14px;
  margin: 0 auto;
  position: relative; z-index: 2;
}
.screen-img {
  width: 100%; height: calc(100% - 24px);
  object-fit: cover; object-position: top center;
  display: block;
}

/* Floating label */
.phone-label {
  position: absolute; bottom: 32px; right: -24px;
  background: #10b981; color: #000;
  padding: 10px 20px; border-radius: 10px;
  font-weight: 800; font-size: 16px;
  transform: rotate(-4deg);
  box-shadow: 0 4px 16px rgba(16,185,129,0.3);
}
</style>
</head>
<body>
  <div class="text-side">
    <div class="badge">Pakalpojumu sniedzējiem</div>
    <div class="main-title">Tava mājaslapa.<br><span>Perfekta</span> uz<br>katra ekrāna.</div>

    <div class="features">
      <div class="feature"><div class="icon">📱</div> Mobilajam optimizēta</div>
      <div class="feature"><div class="icon">⚡</div> Gatava 1-3 dienās</div>
      <div class="feature"><div class="icon">🎨</div> Individuāls dizains</div>
      <div class="feature"><div class="icon">📋</div> Kontaktu forma iekļauta</div>
      <div class="feature"><div class="icon">🛡️</div> 100% garantija</div>
    </div>

    <div class="price-row">
      <span class="price-old">€299</span>
      <span class="price-new">€59</span>
    </div>

    <div class="cta-btn">Iegūsti tagad →</div>
  </div>

  <div class="phone-side">
    <div class="iphone">
      <div class="iphone-screen">
        <div class="iphone-notch"></div>
        <img class="screen-img" src="mobile-screenshot.png" alt="reg.sharpify.lv mobile">
      </div>
    </div>
    <div class="phone-label">Piemērs ☝️</div>
  </div>
</body>
</html>
