<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1080px;overflow:hidden}
.ad{width:1080px;height:1080px;position:relative;overflow:hidden;background:#0a0a0a}
.photo{position:absolute;inset:0;clip-path:polygon(0 0, 100% 0, 100% 38%, 0 58%)}
.photo img{width:100%;height:100%;object-fit:cover}
.photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0.15) 0%,rgba(0,0,0,0.4) 100%)}
.accent-line{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
.accent-line::before{content:"";position:absolute;top:0;left:0;width:100%;height:100%;clip-path:polygon(0 56%, 100% 36%, 100% 38%, 0 58%);background:#F59E0B;box-shadow:0 0 40px rgba(245,158,11,0.5)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(245,158,11,0.06) 1px,transparent 1px),linear-gradient(90deg,rgba(245,158,11,0.06) 1px,transparent 1px);background-size:60px 60px;background-position:0 58%;mask:linear-gradient(180deg,transparent 58%,#000 62%,#000 100%);-webkit-mask:linear-gradient(180deg,transparent 58%,#000 62%,#000 100%)}
.badge{position:absolute;top:56px;left:56px;z-index:5;font-family:'Montserrat',sans-serif;font-size:18px;font-weight:800;color:#fff;text-transform:uppercase;letter-spacing:0.2em;padding:12px 22px;background:rgba(0,0,0,0.55);backdrop-filter:blur(8px);border:1px solid rgba(245,158,11,0.55);border-radius:100px}
.stat-pill{position:absolute;top:340px;right:56px;z-index:5;background:#F59E0B;color:#0a0a0a;padding:14px 22px;border-radius:14px;font-family:'Montserrat',sans-serif;transform:rotate(-2deg);box-shadow:0 16px 40px rgba(0,0,0,0.4)}
.stat-pill b{display:block;font-size:34px;font-weight:900;line-height:1}
.stat-pill span{font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em}
.content{position:absolute;left:56px;right:56px;bottom:80px;z-index:4}
h1{font-family:'Montserrat',sans-serif;font-size:78px;font-weight:900;color:#fff;line-height:0.98;letter-spacing:-0.02em}
h1 .accent{color:#F59E0B}
.sub{font-family:'Inter',sans-serif;font-size:28px;font-weight:500;color:rgba(255,255,255,0.75);margin-top:24px;line-height:1.35;max-width:860px}
.row{display:flex;align-items:center;gap:20px;margin-top:34px;flex-wrap:wrap}
.cta{font-family:'Montserrat',sans-serif;font-size:32px;font-weight:800;color:#0a0a0a;background:#F59E0B;padding:26px 56px;border-radius:14px;box-shadow:0 14px 34px rgba(245,158,11,0.4)}
.gift{display:flex;align-items:center;gap:10px;font-family:'Montserrat',sans-serif;font-size:20px;font-weight:700;color:#fff;padding:14px 22px;border:1px dashed rgba(245,158,11,0.6);border-radius:14px}
.gift b{color:#F59E0B}
</style>
</head>
<body>
<div class="ad">
<div class="photo"><img src="file:///C:/Users/Ritvars Volfs/meta-ad-generator-v2/meta-ad-generator/output/niks-buvnieki/images/v1-wide.png"></div>
<div class="accent-line"></div>
<div class="grid"></div>
<div class="stat-pill"><b>2'300+</b><span>Aktīvi klienti</span></div>
<div class="content">
<h1>Sistēma, kas<br>piesaista klientus —<br><span class="accent">Tavā vietā.</span></h1>
<div class="sub">AI mārketings, CRM un automatizācija vienā platformā. Būvēts būvniekiem, kas grib augt.</div>
<div class="row">
<div class="cta">Pieteikties sadarbībai →</div>
<div class="gift">🎁 <b>Dāvanā</b> — moderna mājaslapa</div>
</div>
</div>
</div>
</body>
</html>
