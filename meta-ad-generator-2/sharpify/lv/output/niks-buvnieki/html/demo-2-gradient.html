<!DOCTYPE html>
<html lang="lv">
<head>

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1080px;overflow:hidden}
.ad{width:1080px;height:1080px;position:relative;overflow:hidden;background:#0a0a0a}
.photo-wrap{position:absolute;top:0;left:0;right:0;height:560px;overflow:hidden}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fade{position:absolute;left:0;right:0;bottom:-2px;height:340px;background:linear-gradient(180deg,rgba(10,10,10,0) 0%,rgba(10,10,10,0.5) 40%,rgba(10,10,10,0.95) 78%,#0a0a0a 100%)}
.glow{position:absolute;left:50%;top:430px;width:900px;height:500px;transform:translateX(-50%);background:radial-gradient(ellipse at center,rgba(245,158,11,0.22) 0%,rgba(245,158,11,0) 65%);filter:blur(20px);pointer-events:none}
.content{position:absolute;left:0;right:0;bottom:70px;text-align:center;padding:0 70px;z-index:3}
.badge{display:inline-block;font-family:'Montserrat',sans-serif;font-size:18px;font-weight:800;color:#F59E0B;text-transform:uppercase;letter-spacing:0.2em;margin-bottom:24px;padding:10px 22px;background:rgba(245,158,11,0.1);border:1px solid rgba(245,158,11,0.35);border-radius:100px}
h1{font-family:'Montserrat',sans-serif;font-size:64px;font-weight:900;color:#fff;line-height:1.02;letter-spacing:-0.015em}
h1 .accent{color:#F59E0B}
.sub{font-family:'Inter',sans-serif;font-size:28px;font-weight:500;color:rgba(255,255,255,0.78);margin-top:22px;line-height:1.4}
.gift-chip{display:inline-flex;align-items:center;gap:10px;margin-top:26px;font-family:'Montserrat',sans-serif;font-size:20px;font-weight:700;color:#F59E0B;background:rgba(245,158,11,0.12);border:1px solid rgba(245,158,11,0.35);padding:12px 22px;border-radius:100px}
.cta{display:inline-block;margin-top:30px;font-family:'Montserrat',sans-serif;font-size:34px;font-weight:800;color:#0a0a0a;background:#F59E0B;padding:28px 68px;border-radius:16px;box-shadow:0 16px 40px rgba(245,158,11,0.45)}
</style>
</head>
<body>
<div class="ad">
<div class="photo-wrap">
<img class="bg" src="file:///C:/Users/Ritvars Volfs/meta-ad-generator-v2/meta-ad-generator/output/niks-buvnieki/images/v2-closeup.png">
<div class="fade"></div>
</div>
<div class="glow"></div>
<div class="content">
<div class="badge">Jumiķiem · Būvniekiem · Remontdarbu meistariem</div>
<h1>Jauni klienti <span class="accent">katru dienu</span> —<br>bez rekomendāciju gaidīšanas.</h1>
<div class="sub">AI mārketinga sistēma, kas piesaista pieteikumus<br>un apstrādā tos Tavā vietā.</div>
<div class="gift-chip">🎁 Dāvanā — jauna, moderna mājaslapa</div>

<div class="cta">Uzzināt vairāk →</div>
</div>
</div>

</html>
