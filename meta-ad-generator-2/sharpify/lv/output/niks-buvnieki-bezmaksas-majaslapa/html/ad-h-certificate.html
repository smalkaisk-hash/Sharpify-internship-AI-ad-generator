<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Instrument+Serif:ital@0;1&family=Cinzel:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1080px;overflow:hidden}
.ad{width:1080px;height:1080px;position:relative;overflow:hidden;background:#0a0a0a}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tint{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,rgba(10,10,10,0) 30%,rgba(10,10,10,0.55) 100%)}

/* Top minimal strip */
.top{position:absolute;top:34px;left:60px;right:60px;display:flex;align-items:center;justify-content:space-between;z-index:5}
.top-l{font-family:'Cinzel',serif;font-weight:500;font-size:13px;color:rgba(255,255,255,0.72);letter-spacing:0.35em;text-transform:uppercase}
.top-l b{color:#E8D500;font-weight:600}
.top-r{font-family:'Cinzel',serif;font-weight:600;font-size:17px;color:#fff;letter-spacing:0.15em}
.top-r .dot{color:#E8D500}

/* Text overlay centered on the Gemini certificate's inner cream area (above the wax seal) */
.cert-content{position:absolute;top:220px;left:210px;right:210px;height:360px;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:4;text-align:center}

.cert-eyebrow{font-family:'Cinzel',serif;font-weight:500;font-size:12px;color:#8a6a18;letter-spacing:0.5em;text-transform:uppercase;line-height:1}
.cert-title{font-family:'Cinzel',serif;font-weight:700;font-size:24px;color:#0a0a0a;letter-spacing:0.3em;text-transform:uppercase;margin-top:12px;line-height:1.2}

.cert-ornament{margin:14px 0 10px 0;display:flex;align-items:center;gap:10px;justify-content:center;width:200px}
.cert-ornament .line{flex:1;height:1px;background:#8a6a18}
.cert-ornament .dia{color:#8a6a18;font-size:10px;line-height:1;letter-spacing:0.3em}

.cert-awarded{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:400;font-size:15px;color:#3a2a18;letter-spacing:0.02em;line-height:1.4;max-width:440px}
.cert-awarded b{font-style:normal;font-weight:600;color:#0a0a0a}

.cert-prize{font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;font-size:60px;color:#0a0a0a;line-height:1;margin-top:10px;letter-spacing:-0.015em}
.cert-prize span{display:block;font-size:13px;font-style:normal;font-weight:500;font-family:'Cinzel',serif;letter-spacing:0.35em;text-transform:uppercase;color:#8a6a18;margin-top:8px}

/* Bottom external CTA strip */
.cta-strip{position:absolute;bottom:30px;left:60px;right:60px;background:rgba(10,10,10,0.82);backdrop-filter:blur(14px);border:1px solid rgba(232,213,0,0.35);border-left:4px solid #E8D500;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;z-index:5;border-radius:3px}
.cs-l{font-family:'Cinzel',serif;font-weight:500;font-size:11px;color:rgba(255,255,255,0.6);letter-spacing:0.3em;text-transform:uppercase;line-height:1.2}
.cs-l b{display:block;color:#fff;font-family:'Instrument Serif',serif;font-style:italic;font-size:22px;font-weight:400;letter-spacing:-0.005em;text-transform:none;margin-top:3px}
.cs-cta{font-family:'Inter',sans-serif;font-size:15px;font-weight:800;color:#0a0a0a;background:#E8D500;padding:14px 20px;letter-spacing:0.01em;border-radius:3px}
</style>
</head>
<body>
<div class="ad">
<img class="bg" src="file:///C:/Users/Ritvars Volfs/meta-ad-generator-v2/meta-ad-generator/sharpify/lv/output/niks-buvnieki-bezmaksas-majaslapa/images/img-h-certificate.png">
<div class="tint"></div>

<div class="top">
<div class="top-l">Sertifikāts <b>· Nr. 01 / 2026</b></div>
<div class="top-r">Sharpify<span class="dot">.</span></div>
</div>

<div class="cert-content">
<div class="cert-eyebrow">Piekļuves sertifikāts</div>
<div class="cert-title">Latvijas būvniecības<br>uzņēmumiem</div>
<div class="cert-ornament"><span class="line"></span><span class="dia">◆ ◆ ◆</span><span class="line"></span></div>
<div class="cert-awarded">ar šo tiek apliecināts, ka <b>Jūsu uzņēmums</b> ir tiesīgs saņemt</div>
<div class="cert-prize">Bezmaksas mājaslapu<span>500 000€+ apgrozījumam</span></div>
</div>

<div class="cta-strip">
<div class="cs-l">Aktivizēt sertifikātu<b>Piesakies uz Zoom ar Niku</b></div>
<div class="cs-cta">Piesakies →</div>
</div>
</div>
</body>
</html>
