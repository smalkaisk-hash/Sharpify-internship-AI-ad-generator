<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1080px;overflow:hidden}
.ad{width:1080px;height:1080px;position:relative;overflow:hidden;background:#0a0a0a}

/* subtle grain */
.noise{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,0.03) 1px,transparent 1px);background-size:3px 3px;pointer-events:none}

/* Top brand strip */
.top-strip{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:34px 58px;border-bottom:1px solid rgba(255,255,255,0.08);z-index:4}
.brand{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:20px;color:#fff;letter-spacing:0.01em}
.brand .dot{color:#E8D500}
.edition{font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:12px;color:rgba(255,255,255,0.45);letter-spacing:0.3em;text-transform:uppercase}

/* Big editorial number */
.num{position:absolute;top:148px;left:58px;font-family:'Instrument Serif',serif;font-style:italic;font-size:52px;color:#E8D500;line-height:1}
.num-label{position:absolute;top:152px;left:120px;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:11px;color:rgba(255,255,255,0.55);letter-spacing:0.28em;text-transform:uppercase;line-height:1.5}
.num-label b{display:block;color:#fff;font-weight:700;font-size:13px;letter-spacing:0.2em;margin-top:4px}

/* Giant headline — breaks grid */
.giant{position:absolute;top:260px;left:56px;right:56px;font-family:'Instrument Serif',serif;font-weight:400;font-size:180px;line-height:0.86;color:#fff;letter-spacing:-0.045em;z-index:3}
.giant .yellow{color:#E8D500;font-style:italic}
.giant .small-line{display:block;font-size:94px;letter-spacing:-0.03em}

/* Gift box image positioned bottom-right, overlapping */
.box-wrap{position:absolute;bottom:-20px;right:-20px;width:520px;height:520px;z-index:2}
.box-wrap img{width:100%;height:100%;object-fit:cover}
.box-wrap::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(10,10,10,0) 50%,rgba(10,10,10,0.85) 100%)}

/* Bottom-left info block */
.info{position:absolute;bottom:56px;left:58px;max-width:540px;z-index:3}
.info-line{display:flex;align-items:flex-start;gap:14px;margin-bottom:14px}
.info-line .dash{font-family:'Space Grotesk',sans-serif;font-weight:700;color:#E8D500;font-size:18px;margin-top:3px;line-height:1}
.info-line .txt{font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:17px;color:rgba(255,255,255,0.8);line-height:1.4}
.info-line .txt b{color:#fff;font-weight:700}

.cta{margin-top:22px;font-family:'Inter',sans-serif;font-size:19px;font-weight:800;color:#0a0a0a;background:#E8D500;padding:20px 30px;letter-spacing:0.01em;display:inline-flex;align-items:center;gap:10px;border-radius:3px}

/* Diagonal accent bar */
.diag{position:absolute;left:-40px;top:460px;width:180px;height:4px;background:#E8D500;transform:rotate(90deg);transform-origin:left center;z-index:3}
</style>
</head>
<body>
<div class="ad">
<div class="noise"></div>

<div class="top-strip">
<div class="brand">Sharpify<span class="dot">.</span></div>
<div class="edition">Piedāvājums · Latvijas būvniecībai</div>
</div>

<div class="num">Nr.01</div>
<div class="num-label">Ekskluzīvs piedāvājums</div>

<h1 class="giant"><span class="yellow">Bez-<br>maksas</span><span class="small-line">mājaslapa.</span></h1>

<div class="box-wrap">
<img src="file:///C:/Users/Ritvars Volfs/meta-ad-generator-v2/meta-ad-generator/sharpify/lv/output/niks-buvnieki-bezmaksas-majaslapa/images/img-c-giftbox-tape.png">
</div>

<div class="info">
<div class="info-line"><span class="dash">—</span><span class="txt">Pilns dizains un izstrāde — <b>no mums.</b></span></div>
<div class="info-line"><span class="dash">—</span><span class="txt">Pieejams tikai būvniecības uzņēmumiem ar <b>500 000€+ gada apgrozījumu.</b></span></div>
<div class="cta">Piesakies uz Zoom ar Niku →</div>
</div>
</div>
</body>
</html>
