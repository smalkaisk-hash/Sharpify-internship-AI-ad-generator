<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800;900&family=Special+Elite&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1080px;overflow:hidden}
.ad{width:1080px;height:1080px;position:relative;overflow:hidden;background:#0a0a0a}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tint{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,10,10,0.4) 0%,rgba(10,10,10,0.1) 35%,rgba(10,10,10,0.65) 100%)}

/* Top strip */
.top{position:absolute;top:42px;left:58px;right:58px;display:flex;align-items:center;justify-content:space-between;z-index:5}
.t-l{font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:12px;color:rgba(255,255,255,0.72);letter-spacing:0.3em;text-transform:uppercase;background:rgba(10,10,10,0.55);padding:8px 14px;backdrop-filter:blur(10px);border-radius:3px}
.t-l b{color:#E8D500;font-weight:700}
.t-r{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:17px;color:#fff;letter-spacing:0.01em;background:rgba(10,10,10,0.55);padding:8px 14px;backdrop-filter:blur(10px);border-radius:3px}
.t-r .dot{color:#E8D500}

/* Kraft paper tag overlay */
.tag{position:absolute;top:150px;left:110px;right:110px;background:#c9a574;padding:48px 54px 44px 54px;transform:rotate(-2.2deg);box-shadow:0 40px 80px rgba(0,0,0,0.6),inset 0 0 0 2px rgba(90,60,20,0.25),inset 0 0 80px rgba(90,60,20,0.15);z-index:3;background-image:radial-gradient(rgba(90,60,20,0.08) 1px,transparent 1px),linear-gradient(175deg,rgba(255,255,255,0.06) 0%,transparent 30%);background-size:4px 4px,auto;clip-path:polygon(12% 0,100% 0,100% 100%,0 100%,0 14%)}
.tag::before{content:'';position:absolute;top:0;left:0;width:140px;height:140px;background:transparent}
/* reinforcement hole on corner */
.tag-hole{position:absolute;top:28px;left:44px;width:32px;height:32px;border:3px solid rgba(40,25,10,0.55);border-radius:50%;background:rgba(10,10,10,0.25);z-index:4;box-shadow:inset 0 2px 4px rgba(0,0,0,0.4)}
/* twine rope detail */
.tag-twine{position:absolute;top:40px;left:-80px;width:120px;height:6px;background:linear-gradient(180deg,#6b4423 0%,#8a5a30 50%,#6b4423 100%);transform:rotate(-35deg);border-radius:3px;z-index:4;box-shadow:0 2px 3px rgba(0,0,0,0.4)}

.tag-eyebrow{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13px;color:rgba(40,25,10,0.75);letter-spacing:0.34em;text-transform:uppercase;margin-left:60px;line-height:1}
.tag-title{font-family:'Instrument Serif',serif;font-weight:400;font-size:92px;color:#1a1008;line-height:0.95;letter-spacing:-0.02em;margin-top:12px}
.tag-title em{font-style:italic;position:relative;display:inline-block}
.tag-title em::after{content:'';position:absolute;left:-4px;right:-6px;bottom:6px;height:16px;background:rgba(232,213,0,0.55);z-index:-1;transform:rotate(-0.5deg)}

.tag-body{font-family:'Special Elite',monospace;font-weight:400;font-size:18px;color:rgba(40,25,10,0.85);margin-top:20px;line-height:1.5;max-width:720px;letter-spacing:0.01em}
.tag-body b{color:#0a0a0a;font-weight:400;background:rgba(255,255,255,0.3);padding:1px 6px}

.tag-row{display:flex;align-items:center;justify-content:space-between;margin-top:24px;padding-top:18px;border-top:1px dashed rgba(40,25,10,0.45)}

.tag-qual{font-family:'Space Grotesk',sans-serif;font-size:12px;font-weight:700;color:rgba(40,25,10,0.72);letter-spacing:0.24em;text-transform:uppercase;line-height:1.3}
.tag-qual b{display:block;color:#0a0a0a;font-family:'Instrument Serif',serif;font-style:italic;font-size:26px;font-weight:400;letter-spacing:-0.005em;text-transform:none;margin-top:3px}

.tag-stamp{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:11px;color:#0a0a0a;background:#E8D500;padding:10px 14px;letter-spacing:0.2em;text-transform:uppercase;line-height:1;transform:rotate(3deg);box-shadow:0 4px 10px rgba(0,0,0,0.25)}

/* Bottom CTA strip */
.cta-strip{position:absolute;bottom:40px;left:60px;right:60px;background:rgba(10,10,10,0.82);backdrop-filter:blur(14px);border:1px solid rgba(232,213,0,0.35);border-left:5px solid #E8D500;padding:18px 24px;display:flex;align-items:center;justify-content:space-between;z-index:5;border-radius:3px}
.cs-l{font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:12px;color:rgba(255,255,255,0.62);letter-spacing:0.28em;text-transform:uppercase;line-height:1.2}
.cs-l b{display:block;color:#fff;font-family:'Instrument Serif',serif;font-style:italic;font-size:24px;font-weight:400;letter-spacing:-0.005em;text-transform:none;margin-top:4px}
.cs-cta{font-family:'Inter',sans-serif;font-size:16px;font-weight:800;color:#0a0a0a;background:#E8D500;padding:15px 22px;letter-spacing:0.01em;border-radius:3px;white-space:nowrap}
</style>
</head>
