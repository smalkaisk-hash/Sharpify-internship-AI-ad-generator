<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;800;900&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400;1,9..144,500&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1080px;overflow:hidden}
.ad{width:1080px;height:1080px;position:relative;overflow:hidden;background:#E8D500;color:#0a0a0a}
.grain{position:absolute;inset:0;background-image:radial-gradient(rgba(10,10,10,0.08) 1px,transparent 1px),radial-gradient(rgba(10,10,10,0.05) 1px,transparent 1px);background-size:3px 3px,6px 6px;background-position:0 0,1px 1px;opacity:0.85;pointer-events:none;mix-blend-mode:multiply}
.vignette{position:absolute;inset:0;background:radial-gradient(ellipse at 30% 30%,rgba(255,240,100,0.5) 0%,transparent 55%),radial-gradient(ellipse at 80% 90%,rgba(120,100,0,0.2) 0%,transparent 55%);pointer-events:none;mix-blend-mode:soft-light}
.reg{position:absolute;inset:0;background:radial-gradient(rgba(200,30,30,0.015) 1px,transparent 1px);background-size:2px 2px;mix-blend-mode:multiply;pointer-events:none}

/* Top strip */
.top{position:absolute;top:48px;left:60px;right:60px;display:flex;justify-content:space-between;align-items:center;font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600;letter-spacing:0.2em;text-transform:uppercase;color:#0a0a0a;z-index:4}
.top .rule{flex:1;height:1px;background:#0a0a0a;margin:0 24px}

/* Massive slam headline */
.slam{position:absolute;top:128px;left:50px;right:50px;z-index:3;text-align:center}
.slam .word{font-family:'Big Shoulders Display',sans-serif;font-weight:900;font-size:280px;line-height:0.82;letter-spacing:-0.04em;color:#0a0a0a;display:block;text-transform:uppercase}
.slam .word.two{font-size:300px;margin-top:-4px;position:relative;display:inline-block}
.slam .word.two::after{content:".";font-family:'Big Shoulders Display',sans-serif;color:#0a0a0a}
.slam .bracket{font-family:'Fraunces',serif;font-style:italic;font-weight:400;font-size:56px;color:#0a0a0a;margin-top:10px;letter-spacing:-0.01em}
.slam .bracket em{font-style:italic;font-weight:500;position:relative;display:inline-block}
.slam .bracket em::after{content:"";position:absolute;left:-2px;right:-2px;bottom:2px;height:4px;background:#0a0a0a;opacity:0.85}

/* Plumber portrait — pinned sticker */
.pin{position:absolute;top:88px;right:58px;width:208px;z-index:5;transform:rotate(5deg)}
.pin .frame{width:100%;aspect-ratio:1/1;background:#0a0a0a;padding:12px 12px 38px;box-shadow:0 22px 36px rgba(0,0,0,0.28),0 6px 10px rgba(0,0,0,0.18)}
.pin .frame img{width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(0.3) contrast(1.05)}
.pin .label{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;letter-spacing:0.2em;text-transform:uppercase;color:#E8D500}
.pin .tack{position:absolute;top:-14px;left:50%;transform:translateX(-50%) rotate(-5deg);width:62px;height:18px;background:#0a0a0a;box-shadow:0 3px 0 -1px rgba(0,0,0,0.25)}

/* Sub callout */
.sub{position:absolute;top:690px;left:60px;right:60px;z-index:4;text-align:center;font-family:'Fraunces',serif;font-style:italic;font-weight:400;font-size:34px;line-height:1.3;color:#0a0a0a;letter-spacing:-0.01em}
.sub b{font-style:normal;font-weight:600;border-bottom:3px solid #0a0a0a;padding-bottom:2px}

/* Divider dots */
.dots{position:absolute;top:800px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:3}
.dots span{width:7px;height:7px;background:#0a0a0a;border-radius:50%}

/* Bottom row */
.foot{position:absolute;bottom:74px;left:60px;right:60px;display:flex;justify-content:space-between;align-items:center;z-index:6}
.chip{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;color:#E8D500;background:#0a0a0a;padding:14px 22px;border-radius:0;transform:rotate(-2deg);box-shadow:4px 4px 0 #b8a500}
.proof{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600;letter-spacing:0.16em;text-transform:uppercase;color:#0a0a0a;opacity:0.75}
.cta{font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:28px;color:#E8D500;background:#0a0a0a;padding:20px 40px;letter-spacing:0.04em;text-transform:uppercase;display:inline-flex;align-items:center;gap:14px;box-shadow:6px 6px 0 rgba(10,10,10,0.25)}
.cta .arr{width:32px;height:32px;background:#E8D500;color:#0a0a0a;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;font-family:'Big Shoulders Display',sans-serif}

/* Corner stamps */
.stamp{position:absolute;top:720px;right:70px;width:130px;height:130px;border:3px solid #0a0a0a;border-radius:50%;display:flex;align-items:center;justify-content:center;text-align:center;transform:rotate(-12deg);z-index:5;font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#0a0a0a;line-height:1.35;padding:10px;opacity:0.92}
.stamp b{font-family:'Big Shoulders Display',sans-serif;font-weight:900;font-size:36px;letter-spacing:-0.02em;display:block;line-height:0.95;margin:2px 0}

/* Torn edge on bottom */
.torn{position:absolute;bottom:0;left:0;right:0;height:10px;background:linear-gradient(to right,#0a0a0a 0%,#0a0a0a 100%);clip-path:polygon(0 100%,2% 30%,5% 90%,8% 20%,11% 85%,14% 40%,17% 95%,20% 30%,24% 80%,27% 25%,31% 90%,35% 35%,39% 85%,43% 20%,47% 95%,51% 30%,55% 80%,59% 40%,63% 85%,67% 25%,71% 90%,75% 35%,79% 80%,83% 20%,87% 95%,91% 30%,95% 85%,98% 40%,100% 100%);z-index:2;opacity:0.15}
</style>
</head>
<body>

</body>
</html>
