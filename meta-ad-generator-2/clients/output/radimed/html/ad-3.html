<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1080px;overflow:hidden;background:#020c18;}

.ad{
  width:1080px;height:1080px;
  position:relative;overflow:hidden;
  background:#020c18;
  font-family:'DM Sans',sans-serif;
}

/* Photo — full bleed */
.photo{
  position:absolute;inset:0;
  width:100%;height:100%;
  object-fit:cover;
  object-position:center top;
  opacity:0.55;
}

/* Gradient — shifted up to match higher text block */
.overlay{
  position:absolute;inset:0;
  background:
    linear-gradient(180deg,
      rgba(2,12,24,0.25) 0%,
      rgba(2,12,24,0.15) 22%,
      rgba(2,12,24,0.55) 48%,
      rgba(2,12,24,0.95) 68%,
      rgba(2,12,24,1.00) 100%
    );
}

/* Corner vignette */
.vignette{
  position:absolute;inset:0;
  background:
    radial-gradient(ellipse at 0% 0%, rgba(2,12,24,0.5) 0%, transparent 45%),
    radial-gradient(ellipse at 100% 0%, rgba(2,12,24,0.5) 0%, transparent 45%);
}

/* ── LOGO — top left ── */
.logo{
  position:absolute;top:52px;left:60px;
  height:88px;width:auto;
  filter:brightness(0) invert(1);
  z-index:5;
}

/* ── BADGE — top right ── */
.badge{
  position:absolute;top:68px;right:60px;
  font-family:'DM Sans',sans-serif;
  font-size:14px;font-weight:500;
  color:rgba(255,255,255,0.82);
  border:1px solid rgba(0,180,216,0.4);
  padding:10px 22px;border-radius:100px;
  background:rgba(0,180,216,0.07);
  letter-spacing:0.06em;
  z-index:5;
}

/* ── MAIN CONTENT — centered, shifted higher ── */
.content{
  position:absolute;
  bottom:160px;
  left:0;right:0;
  text-align:center;
  z-index:5;
  padding:0 80px;
}

.eyebrow{
  font-size:17px;font-weight:500;
  letter-spacing:0.22em;text-transform:uppercase;
  color:#00B4D8;
  margin-bottom:22px;
}

h1{
  font-family:'Playfair Display',serif;
  font-size:116px;line-height:0.93;
  font-weight:700;letter-spacing:-0.02em;
  color:#fff;
  margin-bottom:32px;
}
h1 em{
  font-style:italic;font-weight:400;
  color:#00B4D8;
  display:block;
}

.punch{
  font-family:'Playfair Display',serif;
  font-size:28px;font-weight:400;
  font-style:italic;
  color:rgba(255,255,255,0.78);
  margin-bottom:36px;
  line-height:1.4;
  letter-spacing:0.01em;
}

/* Chips */
.chips{
  display:flex;justify-content:center;gap:12px;
  margin-bottom:42px;
  flex-wrap:nowrap;
}
.chip{
  font-size:14px;font-weight:500;
  color:rgba(255,255,255,0.72);
  padding:10px 22px;
  border:1px solid rgba(255,255,255,0.16);
  border-radius:100px;
  letter-spacing:0.04em;
  white-space:nowrap;
}
.chip.hi{
  background:rgba(0,180,216,0.12);
  border-color:rgba(0,180,216,0.45);
  color:#00B4D8;
}

/* CTA */
.cta{
  font-size:26px;font-weight:700;
  color:#020c18;
  background:#00B4D8;
  padding:30px 140px;
  border-radius:16px;
  display:block;
  width:fit-content;
  margin:0 auto;
  letter-spacing:0.01em;
}
</style>
</head>
<body>
<div class="ad">
  <img class="photo" src="../images/mri-patient.png">
  <div class="overlay"></div>
  <div class="vignette"></div>

  <img class="logo" src="../6135c3339b379db98bc847bdbec13eb5.png">

  <div class="content">
    <div class="eyebrow">Pilna ķermeņa izmeklēšana</div>

    <h1>Ko Tu nezini,<br><em>var kaitēt.</em></h1>

    <div class="punch">Viens izmeklējums var mainīt visu.</div>

    <div class="chips">
      <span class="chip hi">Nav radiācijas</span>
      <span class="chip">Droši grūtniecēm</span>
      <span class="chip">Rezultāts 24h</span>
      <span class="chip">Pieraksts šodien</span>
    </div>

    <div class="cta">Pierakstīties →</div>
  </div>
</div>
</body>
</html>
