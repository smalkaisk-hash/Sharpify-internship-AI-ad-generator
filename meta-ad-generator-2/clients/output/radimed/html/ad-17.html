<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1080px;overflow:hidden;background:#020c18;}
.ad{width:1080px;height:1080px;position:relative;overflow:hidden;font-family:'DM Sans',sans-serif;background:#020c18;}

/* Full canvas photo — right side shows through the slice */
.photo{
  position:absolute;inset:0;
  width:100%;height:100%;
  object-fit:cover;
  object-position:65% center;
  opacity:0.52;
}

/* Right-edge photo vignette */
.photo-edge{
  position:absolute;inset:0;
  background:linear-gradient(to right,
    rgba(2,12,24,0) 55%,
    rgba(2,12,24,0.25) 80%,
    rgba(2,12,24,0.65) 100%
  );
}

/* Dark navy polygon — left diagonal panel */
.dark-panel{
  position:absolute;inset:0;
  background:#020c18;
  clip-path:polygon(0 0, 614px 0, 412px 1080px, 0 1080px);
}

/* Subtle gradient warmth inside the dark panel */
.dark-glow{
  position:absolute;inset:0;
  background:radial-gradient(ellipse 480px 640px at 12% 60%, rgba(0,80,160,0.14) 0%, transparent 70%);
  clip-path:polygon(0 0, 614px 0, 412px 1080px, 0 1080px);
}

/* Diagonal accent line SVG — lives above both panels */
.diag-svg{
  position:absolute;inset:0;
  width:1080px;height:1080px;
  z-index:4;
  pointer-events:none;
}

/* Logo */
.logo{
  position:absolute;top:52px;left:60px;
  height:70px;width:auto;
  filter:brightness(0) invert(1);
  z-index:10;
}

/* Badge floating on photo side */
.badge{
  position:absolute;top:60px;right:56px;
  font-size:13px;font-weight:600;
  color:rgba(255,255,255,0.9);
  border:1px solid rgba(0,180,216,0.5);
  padding:10px 22px;border-radius:100px;
  background:rgba(2,12,24,0.72);
  letter-spacing:0.07em;
  z-index:10;
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
}

/* Eyebrow */
.eyebrow{
  position:absolute;top:164px;left:60px;
  font-size:14px;font-weight:600;
  letter-spacing:0.22em;text-transform:uppercase;
  color:#00B4D8;
  z-index:10;
}

/* Main headline */
h1{
  position:absolute;top:202px;left:60px;
  width:430px;
  font-family:'Playfair Display',serif;
  font-size:82px;line-height:0.91;
  font-weight:700;letter-spacing:-0.03em;
  color:#fff;
  z-index:10;
}
h1 em{font-style:italic;font-weight:400;color:#00B4D8;}

/* Sub copy */
.sub{
  position:absolute;top:544px;left:60px;
  width:400px;
  font-size:20px;font-weight:400;
  color:rgba(255,255,255,0.58);
  line-height:1.55;
  z-index:10;
}

/* Pills row */
.pills{
  position:absolute;bottom:248px;left:60px;
  display:flex;gap:10px;flex-wrap:wrap;
  z-index:10;
}
.pill{
  font-size:13px;font-weight:500;
  color:rgba(255,255,255,0.70);
  padding:9px 18px;
  border:1px solid rgba(255,255,255,0.14);
  border-radius:100px;
  letter-spacing:0.03em;
}
.pill.hi{
  background:rgba(0,180,216,0.11);
  border-color:rgba(0,180,216,0.48);
  color:#00B4D8;
}

/* CTA */
.cta{
  position:absolute;bottom:160px;left:60px;
  font-size:21px;font-weight:700;
  color:#020c18;background:#00B4D8;
  padding:22px 52px;
  border-radius:12px;
  display:inline-block;
  letter-spacing:0.01em;
  box-shadow:0 4px 40px rgba(0,180,216,0.45);
  z-index:10;
}
</style>
</head>
<body>
<div class="ad">
  <img class="photo" src="../images/mri-brain.png">
  <div class="photo-edge"></div>
  <div class="dark-panel"></div>
  <div class="dark-glow"></div>

  <!-- Glowing diagonal separator line -->
  <svg class="diag-svg" viewBox="0 0 1080 1080">
    <line x1="614" y1="0" x2="412" y2="1080" stroke="rgba(0,180,216,0.10)" stroke-width="28"/>
    <line x1="614" y1="0" x2="412" y2="1080" stroke="rgba(0,180,216,0.32)" stroke-width="5"/>
    <line x1="614" y1="0" x2="412" y2="1080" stroke="rgba(0,180,216,0.78)" stroke-width="1.2"/>
    <!-- Accent dots along the line -->
    <circle cx="586" cy="216" r="4" fill="#00B4D8" opacity="0.70"/>
    <circle cx="558" cy="432" r="4" fill="#00B4D8" opacity="0.70"/>
    <circle cx="530" cy="648" r="3.5" fill="#00B4D8" opacity="0.55"/>
    <circle cx="503" cy="864" r="3" fill="#00B4D8" opacity="0.38"/>
    <!-- Small perpendicular tick marks -->
    <line x1="574" y1="208" x2="598" y2="224" stroke="#00B4D8" stroke-width="1" opacity="0.5"/>
    <line x1="546" y1="424" x2="570" y2="440" stroke="#00B4D8" stroke-width="1" opacity="0.5"/>
  </svg>

  <img class="logo" src="../6135c3339b379db98bc847bdbec13eb5.png">
  <div class="badge">MRI DIAGNOSTIKA</div>

  <div class="eyebrow">Diagnostikas ātrums un precizitāte</div>

  <h1>Ārstēt ir<br>vieglāk.<br>Ja zini<br><em>visu.</em></h1>

  <div class="sub">1.5T MRI — precīzākā diagnostika Rīgā. Pilns radiologu ziņojums 24 stundās. Nav radiācijas.</div>

  <div class="pills">
    <span class="pill hi">Nav radiācijas</span>
    <span class="pill">1.5T MRI tehnoloģija</span>
    <span class="pill">4 radiologi</span>
  </div>

  <div class="cta">Pierakstīties →</div>
</div>
</body>
</html>
