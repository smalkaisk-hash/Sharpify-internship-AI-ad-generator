<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1080px;overflow:hidden;background:#020c18;}
.ad{width:1080px;height:1080px;position:relative;overflow:hidden;font-family:'DM Sans',sans-serif;background:#020c18;}

/* Background gradient mesh */
.mesh{
  position:absolute;inset:0;
  background:
    radial-gradient(ellipse 520px 480px at 25% 50%, rgba(0,180,216,0.09) 0%, transparent 65%),
    radial-gradient(ellipse 360px 320px at 82% 22%, rgba(0,100,200,0.07) 0%, transparent 60%),
    radial-gradient(ellipse 300px 280px at 78% 82%, rgba(0,180,216,0.06) 0%, transparent 55%),
    #020c18;
}

/* Decorative hex outlines — SVG in background */
.hex-deco{
  position:absolute;inset:0;
  width:1080px;height:1080px;
  z-index:1;
  pointer-events:none;
}

/* Dot grid texture */
.dot-grid{
  position:absolute;inset:0;
  background-image:radial-gradient(rgba(0,180,216,0.042) 1px, transparent 1px);
  background-size:28px 28px;
  z-index:1;
}

/* Logo + top bar */
.logo{
  position:absolute;top:52px;left:60px;
  height:70px;width:auto;
  filter:brightness(0) invert(1);
  z-index:10;
}
.badge{
  position:absolute;top:60px;right:60px;
  font-size:13px;font-weight:500;
  color:rgba(255,255,255,0.82);
  border:1px solid rgba(0,180,216,0.4);
  padding:9px 20px;border-radius:100px;
  background:rgba(0,180,216,0.07);
  letter-spacing:0.06em;
  z-index:10;
}
.divider{
  position:absolute;top:148px;left:60px;
  width:450px;height:1px;
  background:rgba(0,180,216,0.2);
  z-index:5;
}

/* LEFT COLUMN */
.left{position:absolute;top:0;left:60px;width:480px;z-index:10;}

.eyebrow{
  position:absolute;top:172px;left:0;
  font-size:14px;font-weight:600;
  letter-spacing:0.24em;text-transform:uppercase;
  color:#00B4D8;
}

h1{
  position:absolute;top:208px;left:0;
  width:460px;
  font-family:'Playfair Display',serif;
  font-size:82px;line-height:0.91;
  font-weight:700;letter-spacing:-0.03em;
  color:#fff;
}
h1 em{font-style:italic;font-weight:400;color:#00B4D8;}

.sub{
  position:absolute;top:462px;left:0;
  width:450px;
  font-size:19px;font-weight:400;
  color:rgba(255,255,255,0.56);
  line-height:1.56;
}

/* Stats row */
.stats{
  position:absolute;bottom:264px;left:60px;
  display:flex;gap:0;
  border:1px solid rgba(0,180,216,0.16);
  border-radius:12px;
  overflow:hidden;
  width:450px;
  z-index:10;
}
.stat{
  flex:1;padding:16px 0;
  border-right:1px solid rgba(0,180,216,0.16);
  text-align:center;
}
.stat:last-child{border-right:none;}
.stat-num{
  font-family:'Playfair Display',serif;
  font-size:30px;font-weight:700;
  color:#00B4D8;line-height:1;
  margin-bottom:4px;
}
.stat-lbl{
  font-size:10px;font-weight:600;
  color:rgba(255,255,255,0.38);
  text-transform:uppercase;
  letter-spacing:0.12em;
}

/* CTA */
.cta{
  position:absolute;bottom:160px;left:60px;
  font-size:21px;font-weight:700;
  color:#020c18;background:#00B4D8;
  padding:22px 52px;
  border-radius:12px;
  display:inline-block;
  letter-spacing:0.01em;
  box-shadow:0 4px 36px rgba(0,180,216,0.42);
  z-index:10;
}

/* RIGHT COLUMN — hexagonal image */
/* Outer glow wrapper */
.hex-wrap{
  position:absolute;
  top:196px;left:554px;
  width:466px;height:532px;
  z-index:6;
  filter:drop-shadow(0 0 28px rgba(0,180,216,0.38)) drop-shadow(0 0 6px rgba(0,180,216,0.6));
}
/* Hex clip with cyan border */
.hex-border{
  position:absolute;inset:0;
  background:rgba(0,180,216,0.55);
  clip-path:polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
}
/* Inner hex with image */
.hex-inner{
  position:absolute;
  inset:3px;
  clip-path:polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
  overflow:hidden;
  background:#020c18;
}
.hex-inner img{
  width:100%;height:100%;
  object-fit:cover;
  object-position:center center;
  opacity:0.88;
}

/* Small decorative hex ring (outline only, no image) */
.hex-ring{
  position:absolute;
  top:196px;left:554px;
  width:466px;height:532px;
  z-index:5;
  pointer-events:none;
}
.hex-ring::before{
  content:'';
  position:absolute;
  inset:-22px;
  clip-path:polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
  border:1px solid rgba(0,180,216,0.14);
}

/* Vertical column divider */
.col-divider{
  position:absolute;
  top:148px;bottom:0;
  left:545px;
  width:1px;
  background:linear-gradient(180deg,
    rgba(0,180,216,0.20) 0%,
    rgba(0,180,216,0.08) 55%,
    rgba(0,180,216,0) 100%
  );
  z-index:4;
}
</style>
</head>
<body>
<div class="ad">
  <div class="mesh"></div>
  <div class="dot-grid"></div>

  <!-- Background decorative hexagon outlines -->
  <svg class="hex-deco" viewBox="0 0 1080 1080">
    <!-- Large outer hex ring around the image area -->
    <polygon points="790,60 1058,215 1058,525 790,680 522,525 522,215"
             fill="none" stroke="rgba(0,180,216,0.055)" stroke-width="1"/>
    <!-- Secondary ring -->
    <polygon points="790,108 1018,244 1018,506 790,642 562,506 562,244"
             fill="none" stroke="rgba(0,180,216,0.038)" stroke-width="1"/>
    <!-- Small floating hexes -->
    <polygon points="110,88 148,110 148,154 110,176 72,154 72,110"
             fill="none" stroke="rgba(0,180,216,0.07)" stroke-width="1"/>
    <polygon points="920,730 948,746 948,778 920,794 892,778 892,746"
             fill="none" stroke="rgba(0,180,216,0.08)" stroke-width="1"/>
    <polygon points="72,860 96,874 96,902 72,916 48,902 48,874"
             fill="none" stroke="rgba(0,180,216,0.055)" stroke-width="1"/>
  </svg>

  <img class="logo" src="../6135c3339b379db98bc847bdbec13eb5.png">
  <div class="badge">1.5T MRI</div>
  <div class="divider"></div>
  <div class="col-divider"></div>

  <div class="left">
    <div class="eyebrow">Diagnostikas precizitāte</div>
    <h1>Katra<br>detaļa<br><em>redzama.</em></h1>
    <div class="sub">Milimetru precizitāte. Bez jonizējošā starojuma. Pilns ziņojums jūsu ārstam 24 stundās.</div>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="stat-num">20+</div>
      <div class="stat-lbl">Gadu pieredze</div>
    </div>
    <div class="stat">
      <div class="stat-num">4</div>
      <div class="stat-lbl">Radiologi</div>
    </div>
    <div class="stat">
      <div class="stat-num">24h</div>
      <div class="stat-lbl">Rezultāts</div>
    </div>
  </div>

  <div class="cta">Pierakstīties →</div>

  <!-- Hexagonal image frame -->
  <div class="hex-ring"></div>
  <div class="hex-wrap">
    <div class="hex-border"></div>
    <div class="hex-inner">
      <img src="../images/mri-aperture.png" alt="">
    </div>
  </div>
</div>
</body>
</html>
