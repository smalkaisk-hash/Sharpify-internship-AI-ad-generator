<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1080px;overflow:hidden;background:#020c18;}

.ad{
  width:1080px;height:1080px;
  position:relative;overflow:hidden;
  font-family:'DM Sans',sans-serif;
  background:#020c18;
}

.photo{
  position:absolute;inset:0;
  width:100%;height:100%;
  object-fit:cover;
  object-position:center 35%;
  opacity:0.52;
}

.overlay{
  position:absolute;inset:0;
  background:
    linear-gradient(180deg,
      rgba(2,12,24,0.62) 0%,
      rgba(2,12,24,0.08) 28%,
      rgba(2,12,24,0.22) 52%,
      rgba(2,12,24,0.90) 74%,
      rgba(2,12,24,1.00) 100%
    ),
    radial-gradient(ellipse at 0% 100%, rgba(0,180,216,0.07) 0%, transparent 55%);
}

/* TOP */
.topbar{
  position:absolute;top:52px;left:64px;right:64px;
  display:flex;justify-content:space-between;align-items:center;
  z-index:5;
}
.logo{height:80px;width:auto;filter:brightness(0) invert(1);}
.badge{
  font-size:13px;font-weight:500;
  color:rgba(255,255,255,0.82);
  border:1px solid rgba(0,180,216,0.4);
  padding:9px 20px;border-radius:100px;
  background:rgba(0,180,216,0.07);
  letter-spacing:0.06em;
}
.divider-h{
  position:absolute;top:148px;left:64px;right:64px;
  height:1px;background:rgba(0,180,216,0.2);z-index:5;
}

/* CONTENT — grows upward from bottom */
.content{
  position:absolute;
  bottom:160px;left:64px;right:64px;
  z-index:5;
}

.eyebrow{
  font-size:16px;font-weight:600;
  letter-spacing:0.24em;text-transform:uppercase;
  color:#00B4D8;margin-bottom:18px;
}

h1{
  font-family:'Playfair Display',serif;
  font-size:100px;line-height:0.92;
  color:#fff;font-weight:700;
  letter-spacing:-0.025em;
  margin-bottom:34px;
}
h1 em{font-style:italic;font-weight:400;color:#00B4D8;}

/* 3-step process timeline */
.timeline{
  display:flex;flex-direction:column;gap:0;
  margin-bottom:34px;
}
.step{
  display:flex;align-items:center;gap:20px;
  padding:13px 0;
  border-top:1px solid rgba(255,255,255,0.07);
}
.step:last-child{border-bottom:1px solid rgba(255,255,255,0.07);}

.step-num{
  width:30px;height:30px;
  background:rgba(0,180,216,0.12);
  border:1px solid rgba(0,180,216,0.38);
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  font-size:11px;font-weight:700;
  color:#00B4D8;
}
.step-label{
  font-size:11px;font-weight:600;
  color:rgba(255,255,255,0.38);
  letter-spacing:0.14em;
  text-transform:uppercase;
  width:155px;
  flex-shrink:0;
}
.step-text{
  font-size:17px;font-weight:500;
  color:rgba(255,255,255,0.85);
  line-height:1.3;
}
.step-text strong{color:#fff;font-weight:700;}

/* Bottom row */
.cta-row{display:flex;align-items:center;gap:32px;}
.cta{
  font-size:21px;font-weight:700;
  color:#020c18;background:#00B4D8;
  padding:21px 52px;
  border-radius:12px;
  letter-spacing:0.01em;
  box-shadow:0 4px 28px rgba(0,180,216,0.35);
}
.phone{
  font-size:18px;font-weight:500;
  color:rgba(255,255,255,0.5);
}
.phone strong{color:#fff;font-weight:700;}
</style>
</head>
<body>
<div class="ad">
  <img class="photo" src="../images/mri-corridor.png">
  <div class="overlay"></div>

  <div class="topbar">
    <img class="logo" src="../6135c3339b379db98bc847bdbec13eb5.png">
  </div>

  <div class="content">
    <div class="eyebrow">Kā notiek izmeklēšana</div>
    <h1>Viena vizīte.<br><em>Pilna skaidrība.</em></h1>

    <div class="timeline">
      <div class="step">
        <div class="step-num">1</div>
        <div class="step-label">Pieraksts</div>
        <div class="step-text">Piezvaniet. Brīvas vietas pieejamas <strong>tajā pašā dienā</strong></div>
      </div>
      <div class="step">
        <div class="step-num">2</div>
        <div class="step-label">Izmeklēšana</div>
        <div class="step-text"><strong>45 minūtes,</strong> bez sāpēm, bez radiācijas</div>
      </div>
      <div class="step">
        <div class="step-num">3</div>
        <div class="step-label">Rezultāts</div>
        <div class="step-text">Pilns radioloģiskais ziņojums <strong>24h laikā</strong></div>
      </div>
    </div>

    <div class="cta-row">
      <div class="cta">Pierakstīties →</div>
    </div>
  </div>

</div>
</body>
</html>
