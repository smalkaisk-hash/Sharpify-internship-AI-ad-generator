<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,700;1,9..144,300&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1080px;overflow:hidden;background:#F7F6F2;}
.ad{
  width:1080px;height:1080px;
  position:relative;overflow:hidden;
  background:#F7F6F2;
  font-family:'DM Sans',sans-serif;
}

/* Top edge: thin cyan rule — MRI scanner line feel */
.top-rule{
  position:absolute;top:0;left:0;right:0;height:4px;
  background:#00B4D8;
}

/* Logo row */
.logo-row{
  position:absolute;top:52px;left:60px;right:60px;
  display:flex;justify-content:space-between;align-items:center;
  z-index:10;
}
.logo{height:52px;width:auto;filter:brightness(0);}
.category{
  font-size:12px;font-weight:600;
  letter-spacing:0.22em;text-transform:uppercase;
  color:rgba(10,22,40,0.32);
}

/* Headline block — vertically centered in canvas */
.headline-block{
  position:absolute;
  top:250px;left:60px;right:60px;
  text-align:center;
  z-index:10;
}

/* "Bez" — small italic prefix, deliberately muted */
.headline-pre{
  font-family:'Fraunces',serif;
  font-variation-settings:"opsz" 72,"wght" 300;
  font-size:60px;font-style:italic;font-weight:300;
  color:rgba(10,22,40,0.30);
  letter-spacing:0.01em;
  line-height:1;
  margin-bottom:2px;
}

/* "nosūtījuma." — the dominant word */
.headline-main{
  font-family:'Fraunces',serif;
  font-variation-settings:"opsz" 144,"wght" 700;
  font-size:130px;font-weight:700;
  color:#0A1628;
  letter-spacing:-0.035em;
  line-height:0.92;
}

/* Cyan separator line */
.separator{
  position:absolute;
  top:506px;left:60px;
  width:540px;height:3px;
  background:linear-gradient(90deg,#00B4D8 0%,rgba(0,180,216,0.0) 100%);
  border-radius:2px;
  z-index:10;
}

/* Contrast block — before / after */
.contrast-block{
  position:absolute;
  top:534px;left:60px;
  z-index:10;
}
.contrast-before{
  font-size:24px;font-weight:400;
  color:rgba(10,22,40,0.36);
  letter-spacing:-0.01em;
  line-height:1.4;
  margin-bottom:10px;
}
.contrast-before .striked{
  text-decoration:line-through;
  text-decoration-color:rgba(10,22,40,0.50);
  text-decoration-thickness:2px;
}
.contrast-after{
  font-size:26px;font-weight:700;
  color:#0A1628;
  letter-spacing:-0.015em;
  line-height:1.3;
}
.contrast-after em{
  font-style:normal;
  color:#00B4D8;
}

/* Small trust row above CTA */
.trust-row{
  position:absolute;
  bottom:268px;left:60px;right:60px;
  display:flex;gap:32px;
  z-index:10;
}
.trust-item{
  display:flex;align-items:center;gap:8px;
  font-size:13px;font-weight:500;
  color:rgba(10,22,40,0.40);
  letter-spacing:0.04em;
}
.trust-dot{
  width:5px;height:5px;border-radius:50%;
  background:#00B4D8;flex-shrink:0;
}

/* CTA — full width */
.cta{
  position:absolute;
  bottom:160px;left:60px;right:60px;
  background:#0A1628;color:#F7F6F2;
  font-size:22px;font-weight:700;
  padding:26px;border-radius:12px;
  text-align:center;letter-spacing:0.01em;
  box-shadow:0 8px 40px rgba(10,22,40,0.14);
  z-index:10;
}
.cta em{font-style:normal;color:#00B4D8;}
</style>
</head>
<body>
<div class="ad">
  <div class="top-rule"></div>

  <div class="logo-row">
    <img class="logo" src="../6135c3339b379db98bc847bdbec13eb5.png">
    <div class="category">Privātā MRI klīnika · Rīga</div>
  </div>

  <div class="headline-block">
    <div class="headline-pre">Bez</div>
    <div class="headline-main">nosūtījuma.</div>
  </div>

  <div class="separator"></div>

  <div class="contrast-block">
    <div class="contrast-before">Parasti <span class="striked">gaida mēnešiem.</span></div>
    <div class="contrast-after">Šeit — <em>pierakstīties šodien.</em></div>
  </div>

  <div class="trust-row">
    <div class="trust-item"><div class="trust-dot"></div>Nav radiācijas</div>
    <div class="trust-item"><div class="trust-dot"></div>Rezultāts 24h</div>
    <div class="trust-item"><div class="trust-dot"></div>Modernākā 1.5T iekārta</div>
  </div>

  <div class="cta">Pierakstīties šodien →</div>
</div>
<script>document.fonts.ready.then(()=>{document.title='fonts-ready';});</script>
</body>
</html>
