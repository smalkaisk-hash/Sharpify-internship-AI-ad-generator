<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1080px; height:1080px; overflow:hidden; background:#000; }

.canvas {
  position:relative;
  width:1080px; height:1080px;
  overflow:hidden;
}

.bg {
  position:absolute; inset:0;
  width:100%; height:100%;
  object-fit:cover;
  object-position:center top;
  z-index:0;
}

.overlay {
  position:absolute; inset:0;
  background:linear-gradient(
    165deg,
    rgba(4,10,4,0.70) 0%,
    rgba(4,10,4,0.65) 40%,
    rgba(3,7,3,0.82) 75%,
    rgba(2,4,2,0.94) 100%
  );
  z-index:1;
}

.logo {
  position:absolute;
  top:44px; left:44px;
  z-index:10;
}
.logo img {
  height:96px; width:auto;
  display:block;
  filter: drop-shadow(0 0 3px rgba(255,255,255,0.7)) drop-shadow(0 0 8px rgba(255,255,255,0.35));
}

.main-content {
  position:absolute;
  top:150px; left:44px; right:44px;
  z-index:10;
}

.headline {
  font-family:'Montserrat', sans-serif;
  line-height:1.05;
  margin-bottom:28px;
}
.hl-w {
  display:block;
  font-size:102px;
  font-weight:900;
  color:#FFFFFF;
  letter-spacing:-0.025em;
}
.hl-o {
  display:block;
  font-size:102px;
  font-weight:900;
  color:#F57C20;
  letter-spacing:-0.025em;
}
.hl-w-sm {
  display:block;
  font-size:64px;
  font-weight:900;
  color:#FFFFFF;
  letter-spacing:-0.015em;
  margin-top:14px;
}

/* Model badge with border */
.model-badge {
  display:inline-flex;
  align-items:center;
  gap:8px;
  border:2.5px solid rgba(255,255,255,0.70);
  padding:8px 18px;
  margin-bottom:34px;
}
.badge-brand {
  font-family:'Montserrat', sans-serif;
  font-size:26px;
  font-weight:700;
  color:#FFFFFF;
}
.badge-code {
  font-family:'Montserrat', sans-serif;
  font-size:26px;
  font-weight:700;
  color:#F57C20;
}

.bullets {
  display:flex;
  flex-direction:column;
  gap:22px;
}
.bullet {
  display:flex;
  align-items:center;
  gap:16px;
}
.b-icon {
  width:40px; height:40px;
  flex-shrink:0;
  background:rgba(245,124,32,0.30);
  border:2px solid #F57C20;
  border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 0 10px rgba(245,124,32,0.55);
}
.b-icon svg {
  width:20px; height:20px;
}
.b-txt {
  font-family:'Inter', sans-serif;
  font-size:27px;
  font-weight:500;
  color:rgba(255,255,255,0.92);
  line-height:1.2;
}

/* Product image — larger, bottom right */
.product-wrap {
  position:absolute;
  right:44px; bottom:160px;
  z-index:10;
  filter: drop-shadow(0 0 5px rgba(255,255,255,0.55)) drop-shadow(0 0 14px rgba(255,255,255,0.22));
}
.hex-lg {
  width:320px; height:285px;
  clip-path:polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
  overflow:hidden;
  background:#0d0d0d;
}
.hex-lg img {
  width:100%; height:100%;
  object-fit:cover;
  object-position:center;
}

/* CTA button */
.cta {
  position:absolute;
  left:44px; bottom:165px;
  background:#F57C20;
  color:#FFFFFF;
  font-family:'Montserrat', sans-serif;
  font-size:28px;
  font-weight:800;
  padding:22px 44px;
  border-radius:8px;
  display:flex; align-items:center; gap:16px;
  letter-spacing:0.01em;
  z-index:10;
}
.cta-arrow {
  width:40px; height:40px;
  background:rgba(255,255,255,0.22);
  border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:24px;
  line-height:1;
  padding-left:2px;
}

/* Bottom eco strip — centered under hex */
.eco {
  position:absolute;
  right:44px; bottom:76px;
  width:320px;
  display:flex; align-items:center; justify-content:center; gap:10px;
  z-index:10;
}
.eco svg {
  width:26px; height:26px;
  fill:#F57C20;
  flex-shrink:0;
}
.eco span {
  font-family:'Inter', sans-serif;
  font-size:18px;
  color:rgba(255,255,255,0.62);
  line-height:1.3;
}
</style>
</head>
<body>
<div class="canvas">

  <img class="bg" src="../86a2218bcaf3a97a45f63fb6120e2d80ebc581d6-1080x720.jpg" alt="">
  <div class="overlay"></div>

  <!-- Logo -->
  <div class="logo">
    <img src="../anna-assistance-logo_page-0001-removebg-preview-1-1.png" alt="Anna Assistance">
  </div>

  <!-- Headline + bullets -->
  <div class="main-content">
    <h1 class="headline">
      <span class="hl-w">Saudzīga</span>
      <span class="hl-o">pļaušana</span>
      <span class="hl-w-sm">jutīgām teritorijām</span>
    </h1>

    <div class="model-badge">
      <span class="badge-brand">Raymo</span>
      <span class="badge-code">S46FLORIS</span>
    </div>

    <div class="bullets">
      <div class="bullet">
        <div class="b-icon">
          <!-- Shield -->
          <svg viewBox="0 0 24 24" fill="#F57C20"><path d="M12 2L4 6v5c0 5.25 3.4 10.15 8 11.95C16.6 21.15 20 16.25 20 11V6l-8-4z"/></svg>
        </div>
        <span class="b-txt">Saudzīga pļaušana, kas aizsargā dzīvniekus un kukaiņus</span>
      </div>
      <div class="bullet">
        <div class="b-icon">
          <!-- Sound off / silent -->
          <svg viewBox="0 0 24 24" fill="#F57C20"><path d="M3.63 3.63a.996.996 0 000 1.41L7.29 8.7 7 9H4c-.55 0-1 .45-1 1v4c0 .55.45 1 1 1h3l3.29 3.29c.63.63 1.71.18 1.71-.71v-4.17l4.18 4.18c-.49.37-1.02.68-1.6.91-.36.15-.58.53-.58.92 0 .72.73 1.18 1.39.91.8-.33 1.55-.77 2.22-1.31l1.34 1.34a.996.996 0 101.41-1.41L5.05 3.63c-.39-.39-1.02-.39-1.42 0zM19 12c0 .82-.15 1.61-.41 2.34l1.53 1.53c.56-1.17.88-2.48.88-3.87 0-3.83-2.4-7.11-5.78-8.4-.59-.23-1.22.23-1.22.86v.19c0 .38.25.71.61.85C16.68 6.54 19 9.06 19 12zm-8.71-6.29l-.17.17L12 7.76V6.41c0-.89-1.08-1.33-1.71-.7zM16.5 12A4.5 4.5 0 0014 7.97v1.79l2.48 2.48c.01-.08.02-.16.02-.24z"/></svg>
        </div>
        <span class="b-txt">Klusa, pilnībā elektriska darbība</span>
      </div>
      <div class="bullet">
        <div class="b-icon">
          <!-- Leaf -->
          <svg viewBox="0 0 24 24" fill="#F57C20"><path d="M17 8C8 10 5.9 16.17 3.5 20.5c.5.1 1 .1 1.5.1 6.5 0 11-3.9 11-10 0-1.77-.3-3.4-1-5H17zm-5-5c-2 2-3 5-3 8a9 9 0 009-9 13 13 0 00-6 1z"/></svg>
        </div>
        <span class="b-txt">Piemērota ekoloģiski jutīgām teritorijām</span>
      </div>
      <div class="bullet">
        <div class="b-icon">
          <!-- Target / precision -->
          <svg viewBox="0 0 24 24" fill="#F57C20"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm0-12.5a4.5 4.5 0 100 9 4.5 4.5 0 000-9zM12 14a2 2 0 110-4 2 2 0 010 4z"/></svg>
        </div>
        <span class="b-txt">Precīza un vienmērīga pļaušana</span>
      </div>
    </div>
  </div>

  <!-- Single large product image -->
  <div class="product-wrap">
    <div class="hex-lg">
      <img src="../8166cc890e8686b9f4aa4f8e5fd39c4b11f6669c-1080x720.jpg" alt="">
    </div>
  </div>

  <!-- CTA -->
  <div class="cta">
    Saņemiet piedāvājumu
    <span class="cta-arrow">›</span>
  </div>

  <!-- Eco note -->
  <div class="eco">
    <svg viewBox="0 0 24 24"><path d="M17 8C8 10 5.9 16.17 3.5 20.5c.5.1 1 .1 1.5.1 6.5 0 11-3.9 11-10 0-1.77-.3-3.4-1-5H17zm-5-5c-2 2-3 5-3 8a9 9 0 009-9 13 13 0 00-6 1z"/></svg>
    <span>Droša pļaušana dzīvniekiem un kukaiņiem.</span>
  </div>

</div>
<script>document.fonts.ready.then(()=>{ document.title='fonts-ready'; });</script>
</body>
</html>
