<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1080px; height:1080px; overflow:hidden; background:#000; }

.canvas {
  position:relative;
  width:1080px; height:1080px;
  overflow:hidden;
}

.bg {
  position:absolute; inset:0;
  width:100%; height:100%;
  object-fit:cover;
  object-position:center top;
  z-index:0;
}

.overlay {
  position:absolute; inset:0;
  background:linear-gradient(
    170deg,
    rgba(4,10,4,0.75) 0%,
    rgba(4,10,4,0.70) 42%,
    rgba(3,7,3,0.85) 72%,
    rgba(2,4,2,0.95) 100%
  );
  z-index:1;
}

/* Diagonal orange accent bar — top right corner */
.accent-bar {
  position:absolute;
  top:0; right:0;
  width:8px; height:280px;
  background:linear-gradient(180deg, #F57C20 0%, rgba(245,124,32,0) 100%);
  z-index:5;
}

.logo {
  position:absolute;
  top:44px; left:44px;
  z-index:10;
}
.logo img {
  height:96px; width:auto;
  display:block;
  filter: drop-shadow(0 0 3px rgba(255,255,255,0.7)) drop-shadow(0 0 8px rgba(255,255,255,0.35));
}

.main-content {
  position:absolute;
  top:148px; left:44px; right:44px;
  z-index:10;
}

.headline {
  font-family:'Montserrat', sans-serif;
  line-height:1.08;
  margin-bottom:28px;
}
.hl-w {
  display:block;
  font-size:84px;
  font-weight:900;
  color:#FFFFFF;
  letter-spacing:-0.02em;
  padding-bottom:4px;
}
.hl-o {
  display:block;
  font-size:106px;
  font-weight:900;
  color:#F57C20;
  letter-spacing:-0.025em;
  padding-bottom:6px;
}

.model-row {
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:34px;
}
.model-brand {
  font-family:'Montserrat', sans-serif;
  font-size:30px;
  font-weight:700;
  color:#FFFFFF;
}
.model-code {
  font-family:'Montserrat', sans-serif;
  font-size:30px;
  font-weight:700;
  color:#F57C20;
}

.bullets {
  display:flex;
  flex-direction:column;
  gap:21px;
}
.bullet {
  display:flex;
  align-items:center;
  gap:16px;
}
.b-dot {
  width:36px; height:36px;
  flex-shrink:0;
  background:#F57C20;
  border-radius:50%;
  display:flex; align-items:center; justify-content:center;
}
.b-dot svg {
  width:18px; height:18px;
}
.b-txt {
  font-family:'Inter', sans-serif;
  font-size:27px;
  font-weight:500;
  color:rgba(255,255,255,0.92);
  line-height:1.2;
}

/* Product images — two hexagons, bottom right */
.product-imgs {
  position:absolute;
  right:44px; bottom:155px;
  display:flex;
  gap:14px;
  z-index:10;
}
.hex-wrap {
  filter: drop-shadow(0 0 5px rgba(255,255,255,0.55)) drop-shadow(0 0 14px rgba(255,255,255,0.22));
}
.hex {
  width:215px; height:190px;
  clip-path:polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
  overflow:hidden;
  background:#0d0d0d;
}
.hex img {
  width:100%; height:100%;
  object-fit:cover;
  object-position:center;
}

/* CTA */
.cta {
  position:absolute;
  left:44px; bottom:165px;
  background:#F57C20;
  color:#FFFFFF;
  font-family:'Montserrat', sans-serif;
  font-size:28px;
  font-weight:800;
  padding:22px 40px;
  border-radius:8px;
  display:flex; align-items:center; gap:16px;
  letter-spacing:0.01em;
  z-index:10;
}
.cta-arrow {
  width:40px; height:40px;
  background:rgba(255,255,255,0.22);
  border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:24px;
  line-height:1;
  padding-left:2px;
}

/* Eco note — centered under hex group */
.eco {
  position:absolute;
  right:44px; bottom:76px;
  width:444px;
  display:flex; align-items:center; justify-content:center; gap:10px;
  z-index:10;
}
.eco svg {
  width:28px; height:28px;
  fill:#F57C20;
  flex-shrink:0;
}
.eco span {
  font-family:'Inter', sans-serif;
  font-size:18px;
  color:rgba(255,255,255,0.65);
  line-height:1.3;
  max-width:255px;
}
</style>
</head>
<body>
<div class="canvas">

  <img class="bg" src="../86a2218bcaf3a97a45f63fb6120e2d80ebc581d6-1080x720.jpg" alt="">
  <div class="overlay"></div>
  <div class="accent-bar"></div>

  <!-- Logo -->
  <div class="logo">
    <img src="../anna-assistance-logo_page-0001-removebg-preview-1-1.png" alt="Anna Assistance">
  </div>

  <!-- Content -->
  <div class="main-content">
    <h1 class="headline">
      <span class="hl-w">Klusa un videi</span>
      <span class="hl-o">draudzīga</span>
      <span class="hl-w">pļaušana</span>
    </h1>

    <div class="model-row">
      <span class="model-brand">Raymo</span>
      <span class="model-code">S46FLORIS</span>
    </div>

    <div class="bullets">
      <div class="bullet">
        <div class="b-dot">
          <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="4,12 9,17 20,6"/>
          </svg>
        </div>
        <span class="b-txt">Klusa, pilnībā elektriska darbība</span>
      </div>
      <div class="bullet">
        <div class="b-dot">
          <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="4,12 9,17 20,6"/>
          </svg>
        </div>
        <span class="b-txt">Piemērota jutīgām teritorijām un pilsētvidē</span>
      </div>
      <div class="bullet">
        <div class="b-dot">
          <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="4,12 9,17 20,6"/>
          </svg>
        </div>
        <span class="b-txt">Saudzīga pļaušana, kas aizsargā dzīvniekus un kukaiņus</span>
      </div>
      <div class="bullet">
        <div class="b-dot">
          <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="4,12 9,17 20,6"/>
          </svg>
        </div>
        <span class="b-txt">Vienmērīgs un kvalitatīvs rezultāts</span>
      </div>
    </div>
  </div>

  <!-- Product images -->
  <div class="product-imgs">
    <div class="hex-wrap">
      <div class="hex">
        <img src="../raymo-s46-floris-117-cm-comb-mower-head.jpg" alt="">
      </div>
    </div>
    <div class="hex-wrap">
      <div class="hex">
        <img src="../7f684338722f2aeb9779095f61c07e9fb6914d23-1080x720.jpg" alt="">
      </div>
    </div>
  </div>

  <!-- CTA -->
  <div class="cta">
    Saņemiet piedāvājumu
    <span class="cta-arrow">›</span>
  </div>

  <!-- Eco note -->
  <div class="eco">
    <svg viewBox="0 0 24 24"><path d="M17 8C8 10 5.9 16.17 3.5 20.5c.5.1 1 .1 1.5.1 6.5 0 11-3.9 11-10 0-1.77-.3-3.4-1-5H17zm-5-5c-2 2-3 5-3 8a9 9 0 009-9 13 13 0 00-6 1z"/></svg>
    <span>Droša pļaušana dzīvniekiem un kukaiņiem.</span>
  </div>

</div>
<script>document.fonts.ready.then(()=>{ document.title='fonts-ready'; });</script>
</body>
</html>
