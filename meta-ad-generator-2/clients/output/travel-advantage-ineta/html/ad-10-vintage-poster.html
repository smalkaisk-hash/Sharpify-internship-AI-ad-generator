<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<title>Ad 10 — Vintage travel poster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@400;500;600;700&family=Abril+Fatface&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Space Grotesk', sans-serif; }
  .canvas {
    width: 1080px; height: 1080px;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(212,166,87,0.2) 0%, transparent 50%),
      radial-gradient(ellipse at 50% 100%, rgba(10,61,46,0.2) 0%, transparent 50%),
      linear-gradient(180deg, #f5e9d1 0%, #EEE3CA 50%, #E8D9C0 100%);
    position: relative;
    overflow: hidden;
    padding: 44px 50px;
    display: flex;
    flex-direction: column;
  }
  .canvas::before {
    content: '';
    position: absolute; inset: 0;
    background-image:
      radial-gradient(circle at 1px 1px, rgba(10,61,46,0.05) 1px, transparent 0),
      radial-gradient(circle at 2px 2px, rgba(10,61,46,0.03) 1px, transparent 0);
    background-size: 5px 5px, 8px 8px;
    pointer-events: none;
  }

  /* Art deco border ornament */
  .border-deco {
    position: absolute;
    inset: 30px;
    border: 3px solid #0A3D2E;
    pointer-events: none;
  }
  .border-deco::before, .border-deco::after {
    content: '';
    position: absolute;
    left: 0; right: 0;
    height: 1px;
    background: #0A3D2E;
  }
  .border-deco::before { top: 8px; }
  .border-deco::after { bottom: 8px; }

  /* corners */
  .corner {
    position: absolute;
    width: 34px; height: 34px;
    border: 3px solid #D4A657;
  }
  .corner.tl { top: 44px; left: 64px; border-right: 0; border-bottom: 0; }
  .corner.tr { top: 44px; right: 64px; border-left: 0; border-bottom: 0; }
  .corner.bl { bottom: 44px; left: 64px; border-right: 0; border-top: 0; }
  .corner.br { bottom: 44px; right: 64px; border-left: 0; border-top: 0; }

  .top-banner {
    position: relative;
    margin-top: 10px;
    padding: 12px 0 16px;
    text-align: center;
    z-index: 2;
  }
  .top-banner .brand {
    font-family: 'Instrument Serif', serif;
    font-size: 22px;
    color: #0A3D2E;
    letter-spacing: 0.05em;
  }
  .top-banner .since {
    margin-top: 4px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 13px;
    letter-spacing: 0.4em;
    color: rgba(10,61,46,0.7);
  }

  .ornament-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin-top: 6px;
  }
  .ornament-row .rule {
    width: 80px; height: 1px;
    background: #0A3D2E;
  }
  .ornament-row .glyph {
    color: #D4A657;
    font-family: 'Instrument Serif', serif;
    font-style: italic;
    font-size: 22px;
  }

  /* arched photo frame */
  .photo-frame {
    position: relative;
    margin: 14px auto 0;
    width: 820px;
    flex: 1;
    max-height: 620px;
    z-index: 2;
  }
  .photo-frame .arch {
    position: absolute;
    inset: 0;
    background: #0A3D2E;
    border-radius: 200px 200px 12px 12px;
    padding: 12px;
    box-shadow: 0 20px 40px rgba(10,61,46,0.3);
  }
  .photo-frame .arch::before {
    content: '';
    position: absolute;
    inset: 4px;
    border: 1.5px solid #D4A657;
    border-radius: 196px 196px 8px 8px;
    pointer-events: none;
    z-index: 2;
  }
  .photo-frame .img {
    width: 100%;
    height: 100%;
    background-image: url('../brief/images/bg-santorini.png');
    background-size: cover;
    background-position: center;
    border-radius: 190px 190px 4px 4px;
    position: relative;
  }
  .photo-frame .img::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, transparent 50%, rgba(10,61,46,0.3) 100%);
    border-radius: 190px 190px 4px 4px;
  }

  /* City wordmark overlay */
  .city-overlay {
    position: absolute;
    bottom: 30px; left: 0; right: 0;
    text-align: center;
    z-index: 3;
    color: #F5EFE2;
  }
  .city-overlay .tag {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 14px;
    letter-spacing: 0.4em;
    color: #D4A657;
  }
  .city-overlay .name {
    font-family: 'Abril Fatface', serif;
    font-size: 108px;
    line-height: 0.9;
    letter-spacing: 0.04em;
    margin-top: 2px;
    text-shadow: 0 2px 24px rgba(0,0,0,0.4);
  }
  .city-overlay .sub {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 14px;
    letter-spacing: 0.4em;
    color: #D4A657;
    margin-top: 4px;
  }

  /* Gold medallion on frame */
  .medallion {
    position: absolute;
    right: -30px; top: 240px;
    width: 128px; height: 128px;
    background: #D4A657;
    color: #0A3D2E;
    border-radius: 50%;
    border: 3px solid #0A3D2E;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    transform: rotate(-9deg);
    z-index: 4;
    box-shadow: 0 10px 20px rgba(10,61,46,0.25);
  }
  .medallion::before {
    content: '';
    position: absolute;
    inset: 6px;
    border: 1px dashed rgba(10,61,46,0.5);
    border-radius: 50%;
  }
  .medallion .lbl {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 11px;
    letter-spacing: 0.28em;
    font-weight: 600;
  }
  .medallion .amount {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 32px;
    line-height: 1;
    margin-top: 2px;
    letter-spacing: -0.02em;
  }
  .medallion .foot {
    margin-top: 2px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 10px;
    letter-spacing: 0.28em;
  }

  .bottom-banner {
    margin-top: 20px;
    text-align: center;
    z-index: 2;
    position: relative;
  }
  .bottom-banner .headline {
    font-family: 'Instrument Serif', serif;
    font-size: 46px;
    line-height: 1;
    color: #0A3D2E;
    letter-spacing: -0.005em;
  }
  .bottom-banner .headline em {
    font-style: italic;
    color: #D4A657;
  }
  .bottom-banner .sub {
    margin-top: 6px;
    font-size: 14px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: rgba(10,61,46,0.7);
    font-weight: 500;
  }
  .bottom-banner .cta-row {
    margin-top: 14px;
    display: inline-flex;
    align-items: center;
    gap: 12px;
    background: #0A3D2E;
    color: #F5EFE2;
    padding: 10px 18px;
    border-radius: 0;
    border: 1px solid #D4A657;
    font-size: 12px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    font-weight: 600;
  }
  .bottom-banner .cta-row span { color: #D4A657; }
</style>
</head>
<body>
  <div class="canvas">
    <div class="border-deco"></div>
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>

    <div class="top-banner">
      <div class="brand">Travel Advantage<sup style="font-size:12px;">™</sup></div>
      <div class="ornament-row"><span class="rule"></span><span class="glyph">✦</span><span class="rule"></span></div>
      <div class="since">· EST. 2013 · MEMBER RATES ·</div>
    </div>

    <div class="photo-frame">
      <div class="arch">
        <div class="img"></div>
      </div>
      <div class="city-overlay">
        <div class="tag">· GRAND TOUR · 2026 ·</div>
        <div class="name">SANTORINI</div>
        <div class="sub">· ITALIA · ESPAÑA · FRANCE · GREECE · INDONESIA ·</div>
      </div>
      <div class="medallion">
        <div class="lbl">BIEDRA</div>
        <div class="amount">−€380</div>
        <div class="foot">TAVA CENA</div>
      </div>
    </div>

    <div class="bottom-banner">
      <div class="headline">Iekšējā cena.<em> Ārā no industrijas.</em></div>
      <div class="sub">· Viens pass · Visas sezonas · Kopš 2013 ·</div>
      <div class="cta-row">Guest Pass → <span>biedra cenas</span></div>
    </div>
  </div>
</body>
</html>
