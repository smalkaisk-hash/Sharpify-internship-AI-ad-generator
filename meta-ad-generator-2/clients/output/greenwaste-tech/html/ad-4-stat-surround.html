<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1080">
  <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&family=Fraunces:ital,wght@0,400;0,500;0,600;1,400;1,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #1D3A2C; --secondary: #0D1411; --accent: #4CAF50; --accent-bright: #B4E061;
      --text: #F4F1E8;
      --fh: 'Fraunces', 'Georgia', serif; --fb: 'Ubuntu', sans-serif; --fmono: 'JetBrains Mono', monospace;
    }
    html, body { width: 1080px; height: 1080px; overflow: hidden; margin: 0; }
    .ad {
      position: relative; width: 1080px; height: 1080px; overflow: hidden;
      background: #0D1411;
      color: var(--text);
      display: flex; flex-direction: column;
    }

    .tech-grid {
      position: absolute; inset: 0; pointer-events: none;
      background-image:
        linear-gradient(rgba(180,224,97,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(180,224,97,0.04) 1px, transparent 1px);
      background-size: 60px 60px;
    }

    /* Top bar */
    .top { padding: 36px 56px 0; display: flex; justify-content: space-between; align-items: center; z-index: 10; position: relative; }
    .wm { font-family: var(--fh); font-size: 28px; font-weight: 500; letter-spacing: -0.01em; }
    .wm .dot { color: var(--accent-bright); }
    .sheet-id {
      font-family: var(--fmono); font-size: 11px;
      color: rgba(244,241,232,0.55);
      letter-spacing: 0.18em;
    }
    .sheet-id span { color: var(--accent-bright); }

    /* Header */
    .header { padding: 30px 56px 0; z-index: 10; position: relative; text-align: center; }
    .eye {
      font-family: var(--fmono); font-size: 11px; font-weight: 500;
      color: var(--accent-bright); letter-spacing: 0.28em; text-transform: uppercase;
      margin-bottom: 12px;
    }
    h1 { font-family: var(--fh); font-size: 62px; font-weight: 500; line-height: 1; letter-spacing: -0.025em; margin: 0; }
    h1 .l { color: var(--accent-bright); font-style: italic; }

    /* Blueprint central area */
    .stage {
      flex: 1;
      position: relative;
      padding: 36px 40px 16px;
      z-index: 10;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      grid-template-rows: 1fr auto 1fr;
      gap: 20px 32px;
      align-items: center;
      justify-items: center;
    }

    /* Photo plate - bigger, better proportioned */
    .photo-plate {
      grid-column: 2;
      grid-row: 2;
      position: relative;
      width: 520px;
      height: 380px;
    }
    .photo-plate img {
      width: 100%; height: 100%; object-fit: cover;
      filter: brightness(0.72) saturate(0.85);
      display: block;
    }

    /* L-shaped corner crop marks — larger */
    .tick { position: absolute; width: 32px; height: 32px; z-index: 5; }
    .tick::before, .tick::after { content: ""; position: absolute; background: var(--accent-bright); }
    .tick.tl { top: -20px; left: -20px; }
    .tick.tl::before { top: 0; left: 0; width: 2.5px; height: 22px; }
    .tick.tl::after { top: 0; left: 0; width: 22px; height: 2.5px; }
    .tick.tr { top: -20px; right: -20px; }
    .tick.tr::before { top: 0; right: 0; width: 2.5px; height: 22px; }
    .tick.tr::after { top: 0; right: 0; width: 22px; height: 2.5px; }
    .tick.bl { bottom: -20px; left: -20px; }
    .tick.bl::before { bottom: 0; left: 0; width: 2.5px; height: 22px; }
    .tick.bl::after { bottom: 0; left: 0; width: 22px; height: 2.5px; }
    .tick.br { bottom: -20px; right: -20px; }
    .tick.br::before { bottom: 0; right: 0; width: 2.5px; height: 22px; }
    .tick.br::after { bottom: 0; right: 0; width: 22px; height: 2.5px; }

    .plate-label {
      position: absolute; top: -46px; left: 0;
      font-family: var(--fmono); font-size: 11px;
      color: rgba(244,241,232,0.55); letter-spacing: 0.3em;
      text-transform: uppercase;
    }
    .plate-label span { color: var(--accent-bright); }
    .plate-label-right {
      position: absolute; top: -46px; right: 0;
      font-family: var(--fmono); font-size: 11px;
      color: rgba(244,241,232,0.4); letter-spacing: 0.22em;
    }

    /* Stat blocks — bigger, tidier */
    .stat {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 0 8px;
    }
    .stat.tl { grid-column: 1; grid-row: 1; align-self: start; justify-self: start; }
    .stat.tr { grid-column: 3; grid-row: 1; align-self: start; justify-self: end; text-align: right; }
    .stat.bl { grid-column: 1; grid-row: 3; align-self: end; justify-self: start; }
    .stat.br { grid-column: 3; grid-row: 3; align-self: end; justify-self: end; text-align: right; }

    .stat-label {
      font-family: var(--fmono); font-size: 11px;
      color: rgba(244,241,232,0.55);
      letter-spacing: 0.26em; text-transform: uppercase;
    }
    .stat-label .mark { color: var(--accent-bright); }
    .stat-num {
      font-family: var(--fh); font-size: 74px; font-weight: 500;
      color: var(--accent-bright);
      line-height: 0.92; letter-spacing: -0.03em;
      display: flex; align-items: baseline; gap: 8px;
    }
    .stat.tr .stat-num, .stat.br .stat-num { justify-content: flex-end; }
    .stat-unit {
      font-family: var(--fb); font-size: 22px; font-weight: 500;
      color: var(--text);
    }

    /* Footer */
    .footer {
      padding: 22px 56px 36px;
      display: flex; justify-content: space-between; align-items: center;
      border-top: 1px solid rgba(180,224,97,0.2);
      z-index: 10; position: relative;
    }
    .footer-note {
      font-family: var(--fmono); font-size: 11px;
      color: rgba(244,241,232,0.55);
      letter-spacing: 0.2em;
    }
    .cta {
      display: inline-flex; align-items: center; justify-content: center;
      height: 72px; min-width: 260px; padding: 0 40px;
      background: var(--accent-bright); color: var(--secondary);
      font-family: var(--fb); font-weight: 700; font-size: 17px;
      letter-spacing: 0.22em; text-transform: uppercase; border-radius: 48px;
    }
  </style>
</head>
<body>
  <div class="ad">
    <div class="tech-grid"></div>

    <div class="top">
      <div class="wm">Greenwaste<span class="dot">.</span>Tech</div>
      <div class="sheet-id">SHEET 01/01 <span>·</span> SCALE 1:1</div>
    </div>

    <div class="header">
      <div class="eye">Četros skaitļos</div>
      <h1>Cik tiešām maksā<br><span class="l">nekas nedarīt.</span></h1>
    </div>

    <div class="stage">
      <div class="stat tl">
        <div class="stat-label"><span class="mark">A</span> — Ietaupījumi gadā</div>
        <div class="stat-num">€350–900</div>
      </div>
      <div class="stat tr">
        <div class="stat-label"><span class="mark">B</span> — Atmaksas periods</div>
        <div class="stat-num">3–6<span class="stat-unit">g.</span></div>
      </div>

      <div class="photo-plate">
        <div class="plate-label"><span>PLATE 01</span> · REAL INSTALL · LV</div>
        <div class="plate-label-right">GW.TECH · 2026</div>
        <img src="../brief/images/hero-2.jpg">
        <div class="tick tl"></div>
        <div class="tick tr"></div>
        <div class="tick bl"></div>
        <div class="tick br"></div>
      </div>

      <div class="stat bl">
        <div class="stat-label"><span class="mark">C</span> — Garantija</div>
        <div class="stat-num">5<span class="stat-unit">gadi</span></div>
      </div>
      <div class="stat br">
        <div class="stat-label"><span class="mark">D</span> — Ekspluatācija</div>
        <div class="stat-num">0€</div>
      </div>
    </div>

    <div class="footer">
      <div class="footer-note">CE · EN12566-3 · ONLY-OF-KIND-LV</div>
      <div class="cta">Pieteikties</div>
    </div>
  </div>
</body>
</html>
