<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1080">
  <link rel="stylesheet" href="../../../../templates/base.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-primary: #1E2E24;
      --color-secondary: #181616;
      --color-accent: #DAB453;
      --color-bg: #F5F1E8;
      --color-text: #181616;
      --color-cta-bg: #DAB453;
      --color-cta-text: #181616;
      --font-heading: 'Playfair Display', 'Georgia', serif;
      --font-body: 'Inter', sans-serif;
    }

    html, body { width: 1080px; height: 1080px; overflow: hidden; }

    .hero-section {
      position: relative;
      width: 1080px; height: 1080px;
      overflow: hidden;
      background: var(--color-secondary);
    }

    .hero-bg {
      position: absolute; top:0; left:0;
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: center center;
      filter: saturate(1.05) contrast(1.03);
    }

    .hero-gradient {
      position: absolute; top:0; left:0;
      width: 100%; height: 100%;
      background: linear-gradient(
        180deg,
        rgba(24,22,22,0.20) 0%,
        rgba(24,22,22,0.05) 30%,
        rgba(24,22,22,0.65) 68%,
        rgba(24,22,22,0.95) 100%
      );
    }

    /* Top bar */
    .top-bar {
      position: absolute;
      top: 48px; left: 0; right: 0;
      padding: 0 56px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }
    .brand-wordmark {
      font-family: var(--font-heading);
      font-size: 44px;
      font-weight: 600;
      color: var(--color-accent);
      letter-spacing: 0.01em;
    }
    .top-tagline {
      font-family: var(--font-body);
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: rgba(245,241,232,0.82);
    }

    /* Eyebrow */
    .eyebrow-row {
      position: absolute;
      top: 120px;
      left: 56px;
      right: 56px;
      z-index: 10;
    }
    .eyebrow-line {
      display: inline-block;
      width: 64px;
      height: 2px;
      background: var(--color-accent);
      vertical-align: middle;
      margin-right: 18px;
    }
    .eyebrow-text {
      font-family: var(--font-body);
      font-size: 15px;
      font-weight: 500;
      color: var(--color-accent);
      letter-spacing: 0.3em;
      text-transform: uppercase;
      vertical-align: middle;
    }

    /* Content block */
    .content-block {
      position: absolute;
      left: 56px; right: 56px;
      bottom: 56px;
      display: flex;
      flex-direction: column;
      gap: 28px;
      z-index: 10;
    }

    .headline-serif {
      font-family: var(--font-heading);
      font-size: 104px;
      font-weight: 500;
      line-height: 1.02;
      letter-spacing: -0.015em;
      color: var(--color-bg);
      max-width: 920px;
    }

    .headline-serif em {
      font-style: italic;
      color: var(--color-accent);
      font-weight: 500;
    }

    .body-lead {
      font-family: var(--font-body);
      font-size: 26px;
      font-weight: 400;
      line-height: 1.5;
      color: rgba(245,241,232,0.78);
      max-width: 760px;
    }

    .cta-row {
      display: flex;
      align-items: center;
      gap: 24px;
      margin-top: 8px;
    }

    .cta-gold {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 88px;
      padding: 0 48px;
      background: var(--color-accent);
      color: var(--color-secondary);
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 22px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      border-radius: 52px;
      flex-shrink: 0;
    }

    .cta-sub {
      font-family: var(--font-body);
      font-size: 18px;
      color: rgba(245,241,232,0.68);
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>
  <div class="hero-section">
    <img class="hero-bg" src="../brief/images/hero-1.jpg" alt="">
    <div class="hero-gradient"></div>

    <div class="top-bar">
      <div class="brand-wordmark">TeMix</div>
      <div class="top-tagline">Vairumtirdzniecība</div>
    </div>

    <div class="content-block">
      <h1 class="headline-serif">Sortiments, kas<br><em>pārdodas pats.</em></h1>
      <p class="body-lead">Dizains. Funkcija. Emocija. Trīs vārdi, pēc kuriem atlasām katru preci, pirms tā nonāk tavā plauktā.</p>
      <div class="cta-row">
        <div class="cta-gold">Katalogu šeit</div>
        <div class="cta-sub">Rīga · Eiropas piegādātāji · B2B partneriem</div>
      </div>
    </div>
  </div>
</body>
</html>
