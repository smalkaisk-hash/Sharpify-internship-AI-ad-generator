<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300;1,400;1,600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1080px; height:1080px; overflow:hidden; }
.ad { width:1080px; height:1080px; position:relative; overflow:hidden; background:#120a0e; }

/* Background glow layers */
.glow-1 {
  position:absolute; inset:0;
  background: radial-gradient(ellipse 80% 58% at 70% 20%, #3e1228 0%, transparent 65%);
}
.glow-2 {
  position:absolute; inset:0;
  background: radial-gradient(ellipse 55% 48% at 15% 85%, #281020 0%, transparent 58%);
}
.glow-3 {
  position:absolute; inset:0;
  background: radial-gradient(ellipse 40% 35% at 50% 50%, rgba(196,149,108,0.05) 0%, transparent 65%);
}

/* Concentric ring halos — centered slightly above middle */
.ring {
  position:absolute;
  border-radius:50%;
  top:50%; left:50%;
}
.ring-1 {
  width:940px; height:940px;
  transform:translate(-50%, -53%);
  border:1px solid rgba(196,149,108,0.09);
}
.ring-2 {
  width:680px; height:680px;
  transform:translate(-50%, -53%);
  border:1px solid rgba(196,149,108,0.07);
}
.ring-3 {
  width:440px; height:440px;
  transform:translate(-50%, -53%);
  border:1px solid rgba(196,149,108,0.05);
}

/* SVG decorative layer */
.deco {
  position:absolute; inset:0;
  width:100%; height:100%;
  z-index:2; pointer-events:none;
}

/* Horizontal gossamer lines */
.line {
  position:absolute; left:60px; right:60px; height:1px;
  background:linear-gradient(90deg, transparent 0%, rgba(196,149,108,0.20) 30%, rgba(196,149,108,0.20) 70%, transparent 100%);
  z-index:5;
}
.line-top  { top:172px; }
.line-lower { bottom:314px; }

/* Top bar */
.top {
  position:absolute; top:56px; left:60px; right:60px;
  display:flex; justify-content:space-between; align-items:center;
  z-index:10;
}
.tag {
  font-family:'DM Sans', sans-serif;
  font-size:11px; font-weight:400;
  color:rgba(196,149,108,0.60);
  text-transform:uppercase; letter-spacing:0.28em;
}
.logo-img {
  height:28px;
  filter:invert(1) brightness(2.0);
  mix-blend-mode:screen;
  opacity:0.85;
}

/* Center content block */
.center {
  position:absolute;
  top:50%; left:60px; right:60px;
  transform:translateY(-54%);
  text-align:center;
  z-index:10;
}
.overline {
  font-family:'DM Sans', sans-serif;
  font-size:11px; font-weight:400;
  color:rgba(196,149,108,0.65);
  text-transform:uppercase; letter-spacing:0.32em;
  margin-bottom:30px;
}
.headline {
  font-family:'Cormorant Garamond', serif;
  font-size:90px; line-height:0.91;
  font-weight:300; font-style:italic;
  color:#f6ede7;
  letter-spacing:-0.02em;
  margin-bottom:36px;
}
.headline em {
  font-style:italic;
  font-weight:600;
  color:#c4956c;
}
.rule {
  width:44px; height:1px;
  background:rgba(196,149,108,0.38);
  margin:0 auto 28px;
}
.body-text {
  font-family:'DM Sans', sans-serif;
  font-size:16px; font-weight:300; line-height:1.72;
  color:rgba(246,237,231,0.52);
}

/* Service chips row */
.chips {
  position:absolute; bottom:252px; left:60px; right:60px;
  display:flex; justify-content:center; gap:12px;
  z-index:10;
}
.chip {
  font-family:'DM Sans', sans-serif;
  font-size:11px; font-weight:500;
  color:rgba(196,149,108,0.78);
  text-transform:uppercase; letter-spacing:0.20em;
  padding:10px 24px; border-radius:30px;
  border:1px solid rgba(196,149,108,0.20);
  background:rgba(196,149,108,0.05);
  white-space:nowrap;
}

/* CTA */
.cta-wrap {
  position:absolute; bottom:150px; left:60px; right:60px;
  z-index:10;
}
.cta {
  display:block; width:100%;
  background:linear-gradient(135deg, #b07840 0%, #c4956c 55%, #d2a87a 100%);
  color:#120a0e;
  font-family:'DM Sans', sans-serif;
  font-size:20px; font-weight:600;
  padding:27px; border-radius:10px;
  text-align:center; letter-spacing:0.05em;
  box-shadow:0 8px 56px rgba(196,149,108,0.20);
}
</style>
</head>
<body>
<div class="ad">

  <!-- Background -->
  <div class="glow-1"></div>
  <div class="glow-2"></div>
  <div class="glow-3"></div>

  <!-- Concentric rings -->
  <div class="ring ring-1"></div>
  <div class="ring ring-2"></div>
  <div class="ring ring-3"></div>

  <!-- Decorative SVG: botanical curves + dots -->
  <svg class="deco" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg" fill="none">

    <!-- Top-right trailing arcs -->
    <path d="M680 -10 Q880 90, 1090 200" stroke="rgba(196,149,108,0.13)" stroke-width="1"/>
    <path d="M740 -10 Q930 105, 1090 245" stroke="rgba(196,149,108,0.08)" stroke-width="1"/>
    <path d="M800 -10 Q980 115, 1090 290" stroke="rgba(196,149,108,0.05)" stroke-width="1"/>

    <!-- Bottom-left trailing arcs -->
    <path d="M-10 840 Q90 950, 300 1090" stroke="rgba(196,149,108,0.10)" stroke-width="1"/>
    <path d="M-10 900 Q80 1000, 250 1090" stroke="rgba(196,149,108,0.06)" stroke-width="1"/>

    <!-- Top-left organic petal -->
    <path d="M -30 220 Q 100 60, 280 150 Q 170 290, -30 220 Z"
          fill="rgba(180,60,100,0.06)"/>
    <!-- Smaller inner petal TL -->
    <path d="M -30 240 Q 80 120, 210 190 Q 110 290, -30 240 Z"
          fill="rgba(196,149,108,0.04)"/>

    <!-- Bottom-right organic petal -->
    <path d="M 1110 860 Q 970 1010, 800 930 Q 910 790, 1110 860 Z"
          fill="rgba(180,60,100,0.05)"/>
    <path d="M 1110 900 Q 980 1020, 840 960 Q 940 840, 1110 900 Z"
          fill="rgba(196,149,108,0.03)"/>

    <!-- Cluster of fine dots — right mid -->
    <circle cx="928" cy="490" r="2.2" fill="rgba(196,149,108,0.28)"/>
    <circle cx="946" cy="510" r="1.6" fill="rgba(196,149,108,0.20)"/>
    <circle cx="914" cy="516" r="1.2" fill="rgba(196,149,108,0.16)"/>
    <circle cx="934" cy="530" r="1.0" fill="rgba(196,149,108,0.12)"/>

    <!-- Cluster of fine dots — left mid -->
    <circle cx="152" cy="608" r="2.0" fill="rgba(196,149,108,0.22)"/>
    <circle cx="138" cy="626" r="1.5" fill="rgba(196,149,108,0.16)"/>
    <circle cx="158" cy="638" r="1.0" fill="rgba(196,149,108,0.12)"/>

    <!-- Tiny cross marks -->
    <line x1="965" y1="330" x2="965" y2="338" stroke="rgba(196,149,108,0.22)" stroke-width="1"/>
    <line x1="961" y1="334" x2="969" y2="334" stroke="rgba(196,149,108,0.22)" stroke-width="1"/>
    <line x1="115" y1="750" x2="115" y2="758" stroke="rgba(196,149,108,0.18)" stroke-width="1"/>
    <line x1="111" y1="754" x2="119" y2="754" stroke="rgba(196,149,108,0.18)" stroke-width="1"/>
  </svg>

  <!-- Horizontal lines -->
  <div class="line line-top"></div>
  <div class="line line-lower"></div>

  <!-- Top bar -->
  <div class="top">
    <div class="tag">Skaistumkopšana · Rīga</div>
    <img class="logo-img"
         src="../277528316_6570558562983180_8124041327943958487_n.jpg"
         alt="mariposa">
  </div>

  <!-- Center content -->
  <div class="center">
    <div class="overline">Optimas Tehnoloģija</div>
    <div class="headline">
      Atjauno<br>
      savu ādu<br>
      pirms <em>vasaras</em>
    </div>
    <div class="rule"></div>
    <div class="body-text">
      Pigmentācija, apsārtums, nevēlams apmatojums —<br>
      problēma nav Tevī, bet izmantotajās metodēs.
    </div>
  </div>

  <!-- Service chips -->
  <div class="chips">
    <div class="chip">IPL</div>
    <div class="chip">RF mikro adatas</div>
    <div class="chip">Lāzerepilācija</div>
  </div>

  <!-- CTA -->
  <div class="cta-wrap">
    <div class="cta">Rezervē savu vizīti →</div>
  </div>

</div>
<script>document.fonts.ready.then(()=>{ document.title='fonts-ready'; });</script>
</body>
</html>
