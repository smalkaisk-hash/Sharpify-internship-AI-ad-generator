<!DOCTYPE html>
<html lang="lv"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1080px;height:1080px;font-family:'Inter',sans-serif;overflow:hidden}
  .ad{position:relative;width:1080px;height:1080px;background:linear-gradient(160deg,#0F1114 0%,#1A1D22 100%);overflow:hidden;padding:64px}
  .grid-bg{position:absolute;inset:0;background-image:linear-gradient(rgba(245,245,247,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(245,245,247,0.04) 1px,transparent 1px);background-size:60px 60px;pointer-events:none}
  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:72px;position:relative;z-index:2}
  .brand{font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:600;letter-spacing:4px;color:#F5F5F7}
  .chip{font-family:'Space Grotesk',sans-serif;font-size:11px;letter-spacing:3px;color:#0066FF;padding:8px 14px;border:1px solid rgba(0,102,255,0.4);border-radius:4px}
  .accent{position:relative;z-index:2;width:56px;height:3px;background:#0066FF;margin-bottom:24px}
  h1{position:relative;z-index:2;font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:68px;line-height:0.98;letter-spacing:-1px;color:#F5F5F7;margin-bottom:18px}
  .sub{position:relative;z-index:2;font-size:19px;color:rgba(245,245,247,0.65);margin-bottom:68px;max-width:640px}
  .stats{position:relative;z-index:2;display:grid;grid-template-columns:1fr 1fr 1fr;gap:2px;background:rgba(245,245,247,0.1);border:1px solid rgba(245,245,247,0.1)}
  .stat{background:#0F1114;padding:44px 30px;text-align:left}
  .stat .num{font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:82px;line-height:0.9;color:#F5F5F7;letter-spacing:-2px;margin-bottom:14px}
  .stat .num sup{font-size:36px;color:#0066FF;font-weight:500;vertical-align:super}
  .stat .lbl{font-family:'Inter';font-size:15px;color:rgba(245,245,247,0.7);line-height:1.35}
  .bottom{position:absolute;bottom:64px;left:64px;right:64px;display:flex;justify-content:space-between;align-items:center;z-index:2}
  .cta{display:inline-flex;align-items:center;gap:10px;padding:16px 28px;background:#F5F5F7;color:#0F1114;font-weight:600;font-size:15px;border-radius:4px}
  .meta{font-family:'Space Grotesk',sans-serif;font-size:11px;letter-spacing:3px;color:rgba(245,245,247,0.4);text-align:right}
</style></head>
<body><div class="ad">
  <div class="grid-bg"></div>
  <div class="top"><div class="brand">ALUSTAR</div><div class="chip">TRACK RECORD</div></div>
  <div class="accent"></div>
  <h1>Cipari, kas neslēpjas<br>aiz mārketinga.</h1>
  <div class="sub">19 gadus darbojamies tirgū — viens nosaukums, viena atbildība, viens komanda.</div>
  <div class="stats">
    <div class="stat"><div class="num">19</div><div class="lbl">GADI ZEM VIENA<br>REĢ. NR.</div></div>
    <div class="stat"><div class="num">200<sup>+</sup></div><div class="lbl">REALIZĒTI<br>PROJEKTI</div></div>
    <div class="stat"><div class="num">150<sup>k</sup></div><div class="lbl">M² BŪVĒTU<br>OBJEKTU</div></div>
  </div>
  <div class="bottom">
    <div class="cta">Skatīt projektus →</div>
    <div class="meta">RĪGA · EST. 2007</div>
  </div>
</div></body></html>
