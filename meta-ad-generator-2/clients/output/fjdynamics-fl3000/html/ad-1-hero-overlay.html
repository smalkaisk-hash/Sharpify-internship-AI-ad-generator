<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1080">
  <link rel="stylesheet" href="../../../../templates/base.css">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Figtree:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-primary: #0A0A0A;
      --color-secondary: #1A1A1A;
      --color-accent: #C6FF3D;
      --color-bg: #F5F5F3;
      --color-text: #FAFAF7;
      --font-heading: 'Space Grotesk', sans-serif;
      --font-body: 'Figtree', sans-serif;
    }
    html, body { width: 1080px; height: 1080px; overflow: hidden; }

    .ad-frame {
      position: relative;
      width: 1080px; height: 1080px;
      background: #000;
      overflow: hidden;
    }

    .hero-bg {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 62%;
      object-fit: cover;
      object-position: center center;
    }
    .hero-bottom-fade {
      position: absolute;
      top: 55%;
      left: 0; right: 0;
      bottom: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(5,5,5,0.85) 20%, #000 55%);
    }

    .hero-grad {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 62%;
      background: linear-gradient(
        180deg,
        rgba(0,0,0,0.4) 0%,
        rgba(0,0,0,0.1) 40%,
        rgba(0,0,0,0.7) 100%
      );
    }

    /* Top bar */
    .top-bar {
      position: absolute;
      top: 48px; left: 56px; right: 56px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }
    .brand-wordmark {
      font-family: var(--font-body);
      font-size: 26px;
      font-weight: 700;
      color: var(--color-text);
      letter-spacing: 0.02em;
    }
    .top-tag {
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: rgba(250,250,247,0.62);
    }

    /* Content */
    .content {
      position: absolute;
      left: 56px; right: 56px;
      bottom: 56px;
      z-index: 10;
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 24px;
    }
    .eyebrow::before {
      content: "";
      width: 44px; height: 2px;
      background: var(--color-accent);
    }
    .eyebrow-text {
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 600;
      color: var(--color-accent);
      letter-spacing: 0.32em;
      text-transform: uppercase;
    }

    .headline {
      font-family: var(--font-heading);
      font-size: 108px;
      font-weight: 500;
      line-height: 0.96;
      letter-spacing: -0.035em;
      color: var(--color-text);
      max-width: 920px;
    }
    .headline .lime {
      color: var(--color-accent);
    }

    .body-lead {
      font-family: var(--font-body);
      font-size: 24px;
      font-weight: 400;
      line-height: 1.5;
      color: rgba(250,250,247,0.75);
      max-width: 720px;
      margin-top: 22px;
    }

    .cta-row {
      display: flex;
      align-items: center;
      gap: 28px;
      margin-top: 30px;
    }
    .cta-lime {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 84px;
      min-width: 280px;
      padding: 0 44px;
      background: var(--color-accent);
      color: var(--color-primary);
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 20px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      border-radius: 48px;
      flex-shrink: 0;
    }
    .spec-chips {
      font-family: var(--font-body);
      font-size: 15px;
      color: rgba(250,250,247,0.58);
      letter-spacing: 0.08em;
    }
  </style>
</head>
<body>
  <div class="ad-frame">
    <img class="hero-bg" src="../brief/images/hero-1.webp" alt="">
    <div class="hero-grad"></div>
    <div class="hero-bottom-fade"></div>

    <div class="top-bar">
      <div class="brand-wordmark">FJDynamics</div>
      <div class="top-tag">FL3000 · LiDAR Robotic Mower</div>
    </div>

    <div class="content">
      <div class="eyebrow"><span class="eyebrow-text">No wire · No RTK</span></div>
      <h1 class="headline">See Further.<br><span class="lime">Mow Smarter.</span></h1>
      <p class="body-lead">LiDAR + vision navigation. 3,000 m² on a single charge. Setup in 10 minutes — not a weekend.</p>
      <div class="cta-row">
        <div class="cta-lime">Shop Now</div>
        <div class="spec-chips">3,000 m² · 180 min · 33° · IPX5</div>
      </div>
    </div>
  </div>
</body>
</html>
