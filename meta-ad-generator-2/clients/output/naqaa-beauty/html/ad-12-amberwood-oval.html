<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1080">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{width:1080px;height:1080px;overflow:hidden}
    body{font-family:'Inter',sans-serif}
    .ad{width:1080px;height:1080px;position:relative;overflow:hidden}
    .bg{position:absolute;inset:0}
    .bg img{width:100%;height:100%;object-fit:cover}
    .vignette{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 30%,rgba(52,28,12,0.6) 100%)}
    /* Outer frame */
    .outer{position:absolute;inset:48px;border:1.5px solid rgba(245,230,211,0.5);padding:40px;display:flex;flex-direction:column;align-items:center}
    .top-tag{font-family:'Inter',sans-serif;font-size:12px;font-weight:700;letter-spacing:0.34em;color:#F5E6D3;text-transform:uppercase;text-align:center}
    .top-rule{width:80px;height:1px;background:#F5E6D3;margin:16px auto 28px;opacity:0.6}
    /* Oval product frame */
    .oval{position:relative;width:520px;height:660px;border-radius:50%;overflow:visible;margin-top:8px;display:flex;align-items:center;justify-content:center}
    .oval-frame{position:absolute;inset:0;border-radius:50%;border:2.5px solid #D4A93A;box-shadow:0 0 0 1px rgba(245,230,211,0.2) inset,0 30px 80px rgba(0,0,0,0.4)}
    .oval-inner{position:absolute;inset:18px;border-radius:50%;background:radial-gradient(ellipse at center,rgba(181,130,50,0.9) 0%,rgba(92,55,20,0.95) 100%);overflow:hidden;display:flex;align-items:center;justify-content:center}
    .oval-inner img{height:520px;width:auto;filter:drop-shadow(0 14px 40px rgba(0,0,0,0.5))}
    /* Headline below */
    .headline-zone{margin-top:36px;text-align:center}
    .headline{font-family:'Playfair Display',serif;font-size:56px;font-weight:400;color:#F5E6D3;line-height:1;letter-spacing:-0.01em}
    .subline{font-family:'Playfair Display',serif;font-style:italic;font-size:24px;color:#F5E6D3;margin-top:12px;font-weight:400;opacity:0.9;text-shadow:0 2px 10px rgba(0,0,0,0.5)}
    /* Footer */
    .footer{position:absolute;left:48px;right:48px;bottom:48px;display:flex;justify-content:space-between;align-items:center;padding:0 40px;height:80px}
    .price{font-family:'Playfair Display',serif;font-size:44px;color:#F5E6D3;font-weight:500}
    .cta{padding:18px 36px;background:#D4A93A;color:#1A1A0A;font-family:'Inter',sans-serif;font-size:14px;font-weight:700;letter-spacing:0.24em;text-transform:uppercase}
  </style>
</head>
<body>
  <div class="ad">
    <div class="bg"><img src="file:///C:/Users/Ritvars Volfs/meta-ad-generator-v2/meta-ad-generator/clients/output/naqaa-beauty/brief/images/backgrounds/bg-amber-marble.png"></div>
    <div class="vignette"></div>
    <div class="outer">
      <div class="top-tag">Vitamīnu dušas filtrs</div>
      <div class="top-rule"></div>
      <div class="oval">
        <div class="oval-inner">
          <img src="file:///C:/Users/Ritvars Volfs/meta-ad-generator-v2/meta-ad-generator/clients/output/naqaa-beauty/brief/images/cutouts/product-amberwood-with-box-cutout.png">
        </div>
        <div class="oval-frame"></div>
      </div>
      <div class="headline-zone">
        <div class="headline">Amberwood</div>
        <div class="subline">silta koka un dzintara nots</div>
      </div>
    </div>
    <div class="footer">
      <div class="price">34,99 €</div>
      <div class="cta">Iepirkties</div>
    </div>
  </div>
</body>
</html>
