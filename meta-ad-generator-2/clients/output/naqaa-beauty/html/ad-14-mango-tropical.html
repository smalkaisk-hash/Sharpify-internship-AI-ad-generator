<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1080">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{width:1080px;height:1080px;overflow:hidden}
    body{font-family:'Inter',sans-serif;background:#E5A852}
    .ad{width:1080px;height:1080px;padding:52px;position:relative}
    .frame{width:100%;height:100%;border:1.5px solid rgba(250,246,240,0.55);padding:28px;display:flex;flex-direction:column}
    /* Header */
    .top{display:flex;justify-content:space-between;align-items:center;padding-bottom:22px}
    .tag{font-family:'Inter',sans-serif;font-size:12px;font-weight:700;letter-spacing:0.32em;color:#FAF6F0;text-transform:uppercase}
    .brand{font-family:'Playfair Display',serif;font-style:italic;font-size:22px;color:#FAF6F0}
    /* Hero photo */
    .photo{flex:1;position:relative;overflow:hidden;border:1.5px solid #FAF6F0;background:#000}
    .photo img{width:100%;height:100%;object-fit:cover;display:block}
    .headline{position:absolute;left:40px;right:40px;bottom:56px;color:#FAF6F0}
    .h-main{font-family:'Playfair Display',serif;font-size:88px;font-weight:400;line-height:0.95;letter-spacing:-0.01em;text-shadow:0 4px 24px rgba(0,0,0,0.5)}
    .h-sub{font-family:'Playfair Display',serif;font-style:italic;font-size:24px;margin-top:14px;text-shadow:0 2px 10px rgba(0,0,0,0.6)}
    /* Bottom bar */
    .bot{margin-top:22px;display:flex;justify-content:space-between;align-items:center;padding:10px 14px}
    .bot-left{display:flex;flex-direction:column;gap:4px}
    .bot-scent{font-family:'Playfair Display',serif;font-size:32px;font-weight:500;color:#FAF6F0;line-height:1}
    .bot-note{font-family:'Inter',sans-serif;font-size:13px;font-weight:500;color:#FAF6F0;opacity:0.85;letter-spacing:0.05em}
    .bot-right{display:flex;align-items:center;gap:18px}
    .price{font-family:'Playfair Display',serif;font-size:36px;font-weight:600;color:#FAF6F0}
    .cta{padding:16px 30px;background:#1A1A2E;color:#FAF6F0;font-family:'Inter',sans-serif;font-size:13px;font-weight:700;letter-spacing:0.24em;text-transform:uppercase}
  </style>
</head>
<body>
  <div class="ad">
    <div class="frame">
      <div class="top">
        <div class="tag">Mango Rain · Vitamīnu dušas filtrs</div>
        <div class="brand">Naqaa Beauty</div>
      </div>
      <div class="photo">
        <img src="file:///C:/Users/Ritvars Volfs/meta-ad-generator-v2/meta-ad-generator/clients/output/naqaa-beauty/brief/images/backgrounds/bg-mango-hand-tropical.png">
        <div class="headline">
          <div class="h-main">Tropu dušas<br>rituāls.</div>
          <div class="h-sub">mango, saule un tīrs ūdens — mājās</div>
        </div>
      </div>
      <div class="bot">
        <div class="bot-left">
          <div class="bot-scent">Mango Rain</div>
          <div class="bot-note">Filtrē hloru · 2–3 mēneši · Dermatoloģiski pārbaudīts</div>
        </div>
        <div class="bot-right">
          <div class="price">34,99 €</div>
          <div class="cta">Iepirkties</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
