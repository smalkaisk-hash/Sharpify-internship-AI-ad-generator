  <style>

    .product img{height:480px;width:auto;filter:drop-shadow(10px -5px 30px rgba(0,0,0,0.4))}

    .reviewer{font-family:'Montserrat',sans-serif;font-size:20px;font-weight:600;color:rgba(255,255,255,0.5);margin-bottom:8px}
