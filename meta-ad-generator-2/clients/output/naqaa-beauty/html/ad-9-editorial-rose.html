<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1080">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{width:1080px;height:1080px;overflow:hidden}
    body{font-family:'Inter',sans-serif;background:#F5E6D3}
    .ad{width:1080px;height:1080px;padding:56px;position:relative}
    /* Inner frame w/ hairline gold border */
    .frame{width:100%;height:100%;border:1.5px solid #8B7D3C;background:#FAF6F0;padding:40px;display:flex;flex-direction:column}
    .top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}
    .brand{font-family:'Playfair Display',serif;font-style:italic;font-size:26px;color:#8B7D3C;letter-spacing:0.04em}
    .issue{font-family:'Inter',sans-serif;font-size:13px;font-weight:600;color:#8B7D3C;text-transform:uppercase;letter-spacing:0.22em}
    /* Photo card */
    .photo{position:relative;flex:1;border-radius:2px;overflow:hidden;box-shadow:0 14px 40px rgba(139,125,60,0.2)}
    .photo img{width:100%;height:100%;object-fit:cover;display:block}
    .category-tag{position:absolute;top:28px;left:28px;padding:10px 18px;background:rgba(250,246,240,0.92);font-size:12px;font-weight:700;letter-spacing:0.26em;color:#8B7D3C;text-transform:uppercase}
    .headline{position:absolute;left:40px;bottom:96px;font-family:'Playfair Display',serif;font-size:96px;font-weight:400;color:#FAF6F0;line-height:0.95;letter-spacing:-0.01em;text-shadow:0 4px 24px rgba(0,0,0,0.35)}
    .subline{position:absolute;left:40px;bottom:48px;font-family:'Playfair Display',serif;font-style:italic;font-size:26px;color:#FAF6F0;font-weight:400;text-shadow:0 2px 12px rgba(0,0,0,0.5)}
    /* Bottom bar */
    .bot{margin-top:26px;display:flex;justify-content:space-between;align-items:flex-end}
    .bot-left{display:flex;flex-direction:column;gap:4px}
    .benefit{font-family:'Inter',sans-serif;font-size:14px;font-weight:500;color:#5C4A1E;letter-spacing:0.04em}
    .price{font-family:'Playfair Display',serif;font-size:44px;color:#1A1A2E;font-weight:600;margin-top:2px}
    .cta{padding:18px 36px;background:#1A1A2E;color:#F5E6D3;font-family:'Inter',sans-serif;font-size:15px;font-weight:600;letter-spacing:0.24em;text-transform:uppercase}
  </style>
</head>
<body>
  <div class="ad">
    <div class="frame">
      <div class="top-bar">
        <div class="brand">Naqaa Beauty</div>
        <div class="issue">№ 01 — Rose Edition</div>
      </div>
      <div class="photo">
        <img src="file:///C:/Users/Ritvars Volfs/meta-ad-generator-v2/meta-ad-generator/clients/output/naqaa-beauty/brief/images/backgrounds/bg-rose-shower-editorial.png" alt="">
        <div class="category-tag">Vitamīnu dušas filtrs</div>
        <div class="headline">Precious<br>Rose</div>
        <div class="subline">Katra duša — rituāls.</div>
      </div>
      <div class="bot">
        <div class="bot-left">
          <div class="benefit">Dermatoloģiski pārbaudīts · 2–3 mēneši vienai filtrai</div>
          <div class="price">34,99 €</div>
        </div>
        <div class="cta">Iepirkties</div>
      </div>
    </div>
  </div>
</body>
</html>
