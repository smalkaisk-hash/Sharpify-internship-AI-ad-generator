<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1080">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{width:1080px;height:1080px;overflow:hidden}
    .ad{width:1080px;height:1080px;position:relative;overflow:hidden}
    .bg{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}
    /* Dark overlay heavier on left (dirty), lighter on right (clean) */
    .overlay{position:absolute;top:0;left:0;width:100%;height:100%;background:linear-gradient(180deg,rgba(0,0,0,0.55) 0%,rgba(0,0,0,0.2) 40%,rgba(0,0,0,0.2) 60%,rgba(0,0,0,0.7) 100%)}
    /* Labels on the split */
    .label-before{position:absolute;top:36px;left:36px;z-index:4;padding:14px 28px;background:rgba(231,76,60,0.85);border-radius:10px;font-family:'Montserrat',sans-serif;font-size:28px;font-weight:800;color:#FFF;text-transform:uppercase}
    .label-after{position:absolute;top:36px;right:36px;z-index:4;padding:14px 28px;background:rgba(46,204,113,0.85);border-radius:10px;font-family:'Montserrat',sans-serif;font-size:28px;font-weight:800;color:#FFF;text-transform:uppercase}
    /* Product overlaid center — the solution between the two worlds */
    .product{position:absolute;bottom:140px;left:50%;transform:translateX(-50%);z-index:3}
    .product img{height:560px;width:auto;filter:drop-shadow(0 10px 50px rgba(0,0,0,0.5))}
    /* Bottom text */
    .bot{position:absolute;bottom:0;left:0;right:0;z-index:4;padding:28px 48px;background:linear-gradient(180deg,transparent,rgba(0,0,0,0.85));display:flex;align-items:center;justify-content:space-between}
    .bot-left{max-width:600px}
    .tag{font-family:'Montserrat',sans-serif;font-size:18px;font-weight:800;color:#2ECC71;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:6px}
    .h1{font-family:'Montserrat',sans-serif;font-size:48px;font-weight:900;color:#FFF;line-height:1.05}
    .price{font-family:'Montserrat',sans-serif;font-size:48px;font-weight:900;color:#FFF}
  </style>
</head>
<body>
  <div class="ad">
    <img class="bg" src="file:///C:/Users/Ritvars Volfs/meta-ad-generator-v2/meta-ad-generator/output/naqaa-beauty/brief/images/backgrounds/bg-dirty-vs-clean.png" alt="">
    <div class="overlay"></div>
    <div class="label-before">Bez filtra</div>
    <div class="label-after">Ar filtru</div>
    <div class="product">
      <img src="file:///C:/Users/Ritvars Volfs/meta-ad-generator-v2/meta-ad-generator/output/naqaa-beauty/brief/images/cutouts/product-precious-rose-with-box-cutout.png" alt="">
    </div>
    <div class="bot">
      <div class="bot-left">
        <div class="tag">Vitamīnu dušas filtrs</div>
        <div class="h1">Tavs ūdens. Tava āda. Tava izvēle.</div>
      </div>
      <div class="price">34,99€</div>
    </div>
  </div>
</body>
</html>
