<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1080">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{width:1080px;height:1080px;overflow:hidden}
    .ad{width:1080px;height:1080px;position:relative;overflow:hidden}
    .bg{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}
    .overlay{position:absolute;top:0;left:0;width:100%;height:100%;background:linear-gradient(180deg,rgba(0,0,0,0.4) 0%,rgba(0,0,0,0.1) 30%,rgba(0,0,0,0.1) 50%,rgba(0,0,0,0.65) 80%,rgba(0,0,0,0.85) 100%)}
    /* Top — big bold headline */
    .top{position:absolute;top:44px;left:0;right:0;text-align:center;z-index:4}
    .tag{font-family:'Montserrat',sans-serif;font-size:22px;font-weight:800;color:#B8960C;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:12px;padding:12px 28px;background:rgba(0,0,0,0.4);backdrop-filter:blur(8px);border-radius:8px;display:inline-block}
    .h1{font-family:'Montserrat',sans-serif;font-size:72px;font-weight:900;color:#FFF;line-height:1.0;text-shadow:0 4px 30px rgba(0,0,0,0.5)}
    /* Product — bottom center, massive with box */
    .product{position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);z-index:3}
    .product img{height:580px;width:auto;filter:drop-shadow(0 -10px 50px rgba(0,0,0,0.4))}
    /* Bottom bar */
    .bot{position:absolute;bottom:0;left:0;right:0;z-index:4;padding:24px 48px;display:flex;align-items:center;justify-content:space-between}
    .pills{display:flex;gap:12px}
    .pill{padding:10px 22px;background:rgba(255,255,255,0.1);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.15);border-radius:50px;font-family:'Montserrat',sans-serif;font-size:18px;font-weight:700;color:#FFF}
    .price{font-family:'Montserrat',sans-serif;font-size:48px;font-weight:900;color:#B8960C;text-shadow:0 4px 20px rgba(0,0,0,0.4)}
  </style>
</head>
<body>
  <div class="ad">
    <img class="bg" src="file:///C:/Users/Ritvars Volfs/meta-ad-generator-v2/meta-ad-generator/output/naqaa-beauty/brief/images/backgrounds/bg-luxury-bathroom.png" alt="">
    <div class="overlay"></div>
    <div class="top">
      <div class="tag">Vitamīnu dušas filtrs</div>
      <div class="h1">Spa sajūta<br>katrā dušā.</div>
    </div>
    <div class="product">
      <img src="file:///C:/Users/Ritvars Volfs/meta-ad-generator-v2/meta-ad-generator/output/naqaa-beauty/brief/images/cutouts/product-amberwood-with-box-cutout.png" alt="">
    </div>
    <div class="bot">
      <div class="pills">
        <span class="pill">Bez hlora</span>
        <span class="pill">Vitamīni</span>
        <span class="pill">4 aromāti</span>
      </div>
      <div class="price">34,99€</div>
    </div>
  </div>
</body>
</html>
