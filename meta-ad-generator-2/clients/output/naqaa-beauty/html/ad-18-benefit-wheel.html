<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1080">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{width:1080px;height:1080px;overflow:hidden}
    body{font-family:'Inter',sans-serif;background:#F5E6D3}
    .ad{width:1080px;height:1080px;padding:56px;position:relative}
    .frame{width:100%;height:100%;border:1.5px solid #8B7D3C;background:#FAF6F0;padding:42px;display:flex;flex-direction:column;position:relative}
    .header{text-align:center;padding-bottom:18px}
    .tag{font-family:'Inter',sans-serif;font-size:12px;font-weight:700;letter-spacing:0.32em;color:#8B7D3C;text-transform:uppercase}
    .rule{width:40px;height:1px;background:#8B7D3C;margin:16px auto 14px;opacity:0.6}
    .title{font-family:'Playfair Display',serif;font-size:52px;font-weight:400;color:#1A1A2E;line-height:1;letter-spacing:-0.01em}
    .sub{font-family:'Playfair Display',serif;font-style:italic;font-size:20px;color:#6B5B3E;margin-top:10px}
    /* Wheel */
    .wheel{flex:1;position:relative;display:flex;align-items:center;justify-content:center}
    /* Product center */
    .center{position:absolute;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,#F5E6D3,#E8D5B8);display:flex;align-items:center;justify-content:center;border:2px solid #8B7D3C;z-index:2;box-shadow:0 0 0 10px #FAF6F0,0 0 0 12px rgba(139,125,60,0.3),0 20px 40px rgba(139,125,60,0.2)}
    .center img{height:540px;width:auto;filter:drop-shadow(0 14px 28px rgba(0,0,0,0.3));position:relative;z-index:3}
    /* 4 Badges */
    .badge{position:absolute;width:200px;padding:18px 18px;background:#FAF6F0;border:1.5px solid #8B7D3C;text-align:center;z-index:3;box-shadow:0 8px 20px rgba(139,125,60,0.15)}
    .badge-icon{font-family:'Playfair Display',serif;font-size:34px;font-weight:500;color:#8B7D3C;line-height:1}
    .badge-label{font-family:'Inter',sans-serif;font-size:11px;font-weight:700;letter-spacing:0.24em;color:#6B5B3E;text-transform:uppercase;margin-top:8px}
    .b-tl{top:24px;left:36px}
    .b-tr{top:24px;right:36px}
    .b-bl{bottom:24px;left:36px}
    .b-br{bottom:24px;right:36px}
    /* Footer */
    .footer{display:flex;justify-content:space-between;align-items:center;padding-top:22px;border-top:1px solid rgba(139,125,60,0.4)}
    .footer-label{font-family:'Inter',sans-serif;font-size:11px;font-weight:700;letter-spacing:0.26em;color:#8B7D3C;text-transform:uppercase}
    .footer-price{font-family:'Playfair Display',serif;font-size:36px;font-weight:600;color:#1A1A2E;line-height:1}
    .cta{padding:16px 30px;background:#1A1A2E;color:#F5E6D3;font-family:'Inter',sans-serif;font-size:13px;font-weight:700;letter-spacing:0.24em;text-transform:uppercase}
  </style>
</head>
<body>
  <div class="ad">
    <div class="frame">
      <div class="header">
        <div class="tag">Vitamīnu dušas filtrs</div>
        <div class="rule"></div>
        <div class="title">Kas tavā dušā patiešām notiek</div>
        <div class="sub">4 izmaiņas, ko jūt jau pirmajā nedēļā</div>
      </div>
      <div class="wheel">
        <div class="badge b-tl">
          <div class="badge-icon">−90%</div>
          <div class="badge-label">Hlors filtrēts</div>
        </div>
        <div class="badge b-tr">
          <div class="badge-icon">E + C</div>
          <div class="badge-label">Vitamīni ādai</div>
        </div>
        <div class="center">
          <img src="file:///C:/Users/Ritvars Volfs/meta-ad-generator-v2/meta-ad-generator/clients/output/naqaa-beauty/brief/images/cutouts/product-precious-rose-with-box-cutout.png">
        </div>
        <div class="badge b-bl">
          <div class="badge-icon">4</div>
          <div class="badge-label">Aromāti · rituāli</div>
        </div>
        <div class="badge b-br">
          <div class="badge-icon">2–3 mēn</div>
          <div class="badge-label">Viens filtrs kalpo</div>
        </div>
      </div>
      <div class="footer">
        <div>
          <div class="footer-label">Precious Rose · no</div>
          <div class="footer-price">34,99 €</div>
        </div>
        <div class="cta">Iepirkties</div>
      </div>
    </div>
  </div>
</body>
</html>
