<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920">
<link rel="stylesheet" href="../../../templates/base-mockup.css">
<style>
:root {
  --mockup-accent: #10b981;
  --mockup-bg: #0a1628;
  --mockup-bg-end: #162033;
}
html, body { width: 1920px; height: 1080px; overflow: hidden; }
body {
  background: linear-gradient(155deg, var(--mockup-bg) 0%, #0c1222 50%, var(--mockup-bg-end) 100%);
  display: flex; align-items: center;
  position: relative;
}

.glow-1 {
  width: 600px; height: 600px; top: -80px; right: 400px;
  position: absolute; border-radius: 50%;
  background: var(--mockup-accent); opacity: 0.06; filter: blur(120px); pointer-events: none;
}

.text-section {
  width: 520px; padding-left: 100px; z-index: 2;
}
.text-section .mockup-badge { margin-bottom: 22px; font-size: 15px; }
.text-section .mockup-headline {
  font-family: var(--font-heading);
  font-weight: 900; font-size: 52px; line-height: 1.08;
  color: #fff; margin-bottom: 18px;
}
.text-section .mockup-headline .accent { color: var(--mockup-accent); }
.text-section .mockup-subheadline {
  font-family: var(--font-body);
  font-size: 18px; color: #94a3b8; line-height: 1.55;
  margin-bottom: 28px; max-width: 400px;
}

.features {
  display: flex; flex-direction: column; gap: 14px;
  margin-bottom: 36px;
}
.feature {
  display: flex; align-items: center; gap: 12px;
  font-family: var(--font-body); font-size: 20px; color: #cbd5e1;
}
.feature-icon {
  width: 36px; height: 36px; border-radius: 8px;
  background: rgba(16, 185, 129, 0.15);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; flex-shrink: 0;
}
.cta-btn {
  display: inline-block;
  background: var(--mockup-accent); color: #000;
  padding: 20px 48px; border-radius: 14px;
  font-weight: 800; font-size: 22px;
  font-family: var(--font-body);
  box-shadow: 0 8px 32px rgba(16, 185, 129, 0.3);
}

.browser-section {
  flex: 1; display: flex; align-items: center; justify-content: center;
  padding-right: 60px; z-index: 2;
}
.browser-section .device-browser {
  width: 880px;
  transform: perspective(1200px) rotateY(-6deg) rotateX(2deg);
}
.browser-section .device-browser .device-screen img {
  height: 520px;
}
</style>
</head>
<body>
  <div class="glow-1"></div>

  <div class="text-section">
    <div class="mockup-badge">Sport Factory</div>
    <div class="mockup-headline">
      Moderna<br>
      <span class="accent">mājaslapa</span><br>
      sportam.
    </div>
    <div class="mockup-subheadline">
      Pilnībā responsīva mājaslapa ar integrētu kontaktu formu un SEO optimizāciju.
    </div>

    <div class="features">
      <div class="feature"><div class="feature-icon">📱</div> Responsīvs dizains</div>
      <div class="feature"><div class="feature-icon">⚡</div> Ātra ielāde</div>
      <div class="feature"><div class="feature-icon">🔍</div> SEO optimizēta</div>
      <div class="feature"><div class="feature-icon">📋</div> Kontaktu forma</div>
    </div>

    <div class="cta-btn">Sākt projektu →</div>
  </div>

  <div class="browser-section">
    <div class="device-browser">
      <div class="browser-chrome">
        <div class="browser-dots"><span></span><span></span><span></span></div>
        <div class="browser-url">sportfactory.lv</div>
      </div>
      <div class="device-screen">
        <img src="../../../../portfolio-sportfactory.png" alt="Sport Factory">
      </div>
    </div>
  </div>
</body>
</html>
