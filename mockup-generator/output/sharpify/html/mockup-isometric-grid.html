<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920">
<link rel="stylesheet" href="../../../templates/base-mockup.css">
<style>
:root {
  --mockup-accent: #10b981;
  --mockup-bg: #0a1628;
  --mockup-bg-end: #162033;
}
html, body { width: 1920px; height: 1080px; overflow: hidden; }
body {
  background: linear-gradient(155deg, var(--mockup-bg) 0%, #0c1222 50%, var(--mockup-bg-end) 100%);
  display: flex; align-items: center; justify-content: center;
  position: relative;
}

.glow-1 {
  width: 900px; height: 900px; top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  position: absolute; border-radius: 50%;
  background: var(--mockup-accent); opacity: 0.05; filter: blur(150px); pointer-events: none;
}

.iso-container {
  transform: perspective(2000px) rotateX(35deg) rotateZ(-40deg);
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 40px;
  z-index: 2;
}

.iso-container .device-browser {
  width: 560px;
  box-shadow: 30px 30px 60px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.03);
}
.iso-container .device-browser .device-screen img {
  height: 340px;
}

.headline-area {
  position: absolute; top: 50px; left: 80px; z-index: 10;
}
.headline-area .mockup-badge { margin-bottom: 14px; }
.headline-area .mockup-headline { font-size: 48px; }
.headline-area .mockup-headline .accent { color: var(--mockup-accent); }

.cta-area {
  position: absolute; bottom: 50px; right: 80px; z-index: 10;
}
.cta-btn {
  display: inline-block;
  background: var(--mockup-accent); color: #000;
  padding: 18px 44px; border-radius: 14px;
  font-weight: 800; font-size: 20px;
  font-family: var(--font-body);
  box-shadow: 0 8px 32px rgba(16, 185, 129, 0.3);
}
</style>
</head>
<body>
  <div class="glow-1"></div>

  <div class="headline-area">
    <div class="mockup-badge">Sharpify Portfolio</div>
    <div class="mockup-headline">
      Mūsu klientu<br>
      <span class="accent">mājaslapas</span>
    </div>
  </div>

  <div class="iso-container">
    <div class="device-browser">
      <div class="browser-chrome">
        <div class="browser-dots"><span></span><span></span><span></span></div>
        <div class="browser-url">sportfactory.lv</div>
      </div>
      <div class="device-screen">
        <img src="../../../../portfolio-sportfactory.png" alt="Sport Factory">
      </div>
    </div>

    <div class="device-browser">
      <div class="browser-chrome">
        <div class="browser-dots"><span></span><span></span><span></span></div>
        <div class="browser-url">mryeti.lv</div>
      </div>
      <div class="device-screen">
        <img src="../../../../portfolio-mryeti.png" alt="MrYeti">
      </div>
    </div>

    <div class="device-browser">
      <div class="browser-chrome">
        <div class="browser-dots"><span></span><span></span><span></span></div>
        <div class="browser-url">vaditajuskola.lv</div>
      </div>
      <div class="device-screen">
        <img src="../../../../vaditajuskola-hero.png" alt="Vaditaju Skola">
      </div>
    </div>

    <div class="device-browser">
      <div class="browser-chrome">
        <div class="browser-dots"><span></span><span></span><span></span></div>
        <div class="browser-url">sharpify.lv</div>
      </div>
      <div class="device-screen">
        <img src="../../../../sharpify-full.png" alt="Sharpify">
      </div>
    </div>
  </div>

  <div class="cta-area">
    <div class="cta-btn">Pasūtīt mājaslapu →</div>
  </div>
</body>
</html>
