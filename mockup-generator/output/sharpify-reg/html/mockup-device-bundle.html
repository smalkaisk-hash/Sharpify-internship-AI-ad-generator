<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body { width: 1920px; height: 1080px; overflow: hidden; }
body {
  background: linear-gradient(160deg, #080e1a 0%, #0d1525 40%, #111d33 100%);
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* === Ambient lighting === */
.glow {
  position: absolute; border-radius: 50%;
  pointer-events: none;
}
.glow-top {
  width: 1000px; height: 600px;
  top: -200px; left: 50%; transform: translateX(-50%);
  background: radial-gradient(ellipse, rgba(16,185,129,0.08) 0%, transparent 70%);
}
.glow-left {
  width: 500px; height: 500px;
  bottom: -100px; left: 100px;
  background: radial-gradient(ellipse, rgba(59,130,246,0.05) 0%, transparent 70%);
}
.glow-right {
  width: 400px; height: 400px;
  top: 100px; right: 100px;
  background: radial-gradient(ellipse, rgba(139,92,246,0.04) 0%, transparent 70%);
}

/* === Device cluster — everything centered === */
.cluster {
  position: relative;
  width: 1700px;
  height: 950px;
}

/* ==============================
   LARGE MONITOR — back center, the anchor
   ============================== */
.dev-monitor {
  position: absolute;
  top: 20px;
  left: 50%; transform: translateX(-50%);
  z-index: 1;
}
.mon-bezel {
  width: 780px; height: 488px;
  background: #111;
  border-radius: 14px 14px 0 0;
  border: 4px solid #2a2a2a;
  padding: 8px;
  box-shadow: 0 30px 80px rgba(0,0,0,0.5);
}
.mon-screen {
  width: 100%; height: 100%;
  border-radius: 6px;
  overflow: hidden; background: #fff;
}
.mon-screen img { width: 100%; height: 100%; object-fit: cover; object-position: top center; display: block; }
.mon-chin {
  width: 780px; height: 28px;
  background: linear-gradient(180deg, #2a2a2a, #1e1e1e);
  border-radius: 0 0 6px 6px;
  display: flex; align-items: center; justify-content: center;
}
.mon-chin .dot { width: 8px; height: 8px; border-radius: 50%; background: #3a3a3a; }
.mon-neck { width: 60px; height: 35px; background: linear-gradient(90deg, #2a2a2a, #3a3a3a, #2a2a2a); margin: 0 auto; }
.mon-base { width: 180px; height: 10px; background: #2a2a2a; border-radius: 6px; margin: 0 auto; }

/* ==============================
   LAPTOP — front-left, overlapping monitor
   ============================== */
.dev-laptop {
  position: absolute;
  bottom: 50px; left: 80px;
  z-index: 3;
}
.lap-bezel {
  width: 560px; height: 350px;
  background: #111;
  border-radius: 10px 10px 0 0;
  border: 3px solid #2a2a2a;
  padding: 6px 6px 0 6px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}
.lap-screen {
  width: 100%; height: 100%;
  border-radius: 4px 4px 0 0;
  overflow: hidden; background: #fff;
}
.lap-screen img { width: 100%; height: 100%; object-fit: cover; object-position: top center; display: block; }
.lap-base {
  width: 636px; height: 14px;
  background: linear-gradient(180deg, #333, #252525);
  border-radius: 0 0 8px 8px;
  margin-left: -38px;
  position: relative;
}
.lap-base::before {
  content: '';
  width: 150px; height: 4px;
  background: #444;
  border-radius: 0 0 4px 4px;
  position: absolute; top: 0;
  left: 50%; transform: translateX(-50%);
}

/* ==============================
   TABLET — right side, overlapping monitor
   ============================== */
.dev-tablet {
  position: absolute;
  top: 100px; right: 100px;
  z-index: 2;
}
.tab-bezel {
  width: 340px; height: 460px;
  background: #111;
  border-radius: 22px;
  border: 3px solid #2a2a2a;
  padding: 10px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.45);
  position: relative;
}
.tab-screen {
  width: 100%; height: 100%;
  border-radius: 14px;
  overflow: hidden; background: #fff;
}
.tab-screen img { width: 100%; height: 100%; object-fit: cover; object-position: top center; display: block; }
.tab-indicator {
  width: 70px; height: 4px;
  background: #444; border-radius: 2px;
  position: absolute; bottom: 6px;
  left: 50%; transform: translateX(-50%);
}

/* ==============================
   PHONE 1 — front-right, overlapping tablet & laptop
   ============================== */
.dev-phone-1 {
  position: absolute;
  bottom: 80px; right: 240px;
  z-index: 5;
}
.ph-bezel {
  width: 220px; height: 452px;
  background: #111;
  border-radius: 36px;
  border: 3px solid #2a2a2a;
  padding: 8px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.5);
}
.ph-screen {
  width: 100%; height: 100%;
  border-radius: 28px;
  overflow: hidden; background: #fff;
  position: relative;
}
.ph-notch {
  width: 80px; height: 20px;
  background: #111;
  border-radius: 0 0 12px 12px;
  margin: 0 auto;
  position: relative; z-index: 2;
}
.ph-screen img { width: 100%; height: calc(100% - 20px); object-fit: cover; object-position: top center; display: block; }

/* ==============================
   PHONE 2 — smaller, behind phone 1, more left
   ============================== */
.dev-phone-2 {
  position: absolute;
  bottom: 120px; right: 420px;
  z-index: 4;
}
.dev-phone-2 .ph-bezel {
  width: 190px; height: 390px;
  border-radius: 32px;
}
.dev-phone-2 .ph-screen { border-radius: 24px; }
.dev-phone-2 .ph-notch { width: 70px; height: 18px; }
.dev-phone-2 .ph-screen img { height: calc(100% - 18px); }

/* ==============================
   BOOK MOCKUP — far left, behind laptop
   ============================== */
.dev-book {
  position: absolute;
  bottom: 80px; left: 30px;
  z-index: 2;
  transform-style: preserve-3d;
  perspective: 1000px;
}
.book-cover {
  width: 200px; height: 280px;
  transform: rotateY(-15deg);
  transform-style: preserve-3d;
  box-shadow: 15px 8px 40px rgba(0,0,0,0.5);
  position: relative;
}
.book-front {
  width: 100%; height: 100%;
  background: #fff;
  border-radius: 3px 6px 6px 3px;
  overflow: hidden;
  position: absolute; top: 0; left: 0;
}
.book-front img { width: 100%; height: 100%; object-fit: cover; object-position: top center; display: block; }
.book-spine {
  width: 22px; height: 100%;
  background: linear-gradient(90deg, #0f8a6d, #10b981);
  position: absolute; top: 0; left: -22px;
  transform: rotateY(90deg);
  transform-origin: right center;
  border-radius: 3px 0 0 3px;
}

/* ==============================
   SECOND TABLET — far left behind book, angled
   ============================== */
.dev-tablet-2 {
  position: absolute;
  top: 140px; left: 40px;
  z-index: 1;
}
.dev-tablet-2 .tab-bezel {
  width: 280px; height: 380px;
  border-radius: 18px;
}
.dev-tablet-2 .tab-screen { border-radius: 10px; }
.dev-tablet-2 .tab-indicator { width: 56px; }

/* ==============================
   SMALL FLOATING BADGES
   ============================== */
.badge-float {
  position: absolute;
  background: rgba(16, 185, 129, 0.95);
  color: #000;
  padding: 8px 16px;
  border-radius: 8px;
  font-family: 'Inter', sans-serif;
  font-weight: 800;
  font-size: 12px;
  box-shadow: 0 4px 16px rgba(16, 185, 129, 0.3);
  z-index: 10;
  white-space: nowrap;
}
.badge-1 { top: 30px; right: 300px; }
.badge-2 { bottom: 40px; left: 350px; }
.badge-3 { top: 60px; left: 200px; }

/* Subtle grid/dot pattern overlay */
.pattern-overlay {
  position: absolute;
  inset: 0;
  background-image: radial-gradient(rgba(255,255,255,0.015) 1px, transparent 1px);
  background-size: 30px 30px;
  pointer-events: none;
  z-index: 0;
}
</style>
</head>
<body>
  <div class="glow glow-top"></div>
  <div class="glow glow-left"></div>
  <div class="glow glow-right"></div>
  <div class="pattern-overlay"></div>

  <div class="cluster">

    <!-- LARGE MONITOR (back center) — Sharpify hero -->
    <div class="dev-monitor">
      <div class="mon-bezel">
        <div class="mon-screen">
          <img src="../screenshots/section-hero.png" alt="Sharpify Desktop">
        </div>
      </div>
      <div class="mon-chin"><div class="dot"></div></div>
      <div class="mon-neck"></div>
      <div class="mon-base"></div>
    </div>

    <!-- TABLET 2 (far left) — MrYeti portfolio -->
    <div class="dev-tablet-2">
      <div class="tab-bezel">
        <div class="tab-screen">
          <img src="../../../../portfolio-mryeti.png" alt="MrYeti">
        </div>
        <div class="tab-indicator"></div>
      </div>
    </div>

    <!-- BOOK (left) — Sharpify mobile as cover -->
    <div class="dev-book">
      <div class="book-cover">
        <div class="book-spine"></div>
        <div class="book-front">
          <img src="../screenshots/mobile-hero.png" alt="Mobile cover">
        </div>
      </div>
    </div>

    <!-- LAPTOP (front-left) — Sport Factory -->
    <div class="dev-laptop">
      <div class="lap-bezel">
        <div class="lap-screen">
          <img src="../../../../portfolio-sportfactory.png" alt="Sport Factory">
        </div>
      </div>
      <div class="lap-base"></div>
    </div>

    <!-- TABLET (right) — Sharpify tablet view -->
    <div class="dev-tablet">
      <div class="tab-bezel">
        <div class="tab-screen">
          <img src="../screenshots/tablet-hero.png" alt="Tablet view">
        </div>
        <div class="tab-indicator"></div>
      </div>
    </div>

    <!-- PHONE 2 (behind phone 1) — Vaditaju Skola -->
    <div class="dev-phone-2">
      <div class="ph-bezel">
        <div class="ph-screen">
          <div class="ph-notch"></div>
          <img src="../../../../vaditajuskola-hero.png" alt="Vaditaju Skola">
        </div>
      </div>
    </div>

    <!-- PHONE 1 (front-right) — Sharpify mobile -->
    <div class="dev-phone-1">
      <div class="ph-bezel">
        <div class="ph-screen">
          <div class="ph-notch"></div>
          <img src="../screenshots/mobile-hero.png" alt="Sharpify Mobile">
        </div>
      </div>
    </div>

    <!-- Floating badges -->
    <div class="badge-float badge-1">2 300+ uzņēmumi</div>
    <div class="badge-float badge-2">26 valstis</div>
    <div class="badge-float badge-3">1 000+ atsauksmes</div>

  </div>
</body>
</html>
