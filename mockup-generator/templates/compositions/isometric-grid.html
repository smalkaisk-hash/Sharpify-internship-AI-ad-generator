<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920">
<link rel="stylesheet" href="../base-mockup.css">
<style>
html, body { width: 1920px; height: 1080px; overflow: hidden; }
body {
  background: linear-gradient(155deg, var(--mockup-bg) 0%, #0c1222 50%, var(--mockup-bg-end) 100%);
  display: flex; align-items: center; justify-content: center;
  position: relative;
}

/* Glow */
.glow-1 {
  width: 900px; height: 900px; top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  position: absolute; border-radius: 50%;
  background: var(--mockup-accent); opacity: 0.05; filter: blur(150px); pointer-events: none;
}

/* Isometric container */
.iso-container {
  transform: perspective(2000px) rotateX(35deg) rotateZ(-40deg);
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 40px;
  z-index: 2;
}

/* All devices get consistent isometric shadow */
.iso-container .device-browser {
  width: 560px;
  box-shadow: 30px 30px 60px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.03);
}
.iso-container .device-browser .device-screen img {
  height: 340px;
}

/* Headline — absolute top-left */
.headline-area {
  position: absolute; top: 50px; left: 80px; z-index: 10;
}
.headline-area .mockup-badge { margin-bottom: 14px; }
.headline-area .mockup-headline { font-size: 48px; }
.headline-area .mockup-headline .accent { color: var(--mockup-accent); }

/* CTA — absolute bottom-right */
.cta-area {
  position: absolute; bottom: 50px; right: 80px; z-index: 10;
}
.cta-btn {
  display: inline-block;
  background: var(--mockup-accent); color: #000;
  padding: 18px 44px; border-radius: 14px;
  font-weight: 800; font-size: 20px;
  font-family: var(--font-body);
  box-shadow: 0 8px 32px rgba(16, 185, 129, 0.3);
}
</style>
</head>
<body>
  <div class="glow-1"></div>

  <div class="headline-area">
    <div class="mockup-badge">{{badge_text}}</div>
    <div class="mockup-headline">
      {{headline_line1}}<br>
      <span class="accent">{{headline_accent}}</span>
    </div>
  </div>

  <div class="iso-container">
    <div class="device-browser">
      <div class="browser-chrome">
        <div class="browser-dots"><span></span><span></span><span></span></div>
        <div class="browser-url">{{url_1}}</div>
      </div>
      <div class="device-screen">
        <img src="{{screenshot_1}}" alt="Site 1">
      </div>
    </div>

    <div class="device-browser">
      <div class="browser-chrome">
        <div class="browser-dots"><span></span><span></span><span></span></div>
        <div class="browser-url">{{url_2}}</div>
      </div>
      <div class="device-screen">
        <img src="{{screenshot_2}}" alt="Site 2">
      </div>
    </div>

    <div class="device-browser">
      <div class="browser-chrome">
        <div class="browser-dots"><span></span><span></span><span></span></div>
        <div class="browser-url">{{url_3}}</div>
      </div>
      <div class="device-screen">
        <img src="{{screenshot_3}}" alt="Site 3">
      </div>
    </div>

    <div class="device-browser">
      <div class="browser-chrome">
        <div class="browser-dots"><span></span><span></span><span></span></div>
        <div class="browser-url">{{url_4}}</div>
      </div>
      <div class="device-screen">
        <img src="{{screenshot_4}}" alt="Site 4">
      </div>
    </div>
  </div>

  <div class="cta-area">
    <div class="cta-btn">{{cta_text}}</div>
  </div>
</body>
</html>
