<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920">
<link rel="stylesheet" href="../base-mockup.css">
<style>
html, body {
  width: 1920px; height: 1080px; overflow: hidden;
}
body {
  background: linear-gradient(155deg, var(--mockup-bg) 0%, #0c1222 40%, var(--mockup-bg-end) 100%);
  display: flex; align-items: center; justify-content: center;
  position: relative;
}

/* === Ambient glow effects === */
.glow-1 {
  width: 600px; height: 600px;
  top: -100px; left: 200px;
  position: absolute; border-radius: 50%;
  background: var(--mockup-accent); opacity: 0.06; filter: blur(120px);
  pointer-events: none;
}
.glow-2 {
  width: 500px; height: 500px;
  bottom: -150px; right: 300px;
  position: absolute; border-radius: 50%;
  background: #6366f1; opacity: 0.05; filter: blur(100px);
  pointer-events: none;
}

/* === Layout container === */
.spread-container {
  width: 1920px; height: 1080px;
  position: relative;
  display: flex; align-items: center;
}

/* === Text section (left) === */
.text-section {
  position: absolute; left: 80px; top: 50%; transform: translateY(-50%);
  width: 420px; z-index: 10;
}
.text-section .mockup-badge { margin-bottom: 20px; }
.text-section .mockup-headline {
  font-size: 48px; margin-bottom: 16px;
}
.text-section .mockup-headline .accent { color: var(--mockup-accent); }
.text-section .mockup-subheadline {
  font-size: 18px; margin-bottom: 28px; line-height: 1.5;
}
.text-section .cta-btn {
  display: inline-block;
  background: var(--mockup-accent); color: #000;
  padding: 18px 44px; border-radius: 14px;
  font-weight: 800; font-size: 20px;
  font-family: var(--font-body);
  box-shadow: 0 8px 32px rgba(16, 185, 129, 0.25);
}

/* === Devices section (right) === */
.devices-section {
  position: absolute; right: 0; top: 0;
  width: 1350px; height: 1080px;
}

/* Monitor — back center-right */
.device-monitor {
  position: absolute;
  top: 80px; left: 280px;
  transform: perspective(1400px) rotateY(-8deg) rotateX(2deg);
  z-index: 1;
}
.device-monitor .device-screen-wrap {
  width: 680px; height: 425px;
}
.device-monitor .device-chin { width: 680px; }

/* MacBook — front-left, overlapping monitor */
.device-macbook {
  position: absolute;
  bottom: 120px; left: 60px;
  transform: perspective(1200px) rotateY(5deg) rotateX(2deg);
  z-index: 3;
}
.device-macbook .device-screen-wrap {
  width: 520px; height: 325px;
}
.device-macbook .device-base {
  width: 590px; left: -35px;
}

/* iPad — right side, slight tilt */
.device-ipad {
  position: absolute;
  top: 160px; right: 60px;
  transform: perspective(1000px) rotateY(-12deg) rotateX(3deg);
  z-index: 2;
}
.device-ipad {
  width: 320px; height: 430px;
}

/* iPhone — front-right, overlapping */
.device-iphone {
  position: absolute;
  bottom: 100px; right: 180px;
  transform: perspective(800px) rotateY(-10deg);
  z-index: 4;
}
.device-iphone {
  width: 220px; height: 450px;
}

/* === Floating elements === */
.float-label {
  position: absolute;
  background: var(--mockup-accent); color: #000;
  padding: 10px 20px; border-radius: 10px;
  font-weight: 800; font-size: 14px;
  font-family: var(--font-body);
  box-shadow: 0 4px 16px rgba(16, 185, 129, 0.3);
  z-index: 10;
}
.float-label-1 { bottom: 300px; right: 420px; transform: rotate(-3deg); }
.float-label-2 { top: 120px; right: 400px; transform: rotate(2deg); }
</style>
</head>
<body>
  <div class="glow-1"></div>
  <div class="glow-2"></div>

  <div class="spread-container">
    <!-- Text Section -->
    <div class="text-section">
      <div class="mockup-badge">{{badge_text}}</div>
      <div class="mockup-headline">
        {{headline_line1}}<br>
        <span class="accent">{{headline_accent}}</span><br>
        {{headline_line3}}
      </div>
      <div class="mockup-subheadline">{{subheadline}}</div>
      <div class="cta-btn">{{cta_text}}</div>
    </div>

    <!-- Devices Section -->
    <div class="devices-section">
      <!-- Desktop Monitor (back) -->
      <div class="device-monitor">
        <div class="device-screen-wrap">
          <div class="device-screen">
            <img src="{{screenshot_desktop}}" alt="Desktop">
          </div>
        </div>
        <div class="device-chin"><div class="logo-dot"></div></div>
        <div class="device-stand-neck"></div>
        <div class="device-stand-base"></div>
      </div>

      <!-- MacBook (front-left) -->
      <div class="device-macbook">
        <div class="device-screen-wrap">
          <div class="device-screen">
            <img src="{{screenshot_desktop}}" alt="Laptop">
          </div>
        </div>
        <div class="device-base"></div>
      </div>

      <!-- iPad (right) -->
      <div class="device-ipad">
        <div class="device-screen">
          <img src="{{screenshot_tablet}}" alt="Tablet">
        </div>
        <div class="device-home-indicator"></div>
      </div>

      <!-- iPhone (front-right) -->
      <div class="device-iphone">
        <div class="device-screen">
          <div class="device-notch"></div>
          <img src="{{screenshot_mobile}}" alt="Mobile">
        </div>
      </div>

      <!-- Floating labels -->
      <div class="float-label float-label-1">{{label_1}}</div>
      <div class="float-label float-label-2">{{label_2}}</div>
    </div>
  </div>
</body>
</html>
