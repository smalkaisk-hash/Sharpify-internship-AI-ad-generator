<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920">
<link rel="stylesheet" href="../base-mockup.css">
<style>
html, body { width: 1920px; height: 1080px; overflow: hidden; }
body {
  background: linear-gradient(155deg, var(--mockup-bg) 0%, #0c1222 50%, var(--mockup-bg-end) 100%);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  position: relative;
}

/* Glow */
.glow-1 {
  width: 800px; height: 600px; top: -100px; left: 50%; transform: translateX(-50%);
  position: absolute; border-radius: 50%;
  background: var(--mockup-accent); opacity: 0.06; filter: blur(140px); pointer-events: none;
}

/* Headline above laptop */
.top-section {
  text-align: center; margin-bottom: 40px; z-index: 2;
}
.top-section .mockup-badge { margin-bottom: 16px; }
.top-section .mockup-headline { font-size: 52px; margin-bottom: 12px; }
.top-section .mockup-headline .accent { color: var(--mockup-accent); }
.top-section .mockup-subheadline { font-size: 20px; max-width: 600px; margin: 0 auto; }

/* Laptop — centered, large */
.laptop-section { z-index: 2; }
.laptop-section .device-macbook {
  transform: perspective(1400px) rotateX(4deg);
}
.laptop-section .device-macbook .device-screen-wrap {
  width: 900px; height: 562px;
}
.laptop-section .device-macbook .device-base {
  width: 1010px; left: -55px;
}

/* Bottom CTA */
.bottom-cta {
  margin-top: 32px; z-index: 2; text-align: center;
}
.cta-btn {
  display: inline-block;
  background: var(--mockup-accent); color: #000;
  padding: 18px 48px; border-radius: 14px;
  font-weight: 800; font-size: 20px;
  font-family: var(--font-body);
  box-shadow: 0 8px 32px rgba(16, 185, 129, 0.3);
}
</style>
</head>
<body>
  <div class="glow-1"></div>

  <div class="top-section">
    <div class="mockup-badge">{{badge_text}}</div>
    <div class="mockup-headline">
      {{headline_line1}} <span class="accent">{{headline_accent}}</span>
    </div>
    <div class="mockup-subheadline">{{subheadline}}</div>
  </div>

  <div class="laptop-section">
    <div class="device-macbook">
      <div class="device-screen-wrap">
        <div class="device-screen">
          <img src="{{screenshot_desktop}}" alt="Desktop view">
        </div>
      </div>
      <div class="device-base"></div>
    </div>
  </div>

  <div class="bottom-cta">
    <div class="cta-btn">{{cta_text}}</div>
  </div>
</body>
</html>
