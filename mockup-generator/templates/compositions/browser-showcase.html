<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920">
<link rel="stylesheet" href="../base-mockup.css">
<style>
html, body { width: 1920px; height: 1080px; overflow: hidden; }
body {
  background: linear-gradient(155deg, var(--mockup-bg) 0%, #0c1222 50%, var(--mockup-bg-end) 100%);
  display: flex; align-items: center;
  position: relative;
}

/* Glows */
.glow-1 {
  width: 600px; height: 600px; top: -80px; right: 400px;
  position: absolute; border-radius: 50%;
  background: var(--mockup-accent); opacity: 0.06; filter: blur(120px); pointer-events: none;
}

/* Text — left */
.text-section {
  width: 520px; padding-left: 100px; z-index: 2;
}
.text-section .mockup-badge { margin-bottom: 22px; }
.text-section .mockup-headline { font-size: 54px; margin-bottom: 18px; }
.text-section .mockup-headline .accent { color: var(--mockup-accent); }
.text-section .mockup-subheadline { font-size: 19px; margin-bottom: 32px; max-width: 400px; }

.features {
  display: flex; flex-direction: column; gap: 14px;
  margin-bottom: 36px;
}
.feature {
  display: flex; align-items: center; gap: 12px;
  font-family: var(--font-body); font-size: 18px; color: #cbd5e1;
}
.feature-icon {
  width: 32px; height: 32px; border-radius: 8px;
  background: rgba(16, 185, 129, 0.15);
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; flex-shrink: 0;
}
.cta-btn {
  display: inline-block;
  background: var(--mockup-accent); color: #000;
  padding: 18px 44px; border-radius: 14px;
  font-weight: 800; font-size: 20px;
  font-family: var(--font-body);
  box-shadow: 0 8px 32px rgba(16, 185, 129, 0.3);
}

/* Browser — right, large */
.browser-section {
  flex: 1; display: flex; align-items: center; justify-content: center;
  padding-right: 60px; z-index: 2;
}
.browser-section .device-browser {
  width: 880px;
  transform: perspective(1200px) rotateY(-6deg) rotateX(2deg);
}
.browser-section .device-browser .device-screen img {
  height: 520px;
}
</style>
</head>
<body>
  <div class="glow-1"></div>

  <div class="text-section">
    <div class="mockup-badge">{{badge_text}}</div>
    <div class="mockup-headline">
      {{headline_line1}}<br>
      <span class="accent">{{headline_accent}}</span>
    </div>
    <div class="mockup-subheadline">{{subheadline}}</div>

    <div class="features">
      <div class="feature"><div class="feature-icon">{{icon_1}}</div> {{feature_1}}</div>
      <div class="feature"><div class="feature-icon">{{icon_2}}</div> {{feature_2}}</div>
      <div class="feature"><div class="feature-icon">{{icon_3}}</div> {{feature_3}}</div>
    </div>

    <div class="cta-btn">{{cta_text}}</div>
  </div>

  <div class="browser-section">
    <div class="device-browser">
      <div class="browser-chrome">
        <div class="browser-dots"><span></span><span></span><span></span></div>
        <div class="browser-url">{{url}}</div>
      </div>
      <div class="device-screen">
        <img src="{{screenshot_desktop}}" alt="Website">
      </div>
    </div>
  </div>
</body>
</html>
