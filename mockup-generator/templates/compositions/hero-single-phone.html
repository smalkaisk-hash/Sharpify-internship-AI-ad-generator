<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920">
<link rel="stylesheet" href="../base-mockup.css">
<style>
html, body { width: 1920px; height: 1080px; overflow: hidden; }
body {
  background: linear-gradient(155deg, var(--mockup-bg) 0%, #0c1222 50%, var(--mockup-bg-end) 100%);
  display: flex; align-items: center; position: relative;
}

/* Glow */
.glow-1 {
  width: 600px; height: 600px; top: 100px; right: 500px;
  position: absolute; border-radius: 50%;
  background: var(--mockup-accent); opacity: 0.07; filter: blur(120px); pointer-events: none;
}

/* Text — left side */
.text-section {
  width: 700px; padding-left: 120px; z-index: 2;
}
.text-section .mockup-badge { margin-bottom: 24px; }
.text-section .mockup-headline {
  font-size: 64px; margin-bottom: 20px;
}
.text-section .mockup-headline .accent { color: var(--mockup-accent); }
.text-section .mockup-subheadline {
  font-size: 22px; margin-bottom: 36px; max-width: 520px;
}
.cta-btn {
  display: inline-block;
  background: var(--mockup-accent); color: #000;
  padding: 22px 52px; border-radius: 14px;
  font-weight: 800; font-size: 24px;
  font-family: var(--font-body);
  box-shadow: 0 8px 32px rgba(16, 185, 129, 0.3);
}

/* Phone — right side, large */
.phone-section {
  flex: 1; display: flex; align-items: center; justify-content: center;
  position: relative; z-index: 2;
}
.phone-section .device-iphone {
  width: 340px; height: 700px;
  transform: perspective(900px) rotateY(-12deg);
}

/* Floating elements */
.float-card {
  position: absolute; background: rgba(30, 41, 59, 0.9);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 14px; padding: 16px 24px;
  font-family: var(--font-body); color: #fff;
  box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  z-index: 5;
}
.float-card .card-number {
  font-family: var(--font-heading); font-weight: 900;
  font-size: 28px; color: var(--mockup-accent);
}
.float-card .card-label {
  font-size: 13px; color: #94a3b8; margin-top: 4px;
}
.card-1 { top: 180px; right: 120px; }
.card-2 { bottom: 200px; right: 80px; }
</style>
</head>
<body>
  <div class="glow-1"></div>

  <div class="text-section">
    <div class="mockup-badge">{{badge_text}}</div>
    <div class="mockup-headline">
      {{headline_line1}}<br>
      <span class="accent">{{headline_accent}}</span>
    </div>
    <div class="mockup-subheadline">{{subheadline}}</div>
    <div class="cta-btn">{{cta_text}}</div>
  </div>

  <div class="phone-section">
    <div class="device-iphone">
      <div class="device-screen">
        <div class="device-notch"></div>
        <img src="{{screenshot_mobile}}" alt="Mobile view">
      </div>
    </div>

    <div class="float-card card-1">
      <div class="card-number">{{stat_1_number}}</div>
      <div class="card-label">{{stat_1_label}}</div>
    </div>
    <div class="float-card card-2">
      <div class="card-number">{{stat_2_number}}</div>
      <div class="card-label">{{stat_2_label}}</div>
    </div>
  </div>
</body>
</html>
