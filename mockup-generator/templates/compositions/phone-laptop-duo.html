<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920">
<link rel="stylesheet" href="../base-mockup.css">
<style>
html, body { width: 1920px; height: 1080px; overflow: hidden; }
body {
  background: linear-gradient(155deg, var(--mockup-bg) 0%, #0c1222 50%, var(--mockup-bg-end) 100%);
  display: flex; align-items: center; justify-content: center;
  position: relative; gap: 80px;
}

/* Glows */
.glow-1 {
  width: 600px; height: 600px; top: -100px; left: 300px;
  position: absolute; border-radius: 50%;
  background: var(--mockup-accent); opacity: 0.06; filter: blur(120px); pointer-events: none;
}
.glow-2 {
  width: 500px; height: 500px; bottom: -100px; right: 200px;
  position: absolute; border-radius: 50%;
  background: #8b5cf6; opacity: 0.04; filter: blur(100px); pointer-events: none;
}

/* Laptop — left */
.laptop-wrap {
  transform: perspective(1200px) rotateY(6deg) rotateX(2deg);
  z-index: 2;
}
.laptop-wrap .device-macbook .device-screen-wrap {
  width: 700px; height: 437px;
}
.laptop-wrap .device-macbook .device-base {
  width: 790px; left: -45px;
}

/* Phone — right, overlapping slightly */
.phone-wrap {
  transform: perspective(800px) rotateY(-10deg);
  z-index: 3;
  margin-left: -60px;
}
.phone-wrap .device-iphone {
  width: 280px; height: 572px;
}

/* Headline overlay — top center */
.headline-overlay {
  position: absolute; top: 50px; left: 50%; transform: translateX(-50%);
  text-align: center; z-index: 10;
}
.headline-overlay .mockup-badge { margin-bottom: 14px; }
.headline-overlay .mockup-headline { font-size: 44px; }
.headline-overlay .mockup-headline .accent { color: var(--mockup-accent); }

/* CTA — bottom center */
.cta-overlay {
  position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%);
  z-index: 10;
}
.cta-btn {
  display: inline-block;
  background: var(--mockup-accent); color: #000;
  padding: 18px 48px; border-radius: 14px;
  font-weight: 800; font-size: 20px;
  font-family: var(--font-body);
  box-shadow: 0 8px 32px rgba(16, 185, 129, 0.3);
}
</style>
</head>
<body>
  <div class="glow-1"></div>
  <div class="glow-2"></div>

  <div class="headline-overlay">
    <div class="mockup-badge">{{badge_text}}</div>
    <div class="mockup-headline">
      {{headline_line1}} <span class="accent">{{headline_accent}}</span>
    </div>
  </div>

  <!-- Laptop -->
  <div class="laptop-wrap">
    <div class="device-macbook">
      <div class="device-screen-wrap">
        <div class="device-screen">
          <img src="{{screenshot_desktop}}" alt="Desktop">
        </div>
      </div>
      <div class="device-base"></div>
    </div>
  </div>

  <!-- Phone -->
  <div class="phone-wrap">
    <div class="device-iphone">
      <div class="device-screen">
        <div class="device-notch"></div>
        <img src="{{screenshot_mobile}}" alt="Mobile">
      </div>
    </div>
  </div>

  <div class="cta-overlay">
    <div class="cta-btn">{{cta_text}}</div>
  </div>
</body>
</html>
