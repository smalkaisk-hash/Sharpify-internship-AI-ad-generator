<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920">
<link rel="stylesheet" href="../base-mockup.css">
<style>
html, body { width: 1920px; height: 1080px; overflow: hidden; }
body {
  background: linear-gradient(155deg, var(--mockup-bg) 0%, var(--mockup-bg-end) 100%);
  display: flex; align-items: center; justify-content: center;
}
.device-ipad {
  width: 480px; height: 640px;
  transform: perspective(1000px) rotateY(-5deg);
}
</style>
</head>
<body>
  <div class="device-ipad">
    <div class="device-screen">
      <img src="{{screenshot}}" alt="Tablet screenshot">
    </div>
    <div class="device-home-indicator"></div>
  </div>
</body>
</html>
