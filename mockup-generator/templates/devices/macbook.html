<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920">
<link rel="stylesheet" href="../base-mockup.css">
<style>
html, body { width: 1920px; height: 1080px; overflow: hidden; }
body {
  background: linear-gradient(155deg, var(--mockup-bg) 0%, var(--mockup-bg-end) 100%);
  display: flex; align-items: center; justify-content: center;
}
.device-macbook {
  transform: perspective(1200px) rotateX(3deg) rotateY(-5deg);
}
.device-macbook .device-screen-wrap {
  width: 820px; height: 512px;
}
.device-macbook .device-base {
  width: 920px; left: -50px;
}
</style>
</head>
<body>
  <div class="device-macbook">
    <div class="device-screen-wrap">
      <div class="device-screen">
        <img src="{{screenshot}}" alt="Desktop screenshot">
      </div>
    </div>
    <div class="device-base"></div>
  </div>
</body>
</html>
