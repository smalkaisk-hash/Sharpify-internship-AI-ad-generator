<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920">
<link rel="stylesheet" href="../base-mockup.css">
<style>
html, body { width: 1920px; height: 1080px; overflow: hidden; }
body {
  background: linear-gradient(155deg, var(--mockup-bg) 0%, var(--mockup-bg-end) 100%);
  display: flex; align-items: center; justify-content: center;
}
.device-browser {
  width: 900px;
  transform: perspective(1000px) rotateX(2deg);
}
.device-browser .device-screen img {
  height: 540px;
}
</style>
</head>
<body>
  <div class="device-browser">
    <div class="browser-chrome">
      <div class="browser-dots">
        <span></span><span></span><span></span>
      </div>
      <div class="browser-url">{{url}}</div>
    </div>
    <div class="device-screen">
      <img src="{{screenshot}}" alt="Website screenshot">
    </div>
  </div>
</body>
</html>
