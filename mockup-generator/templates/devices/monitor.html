<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920">
<link rel="stylesheet" href="../base-mockup.css">
<style>
html, body { width: 1920px; height: 1080px; overflow: hidden; }
body {
  background: linear-gradient(155deg, var(--mockup-bg) 0%, var(--mockup-bg-end) 100%);
  display: flex; align-items: center; justify-content: center;
}
.device-monitor {
  transform: perspective(1200px) rotateY(-3deg);
}
.device-monitor .device-screen-wrap {
  width: 800px; height: 500px;
}
.device-monitor .device-chin { width: 800px; }
</style>
</head>
<body>
  <div class="device-monitor">
    <div class="device-screen-wrap">
      <div class="device-screen">
        <img src="{{screenshot}}" alt="Desktop screenshot">
      </div>
    </div>
    <div class="device-chin"><div class="logo-dot"></div></div>
    <div class="device-stand-neck"></div>
    <div class="device-stand-base"></div>
  </div>
</body>
</html>
