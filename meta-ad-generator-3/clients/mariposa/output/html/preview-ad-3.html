<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    background: #13100f;
  }

  .canvas {
    position: relative;
    width: 1080px;
    height: 1080px;
  }

  /* ── Photo — left side ─────────────────────────────── */
  .photo {
    position: absolute;
    left: 0;
    top: 0;
    width: 580px;
    height: 1080px;
    object-fit: cover;
    object-position: 55% center;
  }

  /* Gradient blending photo into panel */
  .photo-fade {
    position: absolute;
    left: 0;
    top: 0;
    width: 580px;
    height: 1080px;
    background: linear-gradient(to left, #13100f 0%, transparent 38%);
  }

  /* ── Right panel ────────────────────────────────────── */
  .panel {
    position: absolute;
    right: 0;
    top: 0;
    width: 560px;
    height: 1080px;
    background: #13100f;
    display: flex;
    flex-direction: column;
    padding: 72px 80px 72px 56px;
  }

  /* Subtle noise texture overlay */
  .panel::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
    opacity: 0.18;
    pointer-events: none;
  }

  /* ── Logo ───────────────────────────────────────────── */
  .logo {
    height: 28px;
    width: auto;
    object-fit: contain;
    object-position: left center;
    opacity: 0.88;
    filter: brightness(0) invert(1);
    position: relative;
  }

  /* ── Body ───────────────────────────────────────────── */
  .body {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding-bottom: 16px;
    position: relative;
  }

  .eyebrow {
    font-family: 'Montserrat', sans-serif;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.32em;
    color: rgba(201, 149, 108, 0.7);
    text-transform: uppercase;
    margin-bottom: 20px;
  }

  .stat-number {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 116px;
    font-weight: 300;
    line-height: 1;
    color: #C9956C;
    letter-spacing: -0.02em;
    margin-bottom: 2px;
  }

  .stat-label {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 42px;
    font-weight: 400;
    line-height: 1.2;
    color: #f5f0eb;
    margin-bottom: 10px;
    letter-spacing: -0.01em;
  }

  .stat-label em {
    font-style: italic;
    color: #e2c4a0;
    font-weight: 300;
  }

  /* thin gold rule */
  .rule {
    width: 56px;
    height: 1px;
    background: #C9956C;
    margin: 28px 0;
  }

  .base-text {
    font-family: 'Montserrat', sans-serif;
    font-size: 12.5px;
    font-weight: 300;
    line-height: 1.82;
    color: rgba(245, 240, 235, 0.56);
    margin-bottom: 32px;
    max-width: 340px;
  }

  /* ── Bullets ────────────────────────────────────────── */
  .bullets {
    display: flex;
    flex-direction: column;
    gap: 0;
    margin-bottom: 48px;
  }

  .bullet {
    display: flex;
    align-items: center;
    gap: 14px;
    font-family: 'Montserrat', sans-serif;
    font-size: 11.5px;
    font-weight: 400;
    color: rgba(245, 240, 235, 0.72);
    letter-spacing: 0.015em;
    padding: 11px 0;
    border-bottom: 1px solid rgba(201, 149, 108, 0.14);
  }

  .bullet:first-child {
    border-top: 1px solid rgba(201, 149, 108, 0.14);
  }

  .tick {
    width: 14px;
    height: 1px;
    background: #C9956C;
    flex-shrink: 0;
  }

  /* ── CTA ────────────────────────────────────────────── */
  .bottom-strip {
    display: flex;
    align-items: center;
    gap: 24px;
  }

  .cta {
    display: inline-block;
    background: transparent;
    border: 1px solid rgba(201, 149, 108, 0.75);
    color: #C9956C;
    font-family: 'Montserrat', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.26em;
    text-transform: uppercase;
    padding: 17px 36px;
    white-space: nowrap;
  }

  .site-url {
    font-family: 'Montserrat', sans-serif;
    font-size: 10px;
    font-weight: 300;
    letter-spacing: 0.2em;
    color: rgba(245, 240, 235, 0.28);
    text-transform: uppercase;
  }
</style>
</head>
<body>
<div class="canvas">

  <!-- Photo left -->
  <img class="photo" src="../../assets/Beautiful-Woman-11-scaled.webp" alt="">
  <div class="photo-fade"></div>

  <!-- Right panel -->
  <div class="panel">

    <img class="logo" src="../../assets/logo-1-Logo_balts-3-scaled.png" alt="Mariposa">

    <div class="body">
      <div class="eyebrow">Medicīniskā estetika · Rīga</div>

      <div class="stat-number">95%</div>
      <div class="stat-label">klientu atgriežas<br><em>pēc pirmās sesijas</em></div>

      <div class="rule"></div>

      <p class="base-text">
        Optimas apvieno IPL, RF un lāzeru vienā precīzā protokolā. Individuāls risinājums katrai ādas problēmai.
      </p>

      <div class="bullets">
        <div class="bullet"><div class="tick"></div>Bez atveseļošanās perioda</div>
        <div class="bullet"><div class="tick"></div>Redzams uzlabojums jau 4 nedēļās</div>
        <div class="bullet"><div class="tick"></div>Bezmaksas konsultācija · vērtība 40€</div>
      </div>

      <div class="bottom-strip">
        <div class="cta">Piesakies</div>
        <span class="site-url">mariposa.lv</span>
      </div>
    </div>

  </div>
</div>
</body>
</html>
