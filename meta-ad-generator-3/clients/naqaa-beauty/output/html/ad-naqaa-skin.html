<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Montserrat:wght@300;400;500;600&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1080px; height: 1080px; overflow: hidden; }

/*
  Palette: Amethyst Wisteria Twilight (palettes-neutral.md) — ✓ WCAG AA 5.8:1
  Base (frosted panel):  #F0F0F0  near-white    L≈0.87
  Decorative:            #D0ADC4  mauve-pink     L≈0.47 (decorative only)
  Decorative:            #C889B5  pink           L≈0.34 (decorative only)
  Decorative:            #736EAE  lavender       L≈0.18 (decorative only)
  Text + CTA button:     #744B93  deep purple    L≈0.11
  Body/CTA text #744B93 on #F0F0F0 = 5.8:1 ✓
  CTA text      #F0F0F0 on #744B93 = 5.8:1 ✓
  On-image text (mechanism angle): "Hlors ārā. / Aromāts iekšā."
*/

.ad {
  width: 1080px;
  height: 1080px;
  position: relative;
  background: #F0F0F0;
  overflow: hidden;
}

/* Full-bleed lifestyle photo */
.photo {
  position: absolute;
  inset: 0;
  width: 1080px;
  height: 1080px;
  object-fit: cover;
  object-position: 65% center;
}

/* Frosted glass panel — left half, fades right edge */
.frosted-panel {
  position: absolute;
  left: 0;
  top: 0;
  width: 560px;
  height: 1080px;
  background: linear-gradient(
    to right,
    rgba(240,240,240,0.92) 76%,
    rgba(240,240,240,0) 100%
  );
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
}

/* Subtle top vignette for depth */
.vignette-top {
  position: absolute;
  top: 0;
  left: 0;
  width: 1080px;
  height: 180px;
  background: linear-gradient(to bottom, rgba(240,240,240,0.18) 0%, transparent 100%);
  pointer-events: none;
}

/* All text content — within the solid zone of the frosted panel */
.content {
  position: absolute;
  top: 0;
  left: 0;
  width: 490px;
  height: 1080px;
  padding: 64px 58px 72px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

/* Top block: logo + eyebrow */
.top {
  display: flex;
  flex-direction: column;
  gap: 40px;
}

.logo {
  height: 20px;
  width: auto;
  align-self: flex-start;
  opacity: 0.78;
}


/* Headline — mechanism angle, 2 lines */
.headline {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-weight: 400;
  font-size: 84px;
  line-height: 0.97;
  color: #744B93;
  letter-spacing: -0.5px;
}

.headline .l2 {
  padding-left: 28px;
  display: block;
}

/* Bottom block: rule + body + CTA */
.bottom {
  display: flex;
  flex-direction: column;
}

/* Rule — palette mauve to transparent, decorative */
.rule {
  width: 300px;
  height: 1px;
  background: linear-gradient(to right, rgba(200,137,181,0.65), transparent);
  margin-bottom: 26px;
}

/* Body text — solid #744B93, 5.8:1 on panel ✓ */
.body-text {
  font-family: 'Montserrat', sans-serif;
  font-size: 15px;
  font-weight: 300;
  line-height: 1.78;
  color: #744B93;
  max-width: 380px;
  margin-bottom: 36px;
}

/* CTA — #744B93 bg, #F0F0F0 text, 5.8:1 ✓ */
.cta-btn {
  display: inline-block;
  align-self: flex-start;
  background: #744B93;
  color: #F0F0F0;
  padding: 20px 48px;
  font-family: 'Montserrat', sans-serif;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  border-radius: 2px;
  box-shadow:
    0 6px 28px rgba(116,75,147,0.32),
    0 2px 8px rgba(0,0,0,0.12);
}
</style>
</head>
<body>
<div class="ad">

  <img class="photo"
       src="file:///C:/Users/User/Meta-ad-generator-v2/meta-ad-generator-3/clients/naqaa-beauty/assets/image-21-ae0cc2_dc9493586f044233b4216c33e16bd4e9~mv2.jpg"
       alt="">

  <div class="frosted-panel"></div>
  <div class="vignette-top"></div>

  <div class="content">

    <div class="top">
      <img class="logo"
           src="file:///C:/Users/User/Meta-ad-generator-v2/meta-ad-generator-3/clients/naqaa-beauty/assets/logo-1-naqaa_beauty_horizontal.png"
           alt="Naqaa Beauty">
    </div>

    <p class="headline">
      Hlors ārā.<br>
      <span class="l2">Aromāts iekšā.</span>
    </p>

    <div class="bottom">
      <div class="rule"></div>
      <p class="body-text">
        Hlorēts ūdens bojā ādu un matus katru dienu.<br>
        Naqaa noņem hloru un piepilda katru dušu<br>
        ar dabīgu aromterapiju. Dermataloģiski testēts.
      </p>
      <a class="cta-btn">Iegādāties tagad</a>
    </div>

  </div>

</div>
</body>
</html>
