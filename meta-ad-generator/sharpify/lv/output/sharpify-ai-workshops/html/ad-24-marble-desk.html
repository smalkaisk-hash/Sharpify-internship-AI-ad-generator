<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1080px; overflow: hidden; }
body {
  width: 1080px; height: 1080px;
  position: relative;
  font-family: 'Inter', sans-serif; color: #fff;
  background: #000;
}

.bg-image {
  position: absolute; inset: 0;
  background-image: url('../images/marble-desk.png');
  background-size: cover;
  background-position: center;
}

.overlay {
  position: absolute; inset: 0;
  background:
    linear-gradient(180deg,
      rgba(0,0,0,0.82) 0%,
      rgba(0,0,0,0.2) 25%,
      rgba(0,0,0,0) 50%,
      rgba(0,0,0,0.15) 75%,
      rgba(0,0,0,0.9) 100%);
}

.content {
  position: relative; z-index: 2;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  justify-content: space-between;
  padding: 56px;
}

.top {
  text-align: left;
}
.badge {
  display: inline-block;
  background: rgba(10,15,25,0.75);
  border: 1px solid rgba(16,185,129,0.5);
  color: #10b981;
  padding: 10px 22px; border-radius: 50px;
  font-size: 18px; font-weight: 800;
  backdrop-filter: blur(12px);
  margin-bottom: 20px;
  text-shadow: 0 2px 8px rgba(0,0,0,0.8);
}
.headline {
  font-family: 'Montserrat', sans-serif;
  font-size: 72px; font-weight: 900;
  line-height: 0.95;
  max-width: 860px;
  text-shadow: 0 6px 32px rgba(0,0,0,1);
}
.headline span { color: #10b981; }

.bottom {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: rgba(5,10,18,0.82);
  backdrop-filter: blur(16px);
  border: 1px solid rgba(16,185,129,0.3);
  border-radius: 18px;
  padding: 24px 32px;
  box-shadow: 0 16px 50px rgba(0,0,0,0.7);
}
.bottom-info {}
.bottom-title {
  font-family: 'Montserrat', sans-serif;
  font-size: 28px; font-weight: 900;
}
.bottom-sub { font-size: 17px; color: #94a3b8; margin-top: 4px; }
.bottom-sub s { color: #ef4444; }
.bottom-sub strong { color: #10b981; font-weight: 700; }
.cta-btn {
  background: #10b981; color: #000;
  padding: 22px 48px; border-radius: 14px;
  font-weight: 800; font-size: 28px;
  box-shadow: 0 8px 32px rgba(16,185,129,0.4);
}
</style>
</head>
<body>
  <div class="bg-image"></div>
  <div class="overlay"></div>
  <div class="content">
    <div class="top">
      <div class="badge">// Pakalpojumu sniedzējiem</div>
      <div class="headline">Tavs rīts ar<br>pareizajiem <span>rīkiem</span></div>
    </div>

    <div class="bottom">
      <div class="bottom-info">
        <div class="bottom-title">27 AI skills · 10 workflows</div>
        <div class="bottom-sub"><s>€99</s> · <strong>€19</strong> · mūžīga piekļuve · 7 dienu garantija</div>
      </div>
      <div class="cta-btn">Iegūt →</div>
    </div>
  </div>
</body>
</html>
