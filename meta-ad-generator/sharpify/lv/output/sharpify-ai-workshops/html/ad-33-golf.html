<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1080px; overflow: hidden; }
body {
  width: 1080px; height: 1080px;
  position: relative;
  font-family: 'Inter', sans-serif; color: #fff;
  background: #000;
}
.bg-image {
  position: absolute; inset: 0;
  background-image: url('../images/golf-laptop.png');
  background-size: cover;
  background-position: center;
}
.overlay {
  position: absolute; inset: 0;
  background:
    linear-gradient(180deg,
      rgba(0,0,0,0.8) 0%,
      rgba(0,0,0,0.15) 25%,
      rgba(0,0,0,0) 50%,
      rgba(0,0,0,0.1) 70%,
      rgba(0,0,0,0.9) 100%);
}
.content {
  position: relative; z-index: 2;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  justify-content: space-between;
  padding: 56px;
}
.top { text-align: center; }
.badge {
  display: inline-block;
  background: rgba(10,15,25,0.75);
  border: 1px solid rgba(16,185,129,0.6);
  color: #10b981;
  padding: 10px 24px; border-radius: 50px;
  font-size: 18px; font-weight: 800;
  backdrop-filter: blur(12px);
  margin-bottom: 18px;
  text-shadow: 0 2px 8px rgba(0,0,0,0.8);
}
.headline {
  font-family: 'Montserrat', sans-serif;
  font-size: 74px; font-weight: 900;
  line-height: 0.95;
  text-shadow: 0 6px 32px rgba(0,0,0,1);
}
.headline span { color: #10b981; text-shadow: 0 0 40px rgba(16,185,129,0.4), 0 6px 32px rgba(0,0,0,1); }

.bottom { text-align: center; }
.cta-btn {
  display: inline-block;
  background: #10b981; color: #000;
  padding: 26px 64px; border-radius: 50px;
  font-weight: 800; font-size: 30px;
  box-shadow: 0 12px 40px rgba(16,185,129,0.5), 0 0 60px rgba(16,185,129,0.3);
  margin-bottom: 14px;
}
.bottom-sub {
  font-size: 18px; color: #cbd5e1;
  text-shadow: 0 2px 12px rgba(0,0,0,1);
}
.bottom-sub s { color: #ef4444; }
.bottom-sub strong { color: #10b981; font-weight: 700; }
</style>
</head>
<body>
  <div class="bg-image"></div>
  <div class="overlay"></div>
  <div class="content">
    <div class="top">
      <div class="badge">⛳ RĪT JAU AR AI</div>
      <div class="headline">Tu spēlē golfu.<br><span>AI pelna naudu.</span></div>
    </div>
    <div class="bottom">
      <div class="cta-btn">Iegūt par €19 →</div>
      <div class="bottom-sub"><s>€99</s> · <strong>Taupi 81%</strong> · Mūžīga piekļuve</div>
    </div>
  </div>
</body>
</html>
