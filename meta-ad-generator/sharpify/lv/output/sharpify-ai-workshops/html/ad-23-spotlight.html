<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1080px; overflow: hidden; }
body {
  width: 1080px; height: 1080px;
  position: relative;
  font-family: 'Inter', sans-serif; color: #fff;
  background: #000;
}

.bg-image {
  position: absolute; inset: 0;
  background-image: url('../images/spotlight-hero.png');
  background-size: cover;
  background-position: center;
}

.overlay {
  position: absolute; inset: 0;
  background:
    linear-gradient(180deg,
      rgba(0,0,0,0.3) 0%,
      rgba(0,0,0,0.15) 40%,
      rgba(0,0,0,0.1) 60%,
      rgba(0,0,0,0.9) 100%);
}

.content {
  position: relative; z-index: 2;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  justify-content: space-between;
  padding: 64px 56px 48px;
}

.top {
  text-align: center;
}
.top-label {
  font-size: 20px;
  color: #cbd5e1;
  letter-spacing: 4px;
  text-transform: uppercase;
  font-weight: 600;
  text-shadow: 0 2px 12px rgba(0,0,0,1);
  margin-bottom: 18px;
}
.top-headline {
  font-family: 'Montserrat', sans-serif;
  font-size: 50px; font-weight: 900;
  line-height: 1.0;
  text-shadow: 0 4px 24px rgba(0,0,0,1);
}
.top-headline span { color: #10b981; }

.bottom {
  text-align: center;
}
.bottom-hook {
  font-family: 'Montserrat', sans-serif;
  font-size: 42px; font-weight: 900;
  color: #fff;
  margin-bottom: 24px;
  text-shadow: 0 4px 24px rgba(0,0,0,1);
  line-height: 1.1;
}
.bottom-hook span { color: #10b981; }
.cta-btn {
  display: inline-block;
  background: #10b981; color: #000;
  padding: 26px 64px; border-radius: 50px;
  font-weight: 800; font-size: 30px;
  box-shadow: 0 12px 40px rgba(16,185,129,0.5), 0 0 60px rgba(16,185,129,0.3);
  margin-bottom: 12px;
}
.bottom-sub {
  font-size: 18px; color: #cbd5e1;
  text-shadow: 0 2px 12px rgba(0,0,0,1);
}
.bottom-sub s { color: #ef4444; }
.bottom-sub strong { color: #10b981; font-weight: 700; }
</style>
</head>
<body>
  <div class="bg-image"></div>
  <div class="overlay"></div>
  <div class="content">
    <div class="top">
      <div class="top-label">Jaunums · 2026</div>
      <div class="top-headline">AI sistēma, kas<br>strādā <span>Tavā vietā</span></div>
    </div>
    <div class="bottom">
      <div class="bottom-hook">27 skills. <span>€19</span>.<br>Mūžīga piekļuve.</div>
      <div class="cta-btn">Iegūt tagad →</div>
      <div class="bottom-sub"><s>€99</s> · <strong>Taupi 81%</strong> · 7 dienu garantija</div>
    </div>
  </div>
</body>
</html>
