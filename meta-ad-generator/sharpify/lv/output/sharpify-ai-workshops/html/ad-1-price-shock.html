<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1080px; overflow: hidden; }
body {
  width: 1080px; height: 1080px;
  background: linear-gradient(145deg, #070c15 0%, #0f1b2d 40%, #0a1628 100%);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  font-family: 'Inter', sans-serif; color: #fff;
  position: relative;
}
body::before {
  content: ''; position: absolute;
  top: -15%; right: -10%;
  width: 600px; height: 600px;
  background: radial-gradient(circle, rgba(16,185,129,0.08) 0%, transparent 65%);
  pointer-events: none;
}
body::after {
  content: ''; position: absolute;
  bottom: -10%; left: -10%;
  width: 500px; height: 500px;
  background: radial-gradient(circle, rgba(16,185,129,0.05) 0%, transparent 65%);
  pointer-events: none;
}

.badge {
  background: rgba(16,185,129,0.12); border: 1px solid rgba(16,185,129,0.3);
  color: #10b981; padding: 10px 28px; border-radius: 50px;
  font-size: 24px; font-weight: 700; letter-spacing: 0.5px;
  margin-bottom: 36px; position: relative;
}

.savings-tag {
  background: #ef4444; color: #fff;
  padding: 8px 20px; border-radius: 8px;
  font-size: 22px; font-weight: 900;
  margin-bottom: 24px; position: relative;
  transform: rotate(-3deg);
}

.price-old {
  font-family: 'Montserrat', sans-serif;
  font-size: 96px; font-weight: 900;
  color: #ef4444; position: relative;
  opacity: 0.5;
}
.price-old::after {
  content: ''; position: absolute;
  left: -5%; right: -5%; top: 50%;
  height: 6px; background: #ef4444;
  transform: rotate(-6deg);
}

.vs-text {
  color: #475569; font-size: 24px; font-weight: 600;
  margin: 12px 0; letter-spacing: 2px; text-transform: uppercase;
}

.price-new {
  font-family: 'Montserrat', sans-serif;
  font-size: 160px; font-weight: 900;
  color: #10b981; position: relative;
  line-height: 1;
  text-shadow: 0 0 80px rgba(16,185,129,0.25);
}

.tagline {
  font-size: 36px; color: #94a3b8; margin-top: 32px;
  text-align: center; max-width: 760px; line-height: 1.45;
}
.tagline strong { color: #fff; font-weight: 700; }

.cta-btn {
  margin-top: 40px;
  background: #10b981; color: #000;
  padding: 28px 72px; border-radius: 16px;
  font-weight: 800; font-size: 36px;
  font-family: 'Inter', sans-serif;
  box-shadow: 0 8px 32px rgba(16,185,129,0.3);
}

.social-proof {
  position: absolute; bottom: 40px;
  display: flex; gap: 32px; color: #475569; font-size: 20px; font-weight: 500;
}
.social-proof span { color: #10b981; font-weight: 700; }
</style>
</head>
<body>
  <div class="badge">AI Rīku Komplekts</div>
  <div class="savings-tag">TAUPI 81%</div>
  <div class="price-old">€99</div>
  <div class="vs-text">Parastā cena</div>
  <div class="price-new">€19</div>
  <div class="tagline"><strong>Ietaupi 2-5 stundas nedēļā</strong><br>ar gatavu AI&nbsp;sistēmu.</div>
  <div class="cta-btn">Iegūsti komplektu →</div>
  <div class="social-proof">
    <div><span>2 300+</span> uzņēmēji</div>
    <div><span>26</span> valstis</div>
    <div><span>7 dienu</span> garantija</div>
  </div>
</body>
</html>
