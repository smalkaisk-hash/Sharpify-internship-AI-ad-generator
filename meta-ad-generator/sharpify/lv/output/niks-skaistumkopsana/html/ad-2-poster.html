<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1080px;overflow:hidden}
.ad{width:1080px;height:1080px;position:relative;overflow:hidden;background:#1a1410}
.left{position:absolute;top:0;left:0;width:520px;height:100%;overflow:hidden;clip-path:polygon(0 0, 100% 0, 94% 50%, 100% 100%, 0 100%)}
.left img{width:100%;height:100%;object-fit:cover;filter:contrast(1.02) saturate(0.95)}
.left::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,0) 0%,rgba(26,20,16,0.25) 100%)}
.right{position:absolute;top:0;right:0;width:580px;height:100%;background:#F5EDE0;display:flex;flex-direction:column;justify-content:space-between;padding:60px 56px 60px 40px;clip-path:polygon(6% 0, 100% 0, 100% 100%, 0 100%, 6% 50%)}
.tag{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:13px;color:#8B6F4A;letter-spacing:0.2em;text-transform:uppercase;margin-bottom:22px}
.tag::before{content:"// "}
h1{font-family:'Bebas Neue',sans-serif;font-size:128px;line-height:0.9;color:#1a1410;letter-spacing:0.005em}
h1 .stroke{-webkit-text-stroke:3px #1a1410;color:transparent;display:inline-block}
h1 .gold{color:#C9A878}
.sub{font-family:'Inter',sans-serif;font-size:22px;font-weight:500;color:#3a2f24;line-height:1.45;margin-top:20px;max-width:420px}
.stats{display:flex;gap:24px;margin-top:28px;padding-top:24px;border-top:2px solid rgba(26,20,16,0.15)}
.stat b{display:block;font-family:'Bebas Neue',sans-serif;font-size:44px;line-height:1;color:#1a1410}
.stat span{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;color:#8B6F4A;text-transform:uppercase;letter-spacing:0.15em}
.bot{background:#1a1410;border-radius:16px;padding:26px 30px;display:flex;justify-content:space-between;align-items:center;gap:16px}
.bot-left{font-family:'Inter',sans-serif;font-size:15px;font-weight:700;line-height:1.3;color:#F5EDE0}
.bot-left b{display:block;font-family:'Bebas Neue',sans-serif;font-size:28px;color:#C9A878;letter-spacing:0.02em}
.bot-cta{font-family:'Bebas Neue',sans-serif;font-size:32px;color:#1a1410;background:#C9A878;padding:14px 28px;border-radius:10px;letter-spacing:0.03em;white-space:nowrap}
.corner{position:absolute;top:50px;left:50px;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;color:#C9A878;letter-spacing:0.2em;z-index:5;writing-mode:vertical-rl;transform:rotate(180deg)}
