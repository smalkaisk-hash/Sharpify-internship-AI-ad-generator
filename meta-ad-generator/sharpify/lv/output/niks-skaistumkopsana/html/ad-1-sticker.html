<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1080px;overflow:hidden}
.ad{width:1080px;height:1080px;position:relative;overflow:hidden;background:#1a1410}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tint{position:absolute;inset:0;background:linear-gradient(180deg,rgba(26,20,16,0.15) 0%,rgba(26,20,16,0.55) 100%)}
.card{position:absolute;left:60px;right:60px;bottom:80px;background:#1a1410;border-radius:28px;padding:48px 52px;transform:rotate(-1.4deg);box-shadow:0 30px 70px rgba(0,0,0,0.55),0 0 0 1px rgba(201,168,120,0.2);border-top:6px solid #C9A878}
.badge{display:inline-block;font-family:'Montserrat',sans-serif;font-size:18px;font-weight:800;color:#C9A878;text-transform:uppercase;letter-spacing:0.2em;margin-bottom:18px;padding:8px 18px;background:rgba(201,168,120,0.12);border-radius:100px}
h1{font-family:'Montserrat',sans-serif;font-size:36px;font-weight:900;color:#fff;line-height:1.15;letter-spacing:-0.01em}
h1 .accent{color:#C9A878}
.sub{font-family:'Inter',sans-serif;font-size:26px;font-weight:500;color:rgba(255,255,255,0.75);margin-top:16px;line-height:1.35}
.row{display:flex;align-items:center;gap:18px;margin-top:26px}
.cta{font-family:'Montserrat',sans-serif;font-size:28px;font-weight:800;color:#1a1410;background:#C9A878;padding:22px 44px;border-radius:14px;box-shadow:0 10px 24px rgba(201,168,120,0.4)}
.gift{font-family:'Montserrat',sans-serif;font-size:18px;font-weight:700;color:rgba(255,255,255,0.85);text-transform:uppercase;letter-spacing:0.08em}
.gift b{color:#C9A878}
.notif{position:absolute;top:80px;right:50px;background:#fff;border-radius:20px;padding:18px 22px;width:380px;box-shadow:0 20px 50px rgba(0,0,0,0.5);transform:rotate(2.4deg);display:flex;gap:14px;align-items:flex-start}
.notif-ico{width:46px;height:46px;border-radius:12px;background:linear-gradient(135deg,#C9A878,#8B6F4A);display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;font-weight:900;flex-shrink:0;font-family:'Montserrat',sans-serif}
.notif-t{font-family:'Inter',sans-serif}
.notif-title{font-size:15px;font-weight:700;color:#0a0a0a;margin-bottom:2px}
.notif-body{font-size:14px;color:#555;line-height:1.3}
.notif-time{font-size:12px;color:#999;margin-top:4px}
</style>
</head>
<body>
<div class="ad">
<img class="bg" src="file:///C:/Users/Ritvars Volfs/meta-ad-generator-v2/meta-ad-generator/output/niks-skaistumkopsana/images/v2-nails.png">
<div class="tint"></div>
<div class="notif">
<div class="notif-ico">S</div>
<div class="notif-t">
<div class="notif-title">Jauns pieraksts</div>
<div class="notif-body">Gēla manikīrs + noņemšana<br>Elīna K. · Rīga</div>
<div class="notif-time">pirms 2 min</div>
</div>
</div>
<div class="card">
<div class="badge">Skaistumkopšanas saloniem</div>
<h1>Tu parūpējies par klienti,<br><span class="accent">mēs parūpēsimies,</span> lai nākamā jau rindā.</h1>
<div class="sub">MP Risinājums™ AI sistēma — reklāmas, automatizēti pieraksti un CRM vienuviet.</div>
<div class="row">
<div class="cta">Uzzināt vairāk →</div>
<div class="gift">🎁 <b>Dāvanā</b><br>jauna mājaslapa</div>
</div>
</div>
</div>
</body>
</html>
