<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:wght@700;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    font-family: 'Inter', sans-serif;
  }

  .page {
    width: 1080px;
    height: 1080px;
    background: #F59E0B;
    display: flex;
    flex-direction: column;
    padding: 70px 70px 60px 70px;
    position: relative;
  }

  .top-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 40px;
  }

  .issue-label {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    color: #0a0a0a;
    font-weight: 700;
    font-style: italic;
  }

  .brand-logo {
    font-family: 'Playfair Display', serif;
    font-size: 28px;
    color: #0a0a0a;
    font-weight: 900;
    letter-spacing: -1px;
  }

  .massive-headline {
    font-family: 'Playfair Display', serif;
    font-size: 180px;
    font-weight: 900;
    color: #0a0a0a;
    line-height: 0.88;
    letter-spacing: -6px;
    margin-bottom: 30px;
  }

  .massive-headline .italic {
    font-style: italic;
  }

  .sub-line {
    font-size: 32px;
    color: #0a0a0a;
    font-weight: 600;
    line-height: 1.3;
    max-width: 800px;
    margin-bottom: 44px;
  }

  .sub-line .underline {
    text-decoration: underline;
    text-decoration-thickness: 3px;
    text-underline-offset: 6px;
  }

  .stats-bar {
    display: flex;
    gap: 40px;
    padding: 28px 0;
    border-top: 3px solid #0a0a0a;
    border-bottom: 3px solid #0a0a0a;
    margin-bottom: 40px;
  }

  .stat {
    flex: 1;
    text-align: center;
  }

  .stat-number {
    font-family: 'Playfair Display', serif;
    font-size: 48px;
    font-weight: 900;
    color: #0a0a0a;
    line-height: 1;
  }

  .stat-label {
    font-size: 15px;
    color: #0a0a0a;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-top: 6px;
  }

  .bottom-row {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    margin-top: auto;
  }

  .bottom-meta {
    font-size: 20px;
    color: #0a0a0a;
    font-weight: 700;
    line-height: 1.4;
  }

  .bottom-price-wrap {
    text-align: right;
  }

  .price-label {
    font-size: 16px;
    color: #0a0a0a;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 4px;
  }

  .price-main {
    display: flex;
    align-items: baseline;
    gap: 14px;
    justify-content: flex-end;
  }

  .price-old {
    font-family: 'Playfair Display', serif;
    font-size: 32px;
    color: #0a0a0a;
    text-decoration: line-through;
    opacity: 0.5;
  }

  .price-new {
    font-family: 'Playfair Display', serif;
    font-size: 100px;
    font-weight: 900;
    color: #0a0a0a;
    line-height: 1;
  }
</style>
</head>
<body>
  <div class="page">
    <div class="top-row">
      <div class="issue-label">Nr. 01 · 2025</div>
      <div class="brand-logo">SHARPIFY</div>
    </div>

    <div class="massive-headline">AI <span class="italic">nezog</span><br>tavu darbu.</div>

    <div class="sub-line">Tavs darbu zog tas, <span class="underline">kurš izmanto AI</span>. Šis workshop rāda kā būt tam cilvēkam.</div>

    <div class="stats-bar">
      <div class="stat">
        <div class="stat-number">74</div>
        <div class="stat-label">min video</div>
      </div>
      <div class="stat">
        <div class="stat-number">128</div>
        <div class="stat-label">slaidi</div>
      </div>
      <div class="stat">
        <div class="stat-number">27</div>
        <div class="stat-label">AI skills</div>
      </div>
      <div class="stat">
        <div class="stat-number">2,300+</div>
        <div class="stat-label">uzņēmēji</div>
      </div>
    </div>

    <div class="bottom-row">
      <div class="bottom-meta">Niks Jansons<br>Forbes 30 Under 30</div>
      <div class="bottom-price-wrap">
        <div class="price-label">Tikai šonedēļ</div>
        <div class="price-main">
          <div class="price-old">€99</div>
          <div class="price-new">€19</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
