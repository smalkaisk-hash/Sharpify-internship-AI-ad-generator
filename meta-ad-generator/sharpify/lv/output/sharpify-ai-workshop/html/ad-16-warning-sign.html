<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    font-family: 'Inter', sans-serif;
  }

  .page {
    width: 1080px;
    height: 1080px;
    background: #0a0a0a;
    display: flex;
    flex-direction: column;
    padding: 50px 60px;
    position: relative;
    overflow: hidden;
  }

  /* Diagonal warning stripes at top */
  .stripes-top {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 50px;
    background: repeating-linear-gradient(
      45deg,
      #F59E0B 0,
      #F59E0B 30px,
      #0a0a0a 30px,
      #0a0a0a 60px
    );
  }

  .stripes-bottom {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 50px;
    background: repeating-linear-gradient(
      45deg,
      #F59E0B 0,
      #F59E0B 30px,
      #0a0a0a 30px,
      #0a0a0a 60px
    );
  }

  .content {
    flex: 1;
    padding: 40px 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    z-index: 1;
  }

  .warning-badge {
    background: #F59E0B;
    color: #0a0a0a;
    font-size: 22px;
    font-weight: 900;
    padding: 12px 30px;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 36px;
    clip-path: polygon(8% 0, 92% 0, 100% 50%, 92% 100%, 8% 100%, 0% 50%);
  }

  .warning-icon {
    width: 240px;
    height: 220px;
    background: #F59E0B;
    clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 30px;
    margin-bottom: 36px;
    position: relative;
  }

  .warning-icon::after {
    content: '!';
    font-family: 'Inter', sans-serif;
    font-size: 140px;
    font-weight: 900;
    color: #0a0a0a;
    line-height: 1;
  }

  .headline {
    font-size: 64px;
    font-weight: 900;
    color: #ffffff;
    line-height: 1.05;
    text-align: center;
    margin-bottom: 24px;
    letter-spacing: -1px;
  }

  .headline .accent { color: #F59E0B; }

  .sub {
    font-size: 24px;
    color: #d1d5db;
    text-align: center;
    line-height: 1.45;
    max-width: 820px;
    margin-bottom: 40px;
  }

  .sub .bold { color: #fff; font-weight: 700; }

  .action-row {
    display: flex;
    align-items: center;
    gap: 30px;
    padding: 22px 40px;
    background: #F59E0B;
    color: #0a0a0a;
    border-radius: 12px;
  }

  .action-text {
    font-size: 26px;
    font-weight: 800;
    line-height: 1.2;
  }

  .action-text .small {
    display: block;
    font-size: 15px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 2px;
    opacity: 0.7;
    margin-bottom: 2px;
  }

  .action-price {
    display: flex;
    align-items: baseline;
    gap: 10px;
    border-left: 2px solid #0a0a0a;
    padding-left: 30px;
  }

  .action-old {
    font-size: 22px;
    text-decoration: line-through;
    opacity: 0.5;
  }

  .action-new {
    font-size: 60px;
    font-weight: 900;
    line-height: 1;
  }
</style>
</head>
<body>
  <div class="page">
    <div class="stripes-top"></div>
    <div class="stripes-bottom"></div>

    <div class="content">
      <div class="warning-badge">UZMANĪBU</div>
      <div class="warning-icon"></div>

      <div class="headline">Tavs konkurents<br>jau lieto <span class="accent">AI.</span></div>

      <div class="sub">Kamēr tu domā "varbūt nākamgad", <span class="bold">viņš ietaupa 10 stundas nedēļā</span>. Pēc 12 mēnešiem starpība būs 520 stundas.</div>

      <div class="action-row">
        <div class="action-text"><span class="small">Risinājums</span>AI Rīku Komplekts</div>
        <div class="action-price">
          <div class="action-old">€99</div>
          <div class="action-new">€19</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
