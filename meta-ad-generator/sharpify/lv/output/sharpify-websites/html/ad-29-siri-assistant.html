<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1080px; overflow: hidden; }
body {
  width: 1080px; height: 1080px;
  background: linear-gradient(180deg, #1a1a2e 0%, #0a0a14 100%);
  font-family: -apple-system, 'Inter', sans-serif;
  color: #fff;
  display: flex; flex-direction: column; align-items: center;
  padding: 0;
  position: relative;
  overflow: hidden;
}

/* Blurred background gradient */
body::before {
  content: ''; position: absolute; inset: 0;
  background:
    radial-gradient(ellipse at 30% 80%, rgba(120,60,200,0.15) 0%, transparent 50%),
    radial-gradient(ellipse at 70% 80%, rgba(60,130,246,0.12) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 90%, rgba(16,185,129,0.08) 0%, transparent 40%);
  pointer-events: none;
}

/* Status bar */
.status-bar {
  width: 100%; padding: 14px 32px;
  display: flex; justify-content: space-between; align-items: center;
  position: relative; z-index: 1;
  font-size: 17px; font-weight: 600; color: #fff;
}
.status-left { }
.status-right { display: flex; gap: 8px; align-items: center; }

/* Main content */
.siri-content {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 0 64px;
  position: relative; z-index: 1;
}

/* Siri orb */
.siri-orb {
  width: 200px; height: 200px; border-radius: 50%;
  background: linear-gradient(135deg,
    rgba(120,60,220,0.6),
    rgba(60,130,246,0.5),
    rgba(16,185,129,0.4),
    rgba(255,100,100,0.3));
  background-size: 200% 200%;
  margin-bottom: 40px;
  position: relative;
  box-shadow:
    0 0 80px rgba(100,80,220,0.25),
    0 0 160px rgba(60,130,246,0.1);
}
.siri-orb::after {
  content: ''; position: absolute; inset: 6px;
  border-radius: 50%;
  background: linear-gradient(135deg,
    rgba(140,80,240,0.8),
    rgba(80,150,255,0.7),
    rgba(20,200,140,0.6),
    rgba(255,120,120,0.5));
  background-size: 200% 200%;
  filter: blur(20px);
}

/* Question */
.siri-question {
  font-size: 36px; color: #fff; text-align: center;
  margin-bottom: 44px; font-weight: 500;
  max-width: 700px; line-height: 1.4;
  opacity: 0.9;
}
.siri-question em {
  font-style: normal; color: rgba(255,255,255,0.5);
}

/* Result card */
.siri-result {
  width: 100%; max-width: 760px;
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(40px);
  border-radius: 20px;
  border: 1px solid rgba(255,255,255,0.1);
  padding: 32px 36px;
}

.result-header {
  display: flex; align-items: center; gap: 16px;
  margin-bottom: 20px;
}
.result-icon {
  width: 56px; height: 56px; border-radius: 14px;
  background: linear-gradient(135deg, #10b981, #059669);
  display: flex; align-items: center; justify-content: center;
  font-weight: 900; font-size: 26px; color: #000;
  flex-shrink: 0;
}
.result-name { font-size: 28px; font-weight: 700; }
.result-sub { font-size: 18px; color: rgba(255,255,255,0.5); margin-top: 2px; }

.result-body {
  display: flex; flex-direction: column; gap: 14px;
  margin-bottom: 24px;
}
.result-row {
  display: flex; justify-content: space-between; align-items: center;
  font-size: 24px;
  padding: 8px 0;
  border-bottom: 1px solid rgba(255,255,255,0.06);
}
.result-row:last-child { border-bottom: none; }
.result-row .label { color: rgba(255,255,255,0.6); }
.result-row .value { font-weight: 700; color: #fff; }
.result-row .value.green { color: #10b981; }

.result-cta {
  background: #10b981; color: #000;
  padding: 20px; border-radius: 14px;
  font-weight: 800; font-size: 28px;
  text-align: center;
  box-shadow: 0 6px 24px rgba(16,185,129,0.25);
}

/* Bottom Siri bar */
.siri-bottom {
  width: 100%; padding: 24px;
  display: flex; justify-content: center;
  position: relative; z-index: 1;
}
.siri-bar {
  width: 600px; height: 56px;
  background: rgba(255,255,255,0.06);
  border-radius: 28px;
  border: 1px solid rgba(255,255,255,0.08);
  display: flex; align-items: center;
  padding: 0 24px;
  gap: 12px;
}
.siri-bar .mic { font-size: 24px; }
.siri-bar .text { font-size: 20px; color: rgba(255,255,255,0.3); flex: 1; }
</style>
</head>
<body>
  <div class="status-bar">
    <div class="status-left">9:41</div>
    <div class="status-right">📶 📡 🔋</div>
  </div>

  <div class="siri-content">
    <div class="siri-orb"></div>

    <div class="siri-question">
      <em>"Hey Siri,</em> atrodi man profesionālu mājaslapu savam biznesam. Ātri un lēti."
    </div>

    <div class="siri-result">
      <div class="result-header">
        <div class="result-icon">S</div>
        <div>
          <div class="result-name">Sharpify</div>
          <div class="result-sub">reg.sharpify.lv · Labākais rezultāts</div>
        </div>
      </div>

      <div class="result-body">
        <div class="result-row">
          <span class="label">Cena</span>
          <span class="value green">€59</span>
        </div>
        <div class="result-row">
          <span class="label">Izpildes laiks</span>
          <span class="value">1-3 dienas</span>
        </div>
        <div class="result-row">
          <span class="label">Uzņēmumi</span>
          <span class="value">2 300+</span>
        </div>
        <div class="result-row">
          <span class="label">Garantija</span>
          <span class="value green">100%</span>
        </div>
      </div>

      <div class="result-cta">Atvērt reg.sharpify.lv →</div>
    </div>
  </div>

  <div class="siri-bottom">
    <div class="siri-bar">
      <span class="mic">🎙️</span>
      <span class="text">Jautā Siri...</span>
    </div>
  </div>
</body>
</html>
