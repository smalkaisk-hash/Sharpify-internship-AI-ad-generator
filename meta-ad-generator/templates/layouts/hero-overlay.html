<!DOCTYPE html>
<html lang="{{language}}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1080">
  <link rel="stylesheet" href="../base.css">
  <!-- Google Fonts — replaced per client -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* === TEMPLATE: Hero Overlay ===
       Full-bleed image with gradient overlay + text content on bottom half.
       Best for: strong hero photo, emotional hook, personal brands.
    */
    :root {
      --color-primary: {{color_primary}};
      --color-secondary: {{color_secondary}};
      --color-accent: {{color_accent}};
      --color-bg: {{color_bg}};
      --color-text: {{color_text}};
      --color-cta-bg: {{color_cta_bg}};
      --color-cta-text: {{color_cta_text}};
      --font-heading: '{{font_heading}}', 'Montserrat', sans-serif;
      --font-body: '{{font_body}}', 'Inter', sans-serif;
    }

    .hero-section {
      position: relative;
      width: 1080px;
      height: 1080px;
      overflow: hidden;
    }

    .hero-bg {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
    }

    .hero-gradient {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        180deg,
        rgba(0, 0, 0, 0.05) 0%,
        rgba(0, 0, 0, 0.15) 35%,
        rgba(0, 0, 0, 0.70) 70%,
        rgba(0, 0, 0, 0.88) 100%
      );
    }

    .hero-content {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 0 var(--pad-outer) var(--pad-outer);
      display: flex;
      flex-direction: column;
      gap: var(--gap-elements);
    }

    .hero-content .headline {
      color: #FFFFFF;
      font-size: 72px;
      max-width: 950px;
    }

    .hero-content .body-text {
      color: rgba(255, 255, 255, 0.88);
      font-size: 36px;
      max-width: 850px;
      line-height: 1.45;
    }

    .cta-row {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 16px;
    }

    .cta-row .cta-button {
      min-width: 680px;
      height: 160px;
      font-size: 52px;
      padding: 0 60px;
      border-radius: 20px;
    }

    .logo-container {
      position: absolute;
      top: var(--pad-outer);
      left: var(--pad-outer);
      z-index: 10;
    }

    .logo-container img {
      height: 80px;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,0.3));
    }
  </style>
</head>
<body>
  <div class="hero-section">
    <!-- Background Image -->
    <img class="hero-bg" src="{{hero_image}}" alt="">

    <!-- Gradient Overlay -->
    <div class="hero-gradient"></div>

    <!-- Logo -->
    <div class="logo-container">
      <img src="{{logo_url}}" alt="{{client_name}}">
    </div>

    <!-- Content -->
    <div class="hero-content">
      <h1 class="headline">{{headline}}</h1>
      <p class="body-text">{{primary_text}}</p>
      <div class="cta-row">
        <button class="cta-button">{{cta_text}}</button>
      </div>
    </div>
  </div>
</body>
</html>
