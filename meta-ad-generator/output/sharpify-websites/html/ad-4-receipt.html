<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Montserrat:wght@700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1080px; overflow: hidden; }
body {
  width: 1080px; height: 1080px;
  background: linear-gradient(145deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
  font-family: 'Inter', sans-serif; color: #fff;
  display: flex; align-items: center; justify-content: center;
  position: relative;
}
body::before {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(ellipse at 50% 30%, rgba(16,185,129,0.06) 0%, transparent 60%);
  pointer-events: none;
}

.receipt {
  width: 680px;
  background: #fefdf8;
  border-radius: 4px;
  padding: 48px 44px 40px;
  color: #1a1a1a;
  position: relative;
  box-shadow: 0 24px 80px rgba(0,0,0,0.5);
}
/* Torn edge top */
.receipt::before {
  content: ''; position: absolute; top: -12px; left: 0; right: 0; height: 12px;
  background: linear-gradient(135deg, transparent 33.33%, #fefdf8 33.33%, #fefdf8 66.66%, transparent 66.66%),
              linear-gradient(225deg, transparent 33.33%, #fefdf8 33.33%, #fefdf8 66.66%, transparent 66.66%);
  background-size: 16px 12px;
}
/* Torn edge bottom */
.receipt::after {
  content: ''; position: absolute; bottom: -12px; left: 0; right: 0; height: 12px;
  background: linear-gradient(45deg, transparent 33.33%, #fefdf8 33.33%, #fefdf8 66.66%, transparent 66.66%),
              linear-gradient(315deg, transparent 33.33%, #fefdf8 33.33%, #fefdf8 66.66%, transparent 66.66%);
  background-size: 16px 12px;
}

.receipt-header {
  text-align: center; padding-bottom: 20px;
  border-bottom: 2px dashed #d1d5db;
}
.receipt-logo {
  font-family: 'Montserrat', sans-serif;
  font-size: 38px; font-weight: 900; letter-spacing: 3px;
  color: #0f172a;
}
.receipt-sub {
  font-size: 14px; color: #9ca3af; margin-top: 6px;
  font-family: 'JetBrains Mono', monospace;
}

.receipt-items { margin-top: 20px; }
.receipt-item {
  display: flex; justify-content: space-between; align-items: center;
  padding: 11px 0;
  border-bottom: 1px dotted #e5e7eb;
  font-family: 'JetBrains Mono', monospace;
}
.receipt-item .label { font-size: 21px; color: #374151; font-weight: 500; }
.receipt-item .value {
  font-size: 21px; font-weight: 700; color: #9ca3af;
  text-decoration: line-through;
  text-decoration-color: #ef4444;
  text-decoration-thickness: 2px;
}

.receipt-total {
  display: flex; justify-content: space-between; align-items: center;
  padding: 20px 0;
  border-top: 3px dashed #d1d5db;
  margin-top: 8px;
}
.receipt-total .label {
  font-family: 'Montserrat', sans-serif;
  font-size: 32px; font-weight: 900; color: #0f172a;
}
.receipt-total .value {
  font-family: 'Montserrat', sans-serif;
  font-size: 62px; font-weight: 900; color: #10b981;
  line-height: 1;
}

.receipt-savings {
  background: #10b981; color: #000;
  text-align: center; padding: 14px;
  border-radius: 10px; margin-top: 16px;
  font-weight: 800; font-size: 26px;
  font-family: 'Inter', sans-serif;
}

.receipt-footer {
  text-align: center; margin-top: 20px; padding-top: 16px;
  border-top: 2px dashed #d1d5db;
}
.receipt-footer p {
  font-size: 14px; color: #9ca3af;
  font-family: 'JetBrains Mono', monospace;
}
.receipt-footer .brand {
  font-family: 'Montserrat', sans-serif;
  font-weight: 900; font-size: 16px; color: #0f172a;
  margin-top: 8px; letter-spacing: 1px;
}

/* Floating badge outside receipt */
.trust-badge {
  position: absolute; top: 48px; right: 80px;
  background: rgba(16,185,129,0.15); border: 1px solid rgba(16,185,129,0.3);
  color: #10b981; padding: 10px 20px; border-radius: 50px;
  font-size: 16px; font-weight: 700;
  transform: rotate(4deg);
}
</style>
</head>
<body>
  <div class="trust-badge">2 300+ uzņēmumi ✓</div>

  <div class="receipt">
    <div class="receipt-header">
      <div class="receipt-logo">SHARPIFY</div>
      <div class="receipt-sub">Rēķins #2301 • 07.04.2026</div>
    </div>

    <div class="receipt-items">
      <div class="receipt-item">
        <span class="label">Profesionāla mājaslapa</span>
        <span class="value">€2 000</span>
      </div>
      <div class="receipt-item">
        <span class="label">Mobilā versija</span>
        <span class="value">€300</span>
      </div>
      <div class="receipt-item">
        <span class="label">Kontaktu forma</span>
        <span class="value">€150</span>
      </div>
      <div class="receipt-item">
        <span class="label">SEO optimizācija</span>
        <span class="value">€200</span>
      </div>
      <div class="receipt-item">
        <span class="label">WhatsApp čata poga</span>
        <span class="value">€100</span>
      </div>
      <div class="receipt-item">
        <span class="label">Individuāls dizains</span>
        <span class="value">€500</span>
      </div>
      <div class="receipt-item">
        <span class="label">Piegāde 1-3 dienās</span>
        <span class="value">€250</span>
      </div>
    </div>

    <div class="receipt-total">
      <span class="label">KOPĀ:</span>
      <span class="value">€59</span>
    </div>

    <div class="receipt-savings">Tu ietaupi €3 441 💰</div>

    <div class="receipt-footer">
      <p>100% apmierinātības garantija</p>
      <p class="brand">reg.sharpify.lv</p>
    </div>
  </div>
</body>
</html>
