<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1080px; overflow: hidden; }
body {
  width: 1080px; height: 1080px;
  background: #050508;
  font-family: 'Inter', sans-serif; color: #fff;
  display: flex;
  position: relative;
}

.side {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 48px 32px;
  position: relative;
}
.side.left { background: rgba(239,68,68,0.03); }
.side.right { background: rgba(16,185,129,0.03); }

/* Divider */
.divider {
  position: absolute; left: 50%; top: 0; bottom: 0;
  width: 4px; background: linear-gradient(180deg, transparent, rgba(255,255,255,0.08), transparent);
  transform: translateX(-50%); z-index: 2;
}
.divider-label {
  position: absolute; left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  background: #1a1a2e; color: #475569;
  padding: 12px 16px; border-radius: 50%;
  font-size: 20px; font-weight: 900; z-index: 3;
  border: 2px solid rgba(255,255,255,0.08);
}

.side-label {
  font-size: 20px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 3px; margin-bottom: 32px;
}
.side.left .side-label { color: #ef4444; }
.side.right .side-label { color: #10b981; }

/* Battery */
.battery {
  width: 200px; height: 380px;
  border: 6px solid rgba(255,255,255,0.15);
  border-radius: 20px;
  position: relative;
  display: flex; flex-direction: column;
  justify-content: flex-end;
  overflow: hidden;
  margin-bottom: 28px;
}
.battery::before {
  content: ''; position: absolute;
  top: -16px; left: 50%; transform: translateX(-50%);
  width: 60px; height: 12px;
  background: rgba(255,255,255,0.15);
  border-radius: 4px 4px 0 0;
}
.battery-fill {
  width: 100%; border-radius: 0 0 14px 14px;
  position: relative;
}
.side.left .battery-fill {
  height: 12%; background: linear-gradient(180deg, #ef4444, #dc2626);
}
.side.right .battery-fill {
  height: 95%; background: linear-gradient(180deg, #10b981, #059669);
}
.battery-pct {
  font-family: 'Montserrat', sans-serif;
  font-size: 56px; font-weight: 900;
  position: absolute;
  top: 50%; left: 50%; transform: translate(-50%, -50%);
}
.side.left .battery { border-color: rgba(239,68,68,0.25); }
.side.left .battery-pct { color: #ef4444; top: 30%; }
.side.right .battery { border-color: rgba(16,185,129,0.3); }
.side.right .battery-pct { color: #10b981; top: 30%; }

.side-title {
  font-family: 'Montserrat', sans-serif;
  font-size: 28px; font-weight: 900;
  text-align: center; margin-bottom: 12px;
  line-height: 1.3;
}
.side.left .side-title { color: #f87171; }
.side.right .side-title { color: #34d399; }

.side-desc {
  font-size: 20px; color: #64748b;
  text-align: center; line-height: 1.4;
  max-width: 360px;
}

.side-items {
  margin-top: 16px;
  display: flex; flex-direction: column; gap: 8px;
}
.side-item {
  font-size: 20px; display: flex; align-items: center; gap: 10px;
}
.side.left .side-item { color: #f87171; }
.side.right .side-item { color: #34d399; }

/* Bottom CTA spanning both sides */
.bottom-cta {
  position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
  z-index: 4;
  background: #10b981; color: #000;
  padding: 24px 56px; border-radius: 16px;
  font-weight: 800; font-size: 32px;
  box-shadow: 0 8px 32px rgba(16,185,129,0.3);
  white-space: nowrap;
}
</style>
</head>
<body>
  <div class="side left">
    <div class="side-label">Bez mājaslapas</div>
    <div class="battery">
      <div class="battery-pct">12%</div>
      <div class="battery-fill"></div>
    </div>
    <div class="side-title">Tavs bizness<br>mirst lēnām</div>
    <div class="side-items">
      <div class="side-item">✕ Klienti Tevi neatrod</div>
      <div class="side-item">✕ Nav uzticamības</div>
      <div class="side-item">✕ Konkurenti uzvar</div>
    </div>
  </div>

  <div class="divider"></div>
  <div class="divider-label">VS</div>

  <div class="side right">
    <div class="side-label">Ar Sharpify mājaslapu</div>
    <div class="battery">
      <div class="battery-pct">100%</div>
      <div class="battery-fill"></div>
    </div>
    <div class="side-title">Bizness aug<br>katru dienu</div>
    <div class="side-items">
      <div class="side-item">✓ Klienti pieteikās paši</div>
      <div class="side-item">✓ Profesionāls izskats</div>
      <div class="side-item">✓ Strādā 24/7</div>
    </div>
  </div>

  <div class="bottom-cta">Uzlādē savu biznesu — €59 →</div>
</body>
</html>
