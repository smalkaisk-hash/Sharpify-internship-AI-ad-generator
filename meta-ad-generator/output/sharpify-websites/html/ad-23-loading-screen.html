<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Montserrat:wght@700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1080px; overflow: hidden; }
body {
  width: 1080px; height: 1080px;
  background: #0a0a0f;
  font-family: 'Inter', sans-serif; color: #fff;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  position: relative;
}

/* Fake OS loading screen */
.loading-window {
  width: 760px;
  background: #1a1a2e;
  border-radius: 16px;
  overflow: hidden;
  border: 1px solid rgba(255,255,255,0.06);
  box-shadow: 0 32px 80px rgba(0,0,0,0.5);
  margin-bottom: 40px;
}

.window-bar {
  background: #0f0f1e; padding: 14px 20px;
  display: flex; align-items: center; gap: 10px;
}
.w-dot { width: 12px; height: 12px; border-radius: 50%; }
.w-dot.r { background: #ef4444; }
.w-dot.y { background: #f59e0b; }
.w-dot.g { background: #10b981; }
.window-url {
  flex: 1; background: rgba(255,255,255,0.05);
  border-radius: 8px; padding: 6px 14px;
  font-size: 14px; color: #475569; margin-left: 8px;
  font-family: 'JetBrains Mono', monospace;
}

.window-content {
  padding: 48px 40px;
  display: flex; flex-direction: column; align-items: center;
  text-align: center;
}

/* Spinner */
.spinner {
  width: 80px; height: 80px;
  border: 6px solid #1e293b;
  border-top: 6px solid #ef4444;
  border-radius: 50%;
  margin-bottom: 28px;
}

.loading-text {
  font-family: 'JetBrains Mono', monospace;
  font-size: 22px; color: #ef4444; margin-bottom: 16px;
}
.loading-subtext {
  font-size: 18px; color: #475569; line-height: 1.5;
}

/* Fake loading bar stuck */
.loading-bar {
  width: 100%; max-width: 400px;
  height: 12px; background: #1e293b;
  border-radius: 8px; margin-top: 20px;
  overflow: hidden;
}
.loading-bar-fill {
  width: 23%; height: 100%;
  background: #ef4444;
  border-radius: 8px;
}

/* VS divider */
.vs-divider {
  font-family: 'Montserrat', sans-serif;
  font-size: 36px; font-weight: 900; color: #333;
  margin: 32px 0;
}

/* Sharpify success card */
.success-card {
  width: 760px;
  background: rgba(16,185,129,0.06);
  border: 2px solid rgba(16,185,129,0.25);
  border-radius: 16px;
  padding: 36px 48px;
  display: flex; align-items: center; gap: 32px;
}
.success-check {
  width: 80px; height: 80px; border-radius: 50%;
  background: #10b981;
  display: flex; align-items: center; justify-content: center;
  font-size: 42px; color: #000; flex-shrink: 0;
}
.success-text {}
.success-title {
  font-family: 'Montserrat', sans-serif;
  font-size: 34px; font-weight: 900; color: #10b981;
  margin-bottom: 6px;
}
.success-desc {
  font-size: 22px; color: #94a3b8; line-height: 1.4;
}
.success-desc strong { color: #fff; }

/* Bottom CTA */
.cta-btn {
  margin-top: 36px;
  background: #10b981; color: #000;
  padding: 26px 64px; border-radius: 16px;
  font-weight: 800; font-size: 34px;
  box-shadow: 0 8px 32px rgba(16,185,129,0.3);
}
</style>
</head>
<body>
  <div class="loading-window">
    <div class="window-bar">
      <div class="w-dot r"></div><div class="w-dot y"></div><div class="w-dot g"></div>
      <div class="window-url">http://tavs-bizness.lv</div>
    </div>
    <div class="window-content">
      <div class="spinner"></div>
      <div class="loading-text">Lapa netiek ielādēta...</div>
      <div class="loading-subtext">Tava mājaslapa ir lēna, salauzta uz mobilā,<br>un klients jau ir aizgājis pie konkurenta.</div>
      <div class="loading-bar"><div class="loading-bar-fill"></div></div>
    </div>
  </div>

  <div class="vs-divider">— vai —</div>

  <div class="loading-window" style="border-color: rgba(16,185,129,0.25); margin-bottom: 0;">
    <div class="window-bar">
      <div class="w-dot r"></div><div class="w-dot y"></div><div class="w-dot g"></div>
      <div class="window-url" style="color: #10b981;">🔒 reg.sharpify.lv</div>
    </div>
    <div style="height: 310px; overflow: hidden; position: relative;">
      <img src="mobile-screenshot.png" style="width: 100%; height: 100%; object-fit: cover; object-position: top center;" alt="reg.sharpify.lv">
      <div style="position: absolute; bottom: 0; left: 0; right: 0; height: 60px; background: linear-gradient(transparent, #1a1a2e);"></div>
      <div style="position: absolute; top: 12px; right: 12px; background: #10b981; color: #000; padding: 6px 16px; border-radius: 8px; font-weight: 800; font-size: 16px;">Gatava 1-3 dienās — €59</div>
    </div>
  </div>

  <div class="cta-btn">Iegūsti savu — €59 →</div>
</body>
</html>
