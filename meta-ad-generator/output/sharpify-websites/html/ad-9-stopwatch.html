<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1080px; overflow: hidden; }
body {
  width: 1080px; height: 1080px;
  background: #000;
  font-family: 'Inter', sans-serif; color: #fff;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  position: relative;
}
body::before {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(circle at 50% 40%, rgba(16,185,129,0.07) 0%, transparent 55%);
  pointer-events: none;
}

.content { position: relative; z-index: 1; text-align: center; }

.eyebrow {
  font-size: 24px; font-weight: 700; color: #10b981;
  text-transform: uppercase; letter-spacing: 4px;
  margin-bottom: 40px;
}

/* Stopwatch circle */
.stopwatch {
  width: 420px; height: 420px;
  border-radius: 50%;
  border: 6px solid rgba(16,185,129,0.25);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  margin: 0 auto 44px;
  position: relative;
  background: rgba(16,185,129,0.03);
}
.stopwatch::before {
  content: ''; position: absolute;
  width: 440px; height: 440px; border-radius: 50%;
  border: 2px solid rgba(16,185,129,0.08);
}
.stopwatch .time-big {
  font-family: 'Montserrat', sans-serif;
  font-size: 120px; font-weight: 900; color: #10b981;
  line-height: 1;
}
.stopwatch .time-label {
  font-size: 28px; color: #64748b; font-weight: 600;
  margin-top: 8px;
}

.vs-row {
  display: flex; justify-content: center; gap: 64px;
  margin-bottom: 48px;
}
.vs-item { text-align: center; }
.vs-item .val {
  font-family: 'Montserrat', sans-serif;
  font-size: 52px; font-weight: 900; line-height: 1;
}
.vs-item.them .val { color: #ef4444; }
.vs-item.us .val { color: #10b981; }
.vs-item .lbl {
  font-size: 22px; color: #64748b; margin-top: 8px; font-weight: 500;
}
.vs-divider {
  font-size: 36px; color: #333; font-weight: 900;
  display: flex; align-items: center;
}

.main-text {
  font-family: 'Montserrat', sans-serif;
  font-size: 52px; font-weight: 900;
  line-height: 1.2; margin-bottom: 20px;
}
.main-text span { color: #10b981; }
.sub-text {
  font-size: 28px; color: #94a3b8; margin-bottom: 40px;
}

.cta-btn {
  background: #10b981; color: #000;
  padding: 28px 72px; border-radius: 16px;
  font-weight: 800; font-size: 36px;
  display: inline-block;
  box-shadow: 0 8px 32px rgba(16,185,129,0.3);
}
</style>
</head>
<body>
<div class="content">
  <div class="eyebrow">Laiks ir nauda</div>

  <div class="stopwatch">
    <div class="time-big">1-3</div>
    <div class="time-label">darba dienas</div>
  </div>

  <div class="vs-row">
    <div class="vs-item them">
      <div class="val">4-12 ned.</div>
      <div class="lbl">Aģentūra</div>
    </div>
    <div class="vs-divider">VS</div>
    <div class="vs-item us">
      <div class="val">1-3 dienas</div>
      <div class="lbl">Sharpify</div>
    </div>
  </div>

  <div class="main-text">Tava mājaslapa.<br><span>Gatava rīt.</span></div>
  <div class="sub-text">Profesionāla mājaslapa sākot no €59</div>

  <div class="cta-btn">Pasūtīt tagad →</div>
</div>
</body>
</html>
