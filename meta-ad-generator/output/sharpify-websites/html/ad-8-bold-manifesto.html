<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1080px; overflow: hidden; }
body {
  width: 1080px; height: 1080px;
  background: #000;
  font-family: 'Inter', sans-serif; color: #fff;
  display: flex; flex-direction: column;
  position: relative;
}

/* Left accent bar */
.accent-bar {
  position: absolute; left: 0; top: 0; bottom: 0;
  width: 8px;
  background: linear-gradient(180deg, #10b981 0%, #059669 50%, #10b981 100%);
}

.content {
  flex: 1; display: flex; flex-direction: column;
  justify-content: center;
  padding: 80px 80px 80px 100px;
}

.eyebrow {
  font-size: 24px; font-weight: 700; color: #10b981;
  text-transform: uppercase; letter-spacing: 4px;
  margin-bottom: 32px;
}

.statement {
  font-family: 'Montserrat', sans-serif;
  font-size: 72px; font-weight: 900;
  line-height: 1.15; margin-bottom: 40px;
  max-width: 900px;
}
.statement .dim { color: #4a5568; }
.statement .highlight { color: #10b981; }

.facts {
  display: flex; gap: 48px; margin-bottom: 48px;
}
.fact {
  display: flex; flex-direction: column;
}
.fact-number {
  font-family: 'Montserrat', sans-serif;
  font-size: 56px; font-weight: 900; color: #10b981;
  line-height: 1;
}
.fact-label {
  font-size: 22px; color: #64748b; margin-top: 6px; font-weight: 500;
}

.divider {
  width: 80px; height: 3px; background: #1e293b;
  margin-bottom: 40px;
}

.offer {
  font-size: 34px; color: #94a3b8; line-height: 1.5;
  max-width: 800px;
}
.offer strong { color: #fff; font-weight: 700; }
.offer .price {
  color: #10b981; font-weight: 900; font-size: 44px;
  font-family: 'Montserrat', sans-serif;
}

.cta-btn {
  margin-top: 44px;
  background: #10b981; color: #000;
  padding: 28px 72px; border-radius: 14px;
  font-weight: 800; font-size: 34px;
  display: inline-block; align-self: flex-start;
  box-shadow: 0 8px 32px rgba(16,185,129,0.3);
}

/* Bottom right branding */
.brand {
  position: absolute; bottom: 40px; right: 60px;
  font-size: 16px; color: #2d3748; font-weight: 600;
  letter-spacing: 2px;
}
</style>
</head>
<body>
  <div class="accent-bar"></div>

  <div class="content">
    <div class="eyebrow">Godīgi?</div>

    <div class="statement">
      <span class="dim">Tava mājaslapa</span><br>
      <span class="dim">izskatās tā,</span><br>
      <span class="dim">it kā būtu būvēta</span><br>
      <span class="highlight">2005. gadā.</span>
    </div>

    <div class="facts">
      <div class="fact">
        <div class="fact-number">63%</div>
        <div class="fact-label">apmeklētāju aiziet<br>no vecmodīgas lapas</div>
      </div>
      <div class="fact">
        <div class="fact-number">3 sek</div>
        <div class="fact-label">lai zaudētu<br>klientu uz visiem laikiem</div>
      </div>
    </div>

    <div class="divider"></div>

    <div class="offer">
      <strong>Profesionāla, moderna mājaslapa</strong> —<br>
      gatava 1-3 dienās, sākot no <span class="price">€59</span>
    </div>

    <div class="cta-btn">Labot to tagad →</div>
  </div>

  <div class="brand">SHARPIFY</div>
</body>
</html>
