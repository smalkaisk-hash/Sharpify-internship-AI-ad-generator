<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1080">
  <link rel="stylesheet" href="file:///C:/Users/Ritvars Volfs/meta-ad-generator-v2/meta-ad-generator/templates/base.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-primary: #00665e;
      --color-secondary: #051c20;
      --color-accent: #cedc00;
      --color-cta-bg: #cedc00;
      --color-cta-text: #051c20;
      --font-heading: 'Montserrat', sans-serif;
      --font-body: 'Montserrat', sans-serif;
    }
    .split-container { width: 1080px; height: 1080px; display: flex; flex-direction: column; overflow: hidden; }
    .split-top {
      width: 100%; height: 480px; flex-shrink: 0;
      background: linear-gradient(135deg, #00665e 0%, #004d47 40%, #051c20 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
    }
    .split-top .big-stat {
      font-family: var(--font-heading); font-size: 160px; font-weight: 900;
      color: var(--color-accent); line-height: 1;
    }
    .split-top .big-subtitle {
      font-family: var(--font-body); font-size: 34px; font-weight: 600;
      color: rgba(255,255,255,0.8); text-align: center;
    }
    .split-top .trust-line {
      font-family: var(--font-body); font-size: 24px; font-weight: 500;
      color: rgba(255,255,255,0.5);
    }
    .split-text {
      flex: 1; background-color: var(--color-secondary);
      padding: 44px var(--pad-outer) var(--pad-outer);
      display: flex; flex-direction: column; justify-content: space-between;
      align-items: center; text-align: center;
    }
    .split-text .headline { color: #FFFFFF; font-size: 64px; margin-bottom: 12px; }
    .headline-accent { color: var(--color-accent); }
    .split-text .body-text {
      color: rgba(255, 255, 255, 0.85); font-size: 34px;
      max-width: 950px; line-height: 1.4;
    }
    .split-bottom { display: flex; align-items: center; justify-content: center; }
    .split-bottom .cta-button {
      min-width: 620px; height: 130px; font-size: 44px;
      padding: 0 50px; border-radius: 18px;
    }
  </style>
</head>
<body>
  <div class="split-container">
    <div class="split-top">
      <span class="big-stat">2,300+</span>
      <span class="big-subtitle">Businesses. 26 Countries.</span>
      <span class="trust-line">One proven system.</span>
    </div>
    <div class="split-text">
      <div>
        <h1 class="headline">Stop <span class="headline-accent">hoping</span> for referrals</h1>
        <p class="body-text">Get the 4-step system to acquire B2B clients on demand. Free playbook.</p>
      </div>
      <div class="split-bottom">
        <button class="cta-button">Get Instant Access</button>
      </div>
    </div>
  </div>
</body>
</html>
