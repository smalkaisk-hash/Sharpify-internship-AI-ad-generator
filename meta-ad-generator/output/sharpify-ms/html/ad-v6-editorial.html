<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1080">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,500;1,600;1,700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1080px; height: 1080px; overflow: hidden; -webkit-font-smoothing: antialiased; }
    :root {
      --gold: #b8952a;
      --gold-light: #d4af37;
      --gold-dark: #8b6914;
      --text-dark: #1a1a1a;
      --text-muted: #6b6b6b;
      --bg: #FFFFFF;
    }
    .container {
      width: 1080px; height: 1080px; background: var(--bg);
      display: flex; flex-direction: column;
      justify-content: center; align-items: center; gap: 56px;
      padding: 72px 80px; position: relative;
    }
    .container::before {
      content: ''; position: absolute; top: 48px; left: 80px; right: 80px; height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold-light), transparent); opacity: 0.4;
    }
    .container::after {
      content: ''; position: absolute; bottom: 48px; left: 80px; right: 80px; height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold-light), transparent); opacity: 0.4;
    }
    .top-section { text-align: center; }
    .top-label {
      font-family: 'Inter', sans-serif; font-size: 28px; font-weight: 600;
      letter-spacing: 0.25em; text-transform: uppercase;
      color: var(--gold); margin-bottom: 28px;
    }
    .top-headline {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 92px; font-weight: 700; color: var(--text-dark);
      line-height: 1.1; max-width: 940px; margin: 0 auto;
    }
    .gold-text { color: var(--gold); font-style: italic; }
    .middle-section { text-align: center; padding: 0 40px; }
    .middle-text {
      font-family: 'Inter', sans-serif; font-size: 38px; font-weight: 400;
      color: var(--text-muted); line-height: 1.55; max-width: 840px; margin: 0 auto;
    }
    .middle-text em { color: var(--gold-dark); font-style: italic; font-weight: 500; }
    .bottom-section { text-align: center; }
    .bottom-details {
      font-family: 'Inter', sans-serif; font-size: 24px; font-weight: 500;
      color: var(--text-muted); letter-spacing: 0.05em;
    }
    .bottom-details strong { color: var(--gold-dark); font-weight: 600; }
  </style>
</head>
<body>
  <div class="container">
    <div class="top-section">
      <div class="top-label">✦ Free B2B Playbook</div>
      <h1 class="top-headline">
        <span class="gold-text">€50M+</span> in sales.
        One <span class="gold-text">system.</span>
        Now it's yours.
      </h1>
    </div>
    <div class="middle-section">
      <p class="middle-text">
        The exact client acquisition playbook behind <em>2,300+ businesses</em> in 26 countries. Step-by-step. No fluff. No gatekeeping.
      </p>
    </div>
    <div class="bottom-section">
      <p class="bottom-details">The MS Solution™ by Niks Jansons · <strong>Get Instant Access</strong></p>
    </div>
  </div>
</body>
</html>
