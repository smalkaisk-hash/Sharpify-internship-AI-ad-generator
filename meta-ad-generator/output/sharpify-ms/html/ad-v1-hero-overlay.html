<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1080">
  <link rel="stylesheet" href="file:///C:/Users/Ritvars Volfs/meta-ad-generator-v2/meta-ad-generator/templates/base.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-primary: #00665e;
      --color-secondary: #051c20;
      --color-accent: #cedc00;
      --color-cta-bg: #cedc00;
      --color-cta-text: #051c20;
      --font-heading: 'Montserrat', sans-serif;
      --font-body: 'Montserrat', sans-serif;
    }
    .hero-section {
      position: relative; width: 1080px; height: 1080px; overflow: hidden;
      background: linear-gradient(160deg, #051c20 0%, #00665e 50%, #051c20 100%);
    }
    .hero-content {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      padding: var(--pad-outer);
      display: flex; flex-direction: column;
      justify-content: center; align-items: center; text-align: center;
      gap: var(--gap-elements);
    }
    .event-badge {
      display: inline-block; padding: 12px 28px;
      background: var(--color-accent); color: var(--color-secondary);
      font-family: var(--font-heading); font-size: 24px; font-weight: 800;
      border-radius: 10px;
    }
    .hero-content .headline {
      color: #FFFFFF; font-size: 72px; max-width: 950px;
    }
    .hero-content .body-text {
      color: rgba(255, 255, 255, 0.85); font-size: 34px;
      max-width: 850px; line-height: 1.45;
    }
    .cta-row { display: flex; justify-content: center; margin-top: 16px; }
    .cta-row .cta-button {
      min-width: 680px; height: 160px; font-size: 52px;
      padding: 0 60px; border-radius: 20px;
    }
  </style>
</head>
<body>
  <div class="hero-section">
    <div class="hero-content">
      <span class="event-badge">Free B2B Playbook</span>
      <h1 class="headline">The Client Acquisition System Behind €50M+ in Sales</h1>
      <p class="body-text">The step-by-step system 2,300+ businesses use to go from referral-dependent to fully booked.</p>
      <div class="cta-row">
        <button class="cta-button">Get Instant Access</button>
      </div>
    </div>
  </div>
</body>
</html>
