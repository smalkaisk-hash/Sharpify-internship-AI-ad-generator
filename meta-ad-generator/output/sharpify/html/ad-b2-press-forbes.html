<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1080">
  <link rel="stylesheet" href="file:///C:/Users/Ritvars Volfs/meta-ad-generator-v2/meta-ad-generator/templates/base.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Playfair+Display:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* === TEMPLATE: Press Quote + Media Strip ===
       Forbes/press credibility with bold editorial quote.
       Best for: brands with press coverage, awards, founder stories.
    */
    :root {
      --color-primary: #00665E;
      --color-secondary: #0A1A2E;
      --color-accent: #00C9B7;
      --color-bg: #FAFAFA;
      --color-text: #0A1A2E;
      --font-heading: 'Playfair Display', serif;
      --font-body: 'Montserrat', sans-serif;
    }

    .press-container {
      width: 1080px;
      height: 1080px;
      background: var(--color-bg);
      display: flex;
      flex-direction: column;
      padding: 56px;
      position: relative;
      overflow: hidden;
    }

    /* Decorative corner accent */
    .corner-accent {
      position: absolute;
      top: 0;
      right: 0;
      width: 280px;
      height: 280px;
      background: linear-gradient(135deg, var(--color-primary) 0%, transparent 100%);
      opacity: 0.06;
    }

    /* Top bar */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 40px;
      position: relative;
      z-index: 2;
    }

    .featured-label {
      font-family: var(--font-body);
      font-size: 16px;
      font-weight: 700;
      color: var(--color-primary);
      text-transform: uppercase;
      letter-spacing: 0.2em;
    }

    .forbes-badge {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 28px;
      background: var(--color-primary);
      border-radius: 10px;
      border: 2px solid var(--color-primary);
    }

    .forbes-text {
      font-family: var(--font-heading);
      font-size: 22px;
      font-weight: 700;
      color: #FFFFFF;
      letter-spacing: 0.05em;
    }

    .forbes-sub {
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.7);
    }

    /* Divider line */
    .divider {
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, var(--color-primary), transparent);
      margin-bottom: 56px;
      opacity: 0.2;
    }

    /* Quote section */
    .quote-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      z-index: 2;
    }

    .quote-mark {
      font-family: var(--font-heading);
      font-size: 160px;
      font-weight: 800;
      color: var(--color-primary);
      opacity: 0.12;
      line-height: 0.6;
      margin-bottom: -20px;
    }

    .quote-text {
      font-family: var(--font-heading);
      font-size: 52px;
      font-weight: 700;
      color: var(--color-text);
      line-height: 1.25;
      max-width: 900px;
      margin-bottom: 32px;
    }

    .quote-text .accent {
      color: var(--color-primary);
    }

    .attribution {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 12px;
    }

    .attr-line {
      width: 48px;
      height: 3px;
      background: var(--color-accent);
      border-radius: 2px;
    }

    .attr-name {
      font-family: var(--font-body);
      font-size: 22px;
      font-weight: 700;
      color: var(--color-text);
    }

    .attr-title {
      font-family: var(--font-body);
      font-size: 18px;
      font-weight: 400;
      color: rgba(10, 26, 46, 0.5);
      margin-left: 64px;
    }

    /* Bottom stats strip */
    .stats-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 28px 0;
      border-top: 2px solid rgba(0, 102, 94, 0.1);
      position: relative;
      z-index: 2;
    }

    .strip-stat {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .strip-number {
      font-family: var(--font-body);
      font-size: 28px;
      font-weight: 800;
      color: var(--color-primary);
    }

    .strip-label {
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 500;
      color: rgba(10, 26, 46, 0.45);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .strip-divider {
      width: 1px;
      height: 40px;
      background: rgba(10, 26, 46, 0.1);
    }

    .brand-name {
      font-family: var(--font-body);
      font-size: 24px;
      font-weight: 800;
      color: var(--color-primary);
      letter-spacing: 0.03em;
    }
  </style>
</head>
<body>
  <div class="press-container">
    <div class="corner-accent"></div>

    <!-- Top bar -->
    <div class="top-bar">
      <span class="featured-label">Atzīts medijos</span>
      <div class="forbes-badge">
        <div>
          <div class="forbes-text">Forbes Baltics</div>
          <div class="forbes-sub">30 under 30</div>
        </div>
      </div>
    </div>

    <div class="divider"></div>

    <!-- Quote -->
    <div class="quote-section">
      <div class="quote-mark">"</div>
      <div class="quote-text">No nulles līdz 7 ciparu biznesam<br><span class="accent">3 gadu laikā</span> — ar sistēmu,<br>ko tagad dod saviem klientiem</div>
      <div class="attribution">
        <div class="attr-line"></div>
        <span class="attr-name">Niks Jansons</span>
      </div>
      <div class="attr-title">Dibinātājs, Sharpify</div>
    </div>

    <!-- Bottom stats strip -->
    <div class="stats-strip">
      <span class="brand-name">sharpify</span>
      <div class="strip-divider"></div>
      <div class="strip-stat">
        <span class="strip-number">€50M+</span>
        <span class="strip-label">Klientu ieņēmumi</span>
      </div>
      <div class="strip-divider"></div>
      <div class="strip-stat">
        <span class="strip-number">2 300+</span>
        <span class="strip-label">Klienti</span>
      </div>
      <div class="strip-divider"></div>
      <div class="strip-stat">
        <span class="strip-number">26</span>
        <span class="strip-label">Valstis</span>
      </div>
    </div>
  </div>
</body>
</html>
