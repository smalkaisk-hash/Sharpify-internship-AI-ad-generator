<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1080">
  <link rel="stylesheet" href="file:///C:/Users/Ritvars Volfs/meta-ad-generator-v2/meta-ad-generator/templates/base.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-primary: #00665e;
      --color-secondary: #051c20;
      --color-accent: #cedc00;
      --color-bg: #FFFFFF;
      --color-text: #222222;
      --color-cta-bg: #cedc00;
      --color-cta-text: #051c20;
      --font-heading: 'Montserrat', sans-serif;
      --font-body: 'Montserrat', sans-serif;
    }

    .split-container {
      width: 1080px;
      height: 1080px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .split-top {
      position: relative;
      width: 100%;
      height: 500px;
      flex-shrink: 0;
      overflow: hidden;
      background: linear-gradient(
        135deg,
        #00665e 0%,
        #004d47 40%,
        #051c20 100%
      );
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
    }

    .split-top .big-price {
      font-family: var(--font-heading);
      font-size: 160px;
      font-weight: 900;
      color: var(--color-accent);
      line-height: 1;
    }

    .split-top .big-subtitle {
      font-family: var(--font-body);
      font-size: 36px;
      font-weight: 600;
      color: rgba(255,255,255,0.8);
      text-align: center;
    }

    .split-top .trust-line {
      font-family: var(--font-body);
      font-size: 24px;
      font-weight: 500;
      color: rgba(255,255,255,0.5);
    }

    .split-text {
      flex: 1;
      background-color: var(--color-secondary);
      padding: 40px var(--pad-outer) var(--pad-outer);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .split-text .headline {
      color: #FFFFFF;
      font-size: 72px;
      margin-bottom: 16px;
    }

    .headline-accent {
      color: var(--color-accent);
    }

    .split-text .body-text {
      color: rgba(255, 255, 255, 0.85);
      font-size: 36px;
      margin-bottom: 20px;
      max-width: 950px;
      line-height: 1.4;
    }

    .split-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .split-bottom .cta-button {
      flex-shrink: 0;
      min-width: 520px;
      height: 120px;
      font-size: 42px;
      padding: 0 50px;
      border-radius: 18px;
    }

    .logo-container {
      position: static;
      z-index: auto;
      flex-shrink: 1;
      min-width: 0;
      overflow: hidden;
    }

    .logo-container img {
      height: 55px;
      width: auto;
      max-width: 100%;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <div class="split-container">
    <div class="split-top">
      <span class="big-price">€59</span>
      <span class="big-subtitle">Profesionāla mājaslapa</span>
      <span class="trust-line">2 300+ uzņēmumi • 1-3 dienas</span>
    </div>

    <div class="split-text">
      <div>
        <h1 class="headline">No <span class="headline-accent">'nav mājaslapas'</span> uz pilnu kalendāru</h1>
        <p class="body-text">Mājaslapa, kas būvēta pārdošanai, nevis tikai skaistumam. Gatava 1-3 dienās.</p>
      </div>
      <div class="split-bottom">
        <button class="cta-button">Iegūsti mājaslapu</button>
      </div>
    </div>
  </div>
</body>
</html>
