<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1080">
  <link rel="stylesheet" href="file:///C:/Users/Ritvars Volfs/meta-ad-generator-v2/meta-ad-generator/templates/base.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    /* === TEMPLATE: Manifesto ===
       Copy-dominant. White bg, provocative headline, short punchy sentences.
       The writing IS the ad. No images, no fluff.
    */
    :root {
      --color-primary: #00665E;
      --color-secondary: #0A1A2E;
      --color-accent: #00C9B7;
      --color-bg: #FFFFFF;
      --color-text: #0A1A2E;
      --font-heading: 'Montserrat', sans-serif;
      --font-body: 'Montserrat', sans-serif;
    }

    .manifesto-container {
      width: 1080px;
      height: 1080px;
      background: var(--color-bg);
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 80px 72px;
      position: relative;
      overflow: hidden;
    }

    /* Left accent bar */
    .left-bar {
      position: absolute;
      top: 0;
      left: 0;
      width: 8px;
      height: 100%;
      background: linear-gradient(180deg, var(--color-primary) 0%, var(--color-accent) 100%);
    }

    /* Content */
    .manifesto-headline {
      font-family: var(--font-heading);
      font-size: 58px;
      font-weight: 900;
      color: var(--color-text);
      line-height: 1.15;
      margin-bottom: 48px;
      max-width: 850px;
    }

    .manifesto-headline .accent {
      color: var(--color-primary);
    }

    .manifesto-body {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-bottom: 56px;
    }

    .manifesto-line {
      font-family: var(--font-body);
      font-size: 28px;
      font-weight: 500;
      color: var(--color-text);
      line-height: 1.5;
      max-width: 800px;
    }

    .manifesto-line .dim {
      color: rgba(10, 26, 46, 0.35);
    }

    .manifesto-line .bold {
      font-weight: 800;
      color: var(--color-primary);
    }

    /* Closing line */
    .manifesto-close {
      font-family: var(--font-heading);
      font-size: 34px;
      font-weight: 800;
      color: var(--color-primary);
      margin-bottom: 0;
    }

    /* Footer */
    .manifesto-footer {
      position: absolute;
      bottom: 56px;
      left: 72px;
      right: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .footer-brand {
      font-family: var(--font-heading);
      font-size: 24px;
      font-weight: 800;
      color: var(--color-primary);
    }

    .footer-url {
      font-family: var(--font-body);
      font-size: 20px;
      font-weight: 500;
      color: rgba(10, 26, 46, 0.4);
    }
  </style>
</head>
<body>
  <div class="manifesto-container">
    <div class="left-bar"></div>

    <div class="manifesto-headline">Kāpēc lielākā daļa<br>reklāmu <span class="accent">nesasniedz neko?</span></div>

    <div class="manifesto-body">
      <div class="manifesto-line">Bez piedāvājuma — nav konversiju.<br>Bez piltuves — nav pārdošanas.<br>Bez kopijas — nav uzmanības.</div>
      <div class="manifesto-line"><span class="bold">Mēs sākam ar sistēmu.</span></div>
    </div>

    <div class="manifesto-close">Stay Sharp & Make a Move.</div>

    <div class="manifesto-footer">
      <span class="footer-brand">sharpify</span>
      <span class="footer-url">sharpify.io</span>
    </div>
  </div>
</body>
</html>
