<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1080">
  <link rel="stylesheet" href="file:///C:/Users/Ritvars Volfs/meta-ad-generator-v2/meta-ad-generator/templates/base.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    /* === TEMPLATE: Dark Minimal SaaS ===
       Clean dark SaaS energy, bold headline, single CTA with arrow.
       Best for: digital products, apps, SaaS tools.
    */
    :root {
      --color-primary: #00665E;
      --color-secondary: #0A1A2E;
      --color-accent: #00C9B7;
      --color-bg: #0D0D0D;
      --color-text: #FFFFFF;
      --color-cta-bg: #00C9B7;
      --color-cta-text: #0A1A2E;
      --font-heading: 'Montserrat', sans-serif;
      --font-body: 'Montserrat', sans-serif;
    }

    .saas-container {
      width: 1080px;
      height: 1080px;
      background: var(--color-bg);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 80px 72px;
      position: relative;
      overflow: hidden;
    }

    /* Ambient glow */
    .ambient-glow {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 201, 183, 0.08) 0%, transparent 70%);
    }

    /* Grid lines background */
    .grid-bg {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-image:
        linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 60px 60px;
    }

    /* Category pill */
    .category-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 28px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 50px;
      font-family: var(--font-body);
      font-size: 18px;
      font-weight: 600;
      color: var(--color-accent);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-bottom: 48px;
      position: relative;
      z-index: 2;
    }

    .pill-dot {
      width: 8px;
      height: 8px;
      background: var(--color-accent);
      border-radius: 50%;
    }

    /* Headline */
    .saas-headline {
      font-family: var(--font-heading);
      font-size: 72px;
      font-weight: 900;
      color: #FFFFFF;
      line-height: 1.1;
      margin-bottom: 28px;
      max-width: 850px;
      position: relative;
      z-index: 2;
    }

    .saas-headline .gradient-text {
      background: linear-gradient(135deg, var(--color-accent) 0%, #00FFC2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Subheadline */
    .saas-sub {
      font-family: var(--font-body);
      font-size: 26px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.45);
      line-height: 1.5;
      max-width: 650px;
      margin-bottom: 56px;
      position: relative;
      z-index: 2;
    }

    /* CTA button */
    .saas-cta {
      display: inline-flex;
      align-items: center;
      gap: 16px;
      font-family: var(--font-body);
      font-size: 30px;
      font-weight: 700;
      color: var(--color-cta-text);
      background: var(--color-cta-bg);
      border: none;
      border-radius: 18px;
      padding: 30px 72px;
      cursor: pointer;
      position: relative;
      z-index: 2;
      letter-spacing: 0.02em;
    }

    .saas-cta svg {
      width: 28px;
      height: 28px;
      fill: var(--color-cta-text);
    }

    /* Trust line */
    .trust-line {
      font-family: var(--font-body);
      font-size: 17px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.25);
      margin-top: 24px;
      position: relative;
      z-index: 2;
    }

    /* Brand */
    .brand-mark {
      position: absolute;
      bottom: 56px;
      font-family: var(--font-heading);
      font-size: 22px;
      font-weight: 800;
      color: rgba(255, 255, 255, 0.15);
      letter-spacing: 0.15em;
      text-transform: lowercase;
      z-index: 2;
    }
  </style>
</head>
<body>
  <div class="saas-container">
    <div class="ambient-glow"></div>
    <div class="grid-bg"></div>

    <div class="category-pill">
      <span class="pill-dot"></span>
      Bezmaksas CRM
    </div>

    <h1 class="saas-headline">Tavs pārdošanas<br><span class="gradient-text">komandcentrs</span></h1>
    <p class="saas-sub">Līdi. Darījumi. Piltuve. Analītika.<br>Vienā rīkā. Par brīvu. Bez limita.</p>

    <button class="saas-cta">
      Sākt tagad
      <svg viewBox="0 0 24 24"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg>
    </button>
    <div class="trust-line">Nav nepieciešama kredītkarte · Iestatīts 5 minūtēs</div>

    <div class="brand-mark">sharpify</div>
  </div>
</body>
</html>
