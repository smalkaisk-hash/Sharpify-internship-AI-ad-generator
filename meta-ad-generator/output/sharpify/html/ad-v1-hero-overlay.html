<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1080">
  <link rel="stylesheet" href="file:///C:/Users/Ritvars Volfs/meta-ad-generator-v2/meta-ad-generator/templates/base.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-primary: #00665e;
      --color-secondary: #051c20;
      --color-accent: #cedc00;
      --color-bg: #FFFFFF;
      --color-text: #222222;
      --color-cta-bg: #cedc00;
      --color-cta-text: #051c20;
      --font-heading: 'Montserrat', sans-serif;
      --font-body: 'Montserrat', sans-serif;
    }

    .hero-section {
      position: relative;
      width: 1080px;
      height: 1080px;
      overflow: hidden;
      background: linear-gradient(
        160deg,
        #051c20 0%,
        #00665e 50%,
        #051c20 100%
      );
    }

    .hero-content {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      top: 0;
      padding: var(--pad-outer);
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: var(--gap-elements);
    }

    .hero-content .headline {
      color: #FFFFFF;
      font-size: 72px;
      max-width: 950px;
    }

    .hero-content .body-text {
      color: rgba(255, 255, 255, 0.88);
      font-size: 36px;
      max-width: 850px;
      line-height: 1.45;
    }

    .price-badge {
      display: inline-block;
      padding: 10px 28px;
      background: var(--color-accent);
      color: var(--color-secondary);
      font-family: var(--font-heading);
      font-size: 28px;
      font-weight: 800;
      border-radius: 10px;
      margin-bottom: 8px;
    }

    .cta-row {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 16px;
    }

    .cta-row .cta-button {
      min-width: 680px;
      height: 160px;
      font-size: 52px;
      padding: 0 60px;
      border-radius: 20px;
    }

    .logo-container {
      position: absolute;
      top: var(--pad-outer);
      left: var(--pad-outer);
      z-index: 10;
    }

    .logo-container img {
      height: 65px;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,0.3));
    }

    .trust-bar {
      position: absolute;
      top: var(--pad-outer);
      right: var(--pad-outer);
      display: flex;
      gap: 24px;
      z-index: 10;
    }

    .trust-item {
      font-family: var(--font-body);
      font-size: 20px;
      font-weight: 600;
      color: rgba(255,255,255,0.9);
      text-shadow: 0 1px 4px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>
  <div class="hero-section">
    <div class="hero-content">
      <span class="price-badge">2 300+ uzņēmumi mums uzticas</span>
      <h1 class="headline">Tava mājaslapa 1-3 dienu laikā</h1>
      <p class="body-text">Profesionāla, moderna mājaslapa pakalpojumu sniedzējiem. Individuāls dizains, nav šabloni.</p>
      <div class="cta-row">
        <button class="cta-button">Iegūsti mājaslapu — €59</button>
      </div>
    </div>
  </div>
</body>
</html>
