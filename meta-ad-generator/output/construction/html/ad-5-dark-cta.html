<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1080">
  <link rel="stylesheet" href="file:///C:/Users/Ritvars Volfs/meta-ad-generator-v2/meta-ad-generator/templates/base.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-primary: #E8930C;
      --color-bg: #0D0D0D;
      --font-heading: 'Montserrat', sans-serif;
      --font-body: 'Montserrat', sans-serif;
    }

    .container {
      width: 1080px;
      height: 1080px;
      background: var(--color-bg);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 80px 72px;
      position: relative;
      overflow: hidden;
    }

    .glow {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 600px; height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(232, 147, 12, 0.07) 0%, transparent 65%);
    }

    .grid-bg {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-image:
        linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
      background-size: 60px 60px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 28px;
      background: rgba(232, 147, 12, 0.1);
      border: 1px solid rgba(232, 147, 12, 0.25);
      border-radius: 50px;
      font-family: var(--font-body);
      font-size: 18px;
      font-weight: 600;
      color: var(--color-primary);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-bottom: 48px;
      position: relative;
      z-index: 2;
    }

    .pill-dot {
      width: 8px; height: 8px;
      background: var(--color-primary);
      border-radius: 50%;
    }

    .headline {
      font-family: var(--font-heading);
      font-size: 72px;
      font-weight: 900;
      color: #FFFFFF;
      line-height: 1.1;
      margin-bottom: 28px;
      position: relative;
      z-index: 2;
    }

    .headline .gradient-text {
      background: linear-gradient(135deg, #E8930C 0%, #FFB84D 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .sub {
      font-family: var(--font-body);
      font-size: 28px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.4);
      line-height: 1.5;
      max-width: 700px;
      margin-bottom: 56px;
      position: relative;
      z-index: 2;
    }

    .cta-btn {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      font-family: var(--font-body);
      font-size: 28px;
      font-weight: 700;
      color: var(--color-bg);
      background: var(--color-primary);
      border: none;
      border-radius: 18px;
      padding: 28px 64px;
      cursor: pointer;
      position: relative;
      z-index: 2;
    }

    .cta-btn svg {
      width: 26px; height: 26px;
      fill: var(--color-bg);
    }

    .trust-line {
      font-family: var(--font-body);
      font-size: 17px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.2);
      margin-top: 24px;
      position: relative;
      z-index: 2;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="glow"></div>
    <div class="grid-bg"></div>

    <div class="pill">
      <span class="pill-dot"></span>
      Construction Owners
    </div>

    <h1 class="headline">From Builder to<br><span class="gradient-text">Construction CEO</span></h1>
    <p class="sub">Stop being the bottleneck in your own company.<br>Start controlling the numbers that control your profit.</p>

    <button class="cta-btn">
      Learn More
      <svg viewBox="0 0 24 24"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg>
    </button>
    <div class="trust-line">For owners who know there's money leaking in the backend</div>
  </div>
</body>
</html>
