<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1080">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{width:1080px;height:1080px;overflow:hidden}
    .ad{width:1080px;height:1080px;position:relative;overflow:hidden}
    .bg{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}
    .overlay{position:absolute;top:0;left:0;width:100%;height:100%;background:linear-gradient(160deg,rgba(0,0,0,0.65) 0%,rgba(0,0,0,0.2) 40%,rgba(0,0,0,0.15) 60%,rgba(0,0,0,0.65) 100%)}
    /* Text — top left */
    .text{position:absolute;top:52px;left:52px;z-index:4;max-width:520px}
    .tag{font-family:'Montserrat',sans-serif;font-size:20px;font-weight:800;color:#CE93D8;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:14px;padding:10px 24px;background:rgba(156,39,176,0.25);backdrop-filter:blur(4px);border-radius:8px;display:inline-block}
    .h1{font-family:'Montserrat',sans-serif;font-size:68px;font-weight:900;color:#FFF;line-height:0.95;margin-bottom:16px;text-shadow:0 4px 20px rgba(0,0,0,0.5)}
    .desc{font-family:'Montserrat',sans-serif;font-size:26px;font-weight:500;color:rgba(255,255,255,0.6);line-height:1.35;margin-bottom:24px}
    .bens{display:flex;flex-direction:column;gap:10px;margin-bottom:28px}
    .ben{display:flex;align-items:center;gap:12px}
    .dot{width:10px;height:10px;border-radius:50%;background:#CE93D8;flex-shrink:0}
    .bt{font-family:'Montserrat',sans-serif;font-size:22px;font-weight:600;color:rgba(255,255,255,0.75)}
    .price{font-family:'Montserrat',sans-serif;font-size:52px;font-weight:900;color:#FFF}
    /* Product — bottom right, overlapping the face */
    .product{position:absolute;bottom:30px;right:20px;z-index:3}
    .product img{height:560px;width:auto;filter:drop-shadow(-10px -5px 40px rgba(0,0,0,0.4))}
  </style>
</head>
<body>
  <div class="ad">
    <img class="bg" src="file:///C:/Users/Ritvars Volfs/meta-ad-generator-v2/meta-ad-generator/output/naqaa-beauty/brief/images/backgrounds/bg-beauty-glow.png" alt="">
    <div class="overlay"></div>
    <div class="text">
      <div class="tag">Dušas vitamīnu filtrs</div>
      <div class="h1">Tava āda<br>ir pelnījusi<br>tīru ūdeni.</div>
      <div class="desc">Lavandas aromāts — nomierina un atjauno</div>
      <div class="bens">
        <div class="ben"><div class="dot"></div><span class="bt">Bez hlora un smagajiem metāliem</span></div>
        <div class="ben"><div class="dot"></div><span class="bt">Vitamīni katrā dušā</span></div>
        <div class="ben"><div class="dot"></div><span class="bt">Piemērots jutīgai ādai</span></div>
      </div>
      <div class="price">34,99€</div>
    </div>
    <div class="product">
      <img src="file:///C:/Users/Ritvars Volfs/meta-ad-generator-v2/meta-ad-generator/output/naqaa-beauty/brief/images/cutouts/product-lavender-meadows-with-box-cutout.png" alt="">
    </div>
  </div>
</body>
</html>
