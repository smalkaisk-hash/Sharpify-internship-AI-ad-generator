<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1080">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{width:1080px;height:1080px;overflow:hidden}
    .ad{width:1080px;height:1080px;background:#0E0508;position:relative;overflow:hidden}
    .burst{position:absolute;top:30%;left:60%;transform:translate(-50%,-50%);width:1200px;height:1200px;border-radius:50%;background:radial-gradient(circle,rgba(233,30,99,0.4) 0%,rgba(200,20,80,0.15) 30%,transparent 55%);filter:blur(60px)}
    .burst2{position:absolute;top:60%;left:40%;transform:translate(-50%,-50%);width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(255,100,150,0.2) 0%,transparent 60%);filter:blur(40px)}
    /* Product — fills the entire right 65% of the frame */
    .product{position:absolute;top:48%;left:58%;transform:translate(-50%,-48%);z-index:2}
    .product img{height:1050px;width:auto;filter:drop-shadow(-30px 0 80px rgba(233,30,99,0.3))}
    /* Text overlaid on left */
    .text{position:absolute;top:56px;left:52px;z-index:4;max-width:480px}
    .tag{font-family:'Montserrat',sans-serif;font-size:22px;font-weight:800;color:#E91E63;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:16px;padding:10px 24px;background:rgba(233,30,99,0.2);border-radius:8px;display:inline-block}
    .h1{font-family:'Montserrat',sans-serif;font-size:76px;font-weight:900;color:#FFF;line-height:0.95;margin-bottom:20px}
    .desc{font-family:'Montserrat',sans-serif;font-size:26px;font-weight:500;color:rgba(255,255,255,0.55);line-height:1.35;margin-bottom:28px}
    .bens{display:flex;flex-direction:column;gap:12px;margin-bottom:32px}
    .ben{display:flex;align-items:center;gap:12px}
    .dot{width:10px;height:10px;border-radius:50%;background:#E91E63;flex-shrink:0}
    .bt{font-family:'Montserrat',sans-serif;font-size:22px;font-weight:600;color:rgba(255,255,255,0.7)}
    .price{font-family:'Montserrat',sans-serif;font-size:56px;font-weight:900;color:#FFF}
  </style>
</head>
<body>
  <div class="ad">
    <div class="burst"></div>
    <div class="burst2"></div>
    <div class="text">
      <div class="tag">Dušas filtrs</div>
      <div class="h1">Tīrāks<br>ūdens.<br>Maigāka<br>āda.</div>
      <div class="desc">Vitamīnu filtrs ar rožu aromātu — attīra hloru un baro ādu</div>
      <div class="bens">
        <div class="ben"><div class="dot"></div><span class="bt">Bez hlora un smagajiem metāliem</span></div>
        <div class="ben"><div class="dot"></div><span class="bt">Vitamīni ādai un matiem</span></div>
        <div class="ben"><div class="dot"></div><span class="bt">Dermatoloģiski pārbaudīts</span></div>
      </div>
      <div class="price">34,99€</div>
    </div>
    <div class="product">
      <img src="file:///C:/Users/Ritvars Volfs/meta-ad-generator-v2/meta-ad-generator/output/naqaa-beauty/brief/images/cutouts/product-precious-rose-with-box-cutout.png" alt="">
    </div>
  </div>
</body>
</html>
