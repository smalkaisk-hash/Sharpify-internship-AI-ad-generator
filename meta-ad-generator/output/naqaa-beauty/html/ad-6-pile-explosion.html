<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1080">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{width:1080px;height:1080px;overflow:hidden}
    .ad{width:1080px;height:1080px;background:#080608;position:relative;overflow:hidden}
    /* Multi-color glow — all 4 scent colors blended */
    .g1{position:absolute;top:20%;left:20%;width:500px;height:500px;border-radius:50%;background:rgba(233,30,99,0.15);filter:blur(80px)}
    .g2{position:absolute;top:60%;left:60%;width:500px;height:500px;border-radius:50%;background:rgba(149,117,205,0.15);filter:blur(80px)}
    .g3{position:absolute;top:30%;left:70%;width:400px;height:400px;border-radius:50%;background:rgba(255,152,0,0.12);filter:blur(80px)}
    .g4{position:absolute;top:65%;left:25%;width:400px;height:400px;border-radius:50%;background:rgba(184,150,12,0.12);filter:blur(80px)}
    /* Product pile — fills center, massive */
    .product{position:absolute;top:50%;left:50%;transform:translate(-50%,-46%);z-index:3}
    .product img{height:850px;width:auto;filter:drop-shadow(0 20px 60px rgba(0,0,0,0.4))}
    /* Top text */
    .top{position:absolute;top:40px;left:0;right:0;text-align:center;z-index:4}
    .tag{font-family:'Montserrat',sans-serif;font-size:22px;font-weight:800;color:rgba(255,255,255,0.4);text-transform:uppercase;letter-spacing:0.12em;margin-bottom:10px}
    .h1{font-family:'Montserrat',sans-serif;font-size:68px;font-weight:900;color:#FFF;line-height:1}
    .h1 .gold{color:#B8960C}
    /* Bottom text */
    .bot{position:absolute;bottom:40px;left:0;right:0;text-align:center;z-index:4}
    .sub{font-family:'Montserrat',sans-serif;font-size:24px;font-weight:600;color:rgba(255,255,255,0.4);margin-bottom:16px}
    .price{font-family:'Montserrat',sans-serif;font-size:48px;font-weight:900;color:#FFF;background:rgba(184,150,12,0.25);padding:14px 48px;border-radius:16px;display:inline-block;border:1px solid rgba(184,150,12,0.3)}
  </style>
</head>
<body>
  <div class="ad">
    <div class="g1"></div><div class="g2"></div><div class="g3"></div><div class="g4"></div>
    <div class="top">
      <div class="tag">Vitamīnu dušas filtri</div>
      <div class="h1">4 aromāti. <span class="gold">Tava izvēle.</span></div>
    </div>
    <div class="product">
      <img src="file:///C:/Users/Ritvars Volfs/meta-ad-generator-v2/meta-ad-generator/output/naqaa-beauty/brief/images/cutouts/product-all-4-pile-cutout.png" alt="">
    </div>
    <div class="bot">
      <div class="sub">Attīra ūdeni · Vitamīni · Dermatoloģiski pārbaudīti</div>
      <span class="price">No 34,99€</span>
    </div>
  </div>
</body>
</html>
