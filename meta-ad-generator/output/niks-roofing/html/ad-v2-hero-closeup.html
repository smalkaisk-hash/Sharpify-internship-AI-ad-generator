<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1080">
  <link rel="stylesheet" href="file:///C:/Users/Ritvars Volfs/meta-ad-generator-v2/meta-ad-generator/templates/base.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-accent: #F59E0B;
      --font-heading: 'Montserrat', sans-serif;
      --font-body: 'Inter', sans-serif;
    }

    .hero-section {
      position: relative;
      width: 1080px;
      height: 1080px;
      overflow: hidden;
    }

    .hero-bg {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
    }

    .hero-gradient {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        180deg,
        rgba(0, 0, 0, 0.0) 0%,
        rgba(0, 0, 0, 0.05) 25%,
        rgba(0, 0, 0, 0.55) 55%,
        rgba(0, 0, 0, 0.93) 100%
      );
    }

    .hero-content {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 0 56px 56px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 20px;
    }

    .hero-content .headline {
      color: #FFFFFF;
      font-family: var(--font-heading);
      font-size: 64px;
      font-weight: 800;
      line-height: 1.14;
      max-width: 960px;
    }

    .hero-content .headline .accent {
      color: var(--color-accent);
    }

    .hero-content .body-text {
      color: rgba(255, 255, 255, 0.85);
      font-family: var(--font-body);
      font-size: 34px;
      max-width: 880px;
      line-height: 1.45;
    }

    .cta-row {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 12px;
    }

    .cta-row .cta-button {
      min-width: 680px;
      height: 150px;
      font-size: 46px;
      padding: 0 60px;
      border-radius: 20px;
      background-color: var(--color-accent);
      color: #FFFFFF;
      font-family: var(--font-heading);
      font-weight: 700;
      border: none;
      box-shadow: 0 6px 24px rgba(245, 158, 11, 0.4);
    }
  </style>
</head>
<body>
  <div class="hero-section">
    <img class="hero-bg" src="file:///C:/Users/Ritvars Volfs/meta-ad-generator-v2/meta-ad-generator/output/niks-roofing/images/roofing-closeup.png" alt="">
    <div class="hero-gradient"></div>

    <div class="hero-content">
      <h1 class="headline">Kur ir <span class="accent">nākamais</span><br>objekts?</h1>
      <p class="body-text">AI sistēma, kas katru dienu piesaista<br>jaunus klientus — kamēr Tu strādā uz jumta</p>
      <div class="cta-row">
        <button class="cta-button">Pieteikties sadarbībai</button>
      </div>
    </div>
  </div>
</body>
</html>
