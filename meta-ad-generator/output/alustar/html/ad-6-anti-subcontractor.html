<!DOCTYPE html>
<html lang="lv"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1080px;height:1080px;font-family:'Inter',sans-serif;overflow:hidden}
  .ad{position:relative;width:1080px;height:1080px;background:#0F1114;overflow:hidden}
  .bg{position:absolute;inset:0;background:url('../brief/images/hero-1.webp') center/cover no-repeat;filter:contrast(1.05) saturate(0.9)}
  .scrim{position:absolute;inset:0;background:linear-gradient(135deg,rgba(15,17,20,0.92) 0%,rgba(15,17,20,0.75) 45%,rgba(15,17,20,0.4) 100%)}
  .top{position:absolute;top:54px;left:54px;right:54px;display:flex;justify-content:space-between;align-items:center;z-index:2}
  .brand{font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:600;letter-spacing:4px;color:#F5F5F7}
  .chip{font-family:'Space Grotesk',sans-serif;font-size:11px;letter-spacing:3px;color:#F5F5F7;padding:8px 14px;border:1px solid rgba(245,245,247,0.3);border-radius:4px}
  .accent{position:absolute;top:124px;left:54px;width:56px;height:3px;background:#0066FF;z-index:2}
  .content{position:absolute;left:54px;right:220px;top:180px;z-index:2}
  .kicker{font-family:'Space Grotesk',sans-serif;font-size:13px;letter-spacing:3px;color:#0066FF;font-weight:600;margin-bottom:20px;text-transform:uppercase}
  h1{font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:108px;line-height:0.94;letter-spacing:-2.5px;color:#F5F5F7;margin-bottom:28px}
  h1 .strike{text-decoration:line-through;text-decoration-thickness:5px;text-decoration-color:#0066FF;color:rgba(245,245,247,0.6)}
  h1 .emph{color:#0066FF}
  .sub{font-size:22px;line-height:1.4;color:rgba(245,245,247,0.8);max-width:720px;margin-bottom:38px;font-weight:400}
  .cta{display:inline-flex;align-items:center;gap:12px;padding:18px 32px;background:#0066FF;color:#fff;font-weight:600;font-size:16px;border-radius:4px}
  .cta svg{width:18px;height:18px}
  .bottom{position:absolute;bottom:48px;left:54px;right:54px;display:flex;justify-content:space-between;font-family:'Space Grotesk',sans-serif;font-size:11px;letter-spacing:2.5px;color:rgba(245,245,247,0.5);text-transform:uppercase;z-index:2}
</style></head>
<body><div class="ad">
  <div class="bg"></div><div class="scrim"></div>
  <div class="top"><div class="brand">ALUSTAR</div><div class="chip">KOPŠ 2007</div></div>
  <div class="accent"></div>
  <div class="content">
    <div class="kicker">— Par atbildību</div>
    <h1><span class="strike">Apakšuzņēmēji</span><br>pazūd.<br><span class="emph">Līgumi paliek.</span></h1>
    <div class="sub">19 gadus — viens nosaukums, viens reģistrācijas numurs, viena atbildība par objektu.</div>
    <div class="cta">Pieteikt konsultāciju <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M13 5l7 7-7 7"/></svg></div>
  </div>
  <div class="bottom"><span>APDROŠINĀTAS GARANTIJAS</span><span>ALUSTAR.LV</span></div>
</div></body></html>
