<!DOCTYPE html>
<html lang="lv"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1080px;height:1080px;font-family:'Inter',sans-serif;overflow:hidden}
  .ad{position:relative;width:1080px;height:1080px;background:#0F1114;overflow:hidden}
  .bg{position:absolute;inset:0;background:url('../brief/images/hero-2.webp') center/cover no-repeat;filter:contrast(1.05) saturate(0.92)}
  .scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,17,20,0.25) 0%,rgba(15,17,20,0.45) 55%,rgba(15,17,20,0.95) 100%)}
  .vign{position:absolute;inset:0;background:radial-gradient(120% 80% at 50% 30%,transparent 40%,rgba(15,17,20,0.55) 100%)}
  .top{position:absolute;top:54px;left:54px;right:54px;display:flex;justify-content:space-between;align-items:center}
  .chip{font-family:'Space Grotesk',sans-serif;font-size:12px;font-weight:600;letter-spacing:3.5px;color:#F5F5F7;padding:10px 16px;border:1px solid rgba(245,245,247,0.25);border-radius:4px;background:rgba(15,17,20,0.35);backdrop-filter:blur(8px)}
  .brand{font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:500;letter-spacing:4px;color:#F5F5F7;opacity:0.85}
  .accent{position:absolute;top:120px;left:54px;width:48px;height:2px;background:#0066FF}
  .content{position:absolute;left:54px;right:54px;bottom:130px;color:#F5F5F7}
  .kicker{font-family:'Space Grotesk',sans-serif;font-size:13px;letter-spacing:3px;color:#0066FF;font-weight:600;margin-bottom:20px;text-transform:uppercase}
  h1{font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:82px;line-height:0.98;letter-spacing:-1.5px;margin-bottom:24px}
  h1 span{color:#0066FF}
  .sub{font-size:22px;line-height:1.4;color:rgba(245,245,247,0.82);max-width:780px;margin-bottom:36px;font-weight:400}
  .cta{display:inline-flex;align-items:center;gap:12px;padding:18px 32px;background:#0066FF;color:#fff;font-weight:600;font-size:16px;letter-spacing:0.3px;border-radius:4px}
  .cta svg{width:18px;height:18px}
  .coords{position:absolute;bottom:48px;left:54px;right:54px;display:flex;justify-content:space-between;font-family:'Space Grotesk',sans-serif;font-size:11px;letter-spacing:2px;color:rgba(245,245,247,0.45);text-transform:uppercase}
</style></head>
<body><div class="ad">
  <div class="bg"></div><div class="scrim"></div><div class="vign"></div>
  <div class="top"><div class="chip">PILNS CIKLS</div><div class="brand">ALUSTAR</div></div>
  <div class="accent"></div>
  <div class="content">
    <div class="kicker">— Projekts Rīgā</div>
    <h1>Mēs to <span>projektējām</span>.<br>Izgatavojām. Uzstādījām.</h1>
    <div class="sub">Stikla konstrukcijas un būvniecība vienā līgumā — no skices līdz objekta nodošanai.</div>
    <div class="cta">Pieteikt bezmaksas tāmi <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M13 5l7 7-7 7"/></svg></div>
  </div>
  <div class="coords"><span>56.9496° N · 24.1052° E</span><span>EST. 2007 · RĪGA</span></div>
</div></body></html>
