<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1080">
  <link rel="stylesheet" href="file:///C:/Users/Ritvars Volfs/meta-ad-generator-v2/meta-ad-generator/templates/base.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-primary: #054b81;
      --color-secondary: #D14299;
      --color-accent: #FF7063;
      --color-cta-bg: #D14299;
      --color-cta-text: #FFFFFF;
      --font-heading: 'Poppins', 'Montserrat', sans-serif;
      --font-body: 'Montserrat', 'Inter', sans-serif;
    }

    .hero-section {
      position: relative;
      width: 1080px;
      height: 1080px;
      overflow: hidden;
    }

    .hero-bg {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: center;
    }

    .hero-gradient {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: linear-gradient(
        180deg,
        rgba(3, 20, 40, 0.3) 0%,
        rgba(3, 20, 40, 0.5) 35%,
        rgba(3, 20, 40, 0.88) 62%,
        rgba(3, 20, 40, 0.96) 100%
      );
    }

    .hero-content {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 0 64px 64px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 24px;
    }

    .top-label {
      font-family: var(--font-body);
      font-size: 24px;
      font-weight: 700;
      color: var(--color-accent);
      text-transform: uppercase;
      letter-spacing: 0.15em;
    }

    .headline {
      font-family: var(--font-heading);
      font-size: 72px;
      font-weight: 800;
      color: #FFFFFF;
      line-height: 1.1;
      max-width: 940px;
    }

    .headline .accent {
      color: var(--color-accent);
    }

    .body-text {
      font-family: var(--font-body);
      font-size: 34px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.7);
      line-height: 1.5;
      max-width: 850px;
    }

    .cta-btn {
      font-family: var(--font-heading);
      font-size: 30px;
      font-weight: 700;
      color: #FFFFFF;
      background: var(--color-accent);
      border: none;
      border-radius: 16px;
      padding: 28px 68px;
      cursor: pointer;
      box-shadow: 0 4px 24px rgba(255, 112, 99, 0.4);
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="hero-section">
    <img class="hero-bg" src="file:///C:/Users/Ritvars Volfs/meta-ad-generator-v2/meta-ad-generator/output/dobuildingbetter/brief/images/stock-house-plans.jpg" alt="">
    <div class="hero-gradient"></div>

    <div class="hero-content">
      <div class="top-label">Construction Business Owners</div>
      <h1 class="headline">Know Your <span class="accent">Job Costs</span> —<br>Or You'll Always Guess</h1>
      <p class="body-text">Job costing, margin control, schedule planning —<br>the few basics that actually drive profit.</p>
      <button class="cta-btn">Get Your Free Profit Health Check →</button>
    </div>
  </div>
</body>
</html>
