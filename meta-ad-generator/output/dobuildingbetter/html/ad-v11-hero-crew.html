<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1080">
  <link rel="stylesheet" href="file:///C:/Users/Ritvars Volfs/meta-ad-generator-v2/meta-ad-generator/templates/base.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-primary: #054b81;
      --color-secondary: #D14299;
      --color-accent: #FF7063;
      --color-cta-bg: #D14299;
      --color-cta-text: #FFFFFF;
      --font-heading: 'Poppins', 'Montserrat', sans-serif;
      --font-body: 'Montserrat', 'Inter', sans-serif;
    }

    .split-container {
      width: 1080px;
      height: 1080px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .split-image {
      position: relative;
      width: 100%;
      height: 500px;
      flex-shrink: 0;
      overflow: hidden;
    }

    .split-image img {
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: center bottom;
    }

    .split-image::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 120px;
      background: linear-gradient(180deg, transparent 0%, #0D1B2A 100%);
    }

    .split-text {
      flex: 1;
      background: #0D1B2A;
      padding: 32px 64px 56px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
    }

    .headline {
      font-family: var(--font-heading);
      font-size: 62px;
      font-weight: 800;
      color: #FFFFFF;
      line-height: 1.15;
      margin-bottom: 16px;
    }

    .headline .accent {
      color: var(--color-accent);
    }

    .body-text {
      font-family: var(--font-body);
      font-size: 32px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.6);
      line-height: 1.5;
      max-width: 850px;
      margin-bottom: 8px;
    }

    .cta-btn {
      font-family: var(--font-heading);
      font-size: 30px;
      font-weight: 700;
      color: #FFFFFF;
      background: var(--color-cta-bg);
      border: none;
      border-radius: 16px;
      padding: 28px 60px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(209, 66, 153, 0.35);
    }
  </style>
</head>
<body>
  <div class="split-container">
    <div class="split-image">
      <img src="file:///C:/Users/Ritvars Volfs/meta-ad-generator-v2/meta-ad-generator/output/dobuildingbetter/brief/images/stock-construction-site.jpg" alt="">
    </div>

    <div class="split-text">
      <div>
        <h1 class="headline">You Own the Business.<br>Now Own the <span class="accent">Numbers</span>.</h1>
        <p class="body-text">Most construction owners were never taught the few basics that actually drive profit.</p>
      </div>
      <button class="cta-btn">See What's Costing You Money →</button>
    </div>
  </div>
</body>
</html>
