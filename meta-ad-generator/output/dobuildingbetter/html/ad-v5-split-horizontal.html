<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1080">
  <link rel="stylesheet" href="file:///C:/Users/Ritvars Volfs/meta-ad-generator-v2/meta-ad-generator/templates/base.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-primary: #054b81;
      --color-secondary: #D14299;
      --color-accent: #FF7063;
      --color-bg: #FFFFFF;
      --color-text: #222222;
      --color-cta-bg: #D14299;
      --color-cta-text: #FFFFFF;
      --font-heading: 'Poppins', 'Montserrat', sans-serif;
      --font-body: 'Montserrat', 'Inter', sans-serif;
    }

    .split-container {
      width: 1080px;
      height: 1080px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top half: gradient color block with key info */
    .split-top {
      width: 100%;
      height: 460px;
      flex-shrink: 0;
      background: linear-gradient(135deg, #D14299 0%, #054b81 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 56px 72px;
      position: relative;
    }

    .split-top .top-label {
      font-family: var(--font-body);
      font-size: 20px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.7);
      text-transform: uppercase;
      letter-spacing: 0.15em;
      margin-bottom: 24px;
    }

    .split-top .big-text {
      font-family: var(--font-heading);
      font-size: 64px;
      font-weight: 900;
      color: #FFFFFF;
      line-height: 1.1;
    }

    .split-top .big-text .highlight {
      color: #FFD93D;
    }

    /* Bottom half */
    .split-bottom {
      flex: 1;
      background: var(--color-primary);
      padding: 44px 64px 56px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .split-bottom .headline {
      font-family: var(--font-heading);
      font-size: 44px;
      font-weight: 700;
      color: #FFFFFF;
      line-height: 1.25;
      margin-bottom: 16px;
    }

    .split-bottom .body-text {
      font-family: var(--font-body);
      font-size: 26px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.7);
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .cta-row {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cta-btn {
      font-family: var(--font-heading);
      font-size: 26px;
      font-weight: 700;
      color: #FFFFFF;
      background: var(--color-cta-bg);
      border: none;
      border-radius: 16px;
      padding: 24px 64px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(209, 66, 153, 0.35);
    }
  </style>
</head>
<body>
  <div class="split-container">
    <div class="split-top">
      <div class="top-label">Free Profit Health Check</div>
      <div class="big-text">Your Crew Builds<br>the <span class="highlight">Project</span>.<br>You Build the <span class="highlight">Profit</span>.</div>
    </div>

    <div class="split-bottom">
      <div>
        <h1 class="headline">Know your job costs.<br>Control your margins.<br>Run a real company.</h1>
        <p class="body-text">Most construction owners were never taught<br>the few basics that actually drive profit.</p>
      </div>
      <div class="cta-row">
        <button class="cta-btn">Book My Free Strategy Call →</button>
      </div>
    </div>
  </div>
</body>
</html>
