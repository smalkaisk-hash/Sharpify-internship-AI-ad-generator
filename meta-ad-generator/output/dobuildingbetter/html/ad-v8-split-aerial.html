<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1080">
  <link rel="stylesheet" href="file:///C:/Users/Ritvars Volfs/meta-ad-generator-v2/meta-ad-generator/templates/base.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-primary: #054b81;
      --color-secondary: #D14299;
      --color-accent: #FF7063;
      --color-cta-bg: #D14299;
      --color-cta-text: #FFFFFF;
      --font-heading: 'Poppins', 'Montserrat', sans-serif;
      --font-body: 'Montserrat', 'Inter', sans-serif;
    }

    .split-container {
      width: 1080px;
      height: 1080px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .split-image {
      position: relative;
      width: 100%;
      height: 480px;
      flex-shrink: 0;
      overflow: hidden;
    }

    .split-image img {
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: center;
    }

    .split-image::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 100px;
      background: linear-gradient(180deg, transparent 0%, #054b81 100%);
    }

    /* Badge overlay on image */
    .image-badge {
      position: absolute;
      top: 32px; left: 32px;
      padding: 12px 28px;
      background: rgba(209, 66, 153, 0.9);
      color: #FFFFFF;
      font-family: var(--font-heading);
      font-size: 22px;
      font-weight: 700;
      border-radius: 10px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      z-index: 2;
    }

    .split-text {
      flex: 1;
      background: var(--color-primary);
      padding: 40px 64px 56px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      text-align: center;
      align-items: center;
    }

    .headline {
      font-family: var(--font-heading);
      font-size: 58px;
      font-weight: 800;
      color: #FFFFFF;
      line-height: 1.2;
      margin-bottom: 16px;
    }

    .headline .accent {
      color: var(--color-accent);
    }

    .body-text {
      font-family: var(--font-body);
      font-size: 30px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.7);
      line-height: 1.5;
      max-width: 900px;
    }

    .cta-btn {
      font-family: var(--font-heading);
      font-size: 30px;
      font-weight: 700;
      color: #FFFFFF;
      background: var(--color-cta-bg);
      border: none;
      border-radius: 16px;
      padding: 26px 60px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(209, 66, 153, 0.35);
    }
  </style>
</head>
<body>
  <div class="split-container">
    <div class="split-image">
      <div class="image-badge">Construction Owners</div>
      <img src="file:///C:/Users/Ritvars Volfs/meta-ad-generator-v2/meta-ad-generator/output/dobuildingbetter/brief/images/stock-aerial-site.jpg" alt="">
    </div>

    <div class="split-text">
      <div>
        <h1 class="headline">Get <span class="accent">Control</span> of Your<br>Construction Operations</h1>
        <p class="body-text">Fix scheduling, costs, and cashflow —<br>stop being the bottleneck in your own company.</p>
      </div>
      <button class="cta-btn">Book My Free Strategy Call →</button>
    </div>
  </div>
</body>
</html>
