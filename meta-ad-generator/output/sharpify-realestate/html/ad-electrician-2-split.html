<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1080">
  <link rel="stylesheet" href="file:///C:/Users/Ritvars Volfs/meta-ad-generator-v2/meta-ad-generator/templates/base.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --color-primary: #051c20; --color-teal: #00665e; --color-accent: #cedc00;
      --font-heading: 'Poppins', sans-serif; --font-body: 'Montserrat', sans-serif; }
    .split-container { width: 1080px; height: 1080px; display: flex; flex-direction: column; overflow: hidden; }
    .split-image { position: relative; width: 100%; height: 480px; flex-shrink: 0; overflow: hidden; }
    .split-image img { width: 100%; height: 100%; object-fit: cover; object-position: center; }
    .split-image::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 100px;
      background: linear-gradient(180deg, transparent 0%, #051c20 100%); }
    .image-badge { position: absolute; top: 32px; left: 32px; padding: 14px 30px;
      background: rgba(206,220,0,0.9); color: #051c20; font-family: var(--font-heading);
      font-size: 22px; font-weight: 700; border-radius: 10px; text-transform: uppercase;
      letter-spacing: 0.1em; z-index: 2; }
    .split-text { flex: 1; background: #051c20; padding: 40px 64px 56px;
      display: flex; flex-direction: column; justify-content: space-between;
      text-align: center; align-items: center; }
    .headline { font-family: var(--font-heading); font-size: 56px; font-weight: 800;
      color: #FFFFFF; line-height: 1.2; margin-bottom: 16px; }
    .headline .accent { color: var(--color-accent); }
    .body-text { font-family: var(--font-body); font-size: 28px; font-weight: 400;
      color: rgba(255,255,255,0.6); line-height: 1.5; max-width: 900px; }
    .cta-btn { font-family: var(--font-heading); font-size: 38px; font-weight: 700;
      color: #051c20; background: var(--color-accent); border: none;
      border-radius: 16px; padding: 36px 80px; cursor: pointer;
      box-shadow: 0 4px 20px rgba(206,220,0,0.3); }
  </style>
</head>
<body>
  <div class="split-container">
    <div class="split-image">
      <div class="image-badge">Electricians</div>
      <img src="file:///C:/Users/Ritvars Volfs/meta-ad-generator-v2/meta-ad-generator/output/sharpify-realestate/brief/images/stock-electrician-panel.jpg" alt="">
    </div>
    <div class="split-text">
      <div>
        <h1 class="headline">Tired of Slow Months?<br><span class="accent">Fill Your Schedule</span><br>on Autopilot.</h1>
        <p class="body-text">The system 2,300+ service businesses use<br>to get clients every week. 2 hours to manage.</p>
      </div>
      <button class="cta-btn">See How It Works →</button>
    </div>
  </div>
</body>
</html>
