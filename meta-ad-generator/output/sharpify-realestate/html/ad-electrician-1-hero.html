<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1080">
  <link rel="stylesheet" href="file:///C:/Users/Ritvars Volfs/meta-ad-generator-v2/meta-ad-generator/templates/base.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --color-primary: #051c20; --color-teal: #00665e; --color-accent: #cedc00;
      --font-heading: 'Poppins', sans-serif; --font-body: 'Montserrat', sans-serif; }
    .hero-section { position: relative; width: 1080px; height: 1080px; overflow: hidden; }
    .hero-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
    .hero-gradient { position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(180deg, rgba(5,28,32,0.15) 0%, rgba(5,28,32,0.35) 30%, rgba(5,28,32,0.88) 60%, rgba(5,28,32,0.97) 100%); }
    .hero-content { position: absolute; bottom: 0; left: 0; right: 0; padding: 0 64px 64px;
      display: flex; flex-direction: column; align-items: center; text-align: center; gap: 24px; }
    .top-label { font-family: var(--font-body); font-size: 24px; font-weight: 700;
      color: var(--color-accent); text-transform: uppercase; letter-spacing: 0.15em; }
    .headline { font-family: var(--font-heading); font-size: 70px; font-weight: 800;
      color: #FFFFFF; line-height: 1.1; max-width: 940px; }
    .headline .accent { color: var(--color-accent); }
    .body-text { font-family: var(--font-body); font-size: 32px; font-weight: 400;
      color: rgba(255,255,255,0.7); line-height: 1.5; max-width: 850px; }
    .cta-btn { font-family: var(--font-heading); font-size: 38px; font-weight: 700;
      color: #051c20; background: var(--color-accent); border: none;
      border-radius: 16px; padding: 36px 80px; cursor: pointer;
      box-shadow: 0 4px 24px rgba(206,220,0,0.3); margin-top: 8px; }
  </style>
</head>
<body>
  <div class="hero-section">
    <img class="hero-bg" src="file:///C:/Users/Ritvars Volfs/meta-ad-generator-v2/meta-ad-generator/output/sharpify-realestate/brief/images/stock-electrician-panel.jpg" alt="">
    <div class="hero-gradient"></div>
    <div class="hero-content">
      <div class="top-label">Electrical Business Owners</div>
      <h1 class="headline">What If <span class="accent">Clients Called You</span><br>Instead of You<br>Chasing Them?</h1>
      <p class="body-text">How electrical contractors get 10+ qualified<br>jobs per week — without word-of-mouth alone.</p>
      <button class="cta-btn">Get the Playbook →</button>
    </div>
  </div>
</body>
</html>
