<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1080">
  <link rel="stylesheet" href="file:///C:/Users/Ritvars Volfs/meta-ad-generator-v2/meta-ad-generator/templates/base.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-primary: #1B2A4A;
      --color-secondary: #2C4070;
      --color-accent: #E8A838;
      --color-bg: #FFFFFF;
      --color-text: #1A1A2E;
      --color-cta-bg: #E8A838;
      --color-cta-text: #FFFFFF;
      --font-heading: 'Montserrat', sans-serif;
      --font-body: 'Inter', sans-serif;
    }

    .hero-section {
      position: relative;
      width: 1080px;
      height: 1080px;
      overflow: hidden;
    }

    .hero-bg {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
    }

    .hero-gradient {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        180deg,
        rgba(0, 0, 0, 0.0) 0%,
        rgba(0, 0, 0, 0.10) 30%,
        rgba(0, 0, 0, 0.65) 60%,
        rgba(0, 0, 0, 0.92) 100%
      );
    }

    .hero-content {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 0 56px 56px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 24px;
    }

    .hero-content .headline {
      color: #FFFFFF;
      font-family: var(--font-heading);
      font-size: 68px;
      font-weight: 800;
      line-height: 1.12;
      max-width: 960px;
    }

    .hero-content .headline .accent {
      color: var(--color-accent);
    }

    .hero-content .body-text {
      color: rgba(255, 255, 255, 0.85);
      font-family: var(--font-body);
      font-size: 36px;
      max-width: 880px;
      line-height: 1.45;
    }

    .cta-row {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 12px;
    }

    .cta-row .cta-button {
      min-width: 680px;
      height: 150px;
      font-size: 48px;
      padding: 0 60px;
      border-radius: 20px;
      background-color: var(--color-accent);
      color: #FFFFFF;
      font-family: var(--font-heading);
      font-weight: 700;
      border: none;
      box-shadow: 0 6px 24px rgba(232, 168, 56, 0.4);
    }
  </style>
</head>
<body>
  <div class="hero-section">
    <img class="hero-bg" src="file:///C:/Users/Ritvars Volfs/meta-ad-generator-v2/meta-ad-generator/output/niks-beauty-pros/images/salon-hero.png" alt="">
    <div class="hero-gradient"></div>

    <div class="hero-content">
      <h1 class="headline">Vēlies <span class="accent">pilnu pierakstu</span><br>katru nedēļu?</h1>
      <p class="body-text">Palīdzam skaistumkopšanas speciālistiem<br>piesaistīt jaunus klientus ar mērķētām reklāmām</p>
      <div class="cta-row">
        <button class="cta-button">Uzzini vairāk</button>
      </div>
    </div>
  </div>
</body>
</html>
