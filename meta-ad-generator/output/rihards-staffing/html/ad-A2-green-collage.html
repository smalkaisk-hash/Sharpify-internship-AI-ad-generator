<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1080">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{width:1080px;height:1080px;overflow:hidden}
    .ad{width:1080px;height:1080px;position:relative;overflow:hidden;background:#0E3A2E}
    /* Top image */
    .image{position:absolute;top:0;left:0;right:0;height:50%;overflow:hidden}
    .image img{width:100%;height:100%;object-fit:cover}
    .image::after{content:'';position:absolute;bottom:0;left:0;right:0;height:120px;background:linear-gradient(180deg,transparent,#0E3A2E)}
    /* Side yellow accent bar */
    .accent-bar{position:absolute;top:0;left:0;width:16px;height:100%;background:#F5A623;z-index:3}
    /* Big VS / comparison style content */
    .content{position:absolute;top:50%;left:0;right:0;bottom:0;padding:48px 44px 40px;z-index:2;display:flex;flex-direction:column;justify-content:space-between}
    .tag{font-family:'Montserrat',sans-serif;font-size:14px;font-weight:800;color:#F5A623;text-transform:uppercase;letter-spacing:0.15em;margin-bottom:8px}
    .headline{font-family:'Montserrat',sans-serif;font-size:68px;font-weight:900;color:#FFFFFF;line-height:0.92;text-transform:uppercase;letter-spacing:-0.02em}
    .headline .yellow{color:#F5A623}
    .stats-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-top:18px}
    .stat{display:flex;flex-direction:column;padding:16px 18px;background:rgba(255,255,255,0.08);border-radius:10px;border-left:3px solid #F5A623}
    .stat-val{font-family:'Montserrat',sans-serif;font-size:36px;font-weight:900;color:#F5A623;line-height:1}
    .stat-label{font-family:'Montserrat',sans-serif;font-size:14px;font-weight:600;color:rgba(255,255,255,0.7);margin-top:4px}
    .cta-row{display:flex;justify-content:space-between;align-items:center;margin-top:20px}
    .brand{font-family:'Montserrat',sans-serif;font-size:15px;font-weight:700;color:rgba(255,255,255,0.45);text-transform:uppercase;letter-spacing:0.08em}
    .cta{font-family:'Montserrat',sans-serif;font-size:20px;font-weight:900;color:#0E3A2E;background:#F5A623;padding:16px 34px;border-radius:10px;text-transform:uppercase;letter-spacing:0.03em}
  </style>
</head>
<body>
  <div class="ad">
    <div class="accent-bar"></div>
    <div class="image">
      <img src="file:///C:/Users/Ritvars Volfs/meta-ad-generator-v2/claude-ad/output/rihards-staffing/brief/images/backgrounds/bg-aerial-site.png" alt="">
    </div>
    <div class="content">
      <div>
        <div class="tag">EU Workforce · Full-Service</div>
        <div class="headline">Your<br>deadline.<br>Our <span class="yellow">crew.</span></div>
      </div>
      <div>
        <div class="stats-row">
          <div class="stat"><span class="stat-val">10+</span><span class="stat-label">Workers mobilized</span></div>
          <div class="stat"><span class="stat-val">7 DAYS</span><span class="stat-label">On-site arrival</span></div>
          <div class="stat"><span class="stat-val">-30%</span><span class="stat-label">Labor cost vs local</span></div>
        </div>
        <div class="cta-row">
          <span class="brand">Construction · Industrial · Demolition</span>
          <span class="cta">Free Consultation →</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
