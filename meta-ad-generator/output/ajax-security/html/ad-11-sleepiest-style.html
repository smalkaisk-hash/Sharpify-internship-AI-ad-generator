<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1080">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{width:1080px;height:1080px;overflow:hidden}
    .ad{width:1080px;height:1080px;background:linear-gradient(160deg,#0A0E1A 0%,#141B2D 50%,#0A0E1A 100%);position:relative;overflow:hidden}
    /* Big blue ambient glow */
    .glow{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);width:700px;height:700px;border-radius:50%;background:radial-gradient(circle,rgba(59,130,246,0.12) 0%,transparent 60%);filter:blur(50px)}
    /* Product — big, upper center */
    .product{position:absolute;top:44%;left:50%;transform:translate(-50%,-50%);z-index:2}
    .product img{height:480px;width:auto;filter:drop-shadow(0 20px 60px rgba(0,0,0,0.5))}
    /* Top left — headline */
    .top{position:absolute;top:40px;left:44px;z-index:3;max-width:500px}
    .tag{font-family:'Montserrat',sans-serif;font-size:20px;font-weight:800;color:#3B82F6;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:10px}
    .h1{font-family:'Montserrat',sans-serif;font-size:56px;font-weight:900;color:#FFF;line-height:1.0}
    .h1 .blue{color:#60A5FA}
    /* Benefit pills — right side, stacked */
    .pills{position:absolute;top:50px;right:44px;z-index:3;display:flex;flex-direction:column;gap:12px;align-items:flex-end}
    .pill{padding:12px 24px;background:rgba(59,130,246,0.1);border-radius:12px;font-family:'Montserrat',sans-serif;font-size:20px;font-weight:700;color:#FFF;display:flex;align-items:center;gap:10px}
    .pill-icon{color:#3B82F6;font-size:20px}
    /* Bottom — price left, CTA right */
    .bot{position:absolute;bottom:44px;left:44px;right:44px;z-index:3;display:flex;align-items:center;justify-content:space-between}
    .price{font-family:'Montserrat',sans-serif;font-size:60px;font-weight:900;color:#FFF}
    .cta{font-family:'Montserrat',sans-serif;font-size:26px;font-weight:800;color:#FFF;background:#3B82F6;padding:20px 48px;border-radius:14px;border:none}
  </style>
</head>
<body>
  <div class="ad">
    <div class="glow"></div>
    <div class="top">
      <div class="tag">Ajax mini komplekts</div>
      <div class="h1">Drošības<br>sistēma, kas<br><span class="blue">tiešām ziņo.</span></div>
    </div>
    <div class="pills">
      <div class="pill"><span class="pill-icon">✔</span> Tūlītēji paziņojumi</div>
      <div class="pill"><span class="pill-icon">✔</span> Vadi no telefona</div>
      <div class="pill"><span class="pill-icon">✔</span> Bez vadiem</div>
      <div class="pill"><span class="pill-icon">✔</span> Mājai un birojam</div>
    </div>
    <div class="product">
      <img src="file:///C:/Users/Ritvars Volfs/meta-ad-generator-v2/meta-ad-generator/output/ajax-security/brief/images/cutouts/ajax-kit-white-bg-cutout.png" alt="">
    </div>
    <div class="bot">
      <span class="price">130€</span>
      <button class="cta">Pieteikties →</button>
    </div>
  </div>
</body>
</html>
