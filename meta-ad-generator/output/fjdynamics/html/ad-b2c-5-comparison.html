<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1080">
  <link rel="stylesheet" href="file:///C:/Users/Ritvars Volfs/meta-ad-generator-v2/meta-ad-generator/templates/base.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-primary: #1DB954;
      --font-heading: 'Montserrat', sans-serif;
      --font-body: 'Montserrat', sans-serif;
    }

    .hero-section {
      position: relative;
      width: 1080px;
      height: 1080px;
      overflow: hidden;
    }

    .hero-bg {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
    }

    .hero-gradient {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: linear-gradient(
        180deg,
        rgba(0, 0, 0, 0.05) 0%,
        rgba(0, 0, 0, 0.08) 30%,
        rgba(0, 0, 0, 0.5) 55%,
        rgba(0, 0, 0, 0.92) 78%,
        rgba(0, 0, 0, 0.96) 100%
      );
    }

    .hero-content {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 0 48px 44px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      z-index: 2;
    }

    .headline {
      font-family: var(--font-heading);
      font-size: 56px;
      font-weight: 800;
      color: #FFFFFF;
      line-height: 1.15;
    }

    .headline .accent {
      color: var(--color-primary);
    }

    .subheadline {
      font-family: var(--font-body);
      font-size: 27px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.55);
      line-height: 1.4;
      max-width: 800px;
    }

    .benefit-bar {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .benefit-chip {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 20px;
      background: rgba(29, 185, 84, 0.12);
      border: 1px solid rgba(29, 185, 84, 0.25);
      border-radius: 12px;
      backdrop-filter: blur(4px);
    }

    .benefit-chip svg {
      width: 18px;
      height: 18px;
      fill: var(--color-primary);
      flex-shrink: 0;
    }

    .benefit-chip span {
      font-family: var(--font-body);
      font-size: 18px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.85);
    }

    .footer-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 8px;
    }

    .brand {
      font-family: var(--font-heading);
      font-size: 22px;
      font-weight: 800;
      color: var(--color-primary);
    }

    .cta-btn {
      font-family: var(--font-body);
      font-size: 20px;
      font-weight: 700;
      color: #FFFFFF;
      background: var(--color-primary);
      border: none;
      border-radius: 12px;
      padding: 18px 36px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="hero-section">
    <img class="hero-bg" src="file:///C:/Users/Ritvars Volfs/meta-ad-generator-v2/meta-ad-generator/output/fjdynamics/images/fv2000-terrain.png" alt="">
    <div class="hero-gradient"></div>

    <div class="hero-content">
      <h1 class="headline">Tavs zāliens var izskatīties<br><span class="accent">perfekti</span> bez tavas iesaistes</h1>
      <p class="subheadline">Tiek galā ar slīpumiem, šķēršļiem un sarežģītu dārza plānojumu. Tu vienkārši baudi rezultātu.</p>

      <div class="benefit-bar">
        <div class="benefit-chip">
          <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/></svg>
          <span>33° slīpumi</span>
        </div>
        <div class="benefit-chip">
          <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/></svg>
          <span>3D LiDAR navigācija</span>
        </div>
        <div class="benefit-chip">
          <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/></svg>
          <span>Kluss un drošs</span>
        </div>
        <div class="benefit-chip">
          <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/></svg>
          <span>Vadāms no telefona</span>
        </div>
      </div>

      <div class="footer-row">
        <span class="brand">FJDynamics</span>
        <button class="cta-btn">Piesakies konsultācijai →</button>
      </div>
    </div>
  </div>
</body>
</html>
