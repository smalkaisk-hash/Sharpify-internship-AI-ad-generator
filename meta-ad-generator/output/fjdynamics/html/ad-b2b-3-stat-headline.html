<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1080">
  <link rel="stylesheet" href="file:///C:/Users/Ritvars Volfs/meta-ad-generator-v2/meta-ad-generator/templates/base.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-primary: #1DB954;
      --color-secondary: #0B1D0F;
      --color-accent: #1DB954;
      --color-bg: #0B1D0F;
      --color-text: #FFFFFF;
      --font-heading: 'Montserrat', sans-serif;
      --font-body: 'Montserrat', sans-serif;
    }

    .container {
      width: 1080px;
      height: 1080px;
      background: var(--color-bg);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 56px;
      position: relative;
      overflow: hidden;
    }

    /* Background texture */
    .bg-grid {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-image:
        linear-gradient(rgba(29, 185, 84, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(29, 185, 84, 0.03) 1px, transparent 1px);
      background-size: 80px 80px;
    }

    .glow {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 700px;
      height: 700px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(29, 185, 84, 0.07) 0%, transparent 65%);
    }

    /* Top label */
    .top-label {
      font-family: var(--font-body);
      font-size: 18px;
      font-weight: 700;
      color: var(--color-primary);
      text-transform: uppercase;
      letter-spacing: 0.15em;
      margin-bottom: 48px;
      position: relative;
      z-index: 2;
    }

    /* Headline */
    .headline {
      font-family: var(--font-heading);
      font-size: 52px;
      font-weight: 900;
      color: #FFFFFF;
      line-height: 1.2;
      max-width: 900px;
      margin-bottom: 24px;
      position: relative;
      z-index: 2;
    }

    .headline .accent {
      color: var(--color-primary);
    }

    .subheadline {
      font-family: var(--font-body);
      font-size: 26px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.45);
      margin-bottom: 56px;
      position: relative;
      z-index: 2;
      line-height: 1.4;
    }

    /* Stats row */
    .stats-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 40px;
      margin-bottom: 56px;
      position: relative;
      z-index: 2;
    }

    .stat-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 28px 36px;
      background: rgba(29, 185, 84, 0.08);
      border: 1px solid rgba(29, 185, 84, 0.15);
      border-radius: 16px;
      min-width: 200px;
    }

    .stat-number {
      font-family: var(--font-heading);
      font-size: 44px;
      font-weight: 900;
      color: var(--color-primary);
      line-height: 1;
    }

    .stat-label {
      font-family: var(--font-body);
      font-size: 15px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.5);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    /* Use cases */
    .use-cases {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 48px;
      position: relative;
      z-index: 2;
    }

    .use-pill {
      padding: 10px 22px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 50px;
      font-family: var(--font-body);
      font-size: 17px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.6);
    }

    .use-pill .emoji {
      margin-right: 6px;
    }

    /* CTA */
    .cta-btn {
      font-family: var(--font-body);
      font-size: 24px;
      font-weight: 700;
      color: #FFFFFF;
      background: var(--color-primary);
      border: none;
      border-radius: 16px;
      padding: 24px 56px;
      cursor: pointer;
      position: relative;
      z-index: 2;
    }

    /* Brand */
    .brand-mark {
      position: absolute;
      bottom: 56px;
      font-family: var(--font-heading);
      font-size: 20px;
      font-weight: 800;
      color: rgba(29, 185, 84, 0.3);
      letter-spacing: 0.1em;
      z-index: 2;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="bg-grid"></div>
    <div class="glow"></div>

    <div class="top-label">FJDynamics FRX</div>

    <h1 class="headline">Milzīgu platību uzturēšana ar<br><span class="accent">vienu autonomu</span> pļaušanas sistēmu</h1>
    <p class="subheadline">Pats jaudīgākais risinājums tirgū. Pļauj precīzi, sistemātiski un bez apstāšanās.</p>

    <!-- Stats -->
    <div class="stats-row">
      <div class="stat-card">
        <span class="stat-number">96 000</span>
        <span class="stat-label">m² teritorija</span>
      </div>
      <div class="stat-card">
        <span class="stat-number">24/7</span>
        <span class="stat-label">Nepārtraukts darbs</span>
      </div>
      <div class="stat-card">
        <span class="stat-number">RTK</span>
        <span class="stat-label">GPS + LiDAR</span>
      </div>
    </div>

    <!-- Use case pills -->
    <div class="use-cases">
      <span class="use-pill"><span class="emoji">⚽</span>Stadioni</span>
      <span class="use-pill"><span class="emoji">⛳</span>Golfa laukumi</span>
      <span class="use-pill"><span class="emoji">🏭</span>Industriālās zonas</span>
      <span class="use-pill"><span class="emoji">🌿</span>Parki</span>
    </div>

    <button class="cta-btn">Piesakies konsultācijai →</button>

    <div class="brand-mark">FJDynamics</div>
  </div>
</body>
</html>
