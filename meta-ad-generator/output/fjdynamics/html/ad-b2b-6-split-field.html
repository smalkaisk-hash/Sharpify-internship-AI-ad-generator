<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1080">
  <link rel="stylesheet" href="file:///C:/Users/Ritvars Volfs/meta-ad-generator-v2/meta-ad-generator/templates/base.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-primary: #1DB954;
      --color-bg: #0B1D0F;
      --font-heading: 'Montserrat', sans-serif;
      --font-body: 'Montserrat', sans-serif;
    }

    .container {
      width: 1080px;
      height: 1080px;
      background: var(--color-bg);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    /* Top: field image */
    .field-section {
      width: 100%;
      height: 460px;
      position: relative;
      overflow: hidden;
    }

    .field-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
    }

    .field-gradient {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 200px;
      background: linear-gradient(180deg, transparent 0%, #0B1D0F 100%);
    }

    /* Product overlay on field */
    .product-overlay {
      position: absolute;
      bottom: -40px;
      right: 48px;
      width: 220px;
      z-index: 3;
      filter: drop-shadow(0 10px 30px rgba(0, 0, 0, 0.6));
    }

    /* Badge on image */
    .field-badge {
      position: absolute;
      top: 28px;
      left: 28px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(29, 185, 84, 0.35);
      border-radius: 50px;
      font-family: var(--font-body);
      font-size: 15px;
      font-weight: 700;
      color: var(--color-primary);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      z-index: 3;
      backdrop-filter: blur(6px);
    }

    .badge-dot {
      width: 7px;
      height: 7px;
      background: var(--color-primary);
      border-radius: 50%;
    }

    /* Bottom: content */
    .content-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 28px 48px 40px;
      position: relative;
      z-index: 2;
    }

    .headline {
      font-family: var(--font-heading);
      font-size: 48px;
      font-weight: 800;
      color: #FFFFFF;
      line-height: 1.2;
      margin-bottom: 24px;
    }

    .headline .accent {
      color: var(--color-primary);
    }

    /* Benefits row */
    .benefits-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      flex: 1;
    }

    .benefit-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 12px;
    }

    .benefit-icon {
      font-size: 20px;
      flex-shrink: 0;
    }

    .benefit-text {
      font-family: var(--font-body);
      font-size: 20px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.8);
      line-height: 1.3;
    }

    .benefit-text .bold {
      font-weight: 700;
      color: #FFFFFF;
    }

    /* Footer */
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 20px;
    }

    .brand {
      font-family: var(--font-heading);
      font-size: 22px;
      font-weight: 800;
      color: var(--color-primary);
    }

    .brand .model {
      color: rgba(255, 255, 255, 0.4);
      font-weight: 600;
    }

    .cta-btn {
      font-family: var(--font-body);
      font-size: 20px;
      font-weight: 700;
      color: #FFFFFF;
      background: var(--color-primary);
      border: none;
      border-radius: 12px;
      padding: 18px 36px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Top: field photo -->
    <div class="field-section">
      <img class="field-img" src="file:///C:/Users/Ritvars Volfs/meta-ad-generator-v2/meta-ad-generator/output/fjdynamics/images/frx-field.webp" alt="">
      <div class="field-gradient"></div>
      <div class="field-badge">
        <span class="badge-dot"></span>
        B2B Risinājums
      </div>
      <img class="product-overlay" src="file:///C:/Users/Ritvars Volfs/meta-ad-generator-v2/meta-ad-generator/output/fjdynamics/images/frx-product-2.webp" alt="FRX">
    </div>

    <!-- Bottom: content -->
    <div class="content-section">
      <h1 class="headline">Milzīgu teritoriju uzturēšana<br>ar <span class="accent">vienu autonomu risinājumu</span></h1>

      <div class="benefits-grid">
        <div class="benefit-item">
          <span class="benefit-icon">⚽</span>
          <span class="benefit-text"><span class="bold">Futbola laukumi</span> un stadioni</span>
        </div>
        <div class="benefit-item">
          <span class="benefit-icon">⛳</span>
          <span class="benefit-text"><span class="bold">Golfa laukumi</span> un klubi</span>
        </div>
        <div class="benefit-item">
          <span class="benefit-icon">🏭</span>
          <span class="benefit-text"><span class="bold">Industriālās</span> teritorijas</span>
        </div>
        <div class="benefit-item">
          <span class="benefit-icon">🌿</span>
          <span class="benefit-text"><span class="bold">Parki</span> un pašvaldības</span>
        </div>
        <div class="benefit-item">
          <span class="benefit-icon">🤖</span>
          <span class="benefit-text">Strādā <span class="bold">24/7</span> autonomi</span>
        </div>
        <div class="benefit-item">
          <span class="benefit-icon">📡</span>
          <span class="benefit-text"><span class="bold">RTK-GPS</span> + LiDAR</span>
        </div>
      </div>

      <div class="footer">
        <span class="brand">FJDynamics <span class="model">FRX</span></span>
        <button class="cta-btn">Piesakies konsultācijai →</button>
      </div>
    </div>
  </div>
</body>
</html>
