<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1080">
  <link rel="stylesheet" href="file:///C:/Users/Ritvars Volfs/meta-ad-generator-v2/meta-ad-generator/templates/base.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-primary: #1DB954;
      --color-bg: #0B1D0F;
      --font-heading: 'Montserrat', sans-serif;
      --font-body: 'Montserrat', sans-serif;
    }

    .container {
      width: 1080px;
      height: 1080px;
      background: var(--color-bg);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    /* Top: garden aerial */
    .garden-section {
      width: 100%;
      height: 440px;
      position: relative;
      overflow: hidden;
    }

    .garden-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
    }

    .garden-gradient {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 220px;
      background: linear-gradient(180deg, transparent 0%, #0B1D0F 100%);
    }

    .garden-badge {
      position: absolute;
      top: 28px;
      left: 28px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(29, 185, 84, 0.35);
      border-radius: 50px;
      font-family: var(--font-body);
      font-size: 15px;
      font-weight: 700;
      color: var(--color-primary);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      z-index: 3;
      backdrop-filter: blur(6px);
    }

    .badge-dot {
      width: 7px;
      height: 7px;
      background: var(--color-primary);
      border-radius: 50%;
    }

    /* Content */
    .content-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 24px 48px 40px;
      position: relative;
      z-index: 2;
    }

    .headline {
      font-family: var(--font-heading);
      font-size: 44px;
      font-weight: 800;
      color: #FFFFFF;
      line-height: 1.2;
      margin-bottom: 28px;
    }

    .headline .accent {
      color: var(--color-primary);
    }

    /* Benefits */
    .benefits-list {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .benefit-row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 20px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 12px;
    }

    .benefit-check {
      width: 32px;
      height: 32px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(29, 185, 84, 0.15);
      border-radius: 9px;
    }

    .benefit-check svg {
      width: 18px;
      height: 18px;
      fill: var(--color-primary);
    }

    .benefit-text {
      font-family: var(--font-body);
      font-size: 20px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.8);
    }

    .benefit-text .bold {
      font-weight: 700;
      color: #FFFFFF;
    }

    /* Footer */
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 20px;
    }

    .brand {
      font-family: var(--font-heading);
      font-size: 22px;
      font-weight: 800;
      color: var(--color-primary);
    }

    .cta-btn {
      font-family: var(--font-body);
      font-size: 20px;
      font-weight: 700;
      color: #FFFFFF;
      background: var(--color-primary);
      border: none;
      border-radius: 12px;
      padding: 18px 36px;
      cursor: pointer;
    }
  </style>
</head>
