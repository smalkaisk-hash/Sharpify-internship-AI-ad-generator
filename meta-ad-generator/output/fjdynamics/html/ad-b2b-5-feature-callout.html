<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1080">
  <link rel="stylesheet" href="file:///C:/Users/Ritvars Volfs/meta-ad-generator-v2/meta-ad-generator/templates/base.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-primary: #1DB954;
      --color-bg: #0B1D0F;
      --font-heading: 'Montserrat', sans-serif;
      --font-body: 'Montserrat', sans-serif;
    }

    .container {
      width: 1080px;
      height: 1080px;
      background: var(--color-bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 48px 40px;
      position: relative;
      overflow: hidden;
    }

    /* Ambient glow behind product */
    .product-glow {
      position: absolute;
      top: 42%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 580px;
      height: 580px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(29, 185, 84, 0.1) 0%, transparent 65%);
    }

    /* Headline */
    .headline {
      font-family: var(--font-heading);
      font-size: 42px;
      font-weight: 800;
      color: #FFFFFF;
      text-align: center;
      line-height: 1.2;
      margin-bottom: 6px;
      position: relative;
      z-index: 2;
    }

    .headline .accent {
      color: var(--color-primary);
    }

    .subheadline {
      font-family: var(--font-body);
      font-size: 20px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.4);
      text-align: center;
      margin-bottom: 24px;
      position: relative;
      z-index: 2;
    }

    /* Middle: product + side stats */
    .middle-section {
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 32px;
      position: relative;
      z-index: 2;
    }

    .side-stats {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 240px;
    }

    .stat-card {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 22px 20px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
    }

    .stat-value {
      font-family: var(--font-heading);
      font-size: 32px;
      font-weight: 900;
      color: var(--color-primary);
      line-height: 1;
    }

    .stat-label {
      font-family: var(--font-body);
      font-size: 15px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.5);
      line-height: 1.3;
    }

    /* Product */
    .product-center {
      width: 420px;
      flex-shrink: 0;
    }

    .product-img {
      width: 100%;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 16px 48px rgba(0, 0, 0, 0.5));
    }

    /* Bottom CTA area */
    .bottom-section {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      z-index: 2;
      padding-top: 16px;
    }

    .brand {
      font-family: var(--font-heading);
      font-size: 22px;
      font-weight: 800;
      color: var(--color-primary);
    }

    .brand .model {
      color: rgba(255, 255, 255, 0.45);
      font-weight: 600;
    }

    .cta-btn {
      font-family: var(--font-body);
      font-size: 22px;
      font-weight: 700;
      color: #FFFFFF;
      background: var(--color-primary);
      border: none;
      border-radius: 14px;
      padding: 20px 44px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="product-glow"></div>

    <h1 class="headline">Autonoms zāles pļāvējs<br>teritorijām līdz <span class="accent">96 000 m²</span></h1>
    <p class="subheadline">Pats jaudīgākais risinājums tirgū</p>

    <div class="middle-section">
      <!-- Left stats -->
      <div class="side-stats">
        <div class="stat-card">
          <span class="stat-value">96 000 m²</span>
          <span class="stat-label">Maksimālā teritorija</span>
        </div>
        <div class="stat-card">
          <span class="stat-value">24/7</span>
          <span class="stat-label">Nepārtraukta darbība visaugstākajā slodzē</span>
        </div>
      </div>

      <!-- Product -->
      <div class="product-center">
        <img class="product-img" src="file:///C:/Users/Ritvars Volfs/meta-ad-generator-v2/meta-ad-generator/output/fjdynamics/images/frx-hero.webp" alt="FJDynamics FRX">
      </div>

      <!-- Right stats -->
      <div class="side-stats">
        <div class="stat-card">
          <span class="stat-value">RTK-GPS</span>
          <span class="stat-label">+ LiDAR precizitāte sarežģītā vidē</span>
        </div>
        <div class="stat-card">
          <span class="stat-value">–70%</span>
          <span class="stat-label">Mazākas izmaksas uz darbaspēku un tehniku</span>
        </div>
      </div>
    </div>

    <div class="bottom-section">
      <span class="brand">FJDynamics <span class="model">FRX</span></span>
      <button class="cta-btn">Uzzināt vairāk →</button>
    </div>
  </div>
</body>
</html>
