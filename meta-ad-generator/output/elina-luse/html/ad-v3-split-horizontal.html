<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1080">
  <link rel="stylesheet" href="file:///C:/Users/Ritvars Volfs/meta-ad-generator/templates/base.css">
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-primary: #152825;
      --color-secondary: #607179;
      --color-accent: #ff974d;
      --color-bg: #FFFFFF;
      --color-text: #2f2f2f;
      --color-cta-bg: #ff974d;
      --color-cta-text: #FFFFFF;
      --font-heading: 'Lato', 'Arial', sans-serif;
      --font-body: 'Roboto', 'Arial', sans-serif;
    }

    .split-container {
      width: 1080px;
      height: 1080px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .split-image {
      position: relative;
      width: 100%;
      height: 540px;
      flex-shrink: 0;
      overflow: hidden;
    }

    .split-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    .split-image::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 80px;
      background: linear-gradient(180deg, transparent 0%, #152825 100%);
    }

    .split-text {
      flex: 1;
      background-color: var(--color-primary);
      padding: 44px var(--pad-outer) var(--pad-outer);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .split-text .headline {
      color: #FFFFFF;
      font-size: 52px;
      margin-bottom: 16px;
    }

    .split-text .body-text {
      color: rgba(255, 255, 255, 0.85);
      font-size: 26px;
      margin-bottom: 24px;
      max-width: 850px;
    }

    .split-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .split-bottom .cta-button {
      flex-shrink: 0;
    }

    .logo-container {
      position: static;
      z-index: auto;
      flex-shrink: 1;
      min-width: 0;
      overflow: hidden;
    }

    .logo-container img {
      height: 50px;
      width: auto;
      max-width: 100%;
      object-fit: contain;
      filter: brightness(10);
    }
  </style>
</head>
<body>
  <div class="split-container">
    <div class="split-image">
      <img src="file:///C:/Users/Ritvars Volfs/meta-ad-generator/output/elina-luse/brief/images/hero-2.jpeg" alt="">
    </div>

    <div class="split-text">
      <div>
        <h1 class="headline">Mainies tu. Mainās dzīve.</h1>
        <p class="body-text">Pirms — uztraucies par ūdens kvalitāti un ienākumiem. Pēc — veselīga ģimene un savs bizness.</p>
      </div>
      <div class="split-bottom">
        <button class="cta-button">Piesakies tikšanās</button>
        <div class="logo-container">
          <img src="file:///C:/Users/Ritvars Volfs/meta-ad-generator/output/elina-luse/brief/images/logo-1.png" alt="Become The Change">
        </div>
      </div>
    </div>
  </div>
</body>
</html>
