<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1080">
  <link rel="stylesheet" href="file:///C:/Users/Ritvars Volfs/meta-ad-generator/templates/base.css">
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-primary: #152825;
      --color-secondary: #607179;
      --color-accent: #ff974d;
      --color-bg: #FFFFFF;
      --color-text: #2f2f2f;
      --color-cta-bg: #ff974d;
      --color-cta-text: #FFFFFF;
      --font-heading: 'Lato', 'Arial', sans-serif;
      --font-body: 'Roboto', 'Arial', sans-serif;
    }

    .bold-container {
      width: 1080px;
      height: 1080px;
      background-color: var(--color-primary);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    .bg-image {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      opacity: 0.12;
      filter: grayscale(50%);
    }

    .geo-circle {
      position: absolute;
      border-radius: 50%;
      border: 3px solid var(--color-accent);
      opacity: 0.12;
    }

    .geo-1 {
      width: 400px;
      height: 400px;
      top: -100px;
      right: -100px;
    }

    .geo-2 {
      width: 250px;
      height: 250px;
      bottom: 150px;
      left: -80px;
    }

    .bold-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 80px var(--pad-outer);
      position: relative;
      z-index: 2;
    }

    .bold-content .headline {
      color: #FFFFFF;
      font-size: 66px;
      line-height: 1.1;
      max-width: 900px;
      margin-bottom: 32px;
    }

    .accent-line {
      width: 80px;
      height: 5px;
      background-color: var(--color-accent);
      border-radius: 3px;
      margin-bottom: 32px;
    }

    .bold-content .body-text {
      color: rgba(255, 255, 255, 0.8);
      font-size: 30px;
      line-height: 1.5;
      max-width: 750px;
      margin-bottom: 48px;
    }

    .bold-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 28px var(--pad-outer);
      background: rgba(0, 0, 0, 0.25);
      position: relative;
      z-index: 2;
    }

    .footer-logo img {
      height: 45px;
      width: auto;
      object-fit: contain;
      filter: brightness(10);
    }

    .footer-text {
      font-family: var(--font-body);
      font-size: 20px;
      color: rgba(255, 255, 255, 0.6);
    }
  </style>
</head>
<body>
  <div class="bold-container">
    <img class="bg-image" src="file:///C:/Users/Ritvars Volfs/meta-ad-generator/output/elina-luse/brief/images/hero-2.jpeg" alt="">

    <div class="geo-circle geo-1"></div>
    <div class="geo-circle geo-2"></div>

    <div class="bold-content">
      <h1 class="headline">Veselība + bizness no mājām</h1>
      <div class="accent-line"></div>
      <p class="body-text">Iedomājies — veselīgāks ūdens ģimenei UN savs bizness no mājām. Tas ir iespējams.</p>
      <button class="cta-button">Uzzini vairāk</button>
    </div>

    <div class="bold-footer">
      <div class="footer-logo">
        <img src="file:///C:/Users/Ritvars Volfs/meta-ad-generator/output/elina-luse/brief/images/logo-1.png" alt="Become The Change">
      </div>
      <span class="footer-text">Elīna Luše · elinaluse.com</span>
    </div>
  </div>
</body>
</html>
