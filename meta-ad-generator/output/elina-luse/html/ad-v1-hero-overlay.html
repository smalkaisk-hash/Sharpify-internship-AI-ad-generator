<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1080">
  <link rel="stylesheet" href="file:///C:/Users/Ritvars Volfs/meta-ad-generator/templates/base.css">
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-primary: #152825;
      --color-secondary: #607179;
      --color-accent: #ff974d;
      --color-bg: #FFFFFF;
      --color-text: #2f2f2f;
      --color-cta-bg: #ff974d;
      --color-cta-text: #FFFFFF;
      --font-heading: 'Lato', 'Arial', sans-serif;
      --font-body: 'Roboto', 'Arial', sans-serif;
    }

    .hero-section {
      position: relative;
      width: 1080px;
      height: 1080px;
      overflow: hidden;
    }

    .hero-bg {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
    }

    .hero-gradient {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        180deg,
        rgba(21, 40, 37, 0.05) 0%,
        rgba(21, 40, 37, 0.15) 35%,
        rgba(21, 40, 37, 0.72) 65%,
        rgba(21, 40, 37, 0.92) 100%
      );
    }

    .hero-content {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 0 var(--pad-outer) var(--pad-outer);
      display: flex;
      flex-direction: column;
      gap: var(--gap-elements);
    }

    .hero-content .headline {
      color: #FFFFFF;
      font-size: 58px;
      max-width: 900px;
    }

    .hero-content .body-text {
      color: rgba(255, 255, 255, 0.88);
      font-size: 26px;
      max-width: 800px;
      line-height: 1.5;
    }

    .cta-row {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-top: 8px;
    }

    .logo-container {
      position: absolute;
      top: var(--pad-outer);
      left: var(--pad-outer);
      z-index: 10;
    }

    .logo-container img {
      height: 70px;
      width: auto;
      object-fit: contain;
      filter: brightness(10) drop-shadow(0 2px 8px rgba(0,0,0,0.3));
    }
  </style>
</head>
<body>
  <div class="hero-section">
    <img class="hero-bg" src="file:///C:/Users/Ritvars Volfs/meta-ad-generator/output/elina-luse/brief/images/hero-1.jpeg" alt="">
    <div class="hero-gradient"></div>

    <div class="logo-container">
      <img src="file:///C:/Users/Ritvars Volfs/meta-ad-generator/output/elina-luse/brief/images/logo-1.png" alt="Become The Change">
    </div>

    <div class="hero-content">
      <h1 class="headline">Tīrs ūdens. Vesela ģimene.</h1>
      <p class="body-text">Vai zini, ko dzer tava ģimene? Japānas jonizēts ūdens maina veselību. Uzzini vairāk!</p>
      <div class="cta-row">
        <button class="cta-button">Uzzini vairāk</button>
      </div>
    </div>
  </div>
</body>
</html>
