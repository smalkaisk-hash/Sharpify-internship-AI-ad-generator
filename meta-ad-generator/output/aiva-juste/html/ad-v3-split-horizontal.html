<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1080">
  <link rel="stylesheet" href="file:///C:/Users/Ritvars Volfs/meta-ad-generator/templates/base.css">
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;600;700;800&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* === TEMPLATE: Split Horizontal ===
       Image on top half, text + CTA on bottom half with brand background.
       Best for: product showcases, clear message delivery, professional brands.
    */
    :root {
      --color-primary: #785e26;
      --color-secondary: #e9ddcf;
      --color-accent: #9E3B1B;
      --color-bg: #FBF2EB;
      --color-text: #20303C;
      --color-cta-bg: #9E3B1B;
      --color-cta-text: #FFFFFF;
      --font-heading: 'EB Garamond', 'Montserrat', sans-serif;
      --font-body: 'Quicksand', 'Inter', sans-serif;
    }

    .split-container {
      width: 1080px;
      height: 1080px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .split-image {
      position: relative;
      width: 100%;
      height: 540px;
      flex-shrink: 0;
      overflow: hidden;
    }

    .split-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    .split-image::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 80px;
      background: linear-gradient(180deg, transparent 0%, #785e26 100%);
    }

    .split-text {
      flex: 1;
      background-color: var(--color-primary);
      padding: 44px var(--pad-outer) var(--pad-outer);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .split-text .headline {
      color: #FFFFFF;
      font-size: 50px;
      margin-bottom: 16px;
    }

    .split-text .body-text {
      color: rgba(255, 255, 255, 0.85);
      font-size: 26px;
      margin-bottom: 24px;
      max-width: 850px;
    }

    .split-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand-name {
      font-family: var(--font-heading);
      font-size: 22px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.8);
    }
  </style>
</head>
<body>
  <div class="split-container">
    <!-- Top: Image -->
    <div class="split-image">
      <img src="file:///C:/Users/Ritvars Volfs/meta-ad-generator/output/aiva-juste/brief/images/hero-2.jpg" alt="">
    </div>

    <!-- Bottom: Text + CTA -->
    <div class="split-text">
      <div>
        <h1 class="headline">No šaubām uz pārliecību</h1>
        <p class="body-text">Šobrīd — šaubies par katru lēmumu. Pēc 8 nedēļām — skaidrība un miers iekšā.</p>
      </div>
      <div class="split-bottom">
        <button class="cta-button">Piesakies sarunai</button>
        <span class="brand-name">Aiva Juste</span>
      </div>
    </div>
  </div>
</body>
</html>
