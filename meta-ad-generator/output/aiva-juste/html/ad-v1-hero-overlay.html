<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1080">
  <link rel="stylesheet" href="file:///C:/Users/Ritvars Volfs/meta-ad-generator/templates/base.css">
  <!-- Google Fonts — EB Garamond + Quicksand -->
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;600;700;800&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* === TEMPLATE: Hero Overlay ===
       Full-bleed image with gradient overlay + text content on bottom half.
       Best for: strong hero photo, emotional hook, personal brands.
    */
    :root {
      --color-primary: #785e26;
      --color-secondary: #e9ddcf;
      --color-accent: #9E3B1B;
      --color-bg: #FBF2EB;
      --color-text: #20303C;
      --color-cta-bg: #9E3B1B;
      --color-cta-text: #FFFFFF;
      --font-heading: 'EB Garamond', 'Montserrat', sans-serif;
      --font-body: 'Quicksand', 'Inter', sans-serif;
    }

    .hero-section {
      position: relative;
      width: 1080px;
      height: 1080px;
      overflow: hidden;
    }

    .hero-bg {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
    }

    .hero-gradient {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        180deg,
        rgba(0, 0, 0, 0.05) 0%,
        rgba(0, 0, 0, 0.15) 35%,
        rgba(0, 0, 0, 0.70) 70%,
        rgba(0, 0, 0, 0.88) 100%
      );
    }

    .hero-content {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 0 var(--pad-outer) var(--pad-outer);
      display: flex;
      flex-direction: column;
      gap: var(--gap-elements);
    }

    .hero-content .headline {
      color: #FFFFFF;
      font-size: 54px;
      max-width: 900px;
    }

    .hero-content .body-text {
      color: rgba(255, 255, 255, 0.88);
      font-size: 26px;
      max-width: 800px;
      line-height: 1.5;
    }

    .cta-row {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-top: 8px;
    }

    .brand-name {
      position: absolute;
      top: var(--pad-outer);
      left: var(--pad-outer);
      z-index: 10;
      font-family: var(--font-heading);
      font-size: 28px;
      font-weight: 700;
      color: #FFFFFF;
      text-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }
  </style>
</head>
<body>
  <div class="hero-section">
    <!-- Background Image -->
    <img class="hero-bg" src="file:///C:/Users/Ritvars Volfs/meta-ad-generator/output/aiva-juste/brief/images/hero-5.jpg" alt="">

    <!-- Gradient Overlay -->
    <div class="hero-gradient"></div>

    <!-- Brand Name -->
    <div class="brand-name">Aiva Juste</div>

    <!-- Content -->
    <div class="hero-content">
      <h1 class="headline">Atgūsti pārliecību par sevi</h1>
      <p class="body-text">Vai iekšā jūties apjukusi, pat ja ārēji viss ir kārtībā? Tu neesi viena. Atgūsti skaidrību par sevi 8 nedēļās.</p>
      <div class="cta-row">
        <button class="cta-button">Piesakies sarunai</button>
      </div>
    </div>
  </div>
</body>
</html>
