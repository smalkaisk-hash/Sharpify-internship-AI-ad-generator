<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1080">
  <link rel="stylesheet" href="file:///C:/Users/Ritvars Volfs/meta-ad-generator/templates/base.css">
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;600;700;800&family=Quicksand:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
  <style>
    /* === TEMPLATE: Testimonial Card ===
       Large quote with author photo, social proof focused.
       Best for: retargeting, trust-building, warm audiences.
    */
    :root {
      --color-primary: #785e26;
      --color-secondary: #e9ddcf;
      --color-accent: #9E3B1B;
      --color-bg: #FBF2EB;
      --color-text: #20303C;
      --color-cta-bg: #9E3B1B;
      --color-cta-text: #FFFFFF;
      --font-heading: 'EB Garamond', 'Montserrat', sans-serif;
      --font-body: 'Quicksand', 'Inter', sans-serif;
    }

    .testimonial-container {
      width: 1080px;
      height: 1080px;
      background-color: var(--color-bg);
      display: flex;
      flex-direction: column;
      padding: var(--pad-outer);
      position: relative;
    }

    .quote-mark {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 180px;
      font-weight: 700;
      color: var(--color-accent);
      line-height: 0.8;
      opacity: 0.2;
      position: absolute;
      top: 40px;
      left: 40px;
    }

    .testimonial-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 40px 20px;
      position: relative;
      z-index: 2;
    }

    .quote-text {
      font-family: var(--font-body);
      font-size: 36px;
      font-weight: 500;
      line-height: 1.5;
      color: var(--color-text);
      font-style: italic;
      max-width: 900px;
      margin-bottom: 40px;
    }

    .author-row {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .author-photo {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--color-accent);
      background-color: var(--color-secondary);
    }

    .author-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .author-name {
      font-family: var(--font-heading);
      font-size: 24px;
      font-weight: 700;
      color: var(--color-text);
    }

    .author-title {
      font-family: var(--font-body);
      font-size: 20px;
      color: var(--color-text);
      opacity: 0.6;
    }

    .testimonial-divider {
      width: 60px;
      height: 4px;
      background-color: var(--color-accent);
      border-radius: 2px;
      margin-bottom: 32px;
    }

    .testimonial-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 24px;
      border-top: 1px solid rgba(0,0,0,0.08);
    }

    .footer-brand {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .footer-brand-name {
      font-family: var(--font-heading);
      font-size: 22px;
      font-weight: 700;
      color: var(--color-primary);
    }

    /* Stars row */
    .stars {
      display: flex;
      gap: 6px;
      margin-bottom: 24px;
    }

    .star {
      width: 32px;
      height: 32px;
      color: #F5A623;
    }
  </style>
</head>
<body>
  <div class="testimonial-container">
    <!-- Decorative quote mark -->
    <div class="quote-mark">&ldquo;</div>

    <!-- Main content -->
    <div class="testimonial-body">
      <!-- Star rating -->
      <div class="stars">
        <svg class="star" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
        <svg class="star" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
        <svg class="star" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
        <svg class="star" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
        <svg class="star" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
      </div>

      <div class="testimonial-divider"></div>

      <!-- Quote -->
      <p class="quote-text">&ldquo;Pirmo reizi ilgā laikā jūtos droša savos lēmumos. Zinu, ko vēlos, un vairs nešaubos par katru soli. Koučings deva man struktūru un drošu telpu, kur atklāt to, ko jau iekšēji zināju.&rdquo;</p>

      <!-- Author -->
      <div class="author-row">
        <div class="author-photo"></div>
        <div class="author-info">
          <span class="author-name">Programmas dalībniece</span>
          <span class="author-title">Iekšējā skaidrība · 8 nedēļas</span>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div class="testimonial-footer">
      <div class="footer-brand">
        <span class="footer-brand-name">Aiva Juste · Koučs</span>
      </div>
      <button class="cta-button">Piesakies sarunai</button>
    </div>
  </div>
</body>
</html>
