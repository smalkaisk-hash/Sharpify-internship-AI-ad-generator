<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1080">
  <link rel="stylesheet" href="file:///C:/Users/Ritvars Volfs/meta-ad-generator/templates/base.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;1,700&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-primary: #b39d00;
      --color-secondary: #F7F3E8;
      --color-accent: #8B6914;
      --color-bg: #F7F3E8;
      --color-text: #242424;
      --color-cta-bg: #b39d00;
      --color-cta-text: #FFFFFF;
      --font-heading: 'Playfair Display', 'Georgia', serif;
      --font-body: 'Open Sans', 'Arial', sans-serif;
    }

    .testimonial-container {
      width: 1080px;
      height: 1080px;
      background-color: var(--color-bg);
      display: flex;
      flex-direction: column;
      padding: var(--pad-outer);
      position: relative;
    }

    .quote-mark {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 180px;
      font-weight: 700;
      color: var(--color-primary);
      line-height: 0.8;
      opacity: 0.2;
      position: absolute;
      top: 40px;
      left: 40px;
    }

    .testimonial-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 40px 20px;
      position: relative;
      z-index: 2;
    }

    .quote-text {
      font-family: var(--font-body);
      font-size: 36px;
      font-weight: 500;
      line-height: 1.5;
      color: var(--color-text);
      font-style: italic;
      max-width: 900px;
      margin-bottom: 40px;
    }

    .author-row {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .author-photo {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--color-primary);
      background-color: #e9e1cc;
    }

    .author-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .author-name {
      font-family: var(--font-heading);
      font-size: 24px;
      font-weight: 700;
      color: var(--color-text);
    }

    .author-title {
      font-family: var(--font-body);
      font-size: 20px;
      color: var(--color-text);
      opacity: 0.6;
    }

    .testimonial-divider {
      width: 60px;
      height: 4px;
      background-color: var(--color-primary);
      border-radius: 2px;
      margin-bottom: 32px;
    }

    .testimonial-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 24px;
      border-top: 1px solid rgba(0,0,0,0.08);
    }

    .footer-brand {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .footer-brand img {
      height: 50px;
      width: auto;
      object-fit: contain;
    }

    .stars {
      display: flex;
      gap: 6px;
      margin-bottom: 24px;
    }

    .star {
      width: 32px;
      height: 32px;
      color: #b39d00;
    }
  </style>
</head>
<body>
  <div class="testimonial-container">
    <div class="quote-mark">&ldquo;</div>

    <div class="testimonial-body">
      <div class="stars">
        <svg class="star" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
        <svg class="star" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
        <svg class="star" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
        <svg class="star" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
        <svg class="star" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
      </div>

      <div class="testimonial-divider"></div>

      <p class="quote-text">&ldquo;Beidzot atradu miltus, ar kuriem pankūkas izdodas vienmēr. Un putra no Kotiņu grūbām — kā bērnībā pie vecmāmiņas. Kvalitāte, ko jūt ar pirmo karoti.&rdquo;</p>

      <div class="author-row">
        <div class="author-photo"></div>
        <div class="author-info">
          <span class="author-name">Kotiņi kliente</span>
          <span class="author-title">Pastāvīga e-veikala pircēja</span>
        </div>
      </div>
    </div>

    <div class="testimonial-footer">
      <div class="footer-brand">
        <img src="file:///C:/Users/Ritvars Volfs/meta-ad-generator/output/kotini/brief/images/logo-1.png" alt="Kotiņi" style="filter: brightness(0.3);">
      </div>
      <button class="cta-button">Pasūti tagad</button>
    </div>
  </div>
</body>
</html>
