<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1080">
  <link rel="stylesheet" href="file:///C:/Users/Ritvars Volfs/meta-ad-generator/templates/base.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;800;900&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-primary: #b39d00;
      --color-secondary: #F7F3E8;
      --color-accent: #8B6914;
      --color-bg: #FFFFFF;
      --color-text: #242424;
      --color-cta-bg: #b39d00;
      --color-cta-text: #FFFFFF;
      --font-heading: 'Playfair Display', 'Georgia', serif;
      --font-body: 'Open Sans', 'Arial', sans-serif;
    }

    .hero-section {
      position: relative;
      width: 1080px;
      height: 1080px;
      overflow: hidden;
    }

    .hero-bg {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
    }

    .hero-gradient {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        180deg,
        rgba(0, 0, 0, 0.05) 0%,
        rgba(0, 0, 0, 0.10) 35%,
        rgba(0, 0, 0, 0.65) 70%,
        rgba(0, 0, 0, 0.88) 100%
      );
    }

    .hero-content {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 0 var(--pad-outer) var(--pad-outer);
      display: flex;
      flex-direction: column;
      gap: var(--gap-elements);
    }

    .hero-content .headline {
      color: #FFFFFF;
      font-size: 56px;
      max-width: 900px;
    }

    .hero-content .body-text {
      color: rgba(255, 255, 255, 0.88);
      font-size: 26px;
      max-width: 800px;
      line-height: 1.5;
    }

    .cta-row {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-top: 8px;
    }

    .logo-container {
      position: absolute;
      top: var(--pad-outer);
      left: var(--pad-outer);
      z-index: 10;
    }

    .logo-container img {
      height: 65px;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,0.3));
    }
  </style>
</head>
<body>
  <div class="hero-section">
    <img class="hero-bg" src="file:///C:/Users/Ritvars Volfs/meta-ad-generator/output/kotini/brief/images/hero-1.jpg" alt="">
    <div class="hero-gradient"></div>

    <div class="logo-container">
      <img src="file:///C:/Users/Ritvars Volfs/meta-ad-generator/output/kotini/brief/images/logo-1.png" alt="Kotiņi">
    </div>

    <div class="hero-content">
      <h1 class="headline">No lauka līdz tavam galdam</h1>
      <p class="body-text">Nezini, no kurienes nāk tava ēdiena sastāvdaļas? Kotiņi — audzējam, ražojam, garantējam kvalitāti.</p>
      <div class="cta-row">
        <button class="cta-button">Iepērcies e-veikalā</button>
      </div>
    </div>
  </div>
</body>
</html>
