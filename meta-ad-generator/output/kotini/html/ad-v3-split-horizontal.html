<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1080">
  <link rel="stylesheet" href="file:///C:/Users/Ritvars Volfs/meta-ad-generator/templates/base.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;800;900&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-primary: #3A3200;
      --color-secondary: #F7F3E8;
      --color-accent: #b39d00;
      --color-bg: #FFFFFF;
      --color-text: #242424;
      --color-cta-bg: #b39d00;
      --color-cta-text: #FFFFFF;
      --font-heading: 'Playfair Display', 'Georgia', serif;
      --font-body: 'Open Sans', 'Arial', sans-serif;
    }

    .split-container {
      width: 1080px;
      height: 1080px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .split-image {
      position: relative;
      width: 100%;
      height: 540px;
      flex-shrink: 0;
      overflow: hidden;
    }

    .split-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    .split-image::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 80px;
      background: linear-gradient(180deg, transparent 0%, #3A3200 100%);
    }

    .split-text {
      flex: 1;
      background-color: var(--color-primary);
      padding: 44px var(--pad-outer) var(--pad-outer);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .split-text .headline {
      color: #FFFFFF;
      font-size: 50px;
      margin-bottom: 16px;
    }

    .split-text .body-text {
      color: rgba(255, 255, 255, 0.85);
      font-size: 26px;
      margin-bottom: 24px;
      max-width: 850px;
    }

    .split-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .split-bottom .cta-button {
      flex-shrink: 0;
    }

    .logo-container {
      position: static;
      z-index: auto;
      flex-shrink: 1;
      min-width: 0;
      overflow: hidden;
    }

    .logo-container img {
      height: 50px;
      width: auto;
      max-width: 100%;
      object-fit: contain;
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="split-container">
    <div class="split-image">
      <img src="file:///C:/Users/Ritvars Volfs/meta-ad-generator/output/kotini/brief/images/hero-4.jpg" alt="">
    </div>

    <div class="split-text">
      <div>
        <h1 class="headline">Zini, ko ēd. Jūti garšu.</h1>
        <p class="body-text">Iepriekš — nezināji, kas ir tavā ēdienā. Tagad — zini katru soli no lauka līdz galdam.</p>
      </div>
      <div class="split-bottom">
        <button class="cta-button">Iepērcies tagad</button>
        <div class="logo-container">
          <img src="file:///C:/Users/Ritvars Volfs/meta-ad-generator/output/kotini/brief/images/logo-1.png" alt="Kotiņi">
        </div>
      </div>
    </div>
  </div>
</body>
</html>
