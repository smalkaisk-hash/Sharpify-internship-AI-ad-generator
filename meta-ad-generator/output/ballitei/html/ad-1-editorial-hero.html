<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1080px;height:1080px;font-family:'Inter',sans-serif;overflow:hidden;background:#FBF3EA}
  .ad{position:relative;width:1080px;height:1080px;overflow:hidden}
  .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(42,31,46,0.05) 0%,rgba(42,31,46,0.15) 40%,rgba(42,31,46,0.75) 100%)}
  .chip{position:absolute;top:48px;left:48px;padding:12px 22px;background:rgba(251,243,234,0.92);color:#2A1F2E;font-size:14px;font-weight:700;letter-spacing:2.5px;border-radius:999px;backdrop-filter:blur(6px)}
  .content{position:absolute;left:48px;right:48px;bottom:48px;color:#FBF3EA}
  h1{font-family:'Instrument Serif',serif;font-weight:400;font-size:96px;line-height:0.98;letter-spacing:-1.5px;margin-bottom:18px;text-shadow:0 2px 30px rgba(42,31,46,0.45)}
  .sub{font-size:22px;line-height:1.4;opacity:0.92;max-width:720px;margin-bottom:32px;font-weight:400}
  .cta{display:inline-flex;align-items:center;gap:12px;padding:18px 34px;background:#FBF3EA;color:#2A1F2E;font-weight:600;font-size:18px;border-radius:999px;letter-spacing:0.3px}
  .cta svg{width:18px;height:18px}
  .brand{position:absolute;top:52px;right:48px;font-family:'Instrument Serif',serif;font-style:italic;font-size:28px;color:#FBF3EA;text-shadow:0 2px 16px rgba(42,31,46,0.5)}
</style>
</head>
<body>
<div class="ad">
  <img class="bg" src="../brief/images/hero-5.jpg" alt="">
  <div class="overlay"></div>
  <div class="chip">GATAVIE KOMPLEKTI</div>
  <div class="brand">ballītei.lv</div>
  <div class="content">
    <h1>Pinterestīgi svētki,<br>gatavi vienā kastē.</h1>
    <div class="sub">Tematiski ballīšu komplekti — atver un uzstādi. 10 minūtes līdz gataviem svētkiem.</div>
    <div class="cta">Iepirkties <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M13 5l7 7-7 7"/></svg></div>
  </div>
</div>
</body></html>
