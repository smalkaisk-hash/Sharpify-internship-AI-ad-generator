<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1080">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-primary: #0891B2;
      --color-bg: #0F0F0F;
      --color-text: #FFFFFF;
      --font-heading: 'Montserrat', sans-serif;
      --font-body: 'Montserrat', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    .container {
      width: 1080px;
      height: 1080px;
      background: var(--color-bg);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 72px;
      position: relative;
      overflow: hidden;
    }

    .bg-glow {
      position: absolute;
      bottom: -200px; left: 50%;
      transform: translateX(-50%);
      width: 600px; height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(8, 145, 178, 0.12) 0%, transparent 65%);
    }

    .icon-row {
      display: flex;
      gap: 20px;
      margin-bottom: 48px;
      position: relative;
      z-index: 2;
    }

    .icon-box {
      width: 76px;
      height: 76px;
      background: rgba(8, 145, 178, 0.15);
      border: 1px solid rgba(8, 145, 178, 0.3);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
    }

    .headline {
      font-family: var(--font-heading);
      font-size: 70px;
      font-weight: 900;
      color: #FFFFFF;
      line-height: 1.15;
      max-width: 940px;
      margin-bottom: 36px;
      position: relative;
      z-index: 2;
    }

    .headline .accent {
      color: var(--color-primary);
    }

    .divider {
      width: 60px;
      height: 4px;
      background: var(--color-primary);
      border-radius: 2px;
      margin-bottom: 36px;
      position: relative;
      z-index: 2;
    }

    .body-text {
      font-family: var(--font-body);
      font-size: 32px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.55);
      line-height: 1.5;
      max-width: 780px;
      margin-bottom: 48px;
      position: relative;
      z-index: 2;
    }

    .cta-btn {
      font-family: var(--font-body);
      font-size: 36px;
      font-weight: 700;
      color: #FFFFFF;
      background: var(--color-primary);
      border: none;
      border-radius: 16px;
      padding: 30px 72px;
      cursor: pointer;
      position: relative;
      z-index: 2;
      box-shadow: 0 4px 24px rgba(8, 145, 178, 0.3);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="bg-glow"></div>

    <div class="icon-row">
      <div class="icon-box">🚜</div>
      <div class="icon-box">💧</div>
      <div class="icon-box">🏗️</div>
    </div>

    <h1 class="headline">No grāvju tīrīšanas līdz bioloģiskajai kanalizācijai — <span class="accent">ar vienu komandu</span></h1>
    <div class="divider"></div>
    <p class="body-text">Grāvji, ūdens novadīšana, zemes darbi un attīrīšanas iekārtas. Viss vienuviet.</p>
    <button class="cta-btn">Saņemt tāmi 24h laikā →</button>
  </div>
</body>
</html>
