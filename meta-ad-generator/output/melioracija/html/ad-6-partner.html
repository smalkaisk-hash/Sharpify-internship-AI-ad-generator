<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1080">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-primary: #0891B2;
      --color-bg: #1A1A1A;
      --font-heading: 'Montserrat', sans-serif;
      --font-body: 'Montserrat', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    .container {
      width: 1080px;
      height: 1080px;
      background: var(--color-bg);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 72px;
      position: relative;
      overflow: hidden;
    }

    .corner-accent {
      position: absolute;
      width: 200px;
      height: 200px;
      border: 3px solid var(--color-primary);
      opacity: 0.1;
    }

    .corner-tl { top: 40px; left: 40px; border-right: none; border-bottom: none; border-radius: 20px 0 0 0; }
    .corner-br { bottom: 40px; right: 40px; border-left: none; border-top: none; border-radius: 0 0 20px 0; }

    .a-z {
      font-family: var(--font-heading);
      font-size: 140px;
      font-weight: 900;
      color: rgba(8, 145, 178, 0.08);
      letter-spacing: 0.05em;
      margin-bottom: 24px;
      position: relative;
      z-index: 2;
    }

    .headline {
      font-family: var(--font-heading);
      font-size: 72px;
      font-weight: 900;
      color: #FFFFFF;
      line-height: 1.15;
      max-width: 900px;
      margin-bottom: 32px;
      position: relative;
      z-index: 2;
    }

    .headline .accent {
      color: var(--color-primary);
    }

    .accent-line {
      width: 80px;
      height: 5px;
      background: var(--color-primary);
      border-radius: 3px;
      margin-bottom: 32px;
      position: relative;
      z-index: 2;
    }

    .body-text {
      font-family: var(--font-body);
      font-size: 32px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.55);
      line-height: 1.6;
      max-width: 760px;
      margin-bottom: 40px;
      position: relative;
      z-index: 2;
    }

    .trust-row {
      display: flex;
      gap: 40px;
      margin-bottom: 40px;
      position: relative;
      z-index: 2;
    }

    .trust-item {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .trust-icon {
      font-size: 28px;
    }

    .trust-text {
      font-family: var(--font-body);
      font-size: 24px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.7);
    }

    .cta-btn {
      font-family: var(--font-body);
      font-size: 36px;
      font-weight: 700;
      color: #FFFFFF;
      background: var(--color-primary);
      border: none;
      border-radius: 16px;
      padding: 30px 72px;
      cursor: pointer;
      position: relative;
      z-index: 2;
      box-shadow: 0 4px 24px rgba(8, 145, 178, 0.25);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="corner-accent corner-tl"></div>
    <div class="corner-accent corner-br"></div>

    <div class="a-z">A → Z</div>
    <h1 class="headline">Viens partneris teritorijas <span class="accent">sakārtošanai</span> no&nbsp;A&nbsp;līdz&nbsp;Z</h1>
    <div class="accent-line"></div>
    <p class="body-text">Grāvji, ūdens novadīšana, zemes darbi, bioloģiskā kanalizācija — visu veic viena profesionāla komanda ar savu tehniku.</p>

    <div class="trust-row">
      <div class="trust-item">
        <span class="trust-icon">🏆</span>
        <span class="trust-text">10+ gadu pieredze</span>
      </div>
      <div class="trust-item">
        <span class="trust-icon">👥</span>
        <span class="trust-text">1000+ klientu</span>
      </div>
      <div class="trust-item">
        <span class="trust-icon">🏛️</span>
        <span class="trust-text">Pašvaldību partneri</span>
      </div>
    </div>

    <button class="cta-btn">Pieteikties bezmaksas apskatei →</button>
  </div>
</body>
</html>
