<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1080">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-primary: #0891B2;
      --color-warning: #F59E0B;
      --color-bg: #111827;
      --font-heading: 'Montserrat', sans-serif;
      --font-body: 'Montserrat', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    .container {
      width: 1080px;
      height: 1080px;
      background: var(--color-bg);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 80px 72px;
      position: relative;
      overflow: hidden;
    }

    .warning-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 12px 28px;
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid rgba(245, 158, 11, 0.3);
      border-radius: 50px;
      margin-bottom: 48px;
      position: relative;
      z-index: 2;
    }

    .warning-badge span {
      font-family: var(--font-body);
      font-size: 21px;
      font-weight: 700;
      color: var(--color-warning);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .headline {
      font-family: var(--font-heading);
      font-size: 78px;
      font-weight: 900;
      color: #FFFFFF;
      line-height: 1.1;
      max-width: 920px;
      margin-bottom: 36px;
      position: relative;
      z-index: 2;
    }

    .headline .accent {
      color: var(--color-warning);
    }

    .body-text {
      font-family: var(--font-body);
      font-size: 34px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.55);
      line-height: 1.5;
      max-width: 750px;
      margin-bottom: 48px;
      position: relative;
      z-index: 2;
    }

    .stat-row {
      display: flex;
      gap: 48px;
      margin-bottom: 48px;
      position: relative;
      z-index: 2;
    }

    .stat {
      text-align: center;
    }

    .stat-number {
      font-family: var(--font-heading);
      font-size: 64px;
      font-weight: 900;
      color: var(--color-primary);
    }

    .stat-label {
      font-family: var(--font-body);
      font-size: 22px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.45);
      margin-top: 4px;
    }

    .cta-btn {
      font-family: var(--font-body);
      font-size: 36px;
      font-weight: 700;
      color: #FFFFFF;
      background: var(--color-primary);
      border: none;
      border-radius: 16px;
      padding: 30px 72px;
      cursor: pointer;
      position: relative;
      z-index: 2;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="warning-badge">
      <span>⚠️ Neriskē ar savu teritoriju</span>
    </div>

    <h1 class="headline">Mitra teritorija <span class="accent">maksā dārgi</span> — risini to laicīgi</h1>
    <p class="body-text">Nesakārtota ūdens novadīšana iznīcina ceļus, pamatus un zemi. Rīkojies tagad.</p>

    <div class="stat-row">
      <div class="stat">
        <div class="stat-number">10+</div>
        <div class="stat-label">gadu pieredze</div>
      </div>
      <div class="stat">
        <div class="stat-number">1000+</div>
        <div class="stat-label">klientu</div>
      </div>
      <div class="stat">
        <div class="stat-number">24h</div>
        <div class="stat-label">tāme</div>
      </div>
    </div>

    <button class="cta-btn">Pieteikties apskatei →</button>
  </div>
</body>
</html>
