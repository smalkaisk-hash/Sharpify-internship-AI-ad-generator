<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1080">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-primary: #0891B2;
      --color-bg: #1A1A1A;
      --color-text: #FFFFFF;
      --font-heading: 'Montserrat', sans-serif;
      --font-body: 'Montserrat', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    .container {
      width: 1080px;
      height: 1080px;
      background: var(--color-bg);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 80px 72px;
      position: relative;
      overflow: hidden;
    }

    .geo-circle {
      position: absolute;
      border-radius: 50%;
      border: 3px solid var(--color-primary);
      opacity: 0.08;
    }

    .geo-1 { width: 500px; height: 500px; top: -150px; right: -150px; }
    .geo-2 { width: 300px; height: 300px; bottom: 100px; left: -100px; }

    .top-label {
      font-family: var(--font-body);
      font-size: 22px;
      font-weight: 700;
      color: var(--color-primary);
      text-transform: uppercase;
      letter-spacing: 0.15em;
      margin-bottom: 48px;
      position: relative;
      z-index: 2;
    }

    .headline {
      font-family: var(--font-heading);
      font-size: 78px;
      font-weight: 900;
      color: #FFFFFF;
      line-height: 1.1;
      max-width: 960px;
      margin-bottom: 32px;
      position: relative;
      z-index: 2;
    }

    .headline .accent {
      color: var(--color-primary);
    }

    .accent-line {
      width: 80px;
      height: 5px;
      background: var(--color-primary);
      border-radius: 3px;
      margin-bottom: 32px;
      position: relative;
      z-index: 2;
    }

    .body-text {
      font-family: var(--font-body);
      font-size: 34px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.6);
      line-height: 1.5;
      max-width: 750px;
      margin-bottom: 48px;
      position: relative;
      z-index: 2;
    }

    .cta-btn {
      font-family: var(--font-body);
      font-size: 36px;
      font-weight: 700;
      color: #FFFFFF;
      background: var(--color-primary);
      border: none;
      border-radius: 16px;
      padding: 30px 72px;
      cursor: pointer;
      position: relative;
      z-index: 2;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="geo-circle geo-1"></div>
    <div class="geo-circle geo-2"></div>

    <div class="top-label">Meliorācija un zemes darbi</div>
    <h1 class="headline">Sakārto <span class="accent">grāvjus</span>, novadi ūdeni, atgūsti <span class="accent">sausu teritoriju</span></h1>
    <div class="accent-line"></div>
    <p class="body-text">Viena komanda ar savu tehniku — no apskates līdz nodošanai ekspluatācijā.</p>
    <button class="cta-btn">Pieteikties bezmaksas apskatei →</button>
  </div>
</body>
</html>
