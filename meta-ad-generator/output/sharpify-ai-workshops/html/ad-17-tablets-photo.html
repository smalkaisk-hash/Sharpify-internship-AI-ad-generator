<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1080px; overflow: hidden; }
body {
  width: 1080px; height: 1080px;
  position: relative;
  font-family: 'Inter', sans-serif; color: #fff;
  background: #000;
}

.bg-image {
  position: absolute; inset: 0;
  background-image: url('../images/tablets-fan.png');
  background-size: cover;
  background-position: center;
  filter: brightness(0.75);
}

.overlay {
  position: absolute; inset: 0;
  background:
    linear-gradient(180deg,
      rgba(5,8,16,0.9) 0%,
      rgba(5,8,16,0.3) 25%,
      rgba(5,8,16,0.3) 60%,
      rgba(5,8,16,0.92) 100%);
}

.content {
  position: relative; z-index: 2;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  justify-content: space-between;
  padding: 56px;
}

.top {
  text-align: center;
}
.badge {
  display: inline-block;
  background: rgba(16,185,129,0.15);
  border: 1px solid rgba(16,185,129,0.4);
  color: #10b981;
  padding: 10px 24px; border-radius: 50px;
  font-size: 20px; font-weight: 800;
  backdrop-filter: blur(8px);
  margin-bottom: 18px;
}
.headline {
  font-family: 'Montserrat', sans-serif;
  font-size: 72px; font-weight: 900;
  line-height: 1.05;
  text-shadow: 0 4px 28px rgba(0,0,0,0.8);
}
.headline span { color: #10b981; }

.sub-headline {
  font-size: 24px; color: #cbd5e1;
  margin-top: 16px;
  text-shadow: 0 2px 12px rgba(0,0,0,0.6);
}

.bottom {
  display: flex; justify-content: space-between; align-items: center;
  background: rgba(10,15,25,0.85);
  backdrop-filter: blur(12px);
  border: 2px solid rgba(16,185,129,0.35);
  border-radius: 16px;
  padding: 26px 34px;
}
.bottom-info {}
.bottom-title {
  font-family: 'Montserrat', sans-serif;
  font-size: 30px; font-weight: 900;
  color: #fff;
}
.bottom-sub { font-size: 18px; color: #94a3b8; margin-top: 4px; }
.bottom-sub s { color: #ef4444; }
.bottom-sub .new { color: #10b981; font-weight: 700; }
.cta-btn {
  background: #10b981; color: #000;
  padding: 24px 52px; border-radius: 14px;
  font-weight: 800; font-size: 30px;
  box-shadow: 0 8px 32px rgba(16,185,129,0.4);
}
</style>
</head>
<body>
  <div class="bg-image"></div>
  <div class="overlay"></div>

  <div class="content">
    <div class="top">
      <div class="badge">// 27 SKILLS · 10 WORKFLOWS</div>
      <div class="headline">Pilna AI komanda<br><span>Tavās rokās</span></div>
      <div class="sub-headline">Katra skill — eksperts konkrētam uzdevumam</div>
    </div>

    <div class="bottom">
      <div class="bottom-info">
        <div class="bottom-title">Mūžīga piekļuve · €19</div>
        <div class="bottom-sub"><s>€99</s> · <span class="new">taupi 81%</span> · 7 dienu garantija</div>
      </div>
      <div class="cta-btn">Iegūt →</div>
    </div>
  </div>
</body>
</html>
