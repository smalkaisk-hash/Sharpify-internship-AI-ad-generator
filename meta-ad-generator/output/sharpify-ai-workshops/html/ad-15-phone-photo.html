<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1080px; overflow: hidden; }
body {
  width: 1080px; height: 1080px;
  position: relative;
  font-family: 'Inter', sans-serif; color: #fff;
  background: #000;
}

.bg-image {
  position: absolute; inset: 0;
  background-image: url('../images/hand-phone-ai.png');
  background-size: cover;
  background-position: center;
  filter: brightness(0.82);
}

/* Dark overlay gradient */
.overlay {
  position: absolute; inset: 0;
  background:
    linear-gradient(180deg,
      rgba(5,8,16,0.2) 0%,
      rgba(5,8,16,0.4) 40%,
      rgba(5,8,16,0.92) 100%);
}

.content {
  position: relative; z-index: 2;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  justify-content: flex-end;
  padding: 56px 56px 48px;
}

.badge {
  display: inline-block; align-self: flex-start;
  background: rgba(16,185,129,0.15);
  border: 1px solid rgba(16,185,129,0.4);
  color: #10b981;
  padding: 10px 22px; border-radius: 50px;
  font-size: 18px; font-weight: 800;
  backdrop-filter: blur(8px);
  margin-bottom: 20px;
}

.headline {
  font-family: 'Montserrat', sans-serif;
  font-size: 72px; font-weight: 900;
  line-height: 1.05;
  margin-bottom: 20px;
  text-shadow: 0 4px 24px rgba(0,0,0,0.5);
}
.headline span { color: #10b981; }

.sub {
  font-size: 26px; color: #cbd5e1;
  line-height: 1.4;
  margin-bottom: 32px;
  max-width: 780px;
  text-shadow: 0 2px 12px rgba(0,0,0,0.5);
}
.sub strong { color: #fff; font-weight: 700; }

.cta-row {
  display: flex; align-items: center; gap: 24px;
}
.cta-btn {
  background: #10b981; color: #000;
  padding: 26px 60px; border-radius: 14px;
  font-weight: 800; font-size: 30px;
  box-shadow: 0 8px 32px rgba(16,185,129,0.4);
}
.price-info {
  color: #94a3b8; font-size: 20px;
}
.price-info .new { color: #10b981; font-weight: 800; font-size: 26px; }
.price-info s { color: #64748b; }
</style>
</head>
<body>
  <div class="bg-image"></div>
  <div class="overlay"></div>

  <div class="content">
    <div class="badge">⚡ Ierobežota laika piedāvājums</div>
    <div class="headline">Tava AI <span>kļūst par<br>personīgu asistentu</span></div>
    <div class="sub"><strong>27 AI skills</strong> + <strong>10 workflows</strong> gatavi darbam. Instalē vienreiz, izmanto mūžīgi.</div>

    <div class="cta-row">
      <div class="cta-btn">Iegūt par €19 →</div>
      <div class="price-info"><s>€99</s> · <span class="new">€19</span> · mūžīga piekļuve</div>
    </div>
  </div>
</body>
</html>
