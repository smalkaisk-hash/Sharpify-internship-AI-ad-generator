<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1080px; overflow: hidden; }
body {
  width: 1080px; height: 1080px;
  position: relative;
  font-family: 'Inter', sans-serif; color: #fff;
  background: #000;
}
.bg-image {
  position: absolute; inset: 0;
  background-image: url('../images/jet-laptop.png');
  background-size: cover;
  background-position: center;
}
.overlay {
  position: absolute; inset: 0;
  background:
    linear-gradient(180deg,
      rgba(0,0,0,0.75) 0%,
      rgba(0,0,0,0.2) 22%,
      rgba(0,0,0,0) 45%,
      rgba(0,0,0,0.15) 70%,
      rgba(0,0,0,0.9) 100%);
}
.content {
  position: relative; z-index: 2;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  justify-content: space-between;
  padding: 56px;
}
.top {}
.badge {
  display: inline-block;
  background: rgba(10,15,25,0.75);
  border: 1px solid rgba(16,185,129,0.6);
  color: #10b981;
  padding: 10px 24px; border-radius: 50px;
  font-size: 18px; font-weight: 800;
  backdrop-filter: blur(12px);
  margin-bottom: 18px;
  text-shadow: 0 2px 8px rgba(0,0,0,0.8);
}
.headline {
  font-family: 'Montserrat', sans-serif;
  font-size: 70px; font-weight: 900;
  line-height: 0.98;
  text-shadow: 0 6px 32px rgba(0,0,0,1);
  max-width: 820px;
}
.headline span { color: #10b981; }

.bottom-card {
  background: rgba(5,10,18,0.82);
  backdrop-filter: blur(16px);
  border: 1px solid rgba(16,185,129,0.3);
  border-radius: 18px;
  padding: 24px 32px;
  display: flex; justify-content: space-between; align-items: center;
}
.bc-info {}
.bc-title {
  font-family: 'Montserrat', sans-serif;
  font-size: 26px; font-weight: 900;
}
.bc-sub { font-size: 16px; color: #94a3b8; margin-top: 3px; }
.bc-sub s { color: #ef4444; }
.bc-sub strong { color: #10b981; font-weight: 700; }
.cta-btn {
  background: #10b981; color: #000;
  padding: 22px 46px; border-radius: 14px;
  font-weight: 800; font-size: 26px;
  box-shadow: 0 8px 32px rgba(16,185,129,0.4);
}
</style>
</head>
<body>
  <div class="bg-image"></div>
  <div class="overlay"></div>
  <div class="content">
    <div class="top">
      <div class="badge">✈ NO PIRMĀS DIENAS</div>
      <div class="headline">AI raksta e-pastus.<br>Tu <span>iedzer šampanieti.</span></div>
    </div>
    <div class="bottom-card">
      <div class="bc-info">
        <div class="bc-title">27 skills + 10 workflows</div>
        <div class="bc-sub"><s>€99</s> · <strong>€19</strong> · mūžīga piekļuve</div>
      </div>
      <div class="cta-btn">Iegūt →</div>
    </div>
  </div>
</body>
</html>
