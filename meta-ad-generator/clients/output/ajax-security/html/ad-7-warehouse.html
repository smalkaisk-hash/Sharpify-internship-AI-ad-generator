<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1080">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{width:1080px;height:1080px;overflow:hidden}
    .ad{width:1080px;height:1080px;position:relative;overflow:hidden}
    .bg{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}
    .overlay{position:absolute;top:0;left:0;width:100%;height:100%;background:linear-gradient(180deg,rgba(0,0,0,0.6) 0%,rgba(0,0,0,0.25) 40%,rgba(0,0,0,0.25) 55%,rgba(0,0,0,0.8) 100%)}
    .top{position:absolute;top:44px;left:0;right:0;text-align:center;z-index:4}
    .tag{font-family:'Montserrat',sans-serif;font-size:22px;font-weight:800;color:#F59E0B;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:10px;padding:12px 28px;background:rgba(245,158,11,0.2);backdrop-filter:blur(8px);border-radius:8px;display:inline-block}
    .h1{font-family:'Montserrat',sans-serif;font-size:68px;font-weight:900;color:#FFF;line-height:1.0;text-shadow:0 4px 20px rgba(0,0,0,0.5)}
    .h1 .yellow{color:#F59E0B}
    .sub{font-family:'Montserrat',sans-serif;font-size:24px;font-weight:500;color:rgba(255,255,255,0.5);margin-top:10px}
    .product{position:absolute;bottom:110px;left:50%;transform:translateX(-50%);z-index:3}
    .product img{height:480px;width:auto;filter:drop-shadow(0 10px 40px rgba(0,0,0,0.5))}
    .bot{position:absolute;bottom:0;left:0;right:0;z-index:4;padding:24px 48px;display:flex;align-items:center;justify-content:space-between}
    .pills{display:flex;gap:10px}
    .pill{padding:10px 20px;background:rgba(255,255,255,0.1);backdrop-filter:blur(8px);border:none;border-radius:50px;font-family:'Montserrat',sans-serif;font-size:18px;font-weight:700;color:#FFF}
    .price-area{display:flex;align-items:center;gap:12px}
    .price{font-family:'Montserrat',sans-serif;font-size:60px;font-weight:900;color:#F59E0B}
    .badge{font-family:'Montserrat',sans-serif;font-size:16px;font-weight:800;color:#000;background:#F59E0B;padding:8px 16px;border-radius:8px}
  </style>
</head>
<body>
  <div class="ad">
    <img class="bg" src="file:///C:/Users/Ritvars Volfs/meta-ad-generator-v2/meta-ad-generator/output/ajax-security/brief/images/backgrounds/bg-warehouse.png" alt="">
    <div class="overlay"></div>
    <div class="top">
      <div class="tag">Ajax drošības sistēma</div>
      <div class="h1">Noliktava. Darbnīca.<br><span class="yellow">Angārs.</span></div>
      <div class="sub">Viena sistēma — vairākas zonas. Vadi no telefona.</div>
    </div>
    <div class="product">
      <img src="file:///C:/Users/Ritvars Volfs/meta-ad-generator-v2/meta-ad-generator/output/ajax-security/brief/images/cutouts/ajax-kit-white-bg-cutout.png" alt="">
    </div>
    <div class="bot">
      <div class="pills">
        <span class="pill">Noliktavas</span>
        <span class="pill">Darbnīcas</span>
        <span class="pill">Angāri</span>
        <span class="pill">Garāžas</span>
      </div>
      <div class="price-area">
        <span class="price">130€</span>
      </div>
    </div>
  </div>
</body>
</html>
