<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1080">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{width:1080px;height:1080px;overflow:hidden}
    .ad{width:1080px;height:1080px;position:relative;overflow:hidden}
    .bg{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}
    .overlay{position:absolute;top:0;left:0;width:100%;height:100%;background:linear-gradient(180deg,rgba(0,0,0,0.55) 0%,rgba(0,0,0,0.15) 40%,rgba(0,0,0,0.15) 55%,rgba(0,0,0,0.8) 100%)}
    .top{position:absolute;top:44px;left:0;right:0;text-align:center;z-index:4}
    .tag{font-family:'Montserrat',sans-serif;font-size:22px;font-weight:800;color:#10B981;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:10px;padding:12px 28px;background:rgba(16,185,129,0.2);backdrop-filter:blur(8px);border-radius:8px;display:inline-block}
    .h1{font-family:'Montserrat',sans-serif;font-size:82px;font-weight:900;color:#FFF;line-height:1.0;text-shadow:0 4px 20px rgba(0,0,0,0.5)}
    .h1 .green{color:#10B981}
    .sub{font-family:'Montserrat',sans-serif;font-size:24px;font-weight:500;color:rgba(255,255,255,0.5);margin-top:10px}
    .product{position:absolute;bottom:28px;right:48px;z-index:3}
    .product img{height:420px;width:auto;filter:drop-shadow(-10px -5px 40px rgba(0,0,0,0.5))}
    .bot{position:absolute;bottom:0;left:0;right:0;z-index:4;padding:28px 48px;display:flex;align-items:flex-end;justify-content:space-between}
    .bot-left{max-width:480px}
    .bens{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
    .ben{display:flex;align-items:center;gap:10px}
    .check{font-family:'Montserrat',sans-serif;font-size:20px;color:#10B981}
    .bt{font-family:'Montserrat',sans-serif;font-size:24px;font-weight:600;color:rgba(255,255,255,0.7)}
    .price-row{display:flex;align-items:center;gap:14px}
    .price{font-family:'Montserrat',sans-serif;font-size:60px;font-weight:900;color:#FFF}
    .badge{font-family:'Montserrat',sans-serif;font-size:18px;font-weight:800;color:#FFF;background:#10B981;padding:8px 18px;border-radius:8px}
    .kit{font-family:'Montserrat',sans-serif;font-size:16px;font-weight:500;color:rgba(255,255,255,0.3);margin-top:4px}
  </style>
</head>
<body>
  <div class="ad">
    <img class="bg" src="file:///C:/Users/Ritvars Volfs/meta-ad-generator-v2/meta-ad-generator/output/ajax-security/brief/images/backgrounds/bg-aerial-night.png" alt="">
    <div class="overlay"></div>
    <div class="top">
      <div class="tag">Ajax mini komplekts</div>
      <div class="h1">Aizsargā to,<br>kas <span class="green">svarīgs.</span></div>
      <div class="sub">Centrāle + kustību detektors — pamata drošība</div>
    </div>
    <div class="product">
      <img src="file:///C:/Users/Ritvars Volfs/meta-ad-generator-v2/meta-ad-generator/output/ajax-security/brief/images/cutouts/ajax-kit-white-bg-cutout.png" alt="">
    </div>
    <div class="bot">
      <div class="bot-left">
        <div class="bens">
          <div class="ben"><span class="check">✔</span><span class="bt">Mājai, dzīvoklim, vasarnīcai</span></div>
          <div class="ben"><span class="check">✔</span><span class="bt">Birojam, veikalam, salonam</span></div>
          <div class="ben"><span class="check">✔</span><span class="bt">Noliktavai, darbnīcai, angāram</span></div>
        </div>
        <div class="price-row"><span class="price">130€</span></div>
      </div>
    </div>
  </div>
</body>
</html>
