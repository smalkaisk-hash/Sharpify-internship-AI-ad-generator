<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1080">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{width:1080px;height:1080px;overflow:hidden}
    .ad{width:1080px;height:1080px;position:relative;overflow:hidden}
    .bg{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}
    .overlay{position:absolute;top:0;left:0;width:100%;height:100%;background:linear-gradient(160deg,rgba(0,0,0,0.7) 0%,rgba(0,0,0,0.35) 40%,rgba(0,0,0,0.4) 60%,rgba(0,0,0,0.7) 100%)}
    .text{position:absolute;top:48px;left:48px;z-index:4;max-width:580px}
    .tag{font-family:'Montserrat',sans-serif;font-size:20px;font-weight:800;color:#3B82F6;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:14px;padding:10px 24px;background:rgba(59,130,246,0.2);border-radius:8px;display:inline-block}
    .h1{font-family:'Montserrat',sans-serif;font-size:62px;font-weight:900;color:#FFF;line-height:0.97;margin-bottom:16px;text-shadow:0 4px 20px rgba(0,0,0,0.5)}
    .h1 .blue{color:#60A5FA}
    .desc{font-family:'Montserrat',sans-serif;font-size:26px;font-weight:500;color:rgba(255,255,255,0.55);line-height:1.35;margin-bottom:24px}
    .bens{display:flex;flex-direction:column;gap:10px}
    .ben{display:flex;align-items:center;gap:12px}
    .check{font-family:'Montserrat',sans-serif;font-size:22px;color:#3B82F6}
    .bt{font-family:'Montserrat',sans-serif;font-size:22px;font-weight:600;color:rgba(255,255,255,0.75)}
    .product{position:absolute;bottom:30px;right:30px;z-index:3}
    .product img{height:460px;width:auto;filter:drop-shadow(-10px -5px 30px rgba(0,0,0,0.5))}
    .bot{position:absolute;bottom:44px;left:48px;z-index:4}
    .price-row{display:flex;align-items:center;gap:14px;margin-bottom:10px}
    .price{font-family:'Montserrat',sans-serif;font-size:52px;font-weight:900;color:#FFF}
    .badge{font-family:'Montserrat',sans-serif;font-size:16px;font-weight:800;color:#FFF;background:#3B82F6;padding:8px 16px;border-radius:8px}
    .kit{font-family:'Montserrat',sans-serif;font-size:18px;font-weight:500;color:rgba(255,255,255,0.35)}
  </style>
</head>
<body>
  <div class="ad">
    <img class="bg" src="file:///C:/Users/Ritvars Volfs/meta-ad-generator-v2/meta-ad-generator/output/ajax-security/brief/images/backgrounds/bg-family-sleep.png" alt="">
    <div class="overlay"></div>
    <div class="text">
      <div class="tag">Ajax drošības sistēma</div>
      <div class="h1">Kontrolē māju<br>no <span class="blue">jebkuras vietas.</span></div>
      <div class="desc">Ieslēdz, izslēdz, pārbaudi statusu — viss tavā telefonā</div>
      <div class="bens">
        <div class="ben"><span class="check">✔</span><span class="bt">Paziņojums par kustību sekundēs</span></div>
        <div class="ben"><span class="check">✔</span><span class="bt">Piemērota mājai, birojam, noliktavai</span></div>
        <div class="ben"><span class="check">✔</span><span class="bt">Vienkārša uzstādīšana bez vadiem</span></div>
      </div>
    </div>
    <div class="product">
      <img src="file:///C:/Users/Ritvars Volfs/meta-ad-generator-v2/meta-ad-generator/output/ajax-security/brief/images/cutouts/ajax-kit-white-bg-cutout.png" alt="">
    </div>
    <div class="bot">
      <div class="price-row"><span class="price">130€</span></div>
    </div>
  </div>
</body>
</html>
