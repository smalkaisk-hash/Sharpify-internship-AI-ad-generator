<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1080px;overflow:hidden;background:#020c18;}
.ad{width:1080px;height:1080px;position:relative;overflow:hidden;display:flex;font-family:'DM Sans',sans-serif;background:#020c18;}

/* LEFT narrow text panel */
.left{width:480px;height:1080px;background:#020c18;position:relative;display:flex;flex-direction:column;justify-content:space-between;padding:56px 52px 100px 60px;flex-shrink:0;z-index:2;}
.left::before{content:'';position:absolute;inset:0;background-image:radial-gradient(rgba(0,180,216,0.05) 1px,transparent 1px);background-size:26px 26px;}

.logo{height:88px;width:auto;filter:brightness(0) invert(1);position:relative;z-index:1;}

.middle{position:relative;z-index:1;}
.eyebrow{font-size:17px;font-weight:500;letter-spacing:0.22em;text-transform:uppercase;color:#00B4D8;margin-bottom:20px;}
h1{font-family:'Playfair Display',serif;font-size:88px;line-height:0.91;font-weight:700;letter-spacing:-0.02em;color:#fff;margin-bottom:36px;}
h1 em{font-style:italic;font-weight:400;color:#00B4D8;display:block;}

.icons{display:flex;flex-direction:column;gap:18px;margin-bottom:0;}
.ic{display:flex;align-items:center;gap:14px;}
.ic-box{width:40px;height:40px;background:rgba(0,180,216,0.1);border:1px solid rgba(0,180,216,0.28);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.ic-text{font-size:15px;font-weight:600;color:rgba(255,255,255,0.82);line-height:1.3;}
.ic-text small{display:block;font-size:12px;font-weight:400;color:rgba(255,255,255,0.44);margin-top:1px;}

.bottom{position:relative;z-index:1;}
.cta{font-size:19px;font-weight:700;color:#020c18;background:#00B4D8;padding:22px 0;border-radius:12px;display:block;text-align:center;width:100%;box-shadow:0 4px 32px rgba(0,180,216,0.45);}

/* DIVIDER */
.divider{width:1px;height:1080px;background:linear-gradient(180deg,rgba(0,180,216,0) 0%,rgba(0,180,216,0.35) 25%,rgba(0,180,216,0.35) 75%,rgba(0,180,216,0) 100%);flex-shrink:0;z-index:3;}

/* RIGHT image */
.right{flex:1;height:1080px;position:relative;overflow:hidden;}
.right img{width:100%;height:100%;object-fit:cover;object-position:center;}
.right-fade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(2,12,24,0.6) 0%,rgba(2,12,24,0.1) 40%,rgba(2,12,24,0) 70%);}
.badge{position:absolute;top:68px;right:50px;font-size:13px;font-weight:500;color:rgba(255,255,255,0.82);border:1px solid rgba(0,180,216,0.4);padding:10px 20px;border-radius:100px;background:rgba(0,180,216,0.07);letter-spacing:0.05em;z-index:5;}
</style>
</head>
<body>
<div class="ad">
  <div class="left">
    <img class="logo" src="../6135c3339b379db98bc847bdbec13eb5.png">
    <div class="middle">
      <div class="eyebrow">MRI izmeklējums Rīgā</div>
      <h1>60<br>minūtes.<br><em>Mūžīgs<br>miers.</em></h1>
      <div class="icons">
        <div class="ic">
          <div class="ic-box"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#00B4D8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg></div>
          <div class="ic-text">Pilna ķermeņa skenēšana<small>Vēzis, kauli, orgāni vienā vizītē</small></div>
        </div>
        <div class="ic">
          <div class="ic-box"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#00B4D8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div>
          <div class="ic-text">Rezultāts 24 stundu laikā<small>Vadošo radiologu slēdziens</small></div>
        </div>
        <div class="ic">
          <div class="ic-box"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#00B4D8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="9 12 11 14 15 10"/></svg></div>
          <div class="ic-text">Nav radiācijas<small>Droši grūtniecēm un bērniem</small></div>
        </div>
        <div class="ic">
          <div class="ic-box"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#00B4D8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><polyline points="9 16 11 18 15 14"/></svg></div>
          <div class="ic-text">Pieraksts tajā pašā dienā<small>Brīvas vietas pieejamas</small></div>
        </div>
      </div>
    </div>
    <div class="bottom">
      <div class="cta">Pierakstīties →</div>
    </div>
  </div>


  <div class="right">
    <img src="../images/mri-corridor.png">
    <div class="right-fade"></div>
  </div>
</div>
</body>
</html>
