<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1080px;overflow:hidden;background:#020c18;}
.ad{width:1080px;height:1080px;position:relative;overflow:hidden;background:#020c18;font-family:'DM Sans',sans-serif;}
.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;opacity:0.5;}
.overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(2,12,24,0.65) 0%,rgba(2,12,24,0.15) 40%,rgba(2,12,24,0.75) 72%,rgba(2,12,24,1) 100%);}

.logo{position:absolute;top:52px;left:60px;height:88px;width:auto;filter:brightness(0) invert(1);z-index:5;}
.badge{position:absolute;top:68px;right:60px;font-size:14px;font-weight:500;color:rgba(255,255,255,0.82);border:1px solid rgba(0,180,216,0.4);padding:10px 22px;border-radius:100px;background:rgba(0,180,216,0.07);letter-spacing:0.06em;z-index:5;}

/* Headline — bold, minimal, top-center */
.headline{position:absolute;top:175px;left:0;right:0;text-align:center;padding:0 70px;z-index:5;}
.eyebrow{font-size:17px;font-weight:500;letter-spacing:0.24em;text-transform:uppercase;color:#00B4D8;margin-bottom:20px;}
h1{font-family:'Playfair Display',serif;font-size:108px;line-height:0.92;font-weight:700;letter-spacing:-0.02em;color:#fff;}
h1 em{font-style:italic;font-weight:400;color:#00B4D8;}

/* Stats strip */
.stats{position:absolute;bottom:400px;left:0;right:0;display:flex;justify-content:center;gap:0;z-index:5;}
.stat{text-align:center;padding:0 52px;border-right:1px solid rgba(0,180,216,0.2);}
.stat:last-child{border-right:none;}
.stat-num{font-family:'Playfair Display',serif;font-size:52px;font-weight:700;color:#00B4D8;line-height:1;margin-bottom:6px;}
.stat-label{font-size:13px;font-weight:500;color:rgba(255,255,255,0.5);text-transform:uppercase;letter-spacing:0.1em;}

/* 3 icon pills — horizontal row */
.pills{position:absolute;bottom:300px;left:0;right:0;display:flex;justify-content:center;gap:14px;z-index:5;}
.pill{display:flex;align-items:center;gap:10px;background:rgba(2,12,24,0.75);border:1px solid rgba(0,180,216,0.22);border-radius:100px;padding:13px 24px;}
.pill-text{font-size:15px;font-weight:600;color:rgba(255,255,255,0.85);}

.cta{position:absolute;bottom:160px;left:50%;transform:translateX(-50%);font-size:23px;font-weight:700;color:#020c18;background:#00B4D8;padding:26px 130px;border-radius:14px;white-space:nowrap;z-index:5;box-shadow:0 4px 32px rgba(0,180,216,0.45);}
</style>
</head>
<body>
<div class="ad">
  <img class="photo" src="../images/mri-aperture.png">
  <div class="overlay"></div>
  <img class="logo" src="../6135c3339b379db98bc847bdbec13eb5.png">

  <div class="headline">
    <div class="eyebrow">Tev būs tikai viena veselība</div>
    <h1>Rūpējies<br>par to <em>tagad.</em></h1>
  </div>

  <div class="stats">
    <div class="stat"><div class="stat-num">20+</div><div class="stat-label">Gadu pieredze</div></div>
    <div class="stat"><div class="stat-num">24h</div><div class="stat-label">Rezultāts</div></div>
    <div class="stat"><div class="stat-num">4</div><div class="stat-label">Speciālisti</div></div>
    <div class="stat"><div class="stat-num">0</div><div class="stat-label">Radiācija</div></div>
  </div>

  <div class="pills">
    <div class="pill">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#00B4D8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><circle cx="11" cy="11" r="3"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <span class="pill-text">Precīza diagnostika</span>
    </div>
    <div class="pill">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#00B4D8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="9 12 11 14 15 10"/></svg>
      <span class="pill-text">Nav radiācijas</span>
    </div>
    <div class="pill">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#00B4D8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><polyline points="9 16 11 18 15 14"/></svg>
      <span class="pill-text">Pieraksts šodien</span>
    </div>
  </div>

  <div class="cta">Pierakstīties →</div>
</div>
</body>
</html>
