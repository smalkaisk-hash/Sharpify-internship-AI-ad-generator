<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1080px;overflow:hidden;background:#020c18;}

.ad{
  width:1080px;height:1080px;
  position:relative;overflow:hidden;
  font-family:'DM Sans',sans-serif;
  background:#020c18;
}

/* LEFT IMAGE PANEL — 56% */
.photo-panel{
  position:absolute;
  top:0;left:0;
  width:600px;height:100%;
  overflow:hidden;
}
.photo{
  width:100%;height:100%;
  object-fit:cover;
  object-position:center center;
}
.photo-fade{
  position:absolute;inset:0;
  background:
    linear-gradient(90deg,
      rgba(2,12,24,0) 45%,
      rgba(2,12,24,0.55) 75%,
      rgba(2,12,24,1) 100%
    ),
    linear-gradient(180deg,
      rgba(2,12,24,0.55) 0%,
      rgba(2,12,24,0) 12%,
      rgba(2,12,24,0) 88%,
      rgba(2,12,24,0.55) 100%
    );
}

/* CYAN SEAM */
.seam{
  position:absolute;
  top:0;bottom:0;left:598px;
  width:2px;
  background:linear-gradient(180deg,
    rgba(0,180,216,0) 0%,
    rgba(0,180,216,0.55) 12%,
    rgba(0,180,216,0.55) 88%,
    rgba(0,180,216,0) 100%
  );
  z-index:6;
}

/* Seam glow */
.seam-glow{
  position:absolute;
  top:0;bottom:0;left:590px;
  width:18px;
  background:radial-gradient(ellipse at 50% 50%,rgba(0,180,216,0.12) 0%,transparent 70%);
  z-index:5;
}

/* RIGHT PANEL */
.right{
  position:absolute;
  top:0;left:602px;right:0;bottom:0;
  z-index:5;
}

/* Logo */
.logo{
  position:absolute;
  top:52px;left:52px;
  height:72px;width:auto;
  filter:brightness(0) invert(1);
}

/* Badge */
.badge{
  position:absolute;
  top:144px;left:52px;
  font-size:12px;font-weight:500;
  color:rgba(255,255,255,0.72);
  border:1px solid rgba(0,180,216,0.35);
  padding:8px 18px;border-radius:100px;
  background:rgba(0,180,216,0.06);
  letter-spacing:0.06em;
}

/* Headline block */
.content{
  position:absolute;
  top:202px;left:52px;right:36px;
}

.eyebrow{
  font-size:17px;font-weight:600;
  letter-spacing:0.24em;text-transform:uppercase;
  color:#00B4D8;margin-bottom:20px;
}

h1{
  font-family:'Playfair Display',serif;
  font-size:76px;line-height:0.90;
  color:#fff;font-weight:700;
  letter-spacing:-0.025em;
  margin-bottom:26px;
}
h1 em{font-style:italic;font-weight:400;color:#00B4D8;}

.sub{
  font-size:16px;font-weight:400;
  color:rgba(255,255,255,0.52);
  line-height:1.55;
  margin-bottom:32px;
}

/* Credential list */
.creds{
  display:flex;flex-direction:column;gap:12px;
}
.cred{
  display:flex;align-items:center;gap:14px;
  padding:13px 16px;
  background:rgba(255,255,255,0.035);
  border:1px solid rgba(0,180,216,0.12);
  border-radius:10px;
}
.cred-icon{
  width:24px;height:24px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.cred-text{
  font-size:14px;font-weight:600;
  color:rgba(255,255,255,0.78);
  line-height:1.2;
}

/* CTA */
.cta{
  position:absolute;
  bottom:160px;left:52px;
  font-size:20px;font-weight:700;
  color:#020c18;background:#00B4D8;
  padding:20px 44px;
  border-radius:12px;
  letter-spacing:0.01em;
  box-shadow:0 4px 28px rgba(0,180,216,0.38);
}
</style>
</head>
<body>
<div class="ad">

  <div class="photo-panel">
    <img class="photo" src="../images/mri-aperture.png">
    <div class="photo-fade"></div>
  </div>


  <div class="right">
    <img class="logo" src="../6135c3339b379db98bc847bdbec13eb5.png">

    <div class="content">
      <div class="eyebrow">Pieredzējušākie radiologi</div>
      <h1>Ātrāk<br>zini.<br>Ātrāk<br><em>dzīvo.</em></h1>
      <div class="sub">Rīgas vadošā MRI klīnika. Jaunākā tehnoloģija, speciālisti un atbilde tajā pašā dienā.</div>

      <div class="creds">
        <div class="cred">
          <div class="cred-icon">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#00B4D8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"/><circle cx="11" cy="11" r="3"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
          </div>
          <div class="cred-text">1.5 Tesla MRI. Precīzākā diagnostika Latvijā.</div>
        </div>
        <div class="cred">
          <div class="cred-icon">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#00B4D8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
          </div>
          <div class="cred-text">4 radiologi 20+ gadu pieredze</div>
        </div>
        <div class="cred">
          <div class="cred-icon">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#00B4D8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
            </svg>
          </div>
          <div class="cred-text">Rezultāts 24h Pieraksts šodien</div>
        </div>
      </div>
    </div>

    <div class="cta">Pierakstīties →</div>
  </div>

</div>
</body>
</html>
