<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1080px;overflow:hidden;}
.ad{width:1080px;height:1080px;position:relative;overflow:hidden;}

.bg{
  position:absolute;inset:0;
  width:100%;height:100%;
  object-fit:cover;object-position:center 25%;
  filter:saturate(0.75) contrast(1.05);
}

.overlay{
  position:absolute;inset:0;
  background:linear-gradient(
    180deg,
    rgba(0,0,0,0.62) 0%,
    rgba(0,0,0,0.22) 22%,
    rgba(0,0,0,0.35) 50%,
    rgba(0,0,0,0.90) 100%
  );
}

/* Orange bottom glow */
.glow{
  position:absolute;bottom:0;left:0;right:0;height:400px;
  background:radial-gradient(ellipse 800px 300px at 50% 100%,rgba(232,114,26,0.28) 0%,transparent 65%);
}

/* TOP BAR */
.top{
  position:absolute;top:52px;left:52px;right:52px;
  display:flex;justify-content:space-between;align-items:center;
  z-index:10;
}
.logo-pill{
  background:#E8721A;padding:11px 22px;border-radius:6px;
  font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:700;
  letter-spacing:0.08em;color:#fff;
}
.cert-badge{
  font-family:'Inter',sans-serif;font-size:14px;font-weight:600;
  color:rgba(255,255,255,0.60);text-transform:uppercase;letter-spacing:0.14em;
  border:1.5px solid rgba(255,255,255,0.22);
  padding:9px 20px;border-radius:6px;
}

/* HERO NUMBER — centrepiece */
.hero{
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-58%);
  z-index:10;
  text-align:center;
}
.num{
  font-family:'Barlow Condensed',sans-serif;
  font-size:320px;font-weight:900;line-height:0.88;
  color:#E8721A;
  text-shadow:
    0 0 60px rgba(232,114,26,0.60),
    0 0 160px rgba(232,114,26,0.25);
  letter-spacing:-0.02em;
}
.num-sub{
  font-family:'Barlow Condensed',sans-serif;
  font-size:34px;font-weight:700;letter-spacing:0.20em;
  text-transform:uppercase;
  color:rgba(255,255,255,0.78);
  margin-top:-14px;
}

/* SERVICE PILLS */
.pills{
  position:absolute;
  bottom:288px;left:52px;right:52px;
  display:flex;justify-content:center;gap:14px;
  z-index:10;
}
.pill{
  font-family:'Inter',sans-serif;font-size:13px;font-weight:600;
  color:rgba(255,255,255,0.62);text-transform:uppercase;letter-spacing:0.12em;
  background:rgba(255,255,255,0.08);
  padding:10px 20px;border-radius:40px;
  border:1px solid rgba(255,255,255,0.14);
  white-space:nowrap;
}

/* CTA */
.cta{
  position:absolute;
  bottom:150px;left:52px;right:52px;
  background:#E8721A;
  border-radius:12px;padding:26px;
  font-family:'Inter',sans-serif;font-size:22px;font-weight:700;
  color:#fff;text-align:center;letter-spacing:0.02em;
  z-index:10;
  box-shadow:0 6px 56px rgba(232,114,26,0.46);
}
</style>
</head>
<body>
<div class="ad">
  <img class="bg" src="../brief/images/roof-workers-bg.png" alt="">
  <div class="overlay"></div>
  <div class="glow"></div>

  <div class="top">
    <div class="logo-pill">JP Solutions</div>
    <div class="cert-badge">Sertificēts aprīkojums</div>
  </div>

  <div class="hero">
    <div class="num">500+</div>
    <div class="num-sub">uzstādītu drošības sistēmu visā Latvijā</div>
  </div>

  <div class="pills">
    <div class="pill">Drošības līnijas</div>
    <div class="pill">Enkurpunkti</div>
    <div class="pill">Jumtu ejas</div>
    <div class="pill">Gada inspekcijas</div>
  </div>

  <div class="cta">Saņemt bezmaksas piedāvājumu → +371 264 47394</div>
</div>
<script>document.fonts.ready.then(()=>{document.title='fonts-ready';});</script>
</body>
</html>
