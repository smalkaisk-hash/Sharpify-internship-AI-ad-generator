<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1080">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{width:1080px;height:1080px;overflow:hidden}
    body{font-family:'Inter',sans-serif;background:
      radial-gradient(ellipse at 20% 30%,#F5D7C1 0%,transparent 55%),
      radial-gradient(ellipse at 80% 85%,#E8D5E8 0%,transparent 55%),
      #FAF6F0;
    }
    .ad{width:1080px;height:1080px;padding:52px;position:relative}
    .frame{width:100%;height:100%;border:1.5px solid #8B7D3C;padding:44px 54px 44px;display:flex;flex-direction:column;position:relative}
    /* Subtle noise overlay for texture */
    .frame::before{content:"";position:absolute;inset:0;background:repeating-radial-gradient(circle at 30% 30%,rgba(139,125,60,0.015) 0,rgba(139,125,60,0.015) 2px,transparent 2px,transparent 5px);pointer-events:none}
    /* Top marker */
    .top{display:flex;justify-content:space-between;align-items:flex-start}
    .brand{font-family:'Playfair Display',serif;font-style:italic;font-size:24px;color:#8B7D3C;letter-spacing:0.02em}
    .code{font-family:'Inter',sans-serif;font-size:11px;font-weight:700;letter-spacing:0.32em;color:#8B7D3C;text-transform:uppercase;text-align:right;line-height:1.5}
    /* Headline zone — dominant */
    .headline{flex:1;display:flex;flex-direction:column;justify-content:center;margin:auto 0;position:relative;z-index:2}
    .h-eyebrow{font-family:'Inter',sans-serif;font-size:12px;font-weight:700;letter-spacing:0.38em;color:#8B7D3C;text-transform:uppercase;margin-bottom:24px}
    .h-main{font-family:'Playfair Display',serif;font-size:172px;font-weight:400;color:#1A1A2E;line-height:0.88;letter-spacing:-0.02em}
    .h-main em{font-style:italic;color:#8B7D3C}
    .h-sub{font-family:'Playfair Display',serif;font-style:italic;font-size:28px;color:#5C4A1E;margin-top:28px;max-width:680px;line-height:1.3}
    /* Signature rule */
    .rule{width:80px;height:1px;background:#8B7D3C;margin-top:32px}
    /* Bottom product strip */
    .bot{display:flex;justify-content:space-between;align-items:center;padding-top:26px;border-top:1.5px solid rgba(139,125,60,0.4)}
    .bot-left{display:flex;align-items:center;gap:20px}
    .bot-prod{height:120px;display:flex;align-items:center}
    .bot-prod img{height:120px;width:auto;filter:drop-shadow(0 4px 10px rgba(139,125,60,0.2))}
    .bot-info{display:flex;flex-direction:column;gap:2px}
    .bot-eye{font-family:'Inter',sans-serif;font-size:10px;font-weight:700;letter-spacing:0.28em;color:#8B7D3C;text-transform:uppercase}
    .bot-name{font-family:'Playfair Display',serif;font-size:24px;font-weight:500;color:#1A1A2E;line-height:1}
    .bot-price{font-family:'Playfair Display',serif;font-size:28px;font-weight:600;color:#1A1A2E;margin-top:4px}
    .cta{padding:18px 30px;background:#1A1A2E;color:#F5E6D3;font-family:'Inter',sans-serif;font-size:13px;font-weight:700;letter-spacing:0.26em;text-transform:uppercase}
  </style>
</head>
<body>
  <div class="ad">
    <div class="frame">
      <div class="top">
        <div class="brand">Naqaa Beauty</div>
        <div class="code">Manifest № 01<br>Vitamīnu Dušas Filtrs</div>
      </div>
      <div class="headline">
        <div class="h-eyebrow">Mazā luksusa filozofija</div>
        <div class="h-main">Tavs ūdens.<br>Tavs <em>rituāls.</em></div>
        <div class="h-sub">Katra duša var būt mazs spa brīdis — ja ūdens ir tā vērts.</div>
        <div class="rule"></div>
      </div>
      <div class="bot">
        <div class="bot-left">
          <div class="bot-prod"><img src="file:///C:/Users/Ritvars Volfs/meta-ad-generator-v2/meta-ad-generator/clients/output/naqaa-beauty/brief/images/cutouts/product-precious-rose-labeled-cutout.png"></div>
          <div class="bot-info">
            <div class="bot-eye">4 aromāti · no</div>
            <div class="bot-name">Precious Rose</div>
            <div class="bot-price">34,99 €</div>
          </div>
        </div>
        <div class="cta">Sāc rituālu</div>
      </div>
    </div>
  </div>
</body>
</html>
