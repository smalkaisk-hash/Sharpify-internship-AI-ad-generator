<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1080">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{width:1080px;height:1080px;overflow:hidden}
    body{font-family:'Inter',sans-serif;background:#E8D5C4}
    .ad{width:1080px;height:1080px;padding:44px;position:relative}
    .frame{width:100%;height:100%;position:relative;overflow:hidden}
    .hero{position:absolute;inset:0;overflow:hidden}
    .hero img{width:100%;height:100%;object-fit:cover;display:block}
    /* Magazine-style masthead */
    .masthead{position:absolute;top:28px;left:40px;right:40px;display:flex;justify-content:space-between;align-items:baseline;z-index:5}
    .m-title{font-family:'Playfair Display',serif;font-size:72px;font-weight:400;color:#FAF6F0;line-height:0.9;letter-spacing:-0.01em;text-shadow:0 2px 12px rgba(0,0,0,0.25)}
    .m-title em{font-style:italic;color:#F5D7C1}
    .m-issue{font-family:'Inter',sans-serif;font-size:11px;font-weight:700;letter-spacing:0.34em;color:#FAF6F0;text-transform:uppercase;text-align:right;text-shadow:0 2px 8px rgba(0,0,0,0.4)}
    .m-issue-bold{font-family:'Playfair Display',serif;font-size:18px;font-weight:500;letter-spacing:0;color:#FAF6F0;text-transform:none;margin-top:6px;font-style:italic}
    /* Cover line */
    .coverline{position:absolute;left:40px;top:54%;transform:translateY(-50%);max-width:460px;z-index:5}
    .cl-eyebrow{font-family:'Inter',sans-serif;font-size:11px;font-weight:700;letter-spacing:0.38em;color:#FAF6F0;text-transform:uppercase;margin-bottom:16px;text-shadow:0 2px 8px rgba(0,0,0,0.5)}
    .cl-h{font-family:'Playfair Display',serif;font-size:68px;font-weight:400;color:#FAF6F0;line-height:0.95;letter-spacing:-0.01em;text-shadow:0 3px 16px rgba(0,0,0,0.4)}
    .cl-h em{font-style:italic;color:#F5D7C1}
    .cl-sub{font-family:'Playfair Display',serif;font-style:italic;font-size:22px;color:#FAF6F0;margin-top:16px;text-shadow:0 2px 10px rgba(0,0,0,0.5);line-height:1.3}
    /* Product card bottom-right */
    .prod-card{position:absolute;right:36px;bottom:36px;width:300px;background:rgba(250,246,240,0.96);padding:20px 22px;backdrop-filter:blur(6px);border:1.5px solid #8B7D3C;z-index:5;display:flex;gap:16px;align-items:center;box-shadow:0 16px 40px rgba(0,0,0,0.25)}
    .prod-card img{height:120px;width:auto;flex-shrink:0}
    .prod-card-text{display:flex;flex-direction:column;gap:2px}
    .prod-card-eye{font-family:'Inter',sans-serif;font-size:10px;font-weight:700;letter-spacing:0.26em;color:#8B7D3C;text-transform:uppercase}
    .prod-card-name{font-family:'Playfair Display',serif;font-size:22px;font-weight:500;color:#1A1A2E;line-height:1.05}
    .prod-card-price{font-family:'Playfair Display',serif;font-size:22px;font-weight:600;color:#1A1A2E;margin-top:4px}
    .prod-card-cta{font-family:'Inter',sans-serif;font-size:10px;font-weight:700;letter-spacing:0.2em;color:#8B7D3C;text-transform:uppercase;margin-top:6px}
    /* Outer hairline frame */
    .hairline{position:absolute;inset:22px;border:1.5px solid rgba(250,246,240,0.7);pointer-events:none;z-index:4}
  </style>
</head>
<body>
  <div class="ad">
    <div class="frame">
      <div class="hero"><img src="file:///C:/Users/Ritvars Volfs/meta-ad-generator-v2/meta-ad-generator/clients/output/naqaa-beauty/brief/images/backgrounds/bg-beauty-portrait.png"></div>
      <div class="hairline"></div>
      <div class="masthead">
        <div class="m-title">Naqaa</div>
        <div class="m-issue">Beauty Issue № 04<div class="m-issue-bold">Pavasara Edition</div></div>
      </div>
      <div class="coverline">
        <div class="cl-eyebrow">Mirdzums — no dušas</div>
        <div class="cl-h">Tava āda<br>pelnījusi <em>tīru<br>ūdeni.</em></div>
        <div class="cl-sub">hlors izzūd. vitamīni paliek. rezultāts — dienas gaišumā.</div>
      </div>
      <div class="prod-card">
        <img src="file:///C:/Users/Ritvars Volfs/meta-ad-generator-v2/meta-ad-generator/clients/output/naqaa-beauty/brief/images/cutouts/product-precious-rose-labeled-cutout.png">
        <div class="prod-card-text">
          <div class="prod-card-eye">Šī mēneša izvēle</div>
          <div class="prod-card-name">Precious<br>Rose</div>
          <div class="prod-card-price">34,99 €</div>
          <div class="prod-card-cta">Iepirkties →</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
