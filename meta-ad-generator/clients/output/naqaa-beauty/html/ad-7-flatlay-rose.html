<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1080">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{width:1080px;height:1080px;overflow:hidden}
    .ad{width:1080px;height:1080px;position:relative;overflow:hidden}
    .bg{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}
    .overlay{position:absolute;top:0;left:0;width:100%;height:100%;background:linear-gradient(180deg,rgba(255,255,255,0.35) 0%,rgba(255,255,255,0.15) 40%,rgba(0,0,0,0.3) 70%,rgba(0,0,0,0.75) 100%)}
    /* Top text — dark text on light flatlay area */
    .top{position:absolute;top:36px;left:0;right:0;text-align:center;z-index:4}
    .tag{font-family:'Montserrat',sans-serif;font-size:22px;font-weight:800;color:#9C27B0;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:10px;padding:12px 28px;background:rgba(255,255,255,0.65);backdrop-filter:blur(6px);border-radius:8px;display:inline-block}
    .h1{font-family:'Montserrat',sans-serif;font-size:68px;font-weight:900;color:#1A1A2E;line-height:1.0;text-shadow:0 2px 10px rgba(255,255,255,0.4)}
    .h1 .accent{color:#9C27B0}
    /* Product — bottom center, large */
    .product{position:absolute;bottom:80px;left:50%;transform:translateX(-50%);z-index:3}
    .product img{height:520px;width:auto;filter:drop-shadow(0 -8px 40px rgba(0,0,0,0.3))}
    /* Bottom bar */
    .bot{position:absolute;bottom:0;left:0;right:0;z-index:4;padding:24px 48px;display:flex;align-items:center;justify-content:space-between}
    .bot-text{font-family:'Montserrat',sans-serif;font-size:22px;font-weight:600;color:rgba(255,255,255,0.75)}
    .price{font-family:'Montserrat',sans-serif;font-size:48px;font-weight:900;color:#FFF}
  </style>
</head>
<body>
  <div class="ad">
    <img class="bg" src="file:///C:/Users/Ritvars Volfs/meta-ad-generator-v2/meta-ad-generator/output/naqaa-beauty/brief/images/backgrounds/bg-flatlay-spa.png" alt="">
    <div class="overlay"></div>
    <div class="top">
      <div class="tag">Vitamīnu dušas filtrs</div>
      <div class="h1">Dabīgs <span class="accent">mirdzums</span><br>katrā dušā</div>
    </div>
    <div class="product">
      <img src="file:///C:/Users/Ritvars Volfs/meta-ad-generator-v2/meta-ad-generator/output/naqaa-beauty/brief/images/cutouts/product-precious-rose-labeled-cutout.png" alt="">
    </div>
    <div class="bot">
      <span class="bot-text">Attīra hloru · Vitamīni · Rožu aromāts</span>
      <span class="price">34,99€</span>
    </div>
  </div>
</body>
</html>
