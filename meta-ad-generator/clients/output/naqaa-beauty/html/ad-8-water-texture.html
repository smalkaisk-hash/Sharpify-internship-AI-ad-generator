<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1080">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{width:1080px;height:1080px;overflow:hidden}
    .ad{width:1080px;height:1080px;position:relative;overflow:hidden}
    .bg{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}
    .overlay{position:absolute;top:0;left:0;width:100%;height:100%;background:linear-gradient(180deg,rgba(0,50,60,0.7) 0%,rgba(0,40,50,0.3) 35%,rgba(0,40,50,0.3) 60%,rgba(0,50,60,0.8) 100%)}
    /* Product — massive center */
    .product{position:absolute;top:50%;left:50%;transform:translate(-50%,-46%);z-index:3}
    .product img{height:700px;width:auto;filter:drop-shadow(0 20px 60px rgba(0,0,0,0.4))}
    /* Top */
    .top{position:absolute;top:40px;left:0;right:0;text-align:center;z-index:4}
    .tag{font-family:'Montserrat',sans-serif;font-size:22px;font-weight:800;color:#FFF;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:10px;padding:12px 28px;background:rgba(0,151,178,0.4);backdrop-filter:blur(8px);border-radius:8px;display:inline-block}
    .h1{font-family:'Montserrat',sans-serif;font-size:72px;font-weight:900;color:#FFF;line-height:1.0;text-shadow:0 4px 30px rgba(0,0,0,0.4)}
    .h1 .accent{color:#4DD0E1}
    /* Bottom */
    .bot{position:absolute;bottom:0;left:0;right:0;z-index:4;padding:28px 48px;display:flex;align-items:center;justify-content:space-between}
    .bens{display:flex;gap:12px}
    .ben{padding:10px 22px;background:rgba(255,255,255,0.1);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.15);border-radius:50px;font-family:'Montserrat',sans-serif;font-size:18px;font-weight:700;color:#FFF}
    .price{font-family:'Montserrat',sans-serif;font-size:48px;font-weight:900;color:#4DD0E1;text-shadow:0 4px 20px rgba(0,0,0,0.4)}
  </style>
</head>
<body>
  <div class="ad">
    <img class="bg" src="file:///C:/Users/Ritvars Volfs/meta-ad-generator-v2/meta-ad-generator/output/naqaa-beauty/brief/images/backgrounds/bg-water-abstract.png" alt="">
    <div class="overlay"></div>
    <div class="top">
      <div class="tag">Dušas vitamīnu filtrs</div>
      <div class="h1">Tava āda<br>jūt <span class="accent">ūdeni.</span></div>
    </div>
    <div class="product">
      <img src="file:///C:/Users/Ritvars Volfs/meta-ad-generator-v2/meta-ad-generator/output/naqaa-beauty/brief/images/cutouts/product-mango-rain-with-box-cutout.png" alt="">
    </div>
    <div class="bot">
      <div class="bens">
        <span class="ben">Bez hlora</span>
        <span class="ben">Vitamīni</span>
        <span class="ben">4 aromāti</span>
        <span class="ben">Eko</span>
      </div>
      <div class="price">34,99€</div>
    </div>
  </div>
</body>
</html>
