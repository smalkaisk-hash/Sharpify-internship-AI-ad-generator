<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1080">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{width:1080px;height:1080px;overflow:hidden}
    body{font-family:'Inter',sans-serif;background:#0F1B25}
    .ad{width:1080px;height:1080px;padding:44px;position:relative}
    .frame{width:100%;height:100%;border:1.5px solid rgba(200,220,235,0.35);padding:30px;display:grid;grid-template-rows:auto 1fr auto;gap:22px}
    /* Header */
    .header{display:flex;justify-content:space-between;align-items:center;padding:4px 8px}
    .tag{font-family:'Inter',sans-serif;font-size:12px;font-weight:700;letter-spacing:0.32em;color:#B8D4E8;text-transform:uppercase}
    .brand{font-family:'Playfair Display',serif;font-style:italic;font-size:22px;color:#B8D4E8}
    /* Hero + spec grid */
    .body{display:grid;grid-template-columns:1.15fr 1fr;gap:18px}
    .hero-photo{position:relative;overflow:hidden;border:1.5px solid #3A5D7A;background:#000}
    .hero-photo img{width:100%;height:100%;object-fit:cover;display:block}
    .hero-label{position:absolute;bottom:20px;left:20px;right:20px;padding:14px 18px;background:rgba(15,27,37,0.85);color:#FAF6F0;backdrop-filter:blur(4px)}
    .hero-label-name{font-family:'Playfair Display',serif;font-size:28px;font-weight:500;line-height:1}
    .hero-label-note{font-family:'Inter',sans-serif;font-size:12px;color:#B8D4E8;letter-spacing:0.1em;margin-top:4px}
    /* Right spec panel */
    .specs{display:flex;flex-direction:column;justify-content:space-between;padding:4px 6px}
    .h-main{font-family:'Playfair Display',serif;font-size:64px;font-weight:400;color:#FAF6F0;line-height:0.95;letter-spacing:-0.01em}
    .h-sub{font-family:'Playfair Display',serif;font-style:italic;font-size:22px;color:#B8D4E8;margin-top:14px;line-height:1.2}
    .zones{display:flex;flex-direction:column;gap:12px;margin-top:22px}
    .zone{display:flex;align-items:center;gap:16px;padding:14px 16px;background:rgba(184,212,232,0.08);border-left:2px solid #B8D4E8}
    .zone-num{font-family:'Playfair Display',serif;font-size:26px;font-weight:500;color:#B8D4E8;min-width:28px}
    .zone-text{display:flex;flex-direction:column;gap:2px}
    .zone-name{font-family:'Inter',sans-serif;font-size:15px;font-weight:700;color:#FAF6F0;letter-spacing:0.04em}
    .zone-desc{font-family:'Inter',sans-serif;font-size:12px;color:#B8D4E8;font-weight:400}
    /* Footer */
    .footer{display:flex;justify-content:space-between;align-items:center;padding:22px 28px;background:rgba(184,212,232,0.12);border:1.5px solid #B8D4E8}
    .f-left{display:flex;flex-direction:column;gap:2px}
    .f-label{font-family:'Inter',sans-serif;font-size:11px;font-weight:700;letter-spacing:0.26em;color:#B8D4E8;text-transform:uppercase}
    .f-price{font-family:'Playfair Display',serif;font-size:38px;font-weight:600;color:#FAF6F0;line-height:1}
    .cta{padding:16px 30px;background:#B8D4E8;color:#0F1B25;font-family:'Inter',sans-serif;font-size:13px;font-weight:700;letter-spacing:0.24em;text-transform:uppercase}
  </style>
</head>
<body>
  <div class="ad">
    <div class="frame">
      <div class="header">
        <div class="tag">3-Zonu Dušas Uzgalis</div>
        <div class="brand">Naqaa Beauty</div>
      </div>
      <div class="body">
        <div class="hero-photo">
          <img src="file:///C:/Users/Ritvars Volfs/meta-ad-generator-v2/meta-ad-generator/clients/output/naqaa-beauty/brief/images/backgrounds/bg-showerhead-chrome.png">
          <div class="hero-label">
            <div class="hero-label-name">3 režīmi</div>
            <div class="hero-label-note">no maigas lietus līdz spēcīgai strūklai</div>
          </div>
        </div>
        <div class="specs">
          <div>
            <div class="h-main">Viena duša.<br>Trīs sajūtas.</div>
            <div class="h-sub">pārslēdz režīmu ar vienu pagriezienu</div>
          </div>
          <div class="zones">
            <div class="zone">
              <div class="zone-num">01</div>
              <div class="zone-text">
                <div class="zone-name">Lietus</div>
                <div class="zone-desc">Maiga, plaša strūkla</div>
              </div>
            </div>
            <div class="zone">
              <div class="zone-num">02</div>
              <div class="zone-text">
                <div class="zone-name">Masāža</div>
                <div class="zone-desc">Koncentrēta, stipra</div>
              </div>
            </div>
            <div class="zone">
              <div class="zone-num">03</div>
              <div class="zone-text">
                <div class="zone-name">Kombinēts</div>
                <div class="zone-desc">Abos reizē</div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="footer">
        <div class="f-left">
          <div class="f-label">3-Zonu uzgalis · saderīgs ar visiem filtriem</div>
          <div class="f-price">29,99 €</div>
        </div>
        <div class="cta">Iepirkties</div>
      </div>
    </div>
  </div>
</body>
</html>
