<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,300;1,400;1,600;1,700&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1080px; height:1080px; overflow:hidden; }
.ad { width:1080px; height:1080px; position:relative; overflow:hidden; background:#1a0618; }

.bg {
  position:absolute; inset:0;
  width:100%; height:100%;
  object-fit:cover; object-position:center 8%;
  filter:saturate(1.10) contrast(1.02) brightness(1.04);
}

.vig-top {
  position:absolute; inset:0;
  background:linear-gradient(180deg,rgba(26,6,18,0.65) 0%,rgba(26,6,18,0.14) 15%,transparent 32%);
}

.vig-bottom {
  position:absolute; inset:0;
  background:linear-gradient(
    180deg,
    transparent           26%,
    rgba(28,5,18,0.26)   40%,
    rgba(26,4,16,0.72)   52%,
    rgba(24,4,15,0.93)   62%,
    rgba(22,3,14,0.97)   72%,
    rgba(20,3,13,1.00)   82%
  );
}

.vig-edges {
  position:absolute; inset:0;
  background:radial-gradient(ellipse 90% 90% at 50% 50%,transparent 45%,rgba(28,5,18,0.18) 70%,rgba(28,5,18,0.44) 100%);
}

/* Warm rose shimmer — feminine glow */
.vig-glow {
  position:absolute; inset:0;
  background:radial-gradient(ellipse 70% 55% at 65% 28%,rgba(210,80,140,0.11) 0%,transparent 62%);
}

.top {
  position:absolute; top:52px; left:60px; right:60px;
  display:flex; justify-content:flex-end; align-items:center;
  z-index:20;
}
.logo-img { height:88px; display:block; }

.content {
  position:absolute;
  bottom:260px; left:60px; right:60px;
  z-index:20;
  text-align:center;
}

.hook {
  font-family:'DM Sans',sans-serif;
  font-size:18px; font-weight:400; font-style:italic;
  color:rgba(232,150,184,0.85);
  letter-spacing:0.03em;
  margin-bottom:18px;
}

.headline {
  font-family:'Cormorant Garamond',serif;
  font-size:82px; line-height:0.88;
  font-weight:300; font-style:italic;
  color:#fdf0f5;
  letter-spacing:-0.02em;
  margin-bottom:26px;
  text-shadow:0 3px 40px rgba(28,5,18,0.55);
}
.headline em {
  font-style:italic; font-weight:700;
  color:#e896b8;
}

.divider {
  display:flex; align-items:center; justify-content:center;
  gap:10px; margin-bottom:28px;
}
.div-line { width:70px; height:1px; background:linear-gradient(90deg,transparent,rgba(232,150,184,0.52)); }
.div-line.r { background:linear-gradient(90deg,rgba(232,150,184,0.52),transparent); }
.div-dot { width:5px; height:5px; background:rgba(232,150,184,0.68); border-radius:50%; }

.chips {
  display:flex; justify-content:center; gap:14px; align-items:center;
}
.chip {
  display:flex; align-items:center; gap:10px;
  font-family:'DM Sans',sans-serif;
  font-size:14px; font-weight:500;
  color:rgba(232,160,192,0.90);
  text-transform:uppercase; letter-spacing:0.15em;
  white-space:nowrap;
  padding:11px 20px; border-radius:40px;
  border:1px solid rgba(232,150,184,0.32);
  background:rgba(232,150,184,0.09);
  backdrop-filter:blur(6px);
}

.cta-wrap {
  position:absolute; bottom:150px; left:60px; right:60px;
  z-index:20;
}
.cta {
  display:block; width:100%;
  background:linear-gradient(135deg,#9b1a52 0%,#c44880 45%,#e07898 100%);
  color:#fdf0f5;
  font-family:'DM Sans',sans-serif;
  font-size:20px; font-weight:600;
  padding:26px; border-radius:10px;
  text-align:center; letter-spacing:0.05em;
  box-shadow:0 8px 56px rgba(196,72,128,0.30);
}
</style>
</head>
<body>
<div class="ad">

  <img class="bg" src="../images/woman-smooth.jpg" alt="">
  <div class="vig-top"></div>
  <div class="vig-bottom"></div>
  <div class="vig-edges"></div>
  <div class="vig-glow"></div>

  <div class="top">
    <img class="logo-img" src="../Logo_balts-3-scaled.png" alt="mariposa">
  </div>

  <div class="content">
    <div class="hook">Cik daudz laika ieguldīji savā ādā bez rezultāta?</div>

    <div class="headline">
      Gludāka un<br>mirdzošāka <em>āda</em>
    </div>

    <div class="divider">
      <div class="div-line"></div>
      <div class="div-dot"></div>
      <div class="div-dot"></div>
      <div class="div-dot"></div>
      <div class="div-line r"></div>
    </div>

    <div class="chips">
      <div class="chip">
        <svg width="16" height="16" viewBox="0 0 22 22" fill="none">
          <path d="M11 2L12.4 9.6L20 11L12.4 12.4L11 20L9.6 12.4L2 11L9.6 9.6Z" stroke="rgba(232,150,184,0.92)" stroke-width="1.1" stroke-linejoin="round" fill="rgba(232,150,184,0.10)"/>
          <circle cx="11" cy="11" r="2" fill="rgba(232,150,184,0.55)"/>
        </svg>
        IPL
      </div>
      <div class="chip">
        <svg width="16" height="16" viewBox="0 0 22 22" fill="none">
          <circle cx="5" cy="5" r="1.8" fill="rgba(232,150,184,0.85)"/>
          <circle cx="11" cy="5" r="1.8" fill="rgba(232,150,184,0.85)"/>
          <circle cx="17" cy="5" r="1.8" fill="rgba(232,150,184,0.85)"/>
          <circle cx="5" cy="11" r="1.8" fill="rgba(232,150,184,0.85)"/>
          <circle cx="11" cy="11" r="2.4" fill="rgba(232,150,184,0.50)" stroke="rgba(232,150,184,0.92)" stroke-width="1"/>
          <circle cx="17" cy="11" r="1.8" fill="rgba(232,150,184,0.85)"/>
          <circle cx="5" cy="17" r="1.8" fill="rgba(232,150,184,0.85)"/>
          <circle cx="11" cy="17" r="1.8" fill="rgba(232,150,184,0.85)"/>
          <circle cx="17" cy="17" r="1.8" fill="rgba(232,150,184,0.85)"/>
        </svg>
        RF mikro adatas
      </div>
      <div class="chip">
        <svg width="14" height="16" viewBox="0 0 18 22" fill="none">
          <path d="M10.5 1L2 13H8.5L7 21L16 9H9.5L10.5 1Z" stroke="rgba(232,150,184,0.92)" stroke-width="1.1" stroke-linejoin="round" fill="rgba(232,150,184,0.10)"/>
        </svg>
        Lāzerepilācija
      </div>
    </div>
  </div>

  <div class="cta-wrap">
    <div class="cta">Rezervē savu vizīti →</div>
  </div>

</div>
<script>document.fonts.ready.then(()=>{ document.title='fonts-ready'; });</script>
</body>
</html>
