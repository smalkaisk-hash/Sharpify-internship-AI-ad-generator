<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,300;1,400;1,600;1,700&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1080px; height:1080px; overflow:hidden; }
.ad {
  width:1080px; height:1080px;
  position:relative; overflow:hidden;
  background:#0d040d;
  display:flex;
}

/* ── Left text panel ── */
.left {
  width:500px;
  height:1080px;
  flex-shrink:0;
  position:relative;
  z-index:10;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:60px 50px;
  background:linear-gradient(160deg, #120512 0%, #0d030d 60%, #0a030a 100%);
}

/* Gold seam on right edge */
.left::after {
  content:'';
  position:absolute; top:80px; right:0; bottom:80px;
  width:1px;
  background:linear-gradient(
    180deg,
    transparent 0%,
    rgba(196,149,108,0.35) 20%,
    rgba(196,149,108,0.55) 50%,
    rgba(196,149,108,0.35) 80%,
    transparent 100%
  );
}

/* ── Right photo panel ── */
.right {
  flex:1;
  position:relative;
  overflow:hidden;
}
.right-img {
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:38% 8%;
  filter:saturate(1.05) contrast(1.02) brightness(1.01);
}

/* Blend left edge of photo */
.right-vignette {
  position:absolute; inset:0;
  background:linear-gradient(
    90deg,
    rgba(10,3,10,1.00) 0%,
    rgba(10,3,10,0.88) 8%,
    rgba(10,3,10,0.65) 18%,
    rgba(10,3,10,0.40) 35%,
    rgba(10,3,10,0.15) 55%,
    transparent 75%
  );
}

/* ── Text content ── */
.headline {
  font-family:'Cormorant Garamond', serif;
  font-size:64px; line-height:0.90;
  font-weight:300; font-style:italic;
  color:#f6ede7;
  letter-spacing:-0.02em;
  margin-bottom:28px;
}
.headline em {
  font-style:italic; font-weight:700;
  color:#d4a97a;
}

.section {
  margin-bottom:32px;
}

.section-title {
  font-family:'DM Sans', sans-serif;
  font-size:12px; font-weight:600;
  color:rgba(196,149,108,0.70);
  text-transform:uppercase; letter-spacing:0.15em;
  margin-bottom:16px;
}

.list {
  font-family:'DM Sans', sans-serif;
  font-size:15px; font-weight:300;
  color:rgba(246,237,231,0.68);
  line-height:2.0;
}

.list-item {
  margin-bottom:8px;
}

.list-item em {
  color:#d4a97a;
  font-style:italic;
  font-weight:500;
}

/* Logo at bottom */
.logo {
  position:absolute;
  bottom:50px; left:50px;
  height:36px;
}

/* Top logo for reference */
.logo-top {
  position:absolute;
  top:50px; left:50px;
  height:24px;
  opacity:0.6;
}
</style>
</head>
<body>
<div class="ad">

  <!-- LEFT PANEL: Text -->
  <div class="left">
    <img class="logo-top" src="../Logo_balts-3-scaled.png" alt="mariposa">

    <div class="headline">
      No sāpēm uz <em>mirdzumam</em>
    </div>

    <div class="section">
      <div class="section-title">Problēma</div>
      <div class="list">
        <div class="list-item">❌ Pigmentācija</div>
        <div class="list-item">❌ Apsārtums</div>
        <div class="list-item">❌ Apmatojums</div>
        <div class="list-item">❌ Elastības zudums</div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">Risinājums</div>
      <div class="list">
        <div class="list-item">✅ <em>IPL</em> — tonis</div>
        <div class="list-item">✅ <em>RF</em> — elastība</div>
        <div class="list-item">✅ <em>Lāzers</em> — gludums</div>
        <div class="list-item">✅ <em>Rezultāti</em> pēc 3 nedēļām</div>
      </div>
    </div>

    <img class="logo" src="../Logo_balts-3-scaled.png" alt="mariposa">
  </div>

  <!-- RIGHT PANEL: Woman image -->
  <div class="right">
    <img class="right-img" src="../images/woman-smooth-2.jpg" alt="">
    <div class="right-vignette"></div>
  </div>

</div>
<script>document.fonts.ready.then(()=>{ document.title='fonts-ready'; });</script>
</body>
</html>
