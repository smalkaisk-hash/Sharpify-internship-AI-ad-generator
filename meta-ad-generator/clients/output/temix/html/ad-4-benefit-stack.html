<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1080">
  <link rel="stylesheet" href="../../../../templates/base.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-primary: #1E2E24;
      --color-secondary: #181616;
      --color-accent: #DAB453;
      --color-bg: #F5F1E8;
      --color-text: #181616;
      --font-heading: 'Playfair Display', 'Georgia', serif;
      --font-body: 'Inter', sans-serif;
    }

    html, body { width: 1080px; height: 1080px; overflow: hidden; }

    .ad-frame {
      width: 1080px; height: 1080px;
      display: flex; flex-direction: column;
      background: var(--color-bg);
      position: relative;
      overflow: hidden;
    }

    /* Hero strip with product image */
    .hero-strip {
      position: relative;
      height: 300px;
      overflow: hidden;
      flex-shrink: 0;
    }
    .hero-strip img {
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: center 40%;
    }
    .hero-strip::after {
      content: "";
      position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(24,22,22,0.1) 0%, rgba(30,46,36,0.65) 100%);
    }

    .hero-overlay-text {
      position: absolute;
      inset: 0;
      padding: 40px 56px 28px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 2;
    }
    .hero-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand-wordmark {
      font-family: var(--font-heading);
      font-size: 38px;
      font-weight: 600;
      color: var(--color-accent);
    }
    .badge-pill {
      display: inline-flex;
      align-items: center;
      padding: 10px 24px;
      background: var(--color-accent);
      color: var(--color-secondary);
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      border-radius: 30px;
    }
    .hero-headline {
      font-family: var(--font-heading);
      font-size: 66px;
      font-weight: 500;
      line-height: 1.02;
      letter-spacing: -0.015em;
      color: var(--color-bg);
    }
    .hero-headline em {
      font-style: italic;
      color: var(--color-accent);
      font-weight: 500;
    }

    /* Benefits */
    .benefits-wrap {
      flex: 1;
      padding: 40px 56px 36px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .sub-line {
      font-family: var(--font-body);
      font-size: 17px;
      font-weight: 500;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: rgba(24,22,22,0.55);
      margin-bottom: 8px;
    }

    .benefit-row {
      display: flex;
      align-items: center;
      gap: 28px;
      padding: 22px 28px;
      background: #FFFFFF;
      border-radius: 16px;
      box-shadow: 0 2px 0 rgba(218,180,83,0.18), 0 12px 32px rgba(24,22,22,0.05);
      border-left: 4px solid var(--color-accent);
    }

    .benefit-num {
      font-family: var(--font-heading);
      font-size: 42px;
      font-weight: 600;
      color: var(--color-accent);
      width: 52px;
      flex-shrink: 0;
      line-height: 1;
    }

    .benefit-body {
      flex: 1;
      display: flex;
      align-items: baseline;
      gap: 22px;
    }

    .benefit-title {
      font-family: var(--font-body);
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--color-text);
      flex-shrink: 0;
      width: 240px;
    }

    .benefit-desc {
      font-family: var(--font-heading);
      font-size: 26px;
      font-weight: 500;
      color: rgba(24,22,22,0.78);
      line-height: 1.25;
    }

    /* Footer CTA */
    .footer-cta {
      padding: 0 56px 40px;
      display: flex;
      justify-content: center;
    }
    .cta-gold {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 82px;
      min-width: 420px;
      padding: 0 52px;
      background: var(--color-primary);
      color: var(--color-bg);
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 22px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      border-radius: 48px;
    }
    .cta-gold span {
      color: var(--color-accent);
      margin-left: 14px;
      letter-spacing: 0.18em;
    }
  </style>
</head>
<body>
  <div class="ad-frame">
    <div class="hero-strip">
      <img src="../brief/images/hero-4.jpg" alt="">
      <div class="hero-overlay-text">
        <div class="hero-top-row">
          <div class="brand-wordmark">TeMix</div>
          <div class="badge-pill">TeMix · B2B</div>
        </div>
        <div class="hero-headline">Vairumtirdzniecība<br><em>bez raizēm.</em></div>
      </div>
    </div>

    <div class="benefits-wrap">
      <div class="sub-line">4 lietas, ko saņem katrs TeMix partneris</div>

      <div class="benefit-row">
        <div class="benefit-num">01</div>
        <div class="benefit-body">
          <div class="benefit-title">Sortiments</div>
          <div class="benefit-desc">Rūpīgi atlasīts, ne pēc cenas</div>
        </div>
      </div>

      <div class="benefit-row">
        <div class="benefit-num">02</div>
        <div class="benefit-body">
          <div class="benefit-title">Piegāde</div>
          <div class="benefit-desc">Bezmaksas virs 300€</div>
        </div>
      </div>

      <div class="benefit-row">
        <div class="benefit-num">03</div>
        <div class="benefit-body">
          <div class="benefit-title">Maksājumi</div>
          <div class="benefit-desc">Atliktais 7–14 dienas</div>
        </div>
      </div>

      <div class="benefit-row">
        <div class="benefit-num">04</div>
        <div class="benefit-body">
          <div class="benefit-title">Mārketings</div>
          <div class="benefit-desc">Bildes un apraksti gatavi</div>
        </div>
      </div>
    </div>

    <div class="footer-cta">
      <div class="cta-gold">Sazināties <span>→</span></div>
    </div>
  </div>
</body>
</html>
