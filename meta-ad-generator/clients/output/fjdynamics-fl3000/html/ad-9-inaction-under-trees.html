<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1080">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Figtree:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --accent: #C6FF3D; --text: #FAFAF7; --primary: #0A0A0A; --fh: 'Space Grotesk', sans-serif; --fb: 'Figtree', sans-serif; }
    html, body { width: 1080px; height: 1080px; overflow: hidden; margin: 0; }
    .ad { position: relative; width: 1080px; height: 1080px; background: #000; overflow: hidden; }
    .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 35%; }
    .grad { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.1) 22%, rgba(0,0,0,0) 50%, rgba(5,5,5,0.95) 100%); }
    .top { position: absolute; top: 44px; left: 56px; right: 56px; display: flex; justify-content: space-between; align-items: center; z-index: 10; }
    .wm { font-family: var(--fb); font-size: 24px; font-weight: 700; color: var(--text); text-shadow: 0 2px 10px rgba(0,0,0,0.6); }
    .tag { font-family: var(--fb); font-size: 12px; font-weight: 600; letter-spacing: 0.36em; text-transform: uppercase; color: rgba(250,250,247,0.9); text-shadow: 0 2px 10px rgba(0,0,0,0.6); }
    .head-block { position: absolute; top: 120px; left: 56px; right: 56px; z-index: 10; }
    .eye { font-family: var(--fb); font-size: 13px; font-weight: 600; color: var(--accent); letter-spacing: 0.36em; text-transform: uppercase; display: inline-flex; align-items: center; gap: 14px; margin-bottom: 18px; }
    .eye::before { content: ""; width: 44px; height: 2px; background: var(--accent); }
    h1 { font-family: var(--fh); font-size: 98px; font-weight: 500; line-height: 0.94; letter-spacing: -0.035em; color: var(--text); margin: 0; text-shadow: 0 4px 24px rgba(0,0,0,0.6); }
    h1 .l { color: var(--accent); font-style: italic; }
    .signal-callout { position: absolute; top: 460px; left: 56px; z-index: 15; display: inline-flex; align-items: center; gap: 12px; padding: 14px 22px; background: rgba(10,10,10,0.82); border: 1px solid rgba(198,255,61,0.45); border-radius: 50px; backdrop-filter: blur(8px); }
    .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 14px rgba(198,255,61,0.75); }
    .sc-text { font-family: var(--fb); font-size: 15px; font-weight: 600; color: var(--text); letter-spacing: 0.05em; }
    .bot { position: absolute; left: 0; right: 0; bottom: 0; padding: 30px 56px 44px; display: flex; justify-content: space-between; align-items: center; z-index: 10; }
    .sub { font-family: var(--fb); font-size: 14px; color: rgba(250,250,247,0.75); letter-spacing: 0.1em; }
    .cta { display: inline-flex; align-items: center; justify-content: center; height: 78px; min-width: 260px; padding: 0 42px; background: var(--accent); color: var(--primary); font-family: var(--fb); font-weight: 700; font-size: 20px; letter-spacing: 0.22em; text-transform: uppercase; border-radius: 48px; flex-shrink: 0; }
  </style>
</head>
<body>
  <div class="ad">
    <img class="bg" src="../brief/images/inaction-2-under-trees.png">
    <div class="grad"></div>
    <div class="top">
      <div class="wm">FJDynamics</div>
      <div class="tag">FL3000 · LiDAR Mower</div>
    </div>
    <div class="head-block">
      <div class="eye">Under trees · Signal handled</div>
      <h1>Where RTK mowers<br><span class="l">lose signal.</span></h1>
    </div>
    <div class="signal-callout">
      <div class="dot"></div>
      <div class="sc-text">360° LiDAR · No signal drop</div>
    </div>
    <div class="bot">
      <div class="sub">LiDAR + vision navigation · no wire · no RTK</div>
      <div class="cta">Shop Now</div>
    </div>
  </div>
</body>
</html>
