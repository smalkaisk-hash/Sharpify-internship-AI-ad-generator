<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1080">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Figtree:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --accent: #C6FF3D; --text: #FAFAF7; --primary: #0A0A0A; --fh: 'Space Grotesk', sans-serif; --fb: 'Figtree', sans-serif; }
    html, body { width: 1080px; height: 1080px; overflow: hidden; margin: 0; }
    .ad { position: relative; width: 1080px; height: 1080px; background: #000; overflow: hidden; }
    .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center center; filter: saturate(1.05) contrast(1.05); }
    .grad { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0) 28%, rgba(0,0,0,0) 62%, rgba(5,5,5,0.96) 100%); }
    .top { position: absolute; top: 44px; left: 56px; right: 56px; display: flex; justify-content: space-between; align-items: center; z-index: 10; }
    .wm { font-family: var(--fb); font-size: 24px; font-weight: 700; color: var(--text); text-shadow: 0 2px 10px rgba(0,0,0,0.6); }
    .tag { font-family: var(--fb); font-size: 12px; font-weight: 600; letter-spacing: 0.36em; text-transform: uppercase; color: rgba(250,250,247,0.9); text-shadow: 0 2px 10px rgba(0,0,0,0.6); }
    .stat-block { position: absolute; top: 110px; left: 56px; right: 56px; z-index: 10; }
    .eye { font-family: var(--fb); font-size: 13px; font-weight: 600; color: var(--accent); letter-spacing: 0.36em; text-transform: uppercase; display: inline-flex; align-items: center; gap: 14px; margin-bottom: 14px; }
    .eye::before { content: ""; width: 44px; height: 2px; background: var(--accent); }
    .big-num { font-family: var(--fh); font-size: 148px; font-weight: 500; line-height: 0.88; letter-spacing: -0.045em; color: var(--accent); text-shadow: 0 4px 24px rgba(0,0,0,0.65); }
    .big-num .u { font-size: 72px; color: var(--text); margin-left: 14px; }
    .big-sub { font-family: var(--fb); font-size: 22px; font-weight: 500; color: rgba(250,250,247,0.92); margin-top: 14px; letter-spacing: 0.03em; text-shadow: 0 2px 14px rgba(0,0,0,0.55); }
    .bot-block { position: absolute; bottom: 0; left: 0; right: 0; padding: 30px 56px 44px; z-index: 10; }
    h1 { font-family: var(--fh); font-size: 56px; font-weight: 500; line-height: 1; letter-spacing: -0.025em; color: var(--text); margin: 0 0 20px; }
    h1 .l { color: var(--accent); font-style: italic; }
    .cta-row { display: flex; justify-content: space-between; align-items: center; gap: 24px; }
    .sub { font-family: var(--fb); font-size: 14px; color: rgba(250,250,247,0.72); letter-spacing: 0.1em; }
    .cta { display: inline-flex; align-items: center; justify-content: center; height: 78px; min-width: 260px; padding: 0 42px; background: var(--accent); color: var(--primary); font-family: var(--fb); font-weight: 700; font-size: 20px; letter-spacing: 0.22em; text-transform: uppercase; border-radius: 48px; flex-shrink: 0; }
  </style>
</head>
<body>
  <div class="ad">
    <img class="bg" src="../brief/images/inaction-5-aerial.png">
    <div class="grad"></div>
    <div class="top">
      <div class="wm">FJDynamics</div>
      <div class="tag">FL3000 · LiDAR Mower</div>
    </div>
    <div class="stat-block">
      <div class="eye">Coverage · one charge</div>
      <div class="big-num">3,000<span class="u">m²</span></div>
      <div class="big-sub">One charge. 180 minutes. The whole yard — handled.</div>
    </div>
    <div class="bot-block">
      <h1>Mapped by LiDAR.<br><span class="l">Mowed autonomously.</span></h1>
      <div class="cta-row">
        <div class="sub">No wire · No RTK · 10-min setup · 33° max climb</div>
        <div class="cta">Shop Now</div>
      </div>
    </div>
  </div>
</body>
</html>
