<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1080">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Figtree:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --accent: #C6FF3D; --text: #FAFAF7; --primary: #0A0A0A; --fh: 'Space Grotesk', sans-serif; --fb: 'Figtree', sans-serif; }
    html, body { width: 1080px; height: 1080px; overflow: hidden; margin: 0; }
    .ad { position: relative; width: 1080px; height: 1080px; background: #000; overflow: hidden; }
    .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center center; }
    .grad { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0) 28%, rgba(0,0,0,0) 52%, rgba(5,5,5,0.95) 100%); }
    .top { position: absolute; top: 44px; left: 56px; right: 56px; display: flex; justify-content: space-between; align-items: center; z-index: 10; }
    .wm { font-family: var(--fb); font-size: 24px; font-weight: 700; color: var(--text); text-shadow: 0 2px 10px rgba(0,0,0,0.6); }
    .tag { font-family: var(--fb); font-size: 12px; font-weight: 600; letter-spacing: 0.36em; text-transform: uppercase; color: rgba(250,250,247,0.9); text-shadow: 0 2px 10px rgba(0,0,0,0.6); }
    .chip-row { position: absolute; top: 110px; left: 56px; right: 56px; z-index: 10; }
    .chip { display: inline-block; padding: 10px 22px; background: rgba(10,10,10,0.55); border: 1px solid rgba(198,255,61,0.55); border-radius: 40px; backdrop-filter: blur(6px); font-family: var(--fb); font-size: 14px; font-weight: 600; color: var(--accent); letter-spacing: 0.28em; text-transform: uppercase; }
    .bot { position: absolute; left: 0; right: 0; bottom: 0; padding: 44px 56px 48px; z-index: 10; }
    .eye { font-family: var(--fb); font-size: 13px; font-weight: 600; color: var(--accent); letter-spacing: 0.36em; text-transform: uppercase; margin-bottom: 16px; display: inline-flex; align-items: center; gap: 14px; }
    .eye::before { content: ""; width: 44px; height: 2px; background: var(--accent); }
    h1 { font-family: var(--fh); font-size: 88px; font-weight: 500; line-height: 0.96; letter-spacing: -0.035em; color: var(--text); margin: 0 0 22px; }
    h1 .l { color: var(--accent); font-style: italic; }
    .cta-row { display: flex; justify-content: space-between; align-items: center; gap: 24px; }
    .sub { font-family: var(--fb); font-size: 14px; color: rgba(250,250,247,0.72); letter-spacing: 0.1em; }
    .cta { display: inline-flex; align-items: center; justify-content: center; height: 78px; min-width: 260px; padding: 0 42px; background: var(--accent); color: var(--primary); font-family: var(--fb); font-weight: 700; font-size: 20px; letter-spacing: 0.22em; text-transform: uppercase; border-radius: 48px; flex-shrink: 0; }
  </style>
</head>
<body>
  <div class="ad">
    <img class="bg" src="../brief/images/inaction-1-golden-hour.png">
    <div class="grad"></div>
    <div class="top">
      <div class="wm">FJDynamics</div>
      <div class="tag">FL3000 · LiDAR Mower</div>
    </div>
    <div class="chip-row"><div class="chip">Saturdays · Returned</div></div>
    <div class="bot">
      <div class="eye">Mowing, while you're not</div>
      <h1>Your lawn, mowed.<br><span class="l">While you're not.</span></h1>
      <div class="cta-row">
        <div class="sub">3,000 m² · 180 min · No wire · No RTK</div>
        <div class="cta">Shop Now</div>
      </div>
    </div>
  </div>
</body>
</html>
