<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1080">
  <link rel="stylesheet" href="../../../../templates/base.css">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Figtree:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-primary: #0A0A0A;
      --color-secondary: #1A1A1A;
      --color-accent: #C6FF3D;
      --color-text: #FAFAF7;
      --font-heading: 'Space Grotesk', sans-serif;
      --font-body: 'Figtree', sans-serif;
    }
    html, body { width: 1080px; height: 1080px; overflow: hidden; }

    .ad-frame {
      position: relative;
      width: 1080px; height: 1080px;
      background: var(--color-primary);
      overflow: hidden;
      color: var(--color-text);
    }

    .bg-img {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: center center;
      filter: saturate(0.9) contrast(1.08);
    }
    .bg-overlay {
      position: absolute; inset: 0;
      background:
        linear-gradient(180deg, rgba(0,0,0,0.35) 0%, rgba(0,0,0,0.1) 40%, rgba(0,0,0,0.55) 75%, rgba(10,10,10,0.96) 100%);
    }

    /* Top bar */
    .top-bar {
      position: absolute;
      top: 48px; left: 56px; right: 56px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
    }
    .brand-wordmark {
      font-family: var(--font-body);
      font-size: 26px;
      font-weight: 700;
    }
    .top-tag {
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: rgba(250,250,247,0.72);
    }

    /* Big stat */
    .big-stat {
      position: absolute;
      left: 56px; right: 56px;
      top: 300px;
      z-index: 20;
      font-family: var(--font-heading);
      line-height: 0.92;
      letter-spacing: -0.04em;
      font-weight: 500;
    }
    .stat-line-1 {
      font-size: 180px;
      color: var(--color-accent);
      display: block;
    }
    .stat-line-2 {
      font-size: 180px;
      color: var(--color-text);
      display: block;
      margin-top: -8px;
    }

    .eyebrow {
      position: absolute;
      top: 250px;
      left: 56px;
      z-index: 20;
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 600;
      color: var(--color-accent);
      letter-spacing: 0.36em;
      text-transform: uppercase;
    }
    .eyebrow::before {
      content: "";
      display: inline-block;
      width: 44px; height: 2px;
      background: var(--color-accent);
      vertical-align: middle;
      margin-right: 16px;
    }

    .subline {
      position: absolute;
      left: 56px; right: 56px;
      bottom: 220px;
      z-index: 20;
      font-family: var(--font-body);
      font-size: 26px;
      font-weight: 400;
      line-height: 1.4;
      color: rgba(250,250,247,0.85);
      max-width: 760px;
    }

    /* Bottom row */
    .bottom-row {
      position: absolute;
      bottom: 44px; left: 56px; right: 56px;
      display: flex;
      align-items: center;
      gap: 24px;
      z-index: 20;
    }
    .product-thumb {
      width: 180px;
      flex-shrink: 0;
      filter: drop-shadow(0 12px 30px rgba(0,0,0,0.6));
    }
    .product-thumb img {
      width: 100%; height: auto;
      display: block;
    }
    .product-details {
      flex: 1;
      font-family: var(--font-body);
    }
    .pd-name {
      font-size: 19px;
      font-weight: 700;
      color: var(--color-text);
      letter-spacing: 0.02em;
    }
    .pd-specs {
      font-size: 14px;
      font-weight: 500;
      color: rgba(250,250,247,0.6);
      letter-spacing: 0.1em;
      margin-top: 2px;
    }
    .cta-lime {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 78px;
      min-width: 260px;
      padding: 0 40px;
      background: var(--color-accent);
      color: var(--color-primary);
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 20px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      border-radius: 48px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="ad-frame">
    <img class="bg-img" src="../brief/images/hero-4.jpeg" alt="">
    <div class="bg-overlay"></div>

    <div class="top-bar">
      <div class="brand-wordmark">FJDynamics</div>
      <div class="top-tag">FL3000 · LiDAR Mower</div>
    </div>

    <div class="eyebrow">Take your Saturdays back</div>
    <div class="big-stat">
      <span class="stat-line-1">0 wires.</span>
      <span class="stat-line-2">0 weekends.</span>
    </div>

    <p class="subline">10-minute setup. No wire. No RTK. LiDAR and vision handle the mowing — up to 3,000 m² on a single charge.</p>

    <div class="bottom-row">
      <div class="product-thumb"><img src="../brief/images/hero-2.png" alt=""></div>
      <div class="product-details">
        <div class="pd-name">FL3000 · LiDAR Robotic Mower</div>
        <div class="pd-specs">3,000 m² · 180 min · 33° · IPX5</div>
      </div>
      <div class="cta-lime">Shop Now</div>
    </div>
  </div>
</body>
</html>
