<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1080">
  <link rel="stylesheet" href="../../../../templates/base.css">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Figtree:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-primary: #0A0A0A;
      --color-secondary: #1A1A1A;
      --color-accent: #C6FF3D;
      --color-text: #FAFAF7;
      --font-heading: 'Space Grotesk', sans-serif;
      --font-body: 'Figtree', sans-serif;
    }
    html, body { width: 1080px; height: 1080px; overflow: hidden; }

    .ad-frame {
      position: relative;
      width: 1080px; height: 1080px;
      background:
        radial-gradient(circle at 50% 50%, #222 0%, #0A0A0A 70%);
      overflow: hidden;
      color: var(--color-text);
    }

    /* Technical grid background */
    .tech-grid {
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(198,255,61,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(198,255,61,0.05) 1px, transparent 1px);
      background-size: 80px 80px;
      opacity: 0.7;
    }
    .tech-grid::after {
      content: "";
      position: absolute; inset: 0;
      background: radial-gradient(circle at 50% 50%, transparent 30%, rgba(0,0,0,0.7) 80%);
    }

    /* Top bar */
    .top-bar {
      position: absolute;
      top: 44px; left: 56px; right: 56px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
    }
    .brand-wordmark {
      font-family: var(--font-body);
      font-size: 24px;
      font-weight: 700;
    }
    .top-tag {
      font-family: var(--font-body);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.36em;
      text-transform: uppercase;
      color: rgba(250,250,247,0.58);
    }

    /* Headline header */
    .header-block {
      position: absolute;
      top: 100px;
      left: 56px; right: 56px;
      text-align: center;
      z-index: 20;
    }
    .eyebrow {
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 600;
      color: var(--color-accent);
      letter-spacing: 0.34em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    .headline {
      font-family: var(--font-heading);
      font-size: 54px;
      font-weight: 500;
      line-height: 1;
      letter-spacing: -0.025em;
    }
    .headline .lime { color: var(--color-accent); }

    /* Product stage */
    .product-stage {
      position: absolute;
      top: 240px;
      left: 0; right: 0;
      height: 620px;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .product {
      width: 520px;
      filter: drop-shadow(0 40px 80px rgba(198,255,61,0.06));
    }
    .product img {
      width: 100%; height: auto;
      display: block;
    }

    /* Stat boxes */
    .stat-block {
      position: absolute;
      padding: 18px 22px;
      z-index: 15;
    }
    .stat-num {
      font-family: var(--font-heading);
      font-size: 78px;
      font-weight: 500;
      line-height: 0.9;
      letter-spacing: -0.04em;
      color: var(--color-accent);
      display: flex;
      align-items: baseline;
      gap: 8px;
    }
    .stat-unit {
      font-family: var(--font-body);
      font-size: 26px;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--color-text);
    }
    .stat-label {
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(250,250,247,0.62);
      margin-top: 4px;
      max-width: 220px;
    }

    .s1 { top: 260px; left: 48px; }
    .s2 { top: 260px; right: 48px; text-align: right; }
    .s2 .stat-num { justify-content: flex-end; }
    .s2 .stat-label { margin-left: auto; }
    .s3 { bottom: 220px; left: 48px; }
    .s4 { bottom: 220px; right: 48px; text-align: right; }
    .s4 .stat-num { justify-content: flex-end; }
    .s4 .stat-label { margin-left: auto; }

    /* Bottom bar */
    .bottom-bar {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 28px 56px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
      border-top: 1px solid rgba(250,250,247,0.1);
      background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.6) 100%);
    }
    .bottom-sub {
      font-family: var(--font-body);
      font-size: 14px;
      color: rgba(250,250,247,0.55);
      letter-spacing: 0.1em;
    }
    .cta-lime {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 74px;
      min-width: 240px;
      padding: 0 38px;
      background: var(--color-accent);
      color: var(--color-primary);
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 19px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      border-radius: 48px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="ad-frame">
    <div class="tech-grid"></div>

    <div class="top-bar">
      <div class="brand-wordmark">FJDynamics</div>
      <div class="top-tag">FL3000 · LiDAR Mower</div>
    </div>

    <div class="header-block">
      <div class="eyebrow">The FL3000 · in four numbers</div>
      <h1 class="headline">No wire. No RTK.<br><span class="lime">Just these four numbers.</span></h1>
    </div>

    <div class="product-stage">
      <div class="product"><img src="../brief/images/hero-2.png" alt=""></div>
    </div>

    <div class="stat-block s1">
      <div class="stat-num">3,000<span class="stat-unit">m²</span></div>
      <div class="stat-label">Max mowing area</div>
    </div>

    <div class="stat-block s2">
      <div class="stat-num">180<span class="stat-unit">min</span></div>
      <div class="stat-label">Runtime per charge</div>
    </div>

    <div class="stat-block s3">
      <div class="stat-num">33<span class="stat-unit">°</span></div>
      <div class="stat-label">Max slope · 65% grade</div>
    </div>

    <div class="stat-block s4">
      <div class="stat-num">10<span class="stat-unit">min</span></div>
      <div class="stat-label">Setup — box to first cut</div>
    </div>

    <div class="bottom-bar">
      <div class="bottom-sub">fjdynamics.com · FL3000 LiDAR Robotic Mower</div>
      <div class="cta-lime">Shop Now</div>
    </div>
  </div>
</body>
</html>
