<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1080">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{width:1080px;height:1080px;overflow:hidden}
    .ad{width:1080px;height:1080px;position:relative;overflow:hidden;background:#1A1A1A}
    .image{position:absolute;top:0;left:0;right:0;height:54%;overflow:hidden}
    .image img{width:100%;height:100%;object-fit:cover}
    .diagonal{position:absolute;top:48%;left:0;right:0;height:80px;background:#1A1A1A;clip-path:polygon(0 40%, 100% 0, 100% 100%, 0 100%);z-index:2}
    .diagonal-yellow{position:absolute;top:48%;left:0;width:30%;height:80px;background:#F5A623;clip-path:polygon(0 40%, 100% 0, 100% 100%, 0 100%);z-index:3}
    .dark-panel{position:absolute;bottom:180px;left:0;right:0;top:54%;background:#1A1A1A;padding:48px 44px 24px;z-index:2;display:flex;gap:30px;align-items:flex-start}
    .dark-left{flex:0 0 auto}
    .dp-title{font-family:'Montserrat',sans-serif;font-size:72px;font-weight:900;color:#FFFFFF;line-height:0.95;text-transform:uppercase;letter-spacing:-0.01em}
    .dp-title .yellow{color:#F5A623;display:block}
    .dark-right{flex:1;padding-top:6px}
    .dp-desc{font-family:'Montserrat',sans-serif;font-size:26px;font-weight:500;color:rgba(255,255,255,0.7);line-height:1.35}
    .dp-desc .yellow{color:#F5A623;font-weight:700}
    .dp-desc b{color:#FFF;font-weight:900}
    .yellow-bar{position:absolute;bottom:68px;left:0;right:0;background:#F5A623;padding:18px 44px;display:flex;justify-content:space-between;align-items:center;z-index:3}
    .yb-text{font-family:'Montserrat',sans-serif;font-size:26px;font-weight:900;color:#1A1A1A;text-transform:uppercase;letter-spacing:0.02em}
    .yb-text span{font-weight:500}
    .yb-arrow{font-family:'Montserrat',sans-serif;font-size:26px;font-weight:900;color:#1A1A1A}
    .tagline{position:absolute;bottom:0;left:0;right:0;background:#1A1A1A;padding:22px 44px;text-align:center;z-index:3}
    .tagline-text{font-family:'Montserrat',sans-serif;font-size:28px;font-weight:800;color:#FFFFFF;font-style:italic;letter-spacing:-0.01em}
    .tagline-text .yellow{color:#F5A623}
  </style>
</head>
<body>
  <div class="ad">
    <div class="image">
      <img src="file:///C:/Users/Ritvars Volfs/meta-ad-generator-v2/claude-ad/output/rihards-staffing/brief/images/backgrounds/bg-bus-flex.png" alt="">
    </div>
    <div class="diagonal"></div>
    <div class="diagonal-yellow"></div>
    <div class="dark-panel">
      <div class="dark-left">
        <div class="dp-title">CREW IN<br><span class="yellow">7 DAYS.</span></div>
      </div>
      <div class="dark-right">
        <div class="dp-desc">For <span class="yellow">construction and industrial</span> companies that need to staff a big site fast with <b>10+ qualified EU workers</b></div>
      </div>
    </div>
    <div class="yellow-bar">
      <span class="yb-text"><span>BOOK</span> Free Initial Consultation</span>
      <span class="yb-arrow">▶</span>
    </div>
    <div class="tagline">
      <div class="tagline-text">Big Builds Need Crews — <span class="yellow">We Mobilize EU Workforce!</span></div>
    </div>
  </div>
</body>
</html>
